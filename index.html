/*═══════════════ قائمة المتابعة ═══════════════
  أكبر تسرّب في عيادة الأسنان ليس في التسعير بل في المتابعة:
  خطة بدأت ولم تُكمل، مراجع غاب ولم يُذكَّر، رصيد بقي ولم يُطالَب.
  كلها موجودة في البيانات، لكن لا شاشة تجمعها — فتُنسى.

  هذه الشاشة اشتقاق محض: لا جدول جديد ولا حقل. تقرأ الخطط
  والزيارات والدفعات وتُخرج سؤالاً واحداً: بمن تتصل اليوم؟
═══════════════════════════════════════════════*/
const Recall = {
  GONE_DAYS:180,     /* ستة أشهر — دورة التنظيف المعتادة */
  STALL_DAYS:21,     /* سلسلة توقّفت ثلاثة أسابيع تستحق اتصالاً */
  open:'tom',        /* القسم المفتوح */

  days(ts){ return Math.floor((Date.now() - Number(ts||0)) / 86400000); },

  since(d){
    if (d >= 60) return `${Math.round(d/30)} ${T('rcMonth')}`;
    return `${d} ${T('rcDay')}`;
  },

  /*──── جمع البيانات مرة واحدة ────
    القراءة الكاملة أرخص من استعلام لكل مراجع: العيادة الواحدة
    آلاف السجلات لا ملايين، والمرور عليها مرة أسرع بكثير. */
  async gather(){
    const cid = CFG.data.cid;
    const mine = p => !p.cid || p.cid === cid;
    const [pats, visits, works, pays, teeth, appts] = await Promise.all([
      DB.all('patients'), DB.all('visits'), DB.all('works'),
      DB.all('payments'), DB.all('tooth'), DB.all('appts'),
    ]);
    const P_ = {};
    pats.filter(mine).forEach(p => P_[p.id] = p);

    /* آخر زيارة لكل مراجع */
    const last = {};
    for (const v of visits){
      if (!P_[v.pid]) continue;
      const t = Number(v.at || 0);
      if (t > (last[v.pid] || 0)) last[v.pid] = t;
    }

    /* المجاميع المالية */
    const owed = {}, paid = {};
    for (const w of works) if (P_[w.pid]) owed[w.pid] = (owed[w.pid]||0) + Number(w.price||0);
    for (const y of pays)  if (P_[y.pid]) paid[y.pid] = (paid[y.pid]||0) + Number(y.amt||0);

    return { P_, visits, works, teeth, appts, last, owed, paid };
  },

  /*──── ① مواعيد الغد ────*/
  tomorrow(d){
    const t = new Date(); t.setDate(t.getDate() + 1);
    const tom = dkey(t);
    return d.appts
      .filter(a => a.st === 'open' && a.day === tom && d.P_[a.pid])
      .sort((a,b) => String(a.time||'').localeCompare(String(b.time||'')))
      .map(a => ({ p:d.P_[a.pid], note:a.time || '', tag:a.note || '' }));
  },

  /*──── ② سلاسل لم تكتمل ────
    خطة سنّ فيها جلسات مخطَّطة، نُفِّذ بعضها، والسلسلة ما زالت
    مفتوحة (لم تُختم)، وتوقّف العمل عليها مدة. */
  stalled(d){
    const out = [];
    for (const t of d.teeth){
      const p = d.P_[t.pid]; if (!p) continue;
      const cur  = t.course || 1;
      const plan = (t.plans || {})[cur];
      if (!plan?.sessions) continue;

      const ws = d.works.filter(w =>
        w.pid === t.pid && Number(w.fdi) === Number(t.fdi) && (w.course||1) === cur);
      const nums = new Set();
      ws.forEach(w => (w.sessionNos||[]).forEach(n => nums.add(Number(n))));
      const done = nums.size;
      if (!done || done >= plan.sessions) continue;   /* لم تبدأ أو اكتملت */

      const lastWork = Math.max(0, ...ws.map(w => Number(w.at||0)));
      const idle = this.days(lastWork || d.last[t.pid]);
      if (idle < this.STALL_DAYS) continue;           /* ما زالت جارية */

      out.push({ p, fdi:t.fdi, done, total:plan.sessions,
                 proc:plan.proc, idle });
    }
    return out.sort((a,b) => b.idle - a.idle);
  },

  /*──── ③ مراجعون غابوا ────*/
  gone(d){
    const out = [];
    for (const id in d.P_){
      const t = d.last[id];
      if (!t) continue;                               /* لم يزر قط */
      const idle = this.days(t);
      if (idle < this.GONE_DAYS) continue;
      /* من له سلسلة متوقّفة يظهر هناك، فلا يُكرَّر هنا */
      out.push({ p:d.P_[id], idle });
    }
    return out.sort((a,b) => b.idle - a.idle);
  },

  /*──── ④ أرصدة معلّقة ────*/
  due(d){
    const out = [];
    for (const id in d.P_){
      const bal = Math.round((d.owed[id]||0) - (d.paid[id]||0));
      if (bal <= 0) continue;
      out.push({ p:d.P_[id], bal, idle:this.days(d.last[id]) });
    }
    return out.sort((a,b) => b.bal - a.bal);
  },

  /*──── العرض ────*/
  async draw(){
    const v = $('#view'); v.innerHTML = UI.spin();
    const d = await this.gather();

    const tom = this.tomorrow(d);
    const st  = this.stalled(d);
    /* من ظهر في السلاسل المتوقّفة لا يُكرَّر في الغائبين */
    const inStall = new Set(st.map(x => x.p.id));
    const gn  = this.gone(d).filter(x => !inStall.has(x.p.id));
    const du  = this.due(d);
    const total = tom.length + st.length + gn.length + du.length;

    if (!total){
      v.innerHTML = `<div class="card ctr" style="padding:34px 18px">
        <div style="font-size:40px">✓</div>
        <div class="h2 mt">${T('rcClean')}</div>
        <div class="tiny mt">${T('recallHint')}</div>
      </div>`;
      return;
    }

    v.innerHTML = `
      <div class="card">
        <div class="row">
          <div class="gr">
            <div class="h2">${T('recallTitle')}</div>
            <div class="tiny mt">${T('recallHint')}</div>
          </div>
          <div class="ctr">
            <div class="mono h1" style="color:var(--br)">${total}</div>
            <div class="tiny">${T('rcTotal')}</div>
          </div>
        </div>
      </div>

      ${this.sec('tom', '📞', T('rcTomorrow'), T('rcTomorrowH'), tom.length,
                 tom.map(x => this.row(x.p, `${esc(x.note)} ${esc(x.tag)}`, 'b')).join(''))}

      ${this.sec('st', '🦷', T('rcOpen'), T('rcOpenH'), st.length,
                 st.map(x => this.row(x.p,
                   `${T('tooth')} ${Chart.lbl(x.fdi)} · ${x.done} ${T('rcOf')} ${x.total}
                    ${T('rcSessions')} · ${T('rcSince')} ${this.since(x.idle)}`,
                   x.idle > 60 ? 'r' : 'w')).join(''))}

      ${this.sec('gn', '🕰', T('rcGone'), T('rcGoneH'), gn.length,
                 gn.map(x => this.row(x.p,
                   `${T('rcSince')} ${this.since(x.idle)}`,
                   x.idle > 365 ? 'r' : 'w')).join(''))}

      ${this.sec('du', '₪', T('rcDue'), T('rcDueH'), du.length,
                 du.map(x => this.row(x.p,
                   `${T('rcSince')} ${this.since(x.idle)}`,
                   'r', `<span class="mono h3" style="color:var(--bd)">${N(x.bal)}</span>`
                 )).join(''))}

      <div style="height:14px"></div>`;
  },

  sec(key, ic, title, hint, n, body){
    return `<details class="acc mt2" ${this.open === key && n ? 'open' : ''}
              ontoggle="if(this.open)Recall.open='${key}'">
      <summary>
        <span class="accic">${ic}</span>
        <span class="gr">${title}</span>
        <span class="pill ${n ? 'b' : 'g'}">${n}</span>
        <span class="ar">${isAr()?'‹':'›'}</span>
      </summary>
      <div class="bd">
        <div class="tiny" style="color:var(--ink3)">${hint}</div>
        <div class="col mt">${body || `<div class="emp">${T('rcNothing')}</div>`}</div>
      </div>
    </details>`;
  },

  /* كل صف: اسم، سبب المتابعة، وزر اتصال — لا خطوة زائدة بينهما */
  row(p, note, tone, extra){
    const tel = String(p.phone || '').replace(/[^\d+]/g,'');
    return `<div class="it" onclick="Sec.file('${p.id}')">
      <div class="av ${tone||''}">${esc(nm(p).charAt(0))}</div>
      <div class="gr">
        <div class="h3 ell">${esc(nm(p))}</div>
        <div class="tiny ell">${note}</div>
      </div>
      ${extra || ''}
      ${tel
        ? `<a class="btn xs gh" href="tel:${esc(tel)}"
             onclick="event.stopPropagation()">${T('rcCall')}</a>`
        : `<span class="tiny" style="color:var(--ink3)">${T('rcNoPhone')}</span>`}
    </div>`;
  },
};

/*═══════════════ الحسابات والإحصائيات ═══════════════
  ثلاث شاشات فوق فلتر تاريخ واحد: الحسابات (المبالغ)، الإحصائيات
  (الأعمال)، المراجعون. كل رقم يظهر هو حصيلة الفلتر الظاهر فوقه —
  لا مجاميع خفية ولا فترة مضمرة.
═══════════════════════════════════════════════════*/
const Money = {
  view:'acc',
  /* الفلتر المشترك — التاريخ لكل الشاشات، والسن والعمل للإحصائيات */
  f:{ range:'today', from:today(), to:today(), fdi:'', proc:'' },

  set(v){ this.view = v; this.draw(); },

  /*──────── مدى التاريخ ────────*/
  span(){
    const now = new Date();
    const ago = n => { const x = new Date(now); x.setDate(x.getDate()-n); return dkey(x); };
    switch (this.f.range){
      case 'today': return { from:dkey(now), to:dkey(now) };
      case 'yest':  return { from:ago(1),    to:ago(1) };
      case 'week':  return { from:ago(6),    to:dkey(now) };
      case 'month': return { from:dkey(now).slice(0,8)+'01', to:dkey(now) };
      case 'all':   return { from:'', to:'' };
      default:      return { from:this.f.from||'', to:this.f.to||'' };
    }
  },

  spanLabel(){
    const s = this.span();
    if (!s.from && !s.to) return T('allTime');
    if (s.from && s.to && s.from === s.to) return fmtD(s.from);
    return `${s.from?fmtD(s.from):'…'} — ${s.to?fmtD(s.to):'…'}`;
  },

  inSpan(ts){
    const s = this.span(), k = dkey(ts);
    if (s.from && k < s.from) return false;
    if (s.to   && k > s.to)   return false;
    return true;
  },

  /*──────── شريط الفلتر ────────*/
  filterBar(){
    const s = this.span();
    const chip = (k,l) => `<button class="btn sm rchip ${this.f.range===k?'':'gh'}"
      data-k="${k}" onclick="Money.range('${k}')">${T(l)}</button>`;
    return `<details class="acc" ${this.f.range==='custom'?'open':''}>
      <summary>
        <span class="accic">📅</span>
        <span class="gr">${T('dateRange')}</span>
        <span class="pill b" id="f-span">${this.spanLabel()}</span>
        <span class="ar">${isAr()?'‹':'›'}</span>
      </summary>
      <div class="bd">
        <div class="row wrapv" style="gap:6px">
          ${chip('today','fToday')}${chip('yest','fYest')}${chip('week','fWeek')}
          ${chip('month','fMonth')}${chip('all','allTime')}${chip('custom','fCustom')}
        </div>
        <div class="g2 mt2">
          <div><label class="lb">${T('from')}</label>
            <input type="date" id="f-from" value="${esc(s.from)}" onchange="Money.custom()"></div>
          <div><label class="lb">${T('to')}</label>
            <input type="date" id="f-to" value="${esc(s.to)}" onchange="Money.custom()"></div>
        </div>
      </div></details>`;
  },

  /* الشرائح والحقول تُحدَّث في مكانها — لا يُعاد بناء الشريط
     حتى لا تنغلق القائمة ولا يقفز مؤشّر حقل التاريخ. */
  syncBar(){
    const s = this.span();
    const ff = $('#f-from'); if (ff) ff.value = s.from;
    const ft = $('#f-to');   if (ft) ft.value = s.to;
    const sp = $('#f-span'); if (sp) sp.textContent = this.spanLabel();
    $$('#acc-filter .rchip').forEach(b =>
      b.classList.toggle('gh', b.dataset.k !== this.f.range));
  },

  range(k){ this.f.range = k; const s = this.span();
    this.f.from = s.from; this.f.to = s.to; this.syncBar(); this.body(); },

  custom(){ this.f.range = 'custom';
    this.f.from = $('#f-from')?.value || '';
    this.f.to   = $('#f-to')?.value   || '';
    this.syncBar(); this.body(); },

  resetF(){ this.f.fdi = ''; this.f.proc = ''; this.stats(); },

  /*──────── العرض ────────*/
  async draw(){
    $('#view').innerHTML = `
      <div class="segs">
        ${[['acc','accMoney'],['stat','accStats'],['pts','accPatients']].map(([k,l])=>
          `<button class="${this.view===k?'on':''}"
             onclick="Money.set('${k}')">${T(l)}</button>`).join('')}
      </div>
      ${this.view!=='pts'?`<div id="acc-filter" class="mt2">${this.filterBar()}</div>`:''}
      <div id="acc-body" class="mt2">${UI.spin()}</div>`;
    return this.body();
  },

  body(){
    if (this.view === 'acc')  return this.accounts();
    if (this.view === 'stat') return this.stats();
    return this.patients();
  },

  card(label, val, color, sub){
    return `<div class="card ctr" style="padding:15px 8px">
      <div class="tiny" style="font-weight:700">${label}</div>
      <div class="mono h2" style="margin-top:5px;${color?`color:${color}`:''}">${val}</div>
      ${sub?`<div class="tiny" style="margin-top:2px">${sub}</div>`:''}</div>`;
  },

  /*──────── البيانات ضمن الفلتر ────────*/
  async data(){
    const works = (await DB.all('works')).filter(w => this.inSpan(w.at));
    const pays  = (await DB.all('payments')).filter(x => this.inSpan(x.at));
    return { works, pays,
      total: works.reduce((a,x)=>a+Number(x.price||0),0),
      paid:  pays .reduce((a,x)=>a+Number(x.amt ||0),0) };
  },

  /* خريطة الأسماء تُقرأ مرة واحدة بدل استعلام لكل صف */
  async ptMap(){
    const m = {}; (await DB.all('patients')).forEach(p => m[p.id] = p); return m;
  },

  /*──────── أشرطة مرتّبة من الأعلى للأدنى ────────*/
  rank(items){
    if (!items.length) return `<div class="emp mt">${T('noData')}</div>`;
    const max = Math.max(1, ...items.map(x => x.n));
    return items.map((x,i)=>`
      <div class="row mt" style="gap:10px;align-items:flex-start">
        <div class="rk ${i===0?'top':''}">${i+1}</div>
        <div class="gr" style="min-width:0">
          <div class="row" style="justify-content:space-between;gap:8px;margin-bottom:5px">
            <span class="ell" style="font-weight:700;font-size:13.5px;color:${x.col}">
              ${esc(x.label)}</span>
            <span class="mono" style="font-weight:800;white-space:nowrap">${x.n}
              <span class="tiny" style="color:var(--ink3)">${T('times')} · ${N(x.sum)}</span></span>
          </div>
          <div class="track"><i style="width:${Math.max(5, x.n/max*100)}%;
            background:${x.col}"></i></div>
        </div>
      </div>`).join('');
  },

  /*═══════ ١) الحسابات ═══════*/
  async accounts(){
    const box = $('#acc-body'); if (!box) return;
    box.innerHTML = UI.spin();

    const d   = await this.data();
    const due = Math.max(0, d.total - d.paid);
    const pm  = await this.ptMap();

    const byDay = {};
    d.pays.forEach(x => { const k = dkey(x.at); byDay[k] = (byDay[k]||0) + Number(x.amt||0); });
    const days = Object.entries(byDay).sort((a,b)=>a[0].localeCompare(b[0]));
    const dmax = Math.max(1, ...days.map(x=>x[1]));

    const payRows = d.pays.sort((a,b)=>(b.at||0)-(a.at||0)).map(x=>`
      <div class="it" style="cursor:default">
        <div class="av g">₪</div>
        <div class="gr">
          <div class="h3 ell">${esc(pm[x.pid]?nm(pm[x.pid]):'—')}</div>
          <div class="tiny">${T(x.method||'cash')} · ${fmtD(x.at)} ${fmtT(x.at)}
            ${x.fdi?` · ${T('tooth')} ${Chart.lbl(x.fdi)}`:''}</div>
        </div>
        <span class="mono" style="font-weight:800;color:var(--ok)">${N(x.amt)}</span>
      </div>`).join('');

    const workRows = d.works.sort((a,b)=>(b.at||0)-(a.at||0)).map(w=>`
      <tr onclick="Sec.file('${w.pid}')">
        <td class="ell" style="max-width:110px">${esc(pm[w.pid]?nm(pm[w.pid]):'—')}</td>
        <td class="mono" style="color:${P(w.proc).col};font-weight:700">
          ${w.fdi?Chart.lbl(w.fdi):'—'}</td>
        <td class="tiny">${esc(pName(w.proc))}</td>
        <td class="mono">${N(w.price)}</td>
        <td class="tiny">${fmtD(w.at)}</td>
      </tr>`).join('');

    const accBox = (icon, title, count, body, open) => `
      <details class="acc mt2" ${open?'open':''}>
        <summary><span class="accic">${icon}</span>
          <span class="gr">${title}</span>
          <span class="pill n">${count}</span>
          <span class="ar">${isAr()?'‹':'›'}</span></summary>
        <div class="bd">${body}</div></details>`;

    box.innerHTML = `
      <div class="card ctr">
        <div class="tiny" style="font-weight:700">${T('collected')} · ${this.spanLabel()}</div>
        <div class="mono h1" style="color:var(--ok);margin-top:4px">${N(d.paid)}</div>
      </div>

      <div class="g3 mt2">
        ${this.card(T('worksTotal'), N(d.total))}
        ${this.card(T('dueNow'), N(due), due>0?'var(--bd)':'var(--ink3)')}
        ${this.card(T('workCount'), d.works.length, null, `${d.pays.length} ${T('payCount')}`)}
      </div>

      ${days.length>1?accBox('📈', T('byDayIncome'), days.length, `
        <div style="display:flex;align-items:flex-end;gap:3px;height:130px">
          ${days.map(([k,val])=>`
            <div class="gr" style="display:flex;flex-direction:column;justify-content:flex-end;
                 height:100%" title="${k} — ${N(val)}">
              <div class="mono" style="font-size:8.5px;text-align:center;
                color:var(--ink3);margin-bottom:3px">${N(val)}</div>
              <div style="height:${Math.max(4, val/dmax*100)}%;background:var(--br);
                border-radius:6px 6px 0 0;min-height:4px"></div>
              <div class="mono" style="font-size:8.5px;text-align:center;
                color:var(--ink3);margin-top:4px">${k.slice(8)}/${k.slice(5,7)}</div>
            </div>`).join('')}
        </div>`, true):''}

      ${accBox('💵', T('gotPays'), d.pays.length,
        payRows?`<div class="col">${payRows}</div>`:`<div class="emp">${T('noData')}</div>`)}

      ${accBox('🦷', T('doneWorks'), d.works.length,
        workRows?`<table class="tbl">
          <thead><tr><th>${T('name')}</th><th>${T('workSite')}</th><th>${T('workType')}</th>
            <th>${T('amountPaid')}</th><th>${T('filterDate')}</th></tr></thead>
          <tbody>${workRows}</tbody></table>`:`<div class="emp">${T('noData')}</div>`)}

      <button class="btn w gh mt2" onclick="Print.day()">${T('printDay')}</button>`;
  },

  /*═══════ ٢) الإحصائيات ═══════*/
  async stats(){
    const box = $('#acc-body'); if (!box) return;
    box.innerHTML = UI.spin();

    const all = (await DB.all('works')).filter(w => this.inSpan(w.at));

    /* قوائم الفلتر تُبنى مما هو موجود فعلاً في الفترة */
    const teethAll = [...new Set(all.map(w=>Number(w.fdi)).filter(Boolean))]
      .sort((a,b)=>a-b);
    const procsAll = [...new Set(all.map(w=>w.proc).filter(Boolean))];

    let ws = all;
    if (this.f.fdi)  ws = ws.filter(w => Number(w.fdi) === Number(this.f.fdi));
    if (this.f.proc) ws = ws.filter(w => w.proc === this.f.proc);

    const sum   = ws.reduce((a,x)=>a+Number(x.price||0),0);
    const pts   = new Set(ws.map(w=>w.pid)).size;
    const teeth = new Set(ws.map(w=>Number(w.fdi)).filter(Boolean)).size;

    /* ترتيب أنواع الأعمال بعدد المرات من الأعلى للأدنى */
    const gp = {};
    ws.forEach(w => { (gp[w.proc] ||= { n:0, sum:0 }); gp[w.proc].n++;
                      gp[w.proc].sum += Number(w.price||0); });
    const topProcs = Object.entries(gp)
      .map(([k,v])=>({ label:pName(k), col:P(k).col, n:v.n, sum:v.sum }))
      .sort((a,b)=> b.n - a.n || b.sum - a.sum);

    const gt = {};
    ws.forEach(w => { if (!w.fdi) return;
      (gt[w.fdi] ||= { n:0, sum:0 }); gt[w.fdi].n++; gt[w.fdi].sum += Number(w.price||0); });
    const topTeeth = Object.entries(gt)
      .map(([k,v])=>({ label:`${T('tooth')} ${Chart.lbl(Number(k))}`,
                       col:'var(--br)', n:v.n, sum:v.sum }))
      .sort((a,b)=> b.n - a.n || b.sum - a.sum);

    const has = this.f.fdi || this.f.proc;

    box.innerHTML = `
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="lbl">${T('clearFilters')}</div>
          ${has?`<button class="btn xs gh" onclick="Money.resetF()">${T('resetF')}</button>`:''}
        </div>
        <div class="g2 mt">
          <div><label class="lb">${T('filterTooth')}</label>
            <select onchange="Money.f.fdi=this.value;Money.stats()">
              <option value="">${T('allTeeth')}</option>
              ${teethAll.map(f=>`<option value="${f}"
                ${String(this.f.fdi)===String(f)?'selected':''}>
                ${T('tooth')} ${Chart.lbl(f)} (FDI ${f})</option>`).join('')}
            </select></div>
          <div><label class="lb">${T('filterProc')}</label>
            <select onchange="Money.f.proc=this.value;Money.stats()">
              <option value="">${T('allProcs')}</option>
              ${procsAll.map(c=>`<option value="${esc(c)}"
                ${this.f.proc===c?'selected':''}>${esc(pName(c))}</option>`).join('')}
            </select></div>
        </div>
      </div>

      <div class="g3 mt2">
        ${this.card(T('workCount'), ws.length)}
        ${this.card(T('total'), N(sum), 'var(--ok)')}
        ${this.card(T('avgWork'), N(ws.length?Math.round(sum/ws.length):0))}
      </div>
      <div class="g2 mt">
        ${this.card(T('statPatients'), pts)}
        ${this.card(T('statTeeth'), teeth)}
      </div>

      <div class="card mt2">
        <div class="row" style="justify-content:space-between">
          <div class="lbl">🏆 ${T('topProcs')}</div>
          <span class="pill n">${topProcs.length}</span>
        </div>
        ${this.rank(topProcs)}
      </div>

      <div class="card mt2">
        <div class="row" style="justify-content:space-between">
          <div class="lbl">🦷 ${T('topTeeth')}</div>
          <span class="pill n">${topTeeth.length}</span>
        </div>
        ${this.rank(topTeeth)}
      </div>`;
  },

  /*═══════ ٣) المراجعون ═══════*/
  pq:'',

  async patients(){
    const box = $('#acc-body'); if (!box) return;
    box.innerHTML = `
      <div class="sbar"><input id="acc-q" placeholder="${T('searchAcc')}" value="${esc(this.pq)}"></div>
      <div id="acc-list" class="col mt2">${UI.spin()}</div>`;
    const inp = $('#acc-q');
    let tm;
    inp.addEventListener('input', ()=>{ this.pq = inp.value;
      clearTimeout(tm); tm = setTimeout(()=>this.ptList(), 200); });
    this.ptList();
  },

  async ptList(){
    const box = $('#acc-list'); if (!box) return;
    const ps = await Ops.patients(this.pq);
    const rows = [];
    for (const p of ps.slice(0,50)){
      const pays = await DB.by('payments','pid',p.id);
      const paid = pays.reduce((a,x)=>a+Number(x.amt||0),0);
      const last = pays.sort((a,b)=>(b.at||0)-(a.at||0))[0];
      const teeth = new Set(pays.map(x=>x.fdi).filter(Boolean));
      rows.push(`<div class="it" onclick="Money.ptVisits('${p.id}')">
        <div class="av">${esc(nm(p).charAt(0))}</div>
        <div class="gr">
          <div class="h3 ell">${esc(nm(p))}</div>
          <div class="mono tiny">${T('file')} ${esc(p.mrn)}
            ${teeth.size?` · ${teeth.size} ${T('teethTreated')}`:''}
            ${last?` · ${fmtD(last.at)}`:''}</div>
        </div>
        <div style="text-align:end">
          <div class="tiny">${T('totalPaid')}</div>
          <div class="mono h3" style="color:var(--ok)">${N(paid)}</div>
        </div>
      </div>`);
    }
    box.innerHTML = rows.join('') || `<div class="emp">${T('noResult')}</div>`;
  },

  /* حسابات المراجع: كل سن ← سلاسله ← جلساته ← مبلغ كل جلسة */
  async ptVisits(pid){
    const p = await DB.get('patients', pid);
    const L = await Ops.ledger(pid);

    const teethHtml = L.teeth.map(t => {
      const col = TS('sound').col;
      const courses = t.courses.map(c => `
        <div class="card flat" style="margin-top:9px">
          <div class="row" style="justify-content:space-between">
            <span class="pill ${c.closed?'n':'b'}">${T('courseNo')} ${c.n} ·
              ${c.closed?T('courseClosed'):T('courseActive')}</span>
            <span class="mono" style="font-weight:800;color:var(--ok)">${N(c.paid)}</span>
          </div>
          <div class="col mt">${c.sessions.map(sx=>`
            <div class="it" style="padding:9px 11px;${sx.vid==='x'?'cursor:default':''}"
              ${sx.vid!=='x'?`onclick="Money.visitPays('${sx.vid}','${pid}')"`:''}>
              <div class="av" style="width:32px;height:32px;font-size:13px">${sx.no||'—'}</div>
              <div class="gr">
                <div class="mono" style="font-weight:700">${sx.date?fmtD(sx.date):'—'}</div>
                <div class="tiny">${sx.works.map(w=>pName(w.proc)).join(' · ')||'—'}</div>
              </div>
              <div style="text-align:end">
                <div class="tiny">${T('sessionAmt')}</div>
                <div class="mono" style="font-weight:700;color:var(--ok)">${N(sx.paid)}</div>
              </div>
            </div>`).join('')}</div>
        </div>`).join('');

      return `<div class="card">
        <div class="row">
          <div class="av mono" style="font-size:15px">${Chart.lbl(t.fdi)}</div>
          <div class="gr">
            <div class="h3">${T('tooth')} ${Chart.lbl(t.fdi)}</div>
            <div class="tiny">${t.visits} ${T('toothVisits')} · ${t.courses.length} ${T('courseNo')}</div>
          </div>
          <div style="text-align:end">
            <div class="tiny">${T('courseTotal')}</div>
            <div class="mono h3" style="color:var(--ok)">${N(t.paid)}</div>
          </div>
        </div>
        ${courses}
      </div>`;
    }).join('');

    UI.sheet(`
      <div class="shhead">
        <div class="gr">
          <div class="h2">${esc(nm(p))}</div>
          <div class="sub">${T('file')} ${esc(p.mrn)} · ${esc(p.phone||'')}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>

      <div class="card">
        <div class="lbl">${T('summary')}</div>
        <div class="g3 mt">
          <div class="ctr"><div class="tiny">${T('grandTotal')}</div>
            <div class="mono h2" style="color:var(--ok)">${N(L.allPaid)}</div></div>
          <div class="ctr"><div class="tiny">${T('visitsCount')}</div>
            <div class="mono h2">${L.visitCount}</div></div>
          <div class="ctr"><div class="tiny">${T('teethTreated')}</div>
            <div class="mono h2">${L.toothCount}</div></div>
        </div>
      </div>

      <div class="lbl mt2">${T('perTooth')}</div>
      ${teethHtml || `<div class="emp mt">${T('noLedger')}</div>`}

      ${L.loose.length?`<div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="lbl">${T('looseP')}</div>
          <span class="mono" style="font-weight:800;color:var(--ok)">${N(L.loosePaid)}</span>
        </div>
        <div class="col mt">${L.loose.sort((a,b)=>(b.at||0)-(a.at||0)).map(x=>`
          <div class="it" style="cursor:default;padding:9px 11px">
            <div class="av g" style="width:32px;height:32px;font-size:13px">₪</div>
            <div class="gr"><div class="mono" style="font-weight:700">${N(x.amt)}</div>
              <div class="tiny">${fmtD(x.at)} · ${T(x.method||'cash')}</div></div>
          </div>`).join('')}</div>
      </div>`:''}

const Perm = {
  /* من يرى مخطط الأسنان؟ الطبيب دائماً، والسكرتير حسب إعداد الطبيب */
  chart(){ return S.role==='doctor' || (S.role==='secretary' && CFG.data.secChart); },
  /* تسجيل الأعمال وتحديد السن: من يملك المخطط يملكها —
     لأن اختيار السن ونوع العمل جزء من المخطط نفسه. */
  addWork(){ return this.chart(); },
  /* كتابة العلاج للطبيب وحده — حتى لو فُتح المخطط للسكرتير */
  writeRx(){ return S.role==='doctor'; },
  money(){ return S.role==='doctor' || S.role==='secretary' || S.role==='owner'; },
  /* إدارة هوية العيادة وطاقمها: المستثمر، أو الطبيب في عيادة قديمة بلا مستثمر */
  manage(){ return !!(Cloud.me && Cloud.me.can_manage); },
};

const Nav = {
  /* فتح جلسة: الطبيب يرى الشاشة السريرية، السكرتير يرى شاشة الحساب */
  /* السكرتير يبقى دائماً في شاشته حتى لا يفقد أزراره،
     والمخطط يُفتح من زر داخلها عند السماح به. */
  session(vid){
    return S.role==='doctor' ? Doc.session(vid) : Sec.visit(vid);
  },

  /*──────────────────────────────────────────────
    سجل الصفحات: كل صفحة تُفتح تُسجَّل، و"رجوع"
    يعود خطوة واحدة فقط بدل القفز للواجهة الرئيسية.
    الصفحات تُغلَّف تلقائياً فلا حاجة لتعديل كل زر.
  ──────────────────────────────────────────────*/
  stack:[], raw:{}, busy:false,

  wrap(){
    for (const path of PAGES){
      const [o,f] = path.split('.');
      const obj = REG[o];
      if (!obj || typeof obj[f] !== 'function') continue;
      this.raw[path] = obj[f].bind(obj);
      obj[f] = (...a) => {
        if (!this.busy) this.push(path, a);
        const r = this.raw[path](...a);
        /* أي صفحة قد تحمل مصغّرات — تُملأ بعد رسمها */
        Promise.resolve(r).then(()=>setTimeout(()=>Doc.thumbs(), 40)).catch(()=>{});
        return r;
      };
    }
  },

  /* مفتاح الصفحة = اسمها + مُعرّفاتها، فصفحتان لسنّين مختلفين ليستا واحدة */
  key(path, a){
    return path + '|' + a.map(x =>
      (x && typeof x === 'object') ? (x.id || '#') : String(x)).join(',');
  },

  /* إعادة فتح صفحة موجودة في السجل = رجوع إليها، لا تكديس نسخة ثانية منها.
     هذا يمنع الحاجة للضغط على «رجوع» مرتين بعد كل حفظ. */
  push(path, a){
    const k = this.key(path, a);
    const i = this.stack.findIndex(x => x.k === k);
    if (i >= 0) this.stack.length = i;
    this.stack.push({ path, a, k });
  },

  back(){
    this.stack.pop();
    const top = this.stack[this.stack.length-1];
    if (!top){ UI.close(); App.draw(); Sync.dirty = false; return; }
    this.busy = true;
    try { return this.raw[top.path](...top.a); }
    finally { this.busy = false; setTimeout(()=>Doc.thumbs(), 40); }
  },

  home(){ this.reset(); S.chartOpen = false; UI.close(); App.draw(); Sync.dirty = false; },
  reset(){ this.stack = []; },
};

/*═══════════════ اختيار نوع العمل ═══════════════
  حقل واحد يقبل ثلاث طرق: الكتابة المباشرة مع اقتراحات فورية،
  أو تصفّح المجموعات ثم أنواعها، أو كتابة نوع غير موجود فيُحفظ
  كما هو. يخدم نموذج خطة السن وإضافة عمل معاً.
═══════════════════════════════════════════════*/
const PickProc = {
  st:{},   /* لكل حقل: المجموعة المفتوحة وحقل السعر المرتبط */

  /* النص الظاهر لأي رمز — يشمل الأنواع المكتوبة يدوياً */
  label(code){
    const c = String(code||'');
    if (!c) return '';
    return c.startsWith('x:') ? c.slice(2) : pName(c);
  },

  /* opt.only يحصر الحقل بمجموعات بعينها، opt.not يستثنيها.
     بهما ينفصل حقل التشخيص عن حقل نوع العمل فلا يزاحم أحدهما الآخر. */
  html(id, code, priceId, opt){
    const o = opt || {};
    this.st[id] = { grp:null, priceId:priceId||'', only:o.only||null, not:o.not||null };
    const p = code && !String(code).startsWith('x:') ? P(code) : null;
    return `
      <div class="pp" id="${id}-box">
        <input type="hidden" id="${id}" value="${esc(code||'')}" data-p="${p?p.p:0}">
        <input id="${id}-q" class="pp-q" autocomplete="off" placeholder="${esc(o.ph || T('procPick'))}"
          value="${esc(this.label(code))}"
          oninput="PickProc.type('${id}')" onfocus="PickProc.open('${id}')">
        <button type="button" class="pp-tg" onclick="PickProc.toggle('${id}')">▾</button>
        <div class="pp-pan hide" id="${id}-pan"></div>
      </div>`;
  },

  /* الأنواع المسموحة لهذا الحقل وحده */
  pool(id){
    const s = this.st[id] || {};
    return PROCS.filter(x =>
      (!s.only || s.only.includes(x.cat)) &&
      (!s.not  || !s.not.includes(x.cat)));
  },

  pan(id){ return $('#'+id+'-pan'); },
  open(id){ const p = this.pan(id); if (p){ p.classList.remove('hide'); this.render(id); } },
  close(id){ this.pan(id)?.classList.add('hide'); },
  toggle(id){
    const p = this.pan(id); if (!p) return;
    if (p.classList.contains('hide')){ this.st[id].grp = null; this.open(id); }
    else this.close(id);
  },

  /* الكتابة تبحث في كل الأنواع فوراً وتتجاوز المجموعات */
  type(id){ this.st[id].grp = null; $('#'+id).value = ''; this.open(id); },

  grp(id, g){ this.st[id].grp = g; $('#'+id+'-q').value = ''; $('#'+id).value = ''; this.render(id); },

  pick(id, code){
    const p = P(code);
    const h = $('#'+id); h.value = code; h.dataset.p = p.p || 0;
    $('#'+id+'-q').value = this.label(code);
    const pi = this.st[id].priceId ? $('#'+this.st[id].priceId) : null;
    if (pi) pi.value = p.p || '';
    this.close(id);
  },

  render(id){
    const box = this.pan(id); if (!box) return;
    const q  = ($('#'+id+'-q')?.value || '').trim().toLowerCase();
    const st = this.st[id];

    /* ١ — كتابة: اقتراحات من كل المجموعات المسموحة */
    if (q){
      const hits = this.pool(id).filter(x =>
        (x.ar + ' ' + x.en).toLowerCase().includes(q)).slice(0, 40);
      box.innerHTML = hits.length
        ? hits.map(x => this.row(id, x, true)).join('')
        : `<div class="pp-hint">${T('noProcMatch')}</div>`;
      return;
    }

    /* ٢ — مجموعة مفتوحة: أنواعها */
    if (st.grp){
      const g = PGRP[st.grp] || { ar:st.grp, en:st.grp, col:'var(--br)' };
      box.innerHTML = `
        <div class="pp-head" onclick="PickProc.grp('${id}','')">
          <span style="color:var(--br)">${isAr()?'›':'‹'}</span>
          <span>${T('allGroups')}</span>
          <span class="cnt" style="color:${g.col}">${esc(isAr()?g.ar:g.en)}</span>
        </div>
        ${this.pool(id).filter(x=>x.cat===st.grp).map(x=>this.row(id,x,false)).join('')}`;
      return;
    }

    /* ٣ — الافتراضي: المجموعات.
       وحقلٌ محصور بمجموعة واحدة لا معنى لخطوة اختيار المجموعة فيه —
       تُعرض أنواعه مباشرة. */
    const pool   = this.pool(id);
    const groups = Object.entries(PGRP).filter(([k]) => pool.some(x=>x.cat===k));
    const other  = pool.filter(x => !PGRP[x.cat]);
    if (groups.length <= 1){
      box.innerHTML = pool.length
        ? pool.map(x=>this.row(id,x,false)).join('')
        : `<div class="pp-hint">${T('noProcMatch')}</div>`;
      return;
    }
    box.innerHTML = `<div class="pp-hint">${T('pickGroup')}</div>` +
      groups.map(([k,g])=>`
        <div class="pp-row" onclick="PickProc.grp('${id}','${k}')">
          <span class="dt" style="background:${g.col}"></span>
          <span>${esc(isAr()?g.ar:g.en)}</span>
          <span class="cnt">${pool.filter(x=>x.cat===k).length} ${isAr()?'›':'‹'}</span>
        </div>`).join('') +
      other.map(x=>this.row(id,x,false)).join('');
  },

  row(id, x, showGrp){
    const g = PGRP[x.cat];
    return `<div class="pp-row" onclick="PickProc.pick('${id}','${esc(x.c)}')">
      <span class="dt" style="background:${x.col}"></span>
      <span class="ell">${esc(isAr()?x.ar:x.en)}</span>
      ${showGrp&&g?`<span class="cnt">${esc(isAr()?g.ar:g.en)}</span>`
        :x.p?`<span class="cnt mono">${N(x.p)}</span>`:''}</div>`;
  },

  /* الضغط خارج الحقل يُغلق اللوحة — ولا يُغلقها الضغط داخلها */
  initOutside(){
    document.addEventListener('pointerdown', e => {
      const box = e.target.closest && e.target.closest('.pp');
      document.querySelectorAll('.pp-pan').forEach(p => {
        if (!box || !box.contains(p)) p.classList.add('hide');
      });
    }, true);
  },

  /* القراءة عند الحفظ: المختار، أو ما كُتب يدوياً كما هو */
  read(id){
    const code = $('#'+id)?.value || '';
    const txt  = ($('#'+id+'-q')?.value || '').trim();
    if (code && txt === this.label(code)) return code;
    if (txt.length >= 2) return 'x:' + txt;
    return code || '';
  },
};

const Rx = {
  /* التحويل يبدأ فارغاً في كل وصفة: الإرسال قرار يُتَّخذ كل مرة،
     لا إعداد يُنسى فتذهب وصفة إلى صيدلية لم تُقصد. */
  write(){ S.rxDraft = [{}]; S.rxPh = ''; this.sheet(); },

  /* الصيدليات المسجّلة في «إيميلات العيادة» */
  /* الصيدليات التي اختارها هذا الطبيب من «فريقي» — ومع حساب قديم
     بلا سيرفر تبقى القائمة المحلية القديمة. */
  pharmacies(){
    if (Staff.cache()){
      return Staff.linked('pharmacy').filter(m => m.active !== false)
        .map(m => ({ id:m.uid, name:m.name || m.email, email:String(m.email||'').toLowerCase() }));

  readPh(){ const n = $('#rx-ph'); return n ? n.value : (S.rxPh || ''); },

  sheet(){

      <div class="card flat" style="margin-top:10px;padding:13px">
        <div class="row" style="justify-content:space-between;margin-bottom:9px">

        <div class="g3 mt">
          <input id="rx-o${i}" placeholder="${T('dose')}" value="${esc(it.dose||'')}" dir="ltr" style="text-align:left">
          <input id="rx-f${i}" placeholder="${T('freq')}" value="${esc(it.freq||'')}" dir="ltr" style="text-align:left">

        <select id="rx-ph">

          ${this.pharmacies().map(a=>`<option value="${a.id}"
            ${S.rxPh===a.id?'selected':''}>${esc(a.name || a.email)}</option>`).join('')}
        </select>
        <div class="tiny mt">${this.pharmacies().length ? T('phHint') : T('needPharmAcc')}</div>
      </div>
      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
        <button class="btn sf gr" onclick="Rx.save(false)">💾 ${T('saveOnly')}</button>

  /* الطبيب يرى وصفاته المكتوبة وحالتها — الصرف ليس من هنا */

    instr:($('#rx-i'+i)?.value||'').trim() })); },

  /* إعادة رسم الورقة ليست صفحة جديدة — تُستبدل مكانها */
  redraw(){ Nav.stack.pop(); this.sheet(); },
  add(){ S.rxDraft=this.read(); S.rxPh=this.readPh(); S.rxDraft.push({}); this.redraw(); },
  del(i){ S.rxDraft=this.read(); S.rxPh=this.readPh(); S.rxDraft.splice(i,1); this.redraw(); },

  async save(alsoPrint){
    const items = this.read().filter(x=>x.drug.length>=2);

    /* تحذير الحساسية قبل الحفظ */

    let v = S.visit;
    if (!v) v = await Ops.openVisit(S.patient.id);

    /* التحويل: بريد الصيدلية هو العنوان — الاسم للعرض والمعرّف
       قد يتبدّل، أما البريد فهو ما تدخل به الصيدلية. ومن لم
       يُختَر له عنوان لا يصل إلى أحد. */
    const phId = this.readPh();
    const ph = this.pharmacies().find(a => a.id === phId) || null;

    const rx = { id:uid(), pid:S.patient.id, vid:v.id, items, st:'signed',
                 doctor: Prof.cachedName() || S.user?.name || CFG.data.doctor || T('r_doctor'),
                 ph: ph ? ph.id : '', phName: ph ? (ph.name || ph.email) : '',
                 phEmail: ph ? ph.email : '', route:1,
                 cid: CFG.data.cid, at:Date.now() };
    await DB.put('rx', rx);
    for (const i of items){
      await SG.learn('drug',i.drug); await SG.learn('dose',i.dose);
      await SG.learn('freq',i.freq); await SG.learn('dur',i.dur); await SG.learn('instr',i.instr);
    }
    toast(ph ? `${T('sentTo')}: ${ph.name || ph.email}` : T('notSent'), ph ? 's' : 'w');
    S.rxPh = '';
    /* العودة إلى جلسة الوصفة نفسها — لا إلى آخر صفحة في السجل،
       فقد تكون صفحة المرفقات إن فُتحت قبل كتابة العلاج. */
    Nav.reset(); UI.close();
    if (alsoPrint) Print.rx(rx.id);
    Nav.session(v.id);
  },
};

/*═══════════════ الطابعات ═══════════════
  لا يعطي أي متصفح قائمة الطابعات لصفحة ويب — لا واجهة قياسية لذلك.
  فالتعرّف التلقائي يجري عبر أي جسر متاح (غلاف سطح مكتب أو أندرويد)،
  وإن لم يوجد بقي الاسم يُكتب مرة واحدة ويُذكَّر به عند كل طباعة.

  والأسماء تُحفظ في هذا الجهاز وحده ولا تُزامَن: طابعة الاستقبال
  ليست طابعة غرفة الطبيب، ولو زُومنت لطبع كلٌّ على طابعة غيره.
═══════════════════════════════════════*/
const Prn = {
  K:{ a5:'d_prn_a5', bc:'d_prn_bc', list:'d_prn_list', w:'d_lbl_w', h:'d_lbl_h' },

  get(k, d){ try { return localStorage.getItem(this.K[k]) || (d==null?'':String(d)); }
             catch(_){ return d==null?'':String(d); } },
  set(k, v){ try { localStorage.setItem(this.K[k], v==null?'':String(v)); } catch(_){} },

  /* قياس ملصق الباركود — الافتراضي ٥٠×٣٠ ملم، أشيع ملصق حراري */
  label(){ return { w:Number(this.get('w', 50)) || 50, h:Number(this.get('h', 30)) || 30 }; },

  names(){ try { return JSON.parse(this.get('list','[]')) || []; } catch(_){ return []; } },
  saveNames(a){
    const list = [...new Set((a||[]).map(x => String(x||'').trim()).filter(Boolean))].slice(0,30);
    this.set('list', JSON.stringify(list));
    return list;
  },

  /* أي جسر يوفّره الغلاف الذي يعمل البرنامج داخله */
  bridge(){
    return window.ClinicPrint || window.AndroidPrint || window.electronPrint
        || (window.electron && window.electron.printHTML ? window.electron : null) || null;
  },

  async detect(){
    const found = [];
    try {
      const b = this.bridge();
      let r = b ? (typeof b.getPrinters === 'function' ? b.getPrinters() : (b.printers || null)) : null;
      if (r && typeof r.then === 'function') r = await r;
      if (typeof r === 'string'){ try { r = JSON.parse(r); } catch(_){ r = r.split(/[\n,;]+/); } }
      if (Array.isArray(r))
        for (const x of r) found.push(typeof x === 'string' ? x : (x.name || x.displayName || x.printerName || ''));
    } catch(_){}
    try {
      const np = navigator.printing;
      let r = (np && typeof np.getPrinters === 'function') ? await np.getPrinters() : null;
      if (Array.isArray(r)) for (const x of r) found.push(x.name || x.printerName || '');
    } catch(_){}
    if (Array.isArray(window.__PRINTERS__)) found.push(...window.__PRINTERS__);

    const list = [...new Set(found.map(x => String(x||'').trim()).filter(Boolean))];
    if (list.length) this.saveNames([...list, ...this.names()]);
    return list;
  },

  /* الطباعة الصامتة عبر الجسر إن وُجد، وإلا تُترك للنافذة المعتادة
     مع تذكير باسم الطابعة المطلوبة حتى لا تُطبع الورقة على الملصق. */
  async send(kind, html, title){
    const dev = this.get(kind === 'bc' ? 'bc' : 'a5', '');
    const b = this.bridge();
    if (b && typeof b.printHTML === 'function'){
      try { await b.printHTML(html, dev || '', kind, title || ''); return true; } catch(_){}
    }
    if (dev) toast(`${T('sendTo')}: ${dev}`, 's');
    return false;
  },
};

/*═══════════════ الطباعة ═══════════════*/
const Print = {
  /* الشعار المرفوع في الإعدادات هو رأس الورقة نفسه — يُطبع بعرض
     الصفحة كاملاً. النص يظهر فقط عند غياب الشعار. */
  head(){
    const c = CFG.data;
    if (c.logo){
      return `<div style="text-align:center;padding-bottom:6px">
        <img src="${c.logo}" style="width:100%;max-height:130px;object-fit:contain;display:block">
      </div>`;
    }
    return `<div style="text-align:center;border-bottom:3px solid #00695C;padding-bottom:8px">
      <div style="font-size:19px;font-weight:800">${esc(c.header||c.clinic)}</div>
      ${c.doctor?`<div style="font-size:13px">${esc(c.doctor)}${c.title?' — '+esc(c.title):''}</div>`:''}
    </div>`;
  },
  /* ورقتان مختلفتان تماماً: ورقة العلاج A5 بترويستها وتذييلها،
     وملصق الباركود بقياس الملصق بلا شيء حوله. لكل واحدة طابعتها
     المختارة في الإعدادات. */
  win(inner, title, kind){
    const isLbl = kind === 'bc';
    const L = Prn.label();
    const page = isLbl ? `@page{size:${L.w}mm ${L.h}mm;margin:2mm}`
                       : `@page{size:A5;margin:9mm}`;
    const foot = isLbl ? '' : `<div class="ft">${CFG.data.footerImg
        ? `<img src="${CFG.data.footerImg}" style="width:100%;max-height:70px;object-fit:contain">`
        : esc(CFG.data.footer||'')}</div>`;

    const html = `<!DOCTYPE html><html lang="${LG}" dir="${isAr()?'rtl':'ltr'}"><head>
      <meta charset="utf-8"><title>${esc(title)}</title>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
      <style>${page}
        body{font-family:'IBM Plex Sans Arabic',sans-serif;margin:0;color:#111;
             font-size:${isLbl?'12px':'13px'}}
        table{width:100%;border-collapse:collapse;margin-top:8px}
        td,th{padding:7px 5px;border-bottom:1px solid #ccc;text-align:start}
        th{background:#eef3f3;font-size:11.5px}
        .ft{position:fixed;bottom:0;inset-inline:0;text-align:center;font-size:11px;
            color:#555;border-top:1px solid #ddd;padding-top:5px}
      </style></head><body>${inner}
      ${foot}
      <script>window.onload=()=>setTimeout(()=>window.print(),420)<\/script>
      </body></html>`;

    /* نافذة الطباعة تُفتح في اللحظة نفسها التي ضُغط فيها الزر —
       لو انتظرنا وعداً لحجبها المتصفح بوصفها نافذة منبثقة.
       فالجسر (إن وُجد) يطبع صامتاً، وإلا فُتحت النافذة فوراً. */
    const kindKey = isLbl ? 'bc' : 'a5';
    const br = Prn.bridge();
    if (br && typeof br.printHTML === 'function'){
      Prn.send(kindKey, html, title).catch(()=>{});
      return;
    }
    const dev = Prn.get(kindKey, '');
    if (dev) toast(`${T('sendTo')}: ${dev}`, 's');
    const w = window.open('','_blank','width=600,height=820');
    if (!w) return toast(T('printBlocked'), 'e');
    w.document.write(html);
    w.document.close();
  },

  /* جسم ورقة A5 — مصدر واحد يُستخدم للطباعة وللمعاينة داخل البرنامج،
     فما يراه الصيدلي هو نفسه ما يطبعه الطبيب حرفياً. */
  /* كل جزء يُعزل باتجاهه: الرقم يبقى ملتصقاً بكلمته العربية
     ولا يقفز للحقل المجاور — سبب ظهور "٤" مع حقل المدة. */
  seg(v){ return `<bdi style="unicode-bidi:isolate">${esc(v)}</bdi>`; },

  /* بيانات الطبيب صاحب الوصفة: ملفّه الشخصي إن وُجد، وإلا إعدادات
     العيادة كما كانت — فعيادة بطبيب واحد لا يتغيّر عليها شيء. */
  async docOf(rx){
    const pf = await Prof.get(rx && rx._own);
    if (!pf) return { doctor: rx?.doctor || CFG.data.doctor || '',
                      title: CFG.data.title || '', sign: CFG.data.sign || '' };
    return { doctor: pf.name || rx?.doctor || CFG.data.doctor || '',
             title: pf.title || '', sign: pf.sign || '' };
  },

  rxBody(rx, p, forScreen, d){
    const c = { ...CFG.data, ...(d || {}) };
    const head = c.logo
      ? `<div class="phd"><img src="${c.logo}"></div>`
      : `<div class="phd">
           <div style="font-size:19px;font-weight:800">${esc(c.header||c.clinic)}</div>
           ${c.doctor?`<div style="font-size:13px">${esc(c.doctor)}${c.title?' — '+esc(c.title):''}</div>`:''}
         </div>`;

    const items = rx.items.map((i,n)=>`
      <div class="rxrow">
        <div class="n">${n+1}</div>
        <div class="rxtxt">
          <div class="dname">${esc(i.drug)}</div>
          <div class="ddose">${[i.dose,i.freq,i.dur,i.instr]
            .filter(Boolean).map(x=>this.seg(x)).join(' — ')}</div>
        </div>
      </div>`).join('');

    return `${head}
      <div class="pmeta">
        <span><b>${esc(nm(p))}</b></span>
        <span>${p.age||''} ${T('yrs')}</span>
        <span>${esc(p.mrn||'')}</span>
        <span>${fmtD(rx.at)}</span>
      </div>
      ${rx.phName?`<div style="font-size:12px;font-weight:700;margin-top:6px">
        ${T('dispenseAt')}: ${esc(rx.phName)}</div>`:''}
      <div style="font-size:16px;font-weight:800;margin:8px 0 2px;color:#00695C">℞</div>
      ${items}
      ${rx.notes?`<div style="margin-top:10px;font-size:12px">${esc(rx.notes)}</div>`:''}
      <div class="psig">
        ${c.sign?`<img src="${c.sign}" alt="">`:''}
        <div class="pname">${esc(c.doctor||'')}</div>
        ${c.title?`<div style="font-size:11px;color:#555">${esc(c.title)}</div>`:''}
      </div>
      ${forScreen && c.footer?`<div class="pft">${esc(c.footer)}</div>`:''}`;
  },

  /* معاينة داخل البرنامج */
  async rxPreview(id){
    const rx = await DB.get('rx', id);
    const p  = await DB.get('patients', rx.pid);
    return `<div class="paper">${this.rxBody(rx, p, true, await this.docOf(rx))}</div>`;
  },

  async rx(id){
    const rx = await DB.get('rx', id);
    const p  = await DB.get('patients', rx.pid);
    const dc = await this.docOf(rx);
    this.win(`${this.head()}
      <div style="display:flex;justify-content:space-between;font-size:12.5px;
        margin:11px 0;padding:8px 0;border-bottom:1px dashed #999">
        <span><b>${esc(nm(p))}</b></span><span>${p.age||''} ${T('yrs')}</span>
        <span>${esc(p.mrn)}</span><span>${fmtD(rx.at)}</span></div>
      <div style="font-size:16px;font-weight:800;margin-top:6px;color:#00695C">℞</div>
      <table dir="ltr"><tbody>${rx.items.map((i,n)=>`<tr>
        <td style="width:24px;font-weight:800;color:#00695C;text-align:left">${n+1}</td>
        <td style="text-align:left">
          <b style="font-size:14.5px">${esc(i.drug)}</b>
          <div style="font-size:11.5px;color:#444;margin-top:2px;unicode-bidi:plaintext">
          ${[i.dose,i.freq,i.dur,i.instr].filter(Boolean)
            .map(x=>`<bdi style="unicode-bidi:isolate">${esc(x)}</bdi>`).join(' — ')}</div></td>
      </tr>`).join('')}</tbody></table>
      ${rx.notes?`<div style="margin-top:10px;font-size:12px">${esc(rx.notes)}</div>`:''}
      <div style="margin-top:26px;text-align:center;font-size:12px">
        ${dc.sign?`<img src="${dc.sign}" style="display:block;margin:0 auto -6px;
          max-height:64px;max-width:210px;object-fit:contain">`:''}
        <div style="font-weight:800;font-size:13px;border-top:1px solid #444;
          display:inline-block;padding-top:5px;min-width:190px">${esc(dc.doctor||'')}</div>
        ${dc.title?`<div style="font-size:11px;color:#555">${esc(dc.title)}</div>`:''}
      </div>`, nm(p), 'a5');
  },

  /*──── ملصق الباركود ────
    ترتيب مقصود: اسم الطبيب فوق ليُعرف مصدر الملصق من نظرة، ثم
    الباركود في وسط الملصق ليقرأه الماسح بلا بحث، ثم اسم المريض
    وتاريخ حجزه ووقته أسفله. ورقم الرمز تحت الخطوط لأن الماسح قد
    يتعطّل فيُكتب الرقم باليد. */
  labelHTML(o){
    return `<div style="width:100%;text-align:center;color:#000;
      font-family:'IBM Plex Sans Arabic',sans-serif;background:#fff">
      <div style="font-size:12.5px;font-weight:800;line-height:1.25;
        border-bottom:1px solid #000;padding-bottom:3px;margin-bottom:5px">
        ${esc(o.doctor||'')}</div>
      <div style="padding:0 2px">${C39.svg(o.code, 52)}</div>
      <div style="font-family:monospace;font-size:12.5px;font-weight:800;
        letter-spacing:.22em;margin-top:1px">${esc(o.code)}</div>
      <div style="font-size:13px;font-weight:800;margin-top:5px;line-height:1.25">
        ${esc(o.patient||'')}</div>
      <div style="font-size:10.5px;margin-top:2px;font-weight:600">${esc(o.when||'')}</div>
    </div>`;
  },

  /* بيانات الملصق: الرمز واحد للمراجع في كل زياراته، والوقت وقت
     حجزه من تطبيقه إن حجز، وإلا وقت فتح جلسته في العيادة. */
  async labelData(vid){
    const v = await DB.get('visits', vid);
    const p = v ? await DB.get('patients', v.pid) : null;
    if (p && !p.bc){ p.bc = await Ops.nextBarcode(); await DB.put('patients', p); }

    /* وقت هذه الزيارة تحديداً: حجز اليوم نفسه إن وُجد، وإلا حجز
       قادم، وإلا وقت فتح الجلسة. فلا يُطبع على ملصق اليوم تاريخُ
       حجز قديم. */
    let when = `${fmtD(v?.date || today())} · ${fmtT(v?.at || Date.now())}`;
    try {
      const day = v?.date || today();
      const mine = (await DB.all('bookings'))
        .filter(b => p && b.pid === p.id && b.day && b.st !== 'declined')
        .sort((a,b) => String((a.day||'')+(a.time||''))
                       .localeCompare(String((b.day||'')+(b.time||''))));
      const bk = mine.find(b => b.day === day) || mine.find(b => b.day >= day);
      if (bk) when = `${fmtD(bk.day)}${bk.time ? ' · ' + bk.time : ''}`;
    } catch(_){}

    return { code:String(p?.bc || v?.code || ''), patient:p ? nm(p) : '',
             doctor:(CFG.data.doctor || CFG.data.clinic || ''), when, p, v };
  },

  async barcode(vid){
    const d = await this.labelData(vid);
    if (!d.code) return toast(T('noResult'), 'e');
    this.win(this.labelHTML(d), d.code, 'bc');
  },

  async day(){
    const works = (await DB.all('works')).filter(w=>dkey(w.at)===today());
    const rows = [];
    for (const w of works){ const p = await DB.get('patients', w.pid);
      rows.push(`<tr><td>${esc(p?nm(p):'—')}</td>
        <td style="font-family:monospace">${w.fdi?Chart.lbl(w.fdi):'—'}</td>
        <td>${esc(pName(w.proc))}</td><td style="font-family:monospace">${N(w.price)}</td>
        <td style="font-size:11px">${esc(w.note||'')}</td></tr>`); }
    const tot = works.reduce((s,x)=>s+Number(x.price||0),0);
    this.win(`${this.head()}
      <div style="font-size:15px;font-weight:800;margin-top:10px">${T('dayReport')} — ${fmtD(today())}</div>
      <table><thead><tr><th>${T('name')}</th><th>${T('workSite')}</th><th>${T('workType')}</th>
        <th>${T('amountPaid')}</th><th>${T('notes')}</th></tr></thead>
        <tbody>${rows.join('')||''}</tbody></table>
      <div style="margin-top:12px;font-weight:800;font-size:15px">${T('total')}: ${N(tot)}</div>`,
      T('dayReport'));
  },
};

/*═══════════════ الصيدلية ═══════════════*/
const Ph = {
  /*──── ما الذي تراه هذه الصيدلية؟ ────
    الوصفة تُحوَّل إلى بريد صيدلية بعينه، فلا تراها غيرها. وما
    حُفظ بلا تحويل لا يراه أحد — هذا نصّ ما يريده الطبيب.
    وحدها الوصفات المكتوبة قبل تسجيل أول صيدلية تبقى ظاهرة، لئلا
    يفقد الصيدلي سجلّه القديم يوم تُفعّل الميزة.
    والطبيب والسكرتير خارج هذه القاعدة: يريان كل شيء كما كانا. */
  myMail(){
    return String(Cloud.session?.email || S.user?.id || '').trim().toLowerCase();
  },

  mine(r){
    if (!r) return false;
    if (S.role !== 'pharmacy') return true;
    /* العلامة route تُوضع على كل وصفة تكتبها هذه النسخة، اختير لها
       تحويل أو لم يُختر. فالحكم يقع من الوصفة نفسها لا من دليل
       الحسابات — وجهاز الصيدلية لا يستقبل إعدادات العيادة أصلاً
       (يسحب الوصفات والمراجعين فقط)، فلو عُلّق الحكم على الدليل
       لرأت كل صيدلية كل شيء. */
    if (r.phEmail) return String(r.phEmail).toLowerCase() === this.myMail();
    return !r.route;      /* وصفات كُتبت قبل هذه الميزة تبقى ظاهرة */
  },

  async mineAll(){ return (await DB.all('rx')).filter(r => this.mine(r)); },

  async queue(){
    const v = $('#view'); v.innerHTML = UI.spin();
    const rs = (await this.mineAll()).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,60);
    const rows = [];
    for (const r of rs){
      const p = await DB.get('patients', r.pid); if(!p) continue;
      rows.push(`<div class="it" onclick="Ph.open('${r.id}')">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr"><div class="h3 ell">${esc(nm(p))}</div>
          <div class="tiny mono">${fmtD(r.at)} · ${r.items.length} ${T('drug')}</div></div>
        <span class="pill ${r.st==='done'?'g':'w'}">${r.st==='done'?T('dispensed'):T('pending')}</span>
      </div>`);
    }
    v.innerHTML = rows.length?`<div class="col">${rows.join('')}</div>`:`<div class="emp">${T('noRx')}</div>`;
  },

  /* الصيدلي يرى ورقة العلاج كما يطبعها الطبيب تماماً،
     مع الحساسيات — بلا تشخيص ولا أسعار. */
  async open(id){
    const r = await DB.get('rx', id);
    if (!r) return toast(T('noResult'), 'e');
    /* حتى لو وصل الرمز بالمسح أو برابط قديم: ما ليس لها لا يُفتح */
    if (!this.mine(r)) return toast(T('rxNotYours'), 'e');
    const p = await DB.get('patients', r.pid);
    const alerts = MH.alerts(p.mh, true);

    UI.sheet(`
      <div class="shhead">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr">
          <div class="h2">${esc(nm(p))}</div>
          <div class="tiny mono">${p.age||'—'} ${T('yrs')} · ${T('file')} ${esc(p.mrn)} · ${fmtD(r.at)}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>

      ${alerts.length?`<div class="col" style="margin-bottom:12px">${alerts.map(x=>`
        <div class="al ${x.risk===2?'r':'w'}"><span>${x.risk===2?'⚠':'!'}</span>
        <span>${esc(x.txt)}${x.d?` — <b>${esc(x.d)}</b>`:''}</span></div>`).join('')}</div>`

  applyFlt(){

  async accBody(){
    const box = $('#pacc-body'); if (!box) return;
    const f = this.flt;
    let rs = (await this.mineAll()).filter(r => r.st === 'done');
    if (f.from) rs = rs.filter(r => new Date(r.doneAt||r.at).toISOString().slice(0,10) >= f.from);
    if (f.to)   rs = rs.filter(r => new Date(r.doneAt||r.at).toISOString().slice(0,10) <= f.to);
    if (f.doc)  rs = rs.filter(r => (r.doctor || CFG.data.doctor || T('r_doctor')) === f.doc);

    const rows = []; let total = 0;
    for (const r of rs.sort((a,b)=>(b.doneAt||b.at)-(a.doneAt||a.at))){
      const p = await DB.get('patients', r.pid); if (!p) continue;
      if (f.pt && !nm(p).toLowerCase().includes(f.pt.toLowerCase())) continue;
      total += Number(r.amount||0);
      rows.push(`<div class="it" onclick="Ph.open('${r.id}')">
