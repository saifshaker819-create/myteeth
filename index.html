/*═══════════════ خزنة الملفات ═══════════════
  AES-256-GCM بمفتاح مشتقّ من كلمة سرّ الطبيب عبر PBKDF2.
  GCM يكشف العبث: ملف عُدِّل بايت واحد منه يُرفض ولا يُفتح جزئياً.
═══════════════════════════════════════════*/
const Vault = {
  async key(pass, salt){
    const base = await crypto.subtle.importKey('raw',
      new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:210000, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  },

  /* النشر بـ ... ينهار على المصفوفات الكبيرة (نسخة فيها صور أشعة
     تُقاس بالميغابايت)، فالتحويل يمرّ على دفعات. */
  b64(buf){
    const a = new Uint8Array(buf), STEP = 0x8000;
    let out = '';
    for (let i = 0; i < a.length; i += STEP)
      out += String.fromCharCode.apply(null, a.subarray(i, i + STEP));
    return btoa(out);
  },
  bin(b64){
    const raw = atob(b64), a = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  },

  async seal(text, pass){
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const k    = await this.key(pass, salt);
    const ct   = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, k,
      new TextEncoder().encode(text));
    return { v:1, alg:'AES-GCM', kdf:'PBKDF2-SHA256', iter:210000,
             salt:this.b64(salt), iv:this.b64(iv), data:this.b64(ct),
             at:Date.now() };
  },

  async open(box, pass){
    try {
      const k  = await this.key(pass, this.bin(box.salt));
      const pt = await crypto.subtle.decrypt(
        { name:'AES-GCM', iv:this.bin(box.iv) }, k, this.bin(box.data));
      return new TextDecoder().decode(pt);
    } catch(_){ return null; }   /* كلمة خاطئة أو ملف معبوث به */
  },
};

/*═══════════════ المظهر ═══════════════
  الثيم والوضع الليلي يُحفظان لكل دور على حدة في هذا الجهاز.
  السبب: الجهاز قد يُتشارك، وتفضيل السكرتير ليس تفضيل الطبيب.
  ولأنهما تفضيل شخصي لا إعداد عيادة، فلا يُزامَنان ولا يُنقلان
  إلى جهاز آخر.
═════════════════════════════════════*/
const Skin = {
  LIST:['mint','ember','indigo','ocean','rose'],
  DEF:'mint',

  key(){ return 'd_skin_' + (S.role || 'guest'); },
  thKey(){ return 'd_theme_' + (S.role || 'guest'); },

  get(){
    const v = localStorage.getItem(this.key());
    return this.LIST.includes(v) ? v : this.DEF;
  },
  dark(){
    const v = localStorage.getItem(this.thKey());
    if (v === 'dark' || v === 'light') return v === 'dark';
    /* لا اختيار سابق: يُتبع نظام الجهاز */
    return matchMedia('(prefers-color-scheme: dark)').matches;
  },

  set(id){
    if (!this.LIST.includes(id)) return;
    try { localStorage.setItem(this.key(), id); } catch(_){}
    this.apply();
    toast(T('skinSaved'), 's');
  },
  setDark(on){
    try { localStorage.setItem(this.thKey(), on ? 'dark' : 'light'); } catch(_){}
    this.apply();
  },

  apply(){
    const d = document.documentElement;
    d.setAttribute('data-skin', this.get());
    d.setAttribute('data-theme', this.dark() ? 'dark' : 'light');
    $$('.thL').forEach(x => x.textContent = this.dark() ? '☀' : '☾');
    const m = document.querySelector('meta[name=theme-color]');
    if (m) m.content = getComputedStyle(d).getPropertyValue('--br').trim() || '#00695C';
  },

  /* بطاقات الاختيار — كل واحدة بلونها هي، فيُرى الفرق قبل الضغط */
  cards(){
    const cur = this.get();
    const sw = { mint:['#00A594','#7FD8CB'], ember:['#F2660A','#F7C59F'],
                 indigo:['#5A5FE8','#B9BEF7'], ocean:['#12A0D6','#9BD9F0'],
                 rose:['#E0447F','#F5C2D4'] };
    return `<div class="skgrid">${this.LIST.map(id => `
      <button class="skcard ${cur===id?'on':''}" onclick="Skin.set('${id}')">
        <span class="skdot" style="background:linear-gradient(135deg,
          ${sw[id][0]},${sw[id][1]});box-shadow:0 0 14px -2px ${sw[id][0]}"></span>
        <span>${T('sk_'+id)}</span>
      </button>`).join('')}</div>`;
  },
};

/*═══════════════ الحماية ═══════════════
  ثلاث طبقات واقعية: كلمة مرور معمّاة لا تُخزَّن كنص، تعطيل
  المحاولات المتكررة، وقفل تلقائي عند ترك الجهاز. البيانات نفسها
  لا تغادر الجهاز — سياسة أمن المحتوى في الأعلى تمنع ذلك.
═════════════════════════════════════*/
const Guard = {
  /* القفل التلقائي مطفأ افتراضياً: الدخول يبقى محفوظاً على الجهاز.
     من يريده يفعّله من الإعدادات. */
  IDLE_DEF:0, t:null, hidAt:0,

  hex(buf){ return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); },
  salt(){ return this.hex(crypto.getRandomValues(new Uint8Array(16))); },
  can(){ return !!(globalThis.crypto && crypto.subtle && crypto.subtle.deriveBits); },

  /* PBKDF2 بـ ١٥٠ ألف دورة — كلمة المرور لا تُحفظ أبداً كنص */
  async hash(pass, salt){
    if (!this.can()) return null;
    const key = await crypto.subtle.importKey('raw',
      new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({
      name:'PBKDF2', iterations:150000, hash:'SHA-256',
      salt: Uint8Array.from(salt.match(/../g).map(h=>parseInt(h,16))),
    }, key, 256);
    return this.hex(bits);
  },

  /*──── تعطيل التخمين ────*/
  tries(){ try { return JSON.parse(localStorage.getItem('d_try')) || {n:0,until:0}; }
           catch(_){ return {n:0,until:0}; } },
  lockLeft(){ return Math.max(0, this.tries().until - Date.now()); },
  fail(){
    const t = this.tries(); t.n++;
    /* بعد خمس محاولات: ٣٠ ثانية تتضاعف حتى ربع ساعة */
    if (t.n >= 5) t.until = Date.now() + Math.min(900000, 30000 * Math.pow(2, t.n - 5));
    try { localStorage.setItem('d_try', JSON.stringify(t)); } catch(_){}
  },
  ok(){ try { localStorage.removeItem('d_try'); } catch(_){} },

  /*──── القفل التلقائي ────*/
  idleMin(){ const v = CFG.data.idleMin; return v === undefined ? this.IDLE_DEF : Number(v)||0; },
  touch(){
    clearTimeout(this.t);
    const m = this.idleMin();
    if (!m || !S.role) return;
    this.t = setTimeout(()=>this.lock(true), m * 60000);
  },
  lock(auto){
    if (!S.role) return;
    clearTimeout(this.t);
    if (auto) toast(T('autoLocked'), 'w');
    Auth.out();
  },
  init(){
    ['pointerdown','keydown','wheel','touchstart'].forEach(ev =>
      document.addEventListener(ev, () => this.touch(), true));
    /* الجهاز المتروك مقفولاً أو التبويب المخفي يُحتسبان خمولاً */
    document.addEventListener('visibilitychange', () => {
      const m = this.idleMin();
      if (document.hidden){ this.hidAt = Date.now(); return; }
      if (m && S.role && this.hidAt && Date.now() - this.hidAt > m * 60000) return this.lock(true);
      this.touch();
    });
  },

  /*──── الدخول بلا إنترنت ────
    بعد كل دخول ناجح متصل تُحفظ بصمة البريد والرمز على الجهاز
    (PBKDF2، لا نصّ صريح). فإذا انقطع النت لاحقاً دخل الموظف
    بنفس بياناته دون أن يقف العمل.
    صلاحيتها ١٤ يوماً: جهاز فُقد أو موظف تُرك، لا يبقى بابه
    مفتوحاً إلى الأبد. */
  OFFLINE_DAYS:14,

  async remember(email, pass, me){
    if (!this.can()) return;
    try {
      const salt = this.salt();
      localStorage.setItem('d_off', JSON.stringify({
        email: String(email).toLowerCase(),
        salt, hash: await this.hash(pass, salt),
        role: me.role, clinic_id: me.clinic_id || null, uid: me.uid || null,
        clinic_name: me.clinic_name || null, full_name: me.full_name || null,
        at: Date.now(),
      }));
    } catch(_){}
  },

  offline(){
    try { return JSON.parse(localStorage.getItem('d_off')) || null; }
    catch(_){ return null; }
  },

  /* يُرجع الحالة بدل true/false، لتُقال للمستخدم علّة الرفض */
  async offlineIn(email, pass){
    const o = this.offline();
    if (!o) return { ok:false, why:'noOffline' };
    if (Date.now() - o.at > this.OFFLINE_DAYS * 86400000)
      return { ok:false, why:'offlineOld' };
    if (o.email !== String(email).toLowerCase()) return { ok:false, why:'bad' };
    if ((await this.hash(pass, o.salt)) !== o.hash) return { ok:false, why:'bad' };
    return { ok:true, me:o };
  },

  forget(){ try { localStorage.removeItem('d_off'); } catch(_){} },

};

/*═══════════════ الهوية والتثبيت كتطبيق ═══════════════
  الأيقونة تُولَّد داخل الملف نفسه (سن أبيض على أخضر) ثم تُحوَّل
  إلى PNG ليقبلها نظام التشغيل، فيبقى البرنامج ملفاً واحداً.
═══════════════════════════════════════════════════════*/
const APP = { nameAr:'أسناني', nameEn:'My teeth', green:'#00796B', green2:'#00A88F',
              logo:'', title:'' };   /* logo/title: هوية العيادة إن ضبطها المستثمر */

const ICON = {
  cache:{},
  TOOTH:'M12 3c-3 0-4-1.2-6 0C4 4.2 3.4 7 4 10c.5 2.6 1.3 4 1.8 6.6.4 2 .6 4.4 2 4.4 1.6 0 1.3-2.6 1.8-4.6.4-1.6.8-2.4 2.4-2.4s2 .8 2.4 2.4c.5 2 .2 4.6 1.8 4.6 1.4 0 1.6-2.4 2-4.4.5-2.6 1.3-4 1.8-6.6.6-3 0-5.8-2-7-2-1.2-3 0-6 0z',

  /* السن مرسوم داخل مربع 512 مع هامش أمان للأيقونات المقنّعة */
  svg(size, maskable){
    const pad = maskable ? 0.19 : 0;        /* منطقة آمنة 80% للأندرويد */
    const r   = maskable ? 0 : size * 0.22; /* زوايا دائرية للأيقونة العادية */
    const s   = size * (1 - pad * 2), o = size * pad;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${APP.green2}"/><stop offset="1" stop-color="${APP.green}"/>
      </linearGradient></defs>
      <rect width="${size}" height="${size}" rx="${r}" fill="url(#g)"/>
      <g transform="translate(${o} ${o}) scale(${s/24})">
        <path fill="#FFFFFF" d="M12 3c-3 0-4-1.2-6 0C4 4.2 3.4 7 4 10c.5 2.6 1.3 4 1.8 6.6.4 2 .6 4.4 2 4.4 1.6 0 1.3-2.6 1.8-4.6.4-1.6.8-2.4 2.4-2.4s2 .8 2.4 2.4c.5 2 .2 4.6 1.8 4.6 1.4 0 1.6-2.4 2-4.4.5-2.6 1.3-4 1.8-6.6.6-3 0-5.8-2-7-2-1.2-3 0-6 0z"/>
      </g></svg>`;
  },

  dataSvg(size, maskable){
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(this.svg(size, maskable))));
  },

  /* PNG أوثق للتثبيت: أنظمة التشغيل لا تقبل SVG دائماً */
  png(size, maskable){
    const key = size + (maskable ? 'm' : '') + (APP.logo ? 'L' : '');
    if (this.cache[key]) return Promise.resolve(this.cache[key]);
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        if (APP.logo){
          /* شعار العيادة على خلفية بيضاء، داخل منطقة الأمان */
          g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, size, size);
          const pad = size * (maskable ? .2 : .08), box = size - pad * 2;
          const sc = Math.min(box / img.width, box / img.height);
          const w = img.width * sc, h = img.height * sc;
          g.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        } else g.drawImage(img, 0, 0, size, size);
        this.cache[key] = c.toDataURL('image/png');
        res(this.cache[key]);
      };
      img.onerror = () => res(this.dataSvg(size, maskable));
      img.src = APP.logo || this.dataSvg(size, maskable);
    });
  },

  /* عنصر الشعار المعروض داخل البرنامج */
  el(cls){
    return `<img class="applogo ${cls||''} ${APP.logo?'custom':''}" alt="${esc(APP.title||APP.nameAr)}"
      src="${APP.logo ? esc(APP.logo) : this.dataSvg(256,false)}">`;
  },
};

const Install = {
  prompt:null, ready:false,

  async manifest(){
    const [i192, i512, m512] = await Promise.all([
      ICON.png(192,false), ICON.png(512,false), ICON.png(512,true),
    ]);
    /* المنيفست يُبنى كـ blob، والعناوين النسبية داخله تُحلّ نسبةً
       إلى عنوان الـ blob لا إلى عنوان الصفحة. فـ scope:'./' كان
       يخرج نطاقاً لا يغطّي الصفحة، فيرفض المتصفح فتحها مستقلة
       ويرجعها إلى تبويب عادي. العناوين المطلقة تحسم ذلك. */
    const page = location.href.split(/[?#]/)[0];
    const dir  = page.slice(0, page.lastIndexOf('/') + 1);
    const man = {
      id: page,
      name: APP.title || `${APP.nameAr} — ${APP.nameEn}`,
      short_name: APP.title || APP.nameAr,
      description: 'نظام إدارة عيادات الأسنان',
      start_url: page,
      scope: dir,
      display: 'standalone',
      display_override: ['standalone','minimal-ui'],
      orientation: 'any',
      background_color: '#E8EFF1',
      theme_color: APP.green,
      dir: 'rtl', lang: 'ar',
      icons: [
        { src:i192, sizes:'192x192', type:'image/png', purpose:'any' },
        { src:i512, sizes:'512x512', type:'image/png', purpose:'any' },
        { src:m512, sizes:'512x512', type:'image/png', purpose:'maskable' },
      ],
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(man)], { type:'application/manifest+json' }));
    let link = document.querySelector('link[rel=manifest]');
    if (!link){ link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
    link.href = url;

    /* آيفون لا يقرأ manifest — يحتاج أيقونة خاصة */
    let ap = document.querySelector('link[rel="apple-touch-icon"]');
    if (!ap){ ap = document.createElement('link'); ap.rel = 'apple-touch-icon'; document.head.appendChild(ap); }
    ap.href = i192;

    let ic = document.querySelector('link[rel=icon]');
    if (!ic){ ic = document.createElement('link'); ic.rel = 'icon'; document.head.appendChild(ic); }
    ic.type = 'image/png'; ic.href = i192;
  },

  standalone(){
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  },
  isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; },


  /* عامل الخدمة: شرط عرض زر التثبيت المباشر على سطح المكتب.
     يُسجَّل بصمت — وإن غاب الملف يبقى البرنامج يعمل كما هو،
     ويكتفي بإرشاد التثبيت اليدوي. */
  reg(){
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' &&
        !['localhost','127.0.0.1'].includes(location.hostname)) return;
    const dir = location.href.split(/[?#]/)[0].replace(/[^/]*$/, '');
    navigator.serviceWorker.register(dir + 'sw.js', { scope: dir })
      .catch(() => { /* الملف غير مرفوع: لا يتعطّل شيء */ });
  },
  init(){
    this.manifest();
    this.reg();

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      this.prompt = e; this.ready = true;
      this.bar();
    });
    window.addEventListener('appinstalled', () => {
      this.prompt = null; this.ready = false;
      /* التثبيت يمحو الإرجاء: لو أُزيل التطبيق لاحقاً عاد الشريط */
      try { localStorage.removeItem('d_inst_x'); } catch(_){}
      this.hide(); toast(T('installed'), 's');
    });

    /* الشريط يظهر حتى لو لم يطلق المتصفح حدث التثبيت.
       الحدث لا يُطلق على آيفون أصلاً، ولا يُطلق في كروم إن ظنّ
       التطبيق مثبَّتاً — فبانتظاره وحده يختفي الشريط بلا سبب
       ظاهر للمستخدم. */
    setTimeout(() => this.bar(), this.isIOS() ? 1400 : 2200);
  },

  /* الإخفاء إرجاء لا إلغاء: من ضغط ✕ اليوم قد يريده الأسبوع
     القادم، ولا معنى لحرمانه منه إلى الأبد. */
  SNOOZE:7 * 86400000,
  snoozed(){
    const t = Number(localStorage.getItem('d_inst_x') || 0);
    return t && (Date.now() - t) < this.SNOOZE;
  },

  /* بطاقة التثبيت */
  bar(){
    if (this.standalone() || this.snoozed()) return;
    if (document.getElementById('instbar')) return;

    const box = el(`<div id="instbar"><div class="box">
      <img class="applogo sm" src="${APP.logo ? esc(APP.logo) : ICON.dataSvg(160,false)}" alt="">
      <div class="gr" style="min-width:0">
        <div class="nm">${esc(APP.title || `${APP.nameAr} — ${APP.nameEn}`)}</div>
        <div class="ds">${this.isIOS() ? T('iosInstall')
          : this.ready ? T('installHint') : T('installMenu')}</div>
      </div>
      ${this.isIOS() ? '' : `<button class="btn sm" onclick="Install.go()">${T('install')}</button>`}
      <button class="x" onclick="Install.dismiss()">✕</button>
    </div></div>`);
    document.body.appendChild(box);
  },

  hide(){ document.getElementById('instbar')?.remove(); },
  dismiss(){
    try { localStorage.setItem('d_inst_x', String(Date.now())); } catch(_){}
    this.hide();
  },

  async go(){
    if (this.prompt){
      this.prompt.prompt();
      const r = await this.prompt.userChoice.catch(()=>null);
      this.prompt = null; this.ready = false;
      if (r?.outcome === 'accepted') this.hide();
      return;
    }
    /* لا يوجد طلب تثبيت: نشرح السبب بدقة بدل رسالة مبهمة */
    this.help();
  },

  help(){
    const https = location.protocol === 'https:' ||
                  ['localhost','127.0.0.1'].includes(location.hostname);
    UI.sheet(`
      <div class="shhead"><div class="gr">
        <div class="h2">${T('install')}</div>
        <div class="sub">${esc(APP.title || `${APP.nameAr} — ${APP.nameEn}`)}</div>
      </div><button class="ib" onclick="Nav.back()">✕</button></div>

      <div class="ctr">${ICON.el()}</div>

      ${!https ? `<div class="al w"><span>!</span><span>${T('needHttps')}</span></div>` : ''}

      <div class="card mt">
        <div class="lbl">${this.isIOS() ? 'iPhone / iPad' : T('howToFix')}</div>
        <div class="col mt">
          ${(this.isIOS() ? T('iosSteps') : T('manualSteps')).split('|').map((x,i)=>`
            <div class="row" style="align-items:flex-start;gap:10px">
              <div class="av" style="width:28px;height:28px;font-size:13px">${i+1}</div>
              <div class="gr" style="font-weight:600;font-size:13.5px">${esc(x)}</div>
            </div>`).join('')}
        </div>
      </div>
      <button class="btn w gh mt2" onclick="Nav.back()">${T('close')}</button>`);
  },
};

/* متاح من الإعدادات */
window.installApp = () => Install.go();

/*═══════════════ تسجيل الصفحات ═══════════════*/
const REG = { Sec, Doc, Rx, Ph, Appt, Money, Pt, Scan, Cfg };
const PAGES = [
  'Sec.file','Sec.visit','Sec.newPt','Sec.showMH','Sec.bookInfo','Sec.barcode','Sec.pay','Sec.addWork',
  'Doc.session','Doc.sessionRx','Doc.sessionArc','Doc.sessionInfo','Doc.tooth',
  'Doc.pickFile','Doc.viewFile','Doc.editPlan','Doc.doSession','Doc.statusPicker',
  'Doc.toothCourse','Doc.sessionCard',
  /* Doc.openToothFile موزّع لا صفحة: يقرّر أيّ صفحة تُفتح ثم يسلّمها السجل.
     لو سُجّل كصفحة لأعاد رسم صفحة السن عند «رجوع» فلا تُغلق أبداً. */
  'Rx.view','Rx.sheet','Ph.open','Scan.open',
  'Appt.ask','Appt.pick','Appt.picker',
  'Money.ptVisits','Money.visitPays','Pt.edit','Pt.visit',
];

/*═══════════════ الإقلاع ═══════════════*/
/* أي خطأ غير متوقع يظهر للمستخدم بدل أن يبقى الزر صامتاً */
window.addEventListener('error', e => toast('خطأ: ' + (e.message||''), 'e'));
window.addEventListener('unhandledrejection', e =>
  toast('خطأ: ' + (e.reason?.message || e.reason || ''), 'e'));

(async function boot(){
  Skin.apply();
  document.documentElement.lang = LG;
  document.documentElement.dir  = isAr()?'rtl':'ltr';

  /* تُربط الأزرار قبل أي انتظار — لو تعثّر التحميل يبقى الزر مستجيباً
     ويُظهر سبب المشكلة بدل الصمت. */
  /* شاشة الدخول بالبريد هي الافتراضية، والمحلي احتياط عند انقطاع النت */
  Cloud.load();
  $('#cl-go').onclick    = () => Login.cloudSubmit();
  $('#cl-reg').onclick   = () => Login.regClinic();
  $('#cl-forgot').onclick = () => Login.reset();
  $('#cl-pass').onkeydown  = e => { if (e.key==='Enter') Login.cloudSubmit(); };
  $('#cl-email').onkeydown = e => { if (e.key==='Enter') $('#cl-pass').focus(); };
  Login.drawCloud();

  Nav.wrap();
  Hold.init();
  PickProc.initOutside();
  Guard.init();
  Sync.init();

  /* الشعار نفسه يظهر عند فتح البرنامج وعلى أيقونة التثبيت */
  /* تموّج عند اللمس — إحساس بأن الزر استجاب */
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest && e.target.closest('.btn,.navb,.pf-act');
    if (!b || b.disabled || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height);
    const s = document.createElement('span');
    s.className = 'rpl';
    s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d/2}px;top:${e.clientY - r.top - d/2}px`;
    b.appendChild(s);
    setTimeout(() => s.remove(), 650);
  }, { passive:true });

  /* هوية العيادة المحفوظة على هذا الجهاز تظهر من أول لحظة */
  Brand.apply();
  Install.init();
  /* عند العودة للتطبيق: هل تغيّر من يجوز لهذا الحساب أن يرى؟ */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.role){
      if (Sub.expired()) Sub.recheck(); else Scope.recheck();
    }
  });

  try {
    await DB.open();
  } catch (err) {
    if (err.message !== 'STORAGE_FALLBACK'){
      const box = $('#cl-err');
      if (box){ box.textContent = err.message || String(err); box.classList.remove('hide'); }
      toast(err.message || String(err), 'e');
      return;
    }
  }

  try {
    await Setup.ensure();
    Login.drawCloud();

    /* جلسة محفوظة: يُستأنف العمل بلا إعادة كتابة البريد والرمز.
       الجلسة على هذا الجهاز وحده، والقفل التلقائي يحرسها. */
    if (Cloud.session && Cloud.ready()){
      const box = $('#cl-err');
      if (box){ box.textContent = T('resuming'); box.classList.remove('hide'); }
      try {
        if (Cloud.session.exp - Date.now() < 60000) await Cloud.refresh();
        let me = null;
        try { me = Cloud.session && await Cloud.whoami(); }
        catch(e){
          /* بلا إنترنت أو السيرفر بطيء: الجلسة سليمة، فيُفتح البرنامج
             بآخر هوية معروفة ويزامن حين يعود الاتصال — لا إعادة دخول. */
          if (!(e?.net || !navigator.onLine) || !Cloud.session) throw e;
          try { me = JSON.parse(localStorage.getItem('d_me')) || null; } catch(_){ me = null; }
          if (me) Cloud.me = me;
          if (me) toast(T('offlineResume'), 'w');
        }
        if (me && me.role && me.role !== 'none'){
          S.role = me.role;
          S.clinicName = me.clinic_name || null;
          S.user = { id: Cloud.session.email, uid: me.uid || null, role:me.role,
                     name: me.full_name || Cloud.session.email, cloud:true,
                     clinic_id: me.clinic_id };
          Guard.ok();
          box?.classList.add('hide');
          Brand.save(me);
          Sub.save(me);
          await Scope.check(me);
          return App.start();
        }
      } catch(_){ /* التذكرة لم تعد صالحة: تُعرض شاشة الدخول */ }
      Cloud.saveSess(null);
      box?.classList.add('hide');
    }
    /* بيانات العيادة تُسجَّل الآن على السيرفر (تسجيل عيادة جديدة)
       وتصل مع أول دخول — فلا تُطلب محلياً قبل الدخول. */
    if (DB.fallback) Storage.warn();
  } catch (err) {
    const box = $('#cl-err');
    if (box){ box.textContent = err.message || String(err); box.classList.remove('hide'); }
  }
})();
</script>
</body>
</html>
