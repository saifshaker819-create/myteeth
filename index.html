<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00695C">
<!-- سياسة أمن المحتوى: البرنامج لا يتصل بالإنترنت إطلاقاً.
     الاتصال مسموح لسيرفر العيادة وحده (Firebase على googleapis.com) — أي وجهة
     أخرى مرفوضة، فلا تستطيع شيفرة مدسوسة تسريب بيانات المراجعين.
     والصور كذلك: من جهازك أو من تخزين عيادتك، لا من أي نطاق آخر. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://res.cloudinary.com; media-src 'self' blob: mediastream:; manifest-src blob:; worker-src 'self'; connect-src https://*.googleapis.com https://firebasestorage.googleapis.com https://api.cloudinary.com; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>أسناني — My teeth</title>
<meta name="application-name" content="أسناني">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="أسناني">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/*═══════════════════════════════════════════════════════════
  DentalOS — نظام تصميم زجاجي (Glass)
  الأسطح شبه شفافة فوق خلفية متدرّجة ثابتة.
  التمويه مقصور على الأسطح الكبيرة فقط حتى لا يثقل الجهاز.
═══════════════════════════════════════════════════════════*/
:root{
  --bg:#E8EFF1;
  --blob1:#7FD8CB; --blob2:#9CC8F0; --blob3:#F2D3B8;

  --glass:rgba(255,255,255,.62);
  --glass2:rgba(255,255,255,.44);
  --glassS:rgba(255,255,255,.78);
  --stroke:rgba(255,255,255,.75);
  --edge:rgba(10,50,58,.10);

  --ink:#06232B; --ink2:#31555F; --ink3:#5D7F89;

  --br:#00736A; --br2:#00A594; --brL:rgba(0,115,106,.13);
  --on-br:#FFFFFF;

  --ok:#12784A; --okL:rgba(18,120,74,.14);
  --wr:#9A6400; --wrL:rgba(154,100,0,.15);
  --bd:#B23A2C; --bdL:rgba(178,58,44,.14);
  --info:#0B5FA0; --infoL:rgba(11,95,160,.13);

  --gum:#EFC2CA; --tooth:#FFFFFF; --tline:#9DB4B8;

  --sh:0 1px 1px rgba(6,35,43,.04), 0 8px 24px -14px rgba(6,35,43,.30);
  --shL:0 2px 6px rgba(6,35,43,.06), 0 24px 50px -26px rgba(6,35,43,.45);
  --r:18px; --blur:blur(18px) saturate(150%);

  /* هالة الحافة: لونان من عائلة اللون الأساسي — خافت للسكون
     وأقوى للتركيز. تُعاد تعريفهما في كل ثيم. */
  --gl:rgba(0,165,148,.30);
  --gl2:rgba(0,165,148,.55);
  --glw:14px;          /* اتساع الهالة */
}
html[data-theme=dark]{
  /* الهالة في الليل أوسع وأصفى — الخلفية الداكنة تحتملها */
  --gl:rgba(63,232,206,.34);
  --gl2:rgba(63,232,206,.70);
  --glw:22px;
  --bg:#050D10;
  --blob1:#065A55; --blob2:#0A3352; --blob3:#3A2418;

  --glass:rgba(20,38,42,.62);
  --glass2:rgba(20,38,42,.42);
  --glassS:rgba(24,44,49,.86);
  --stroke:rgba(255,255,255,.10);
  --edge:rgba(255,255,255,.07);

  --ink:#E9F5F3; --ink2:#A8C6C2; --ink3:#7C9C98;

  --br:#12C9AE; --br2:#3FE8CE; --brL:rgba(18,201,174,.16);
  --on-br:#03211D;

  --ok:#3FD489; --okL:rgba(63,212,137,.15);
  --wr:#E2AE47; --wrL:rgba(226,174,71,.15);
  --bd:#F2705F; --bdL:rgba(242,112,95,.15);
  --info:#55AFF5; --infoL:rgba(85,175,245,.15);

  --gum:#3B2028; --tooth:#DCEAE8; --tline:#06232B;

  --sh:0 1px 1px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.8);
  --shL:0 24px 60px -30px rgba(0,0,0,.95);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  font-size:15px;line-height:1.6;font-weight:500;
  -webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease;
}
/* الخلفية: ثلاث هالات لونية ثابتة — تعطي العمق الزجاجي بلا أي رسم متحرك */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48vw 42vw at 12% 8%,  var(--blob1), transparent 62%),
    radial-gradient(52vw 46vw at 88% 22%, var(--blob2), transparent 64%),
    radial-gradient(46vw 40vw at 50% 96%, var(--blob3), transparent 62%);
  opacity:.55;
}
html[data-theme=dark] body::before{opacity:.42}

.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.dsp{font-family:'Zain','IBM Plex Sans Arabic',sans-serif;font-weight:800}

/*──────── الأسطح الزجاجية ────────*/
.card{
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid var(--stroke);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh);
}
.card+.card{margin-top:12px}
.card.flat{background:var(--glass2);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}

/*──────── إدخال ────────*/
input,select,textarea{
  width:100%;padding:12px 14px;border-radius:13px;font:inherit;font-weight:500;
  border:1px solid var(--edge);background:var(--glassS);color:var(--ink);
  outline:none;transition:border-color .16s,box-shadow .16s,background .16s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--br);box-shadow:0 0 0 4px var(--brL);
}
input.err,select.err,textarea.err{border-color:var(--bd);background:var(--bdL)}
input::placeholder,textarea::placeholder{color:var(--ink3);font-weight:500}
textarea{min-height:84px;resize:vertical}
select{cursor:pointer}
label.lb{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:7px}
label.lb .req{color:var(--bd);font-weight:800}
input[type=color]{padding:3px;cursor:pointer}
input[type=file]{padding:9px;font-size:13px}


/*══════════════ الثيمات ══════════════
  كل ثيم يبدّل عائلة اللون الأساسي وهالتَه وهالات الخلفية.
  البنية والتباين لا يتغيّران — يتغيّر اللون وحده، فلا تنكسر
  قراءة نصّ ولا يضيع زر.
  الاختيار لكل دور على حدة، فثيم الطبيب لا يمسّ السكرتير.
════════════════════════════════════*/

/* ① النعناع — الافتراضي */
html[data-skin=mint]{
  --br:#00736A; --br2:#00A594; --brL:rgba(0,115,106,.13);
  --blob1:#7FD8CB; --blob2:#9CC8F0; --blob3:#F2D3B8;
  --gl:rgba(0,165,148,.30); --gl2:rgba(0,165,148,.55);
}
html[data-theme=dark][data-skin=mint]{
  --br:#12C9AE; --br2:#3FE8CE; --brL:rgba(18,201,174,.16);
  --blob1:#065A55; --blob2:#0A3352; --blob3:#3A2418;
  --gl:rgba(63,232,206,.34); --gl2:rgba(63,232,206,.70);
}

/* ② الجمرة — نار دافئة، أقرب ما يكون لحواف متوهّجة */
html[data-skin=ember]{
  --br:#B3400F; --br2:#F2660A; --brL:rgba(242,102,10,.13);
  --blob1:#F7C59F; --blob2:#F2A365; --blob3:#EAD7C3;
  --gl:rgba(242,102,10,.34); --gl2:rgba(255,122,26,.62);
}
html[data-theme=dark][data-skin=ember]{
  --br:#FF7A1A; --br2:#FFA24D; --brL:rgba(255,122,26,.17);
  --blob1:#5C2408; --blob2:#3D1A22; --blob3:#4A2E10;
  --gl:rgba(255,140,45,.40); --gl2:rgba(255,168,80,.78);
  --bg:#0B0705;
}

/* ③ النيلي — هادئ للعمل الطويل */
html[data-skin=indigo]{
  --br:#3B3FBF; --br2:#5A5FE8; --brL:rgba(90,95,232,.13);
  --blob1:#B9BEF7; --blob2:#9CC8F0; --blob3:#E3D3F2;
  --gl:rgba(90,95,232,.30); --gl2:rgba(112,118,255,.58);
}
html[data-theme=dark][data-skin=indigo]{
  --br:#7B80FF; --br2:#A0A4FF; --brL:rgba(123,128,255,.17);
  --blob1:#1B1F63; --blob2:#0A2352; --blob3:#2B1A4A;
  --gl:rgba(140,145,255,.36); --gl2:rgba(170,175,255,.72);
  --bg:#07070F;
}

/* ④ المحيط — أزرق صافٍ */
html[data-skin=ocean]{
  --br:#0A6E9E; --br2:#12A0D6; --brL:rgba(18,160,214,.13);
  --blob1:#9BD9F0; --blob2:#B7E3E0; --blob3:#D9E4F2;
  --gl:rgba(18,160,214,.30); --gl2:rgba(40,182,235,.58);
}
html[data-theme=dark][data-skin=ocean]{
  --br:#2BB6EB; --br2:#66D4FF; --brL:rgba(43,182,235,.17);
  --blob1:#06364F; --blob2:#052A3F; --blob3:#1A2E3A;
  --gl:rgba(60,200,255,.36); --gl2:rgba(110,220,255,.72);
  --bg:#030C12;
}

/* ⑤ الورد — دافئ بلا صخب */
html[data-skin=rose]{
  --br:#B02A5B; --br2:#E0447F; --brL:rgba(224,68,127,.13);
  --blob1:#F5C2D4; --blob2:#E8C3F0; --blob3:#F7DCC9;
  --gl:rgba(224,68,127,.30); --gl2:rgba(240,90,148,.58);
}
html[data-theme=dark][data-skin=rose]{
  --br:#F0568F; --br2:#FF87B4; --brL:rgba(240,86,143,.17);
  --blob1:#54123A; --blob2:#3A1240; --blob3:#4A1F2A;
  --gl:rgba(255,110,165,.36); --gl2:rgba(255,150,190,.72);
  --bg:#0E050A;
}

/*══════════════ الحواف المتوهّجة ══════════════
  هالة خارجية خفيفة في السكون، تشتدّ عند اللمس والتركيز.
  الغرض أن يُرى الحدّ في وضح النهار أيضاً، لا أن يبهر —
  فالقيم منخفضة عمداً في الوضع النهاري.
════════════════════════════════════════════*/
.btn{ box-shadow:0 1px 1px rgba(0,0,0,.05),
      0 8px 20px -12px var(--br),
      0 0 var(--glw) -4px var(--gl2) }
.btn:hover{ box-shadow:0 1px 1px rgba(0,0,0,.05),
      0 8px 20px -12px var(--br),
      0 0 calc(var(--glw) + 8px) -2px var(--gl2) }
.btn:disabled{ box-shadow:none }

.btn.gh{ box-shadow:inset 0 0 0 1px var(--gl), 0 0 var(--glw) -7px var(--gl) }
.btn.gh:hover{ border-color:var(--br); color:var(--br);
      box-shadow:inset 0 0 0 1px var(--gl2), 0 0 var(--glw) -4px var(--gl2) }

input,select,textarea{ box-shadow:0 0 var(--glw) -8px var(--gl) }
input:focus,select:focus,textarea:focus{
  border-color:var(--br);
  box-shadow:0 0 0 4px var(--brL), 0 0 calc(var(--glw) + 6px) -3px var(--gl2);
}
input.err,select.err,textarea.err,
input.err:focus,select.err:focus{
  box-shadow:0 0 0 4px var(--bdL), 0 0 var(--glw) -4px rgba(178,58,44,.55);
}

/* العناصر القابلة للنقر تُضيء عند اللمس فيُعرف أنها استجابت */
.it:hover{ box-shadow:0 0 var(--glw) -6px var(--gl) }
.pill.b{ box-shadow:0 0 var(--glw) -6px var(--gl2) }
.syncdot.live{ box-shadow:0 0 0 2px var(--okL), 0 0 12px -4px var(--gl2) }

/* الحركة تُطفأ لمن يطلب تقليلها */
@media (prefers-reduced-motion:reduce){
  .btn,.btn.gh,input,select,textarea{transition:none}
}

/* بطاقات اختيار الثيم */
.skgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px}
.skcard{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 8px;
  border-radius:15px;background:var(--glass2);border:1px solid var(--edge);
  font-size:12.5px;font-weight:800;color:var(--ink2);
  transition:transform .13s,border-color .18s,box-shadow .18s}
.skcard:active{transform:scale(.97)}
.skcard.on{border-color:var(--br);color:var(--ink);
  box-shadow:0 0 0 2px var(--brL), 0 0 16px -5px var(--gl2)}
.skdot{width:30px;height:30px;border-radius:11px;display:block}

/*──────── أزرار ────────*/
button{font:inherit;font-weight:700;cursor:pointer;border:none;background:none;color:inherit}
a.btn{text-decoration:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:14px;font-size:14.5px;font-weight:700;
  background:linear-gradient(180deg,var(--br2),var(--br));color:var(--on-br);
  box-shadow:0 1px 1px rgba(0,0,0,.05),0 8px 20px -12px var(--br);
  transition:transform .13s,filter .16s,box-shadow .16s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.w{width:100%}
.btn.gh{background:var(--glassS);color:var(--ink2);border:1px solid var(--edge);box-shadow:none;
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.gh:hover{border-color:var(--br);color:var(--br)}
.btn.sf{background:var(--brL);color:var(--br);box-shadow:none}
.btn.dg{background:linear-gradient(180deg,#e0685a,var(--bd));color:#fff;box-shadow:0 8px 20px -12px var(--bd)}
.btn.ok{background:linear-gradient(180deg,#2fa96e,var(--ok));color:#fff;box-shadow:0 8px 20px -12px var(--ok)}
.btn.wn{background:linear-gradient(180deg,#d0a04a,var(--wr));color:#fff;box-shadow:0 8px 20px -12px var(--wr)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn.xs{padding:5px 11px;font-size:12px;border-radius:10px}
.ib{width:40px;height:40px;border-radius:13px;flex-shrink:0;
    border:1px solid var(--edge);background:var(--glassS);color:var(--ink2);
    display:grid;place-items:center;font-size:15px;font-weight:700;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:border-color .16s,color .16s,transform .13s}
.ib:hover{border-color:var(--br);color:var(--br)}
.ib:active{transform:scale(.94)}

/*──────── تخطيط ────────*/
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:9px}
.gr{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wrapv{flex-wrap:wrap}
.mt{margin-top:12px}.mt2{margin-top:20px}.mt3{margin-top:28px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr{text-align:center}
.hide{display:none!important}
.sep{height:1px;background:var(--edge);margin:16px 0}

.h1{font-family:'Zain',sans-serif;font-weight:800;font-size:27px;line-height:1.2}
.h2{font-family:'Zain',sans-serif;font-weight:800;font-size:22px;line-height:1.25}
.h3{font-size:15.5px;font-weight:700}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
     letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.sub{font-size:13px;color:var(--ink2);font-weight:500}
.tiny{font-size:12px;color:var(--ink3)}

/*──────── شارات ────────*/
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;
      font-size:12px;font-weight:700;white-space:nowrap}
.pill.b{background:var(--brL);color:var(--br)}
.pill.g{background:var(--okL);color:var(--ok)}
.pill.w{background:var(--wrL);color:var(--wr)}
.pill.r{background:var(--bdL);color:var(--bd)}
.pill.i{background:var(--infoL);color:var(--info)}
.pill.n{border:1px solid var(--edge);color:var(--ink2);background:var(--glass2)}

/*──────── تنبيهات ────────*/
.al{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;
    font-size:13.5px;font-weight:700;line-height:1.55;border:1px solid transparent}
.al.r{background:var(--bdL);color:var(--bd);border-color:var(--bd)}
.al.w{background:var(--wrL);color:var(--wr);border-color:var(--wr)}
.al.g{background:var(--okL);color:var(--ok);border-color:var(--ok)}
.al.i{background:var(--infoL);color:var(--info);border-color:var(--info)}

/*──────── عناصر القوائم ────────*/
.it{display:flex;align-items:center;gap:12px;padding:13px 14px;
    background:var(--glass);border:1px solid var(--stroke);border-radius:15px;
    cursor:pointer;box-shadow:var(--sh);
    transition:transform .14s,border-color .16s,box-shadow .16s}
.it:hover{border-color:var(--br);box-shadow:var(--shL)}
.it:active{transform:scale(.99)}
/* الضغط المطوّل: العنصر ينكمش ويتلوّن بلون التحذير قبل فتح الخيارات */
.it.holding{transform:scale(.965);border-color:var(--bd);box-shadow:0 0 0 3px var(--bdL)}
/* مسار الأشرطة في الإحصائيات */
.track{height:10px;border-radius:99px;background:var(--glass2);
       border:1px solid var(--edge);overflow:hidden}
.track>i{display:block;height:100%;border-radius:99px;transition:width .45s cubic-bezier(.3,.9,.3,1)}
/* بديل الصورة التي تعذّر عرضها — يقول ما جرى ويعرض إعادة المحاولة */
.imgx{aspect-ratio:1;border-radius:13px;border:1px dashed var(--edge);
  background:var(--glass2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;cursor:pointer;color:var(--ink3);font-weight:700}
.imgx>span:first-child{font-size:22px}
.rk{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
    font-family:'Zain',sans-serif;font-size:13px;font-weight:800;
    background:var(--glass2);color:var(--ink2);border:1px solid var(--edge)}
.rk.top{background:var(--wrL);color:var(--wr);border-color:transparent}

/*──────── حقل اختيار نوع العمل ────────*/
.pp{position:relative}
.pp .pp-q{padding-inline-end:46px}
.pp .pp-tg{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:10px;color:var(--ink3);font-size:13px;
  display:grid;place-items:center;background:var(--glass2)}
.pp .pp-tg:hover{color:var(--br);background:var(--brL)}
.pp-pan{margin-top:7px;border:1px solid var(--stroke);border-radius:15px;
  background:var(--glassS);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:var(--shL);max-height:290px;overflow:auto;padding:7px}
.pp-row{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;
  cursor:pointer;font-size:13.5px;font-weight:600;transition:background .14s}
.pp-row:hover{background:var(--brL)}
.pp-row .dt{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.pp-row .cnt{margin-inline-start:auto;font-size:11px;color:var(--ink3);font-weight:700}
.pp-head{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;
  cursor:pointer;background:var(--glass2);font-weight:800;font-size:13px;margin-bottom:5px}
.pp-hint{padding:9px 11px;font-size:12px;color:var(--ink3);font-weight:600}

/*──────── بحث ناعم ────────*/
.soft{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 14px;
  border:1px solid var(--stroke);border-radius:99px;background:var(--glassS);
  box-shadow:var(--sh);transition:border-color .18s,box-shadow .18s}
.soft:focus-within{border-color:var(--br);box-shadow:0 0 0 4px var(--brL)}
.soft .ic{color:var(--ink3);font-size:15px;flex-shrink:0}
.soft input{flex:1;border:none;background:transparent;box-shadow:none;padding:9px 0;
  font-size:14.5px;font-weight:600}
.soft input:focus{border:none;box-shadow:none}

/*──────── وسيلة إيضاح المخطط ────────*/
.lgd-more{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800}
.lgd-more .arw{display:inline-grid;place-items:center;width:24px;height:24px;
  border-radius:99px;background:var(--brL);color:var(--br);font-size:14px;
  animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.lgd-more .arw.up{background:var(--glass2);color:var(--ink3);animation:none}
/* رابط نصّي داخل شاشة الدخول */
.lnk{background:none;border:none;box-shadow:none;color:var(--br);font-weight:700;
     font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.lnk:hover{color:var(--br2)}
/* مؤشّر المزامنة: نقطة صامتة تتكلّم باللون لا برسائل تقاطع العمل */
.syncdot{width:34px;height:34px;border-radius:12px;border:1px solid var(--edge);
  background:var(--glass2);position:relative;flex-shrink:0}
.syncdot::after{content:'';position:absolute;inset:0;margin:auto;width:9px;height:9px;
  border-radius:99px;transition:background .25s}
.syncdot.ok::after{background:var(--ok)}
.syncdot.wait::after{background:var(--wr)}
.syncdot.off::after{background:var(--bd)}
.syncdot.busy::after{background:var(--br);animation:pulse 1s ease-in-out infinite}
.syncdot.live{border-color:var(--ok);box-shadow:0 0 0 2px var(--okL)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.lgd-grp{font-size:11px;font-weight:800;color:var(--ink3);
  margin:11px 0 5px;letter-spacing:.02em}
.dotc{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:6px}
.av{width:42px;height:42px;border-radius:14px;flex-shrink:0;background:var(--brL);
    color:var(--br);display:grid;place-items:center;font-family:'Zain',sans-serif;
    font-size:18px;font-weight:800}
.av.r{background:var(--bdL);color:var(--bd)}
.av.w{background:var(--wrL);color:var(--wr)}
.av.g{background:var(--okL);color:var(--ok)}

/*──────── مربع اختيار ────────*/
.chk{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:13px;
     border:1px solid var(--edge);background:var(--glass2);cursor:pointer;
     font-size:14px;font-weight:600;line-height:1.45;transition:all .16s}
.chk .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink3);
         flex-shrink:0;display:grid;place-items:center;font-size:15px;
         color:transparent;font-weight:900;transition:all .16s}
.chk.on{border-color:var(--br);background:var(--brL)}
.chk.on .bx{background:var(--br);border-color:var(--br);color:var(--on-br)}
.chk.on.dang{border-color:var(--bd);background:var(--bdL)}
.chk.on.dang .bx{background:var(--bd);border-color:var(--bd);color:#fff}

/*──────── مقاطع ────────*/
.segs{display:flex;gap:4px;padding:4px;background:var(--glass2);
      border:1px solid var(--edge);border-radius:14px}
.segs button{flex:1;padding:10px 6px;border-radius:11px;font-size:13.5px;
             font-weight:700;color:var(--ink2);transition:all .2s}
.segs button.on{background:var(--glassS);color:var(--br);box-shadow:var(--sh)}

/*═══════════ الهيكل: قائمة جانبية ═══════════*/
.shell{display:flex;min-height:100vh}

.side{
  width:250px;flex-shrink:0;position:sticky;top:0;height:100vh;
  padding:18px 14px;display:flex;flex-direction:column;gap:6px;
  background:var(--glass);border-inline-end:1px solid var(--stroke);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  z-index:50;transition:transform .28s cubic-bezier(.3,.9,.3,1);
}
.side .brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px}
.side .brand .mk{width:40px;height:40px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(180deg,var(--br2),var(--br));display:grid;place-items:center;
  box-shadow:0 8px 20px -12px var(--br)}
.navb{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
      font-size:14.5px;font-weight:700;color:var(--ink2);width:100%;text-align:start;
      position:relative;transition:background .18s,color .18s,transform .14s}
.navb:hover{background:var(--glass2);color:var(--ink)}
.navb.on{background:var(--brL);color:var(--br)}
.navb.on::before{content:'';position:absolute;inset-inline-start:0;top:22%;bottom:22%;
  width:3px;border-radius:99px;background:var(--br)}
.navb:active{transform:scale(.985)}
.navb svg{width:20px;height:20px;flex-shrink:0}
.navb .cnt{margin-inline-start:auto;min-width:20px;height:20px;border-radius:99px;
  background:var(--bd);color:#fff;font-size:11px;font-weight:800;
  display:grid;place-items:center;padding:0 6px;font-family:'IBM Plex Mono',monospace}
.side .foot{margin-top:auto;display:flex;gap:7px;padding-top:12px;border-top:1px solid var(--edge)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
        padding:12px 16px;background:var(--glass);border-bottom:1px solid var(--stroke);
        -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:16px 16px 60px}
.burger{display:none}
.scrim{position:fixed;inset:0;background:rgba(3,16,19,.45);z-index:45;
       backdrop-filter:blur(2px);animation:fade .2s}

@media (min-width:1500px){ .wrap{max-width:1240px} }

/* الهاتف واللوحي: القائمة تنزلق */
@media (max-width:899px){
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:270px;
        transform:translateX(var(--sx,-110%));box-shadow:var(--shL)}
  html[dir=rtl] .side{--sx:110%}
  body.nav-open .side{--sx:0 !important;transform:translateX(0)}
  .burger{display:grid}
  .wrap{padding:14px 14px 50px}
  .topbar{padding:10px 12px}
}

/*──────── صفحة مستقلة ────────*/
.shb{position:fixed;inset:0;z-index:70;background:var(--bg);
     overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .18s ease}
.shb::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48vw 42vw at 12% 8%,  var(--blob1), transparent 62%),
    radial-gradient(52vw 46vw at 88% 22%, var(--blob2), transparent 64%),
    radial-gradient(46vw 40vw at 50% 96%, var(--blob3), transparent 62%);
  opacity:.55}
html[data-theme=dark] .shb::before{opacity:.42}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh{width:100%;max-width:960px;margin:0 auto;min-height:100%;
    padding:14px 15px 46px;animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(12px);opacity:.5}to{transform:translateY(0);opacity:1}}
.grab{display:none}
@media (min-width:900px){ .sh{padding:24px 30px 56px} }

.shhead{display:flex;align-items:flex-start;gap:10px;position:sticky;top:0;z-index:5;
        padding:12px 14px;margin:0 0 14px;border-radius:16px;
        background:var(--glass);border:1px solid var(--stroke);
        -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
        box-shadow:var(--sh)}

/*──────── اقتراحات ────────*/
.sgw{position:relative}
.sgs{position:absolute;top:100%;inset-inline:0;margin-top:6px;z-index:50;
     background:var(--glassS);border:1px solid var(--br);border-radius:13px;
     overflow:hidden;box-shadow:var(--shL);
     -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sgs div{padding:11px 13px;font-size:14px;font-weight:600;cursor:pointer}
.sgs div+div{border-top:1px solid var(--edge)}
.sgs div:hover{background:var(--brL)}

/*──────── مخطط الأسنان ────────*/
.chart{width:100%;display:block;touch-action:manipulation;max-width:560px;margin:0 auto}
.chart g{cursor:pointer;transition:opacity .15s}
.chart g:hover{opacity:.78}
.lgd{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lgd span{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
          color:var(--ink2);padding:4px 9px;border-radius:99px;
          background:var(--glass2);border:1px solid var(--edge)}
.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block}

/*──────── خط زمني ────────*/
.tl{display:flex;gap:13px}
.tl .dot{width:11px;height:11px;border-radius:99px;background:var(--ink3);
         margin-top:6px;flex-shrink:0}
.tl .dot.on{background:var(--br);box-shadow:0 0 0 4px var(--brL)}
.tl .bar{width:2px;flex:1;background:var(--edge);margin-top:3px}
.tl .cl{display:flex;flex-direction:column;align-items:center}

/*──────── جدول ────────*/
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:start;padding:10px 8px;font-size:11.5px;font-weight:700;
        color:var(--ink2);border-bottom:1px solid var(--edge)}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--edge);font-weight:600}
.tbl tr:last-child td{border-bottom:none}

/*──────── فارغ / تحميل ────────*/
.emp{padding:44px 18px;text-align:center;font-size:14px;font-weight:600;
     color:var(--ink3);border:1px dashed var(--ink3);border-radius:17px;
     background:var(--glass2)}
.spin{width:26px;height:26px;border:3px solid var(--edge);border-top-color:var(--br);
      border-radius:99px;animation:sp .7s linear infinite;margin:34px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/*──────── إشعار ────────*/
#toast{position:fixed;inset-inline:0;bottom:26px;z-index:95;display:flex;
       justify-content:center;pointer-events:none;padding:0 16px}
#toast>div{padding:13px 22px;border-radius:15px;font-size:14px;font-weight:700;
           max-width:460px;box-shadow:var(--shL);animation:up .25s;
           background:var(--glassS);color:var(--ink);border:1px solid var(--stroke);
           -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#toast>div.e{background:var(--bd);color:#fff;border-color:transparent}
#toast>div.s{background:var(--ok);color:#fff;border-color:transparent}

/*──────── دخول ────────*/
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.logo{width:70px;height:70px;border-radius:23px;
      background:linear-gradient(180deg,var(--br2),var(--br));
      display:grid;place-items:center;margin:0 auto 18px;
      box-shadow:0 18px 40px -18px var(--br)}
.rolebtn{display:flex;align-items:center;gap:13px;padding:15px;border-radius:17px;
         border:1px solid var(--stroke);background:var(--glass);width:100%;text-align:start;
         box-shadow:var(--sh);
         -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
         transition:transform .14s,border-color .16s,box-shadow .16s}
.rolebtn:hover{border-color:var(--br);box-shadow:var(--shL)}
.rolebtn:active{transform:scale(.99)}
.rolebtn .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}

/*──────── قوائم الإعدادات ────────*/
details.acc{background:var(--glass);border:1px solid var(--stroke);border-radius:17px;
            overflow:hidden;margin-top:11px;box-shadow:var(--sh);
            -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
details.acc>summary{padding:15px 16px;cursor:pointer;font-weight:700;font-size:15px;
  list-style:none;display:flex;align-items:center;gap:11px;user-select:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .ar{margin-inline-start:auto;color:var(--ink3);transition:transform .22s}
details.acc[open]>summary{border-bottom:1px solid var(--edge)}
details.acc[open]>summary .ar{transform:rotate(90deg)}
details.acc .bd{padding:16px}
.accic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
       background:var(--brL);color:var(--br);font-size:16px;flex-shrink:0}

/*──────── مفتاح ────────*/
.sw{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;
    border:1px solid var(--edge);background:var(--glass2);cursor:pointer;transition:all .18s}
.sw.on{border-color:var(--br);background:var(--brL)}
.sw .tg{width:52px;height:30px;border-radius:99px;background:var(--ink3);
        position:relative;flex-shrink:0;transition:background .22s}
.sw .tg::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;
  border-radius:99px;background:#fff;transition:transform .24s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw.on .tg{background:var(--br)}
html[dir=rtl] .sw.on .tg::after{transform:translateX(-22px)}
html[dir=ltr] .sw.on .tg::after{transform:translateX(22px)}

/*──────── وميض الاستدعاء ────────*/
@keyframes blink{
  0%,100%{box-shadow:var(--sh),0 0 0 0 var(--brL);border-color:var(--br)}
  50%{box-shadow:var(--sh),0 0 0 8px transparent;border-color:var(--br2)}
}
.it.live{animation:blink 1.7s ease-in-out infinite;border-color:var(--br)}
.dotlive{width:9px;height:9px;border-radius:99px;background:var(--br);
         display:inline-block;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}

/*──────── شريط بحث ────────*/
.sbar{display:flex;gap:9px;align-items:center}
.sbar input{flex:1}

/*──────── شعار التطبيق ────────*/
.applogo{width:96px;height:96px;border-radius:26px;margin:0 auto 16px;display:block;
  box-shadow:0 20px 44px -18px rgba(0,105,92,.7)}
.applogo.sm{width:52px;height:52px;border-radius:15px;margin:0;box-shadow:var(--sh)}

/*──────── بطاقة التثبيت ────────*/
#instbar{position:fixed;z-index:88;inset-inline:0;bottom:0;display:flex;
  justify-content:center;padding:14px;pointer-events:none;
  animation:instUp .38s cubic-bezier(.2,.9,.3,1)}
@keyframes instUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
#instbar .box{pointer-events:auto;width:100%;max-width:430px;display:flex;align-items:center;
  gap:13px;padding:13px 14px;border-radius:20px;
  background:var(--glassS);border:1px solid var(--stroke);box-shadow:var(--shL);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
#instbar .nm{font-family:'Zain',sans-serif;font-weight:800;font-size:17px;line-height:1.15}
#instbar .ds{font-size:12px;color:var(--ink2);font-weight:600;margin-top:1px}
#instbar .x{width:30px;height:30px;border-radius:10px;flex-shrink:0;color:var(--ink3);
  display:grid;place-items:center;font-size:15px}
/* على الحاسبة تظهر في الزاوية بدل منتصف الأسفل */
@media (min-width:900px){
  #instbar{inset-inline-start:auto;inset-inline-end:0;bottom:0;padding:22px;justify-content:flex-end}
  #instbar .box{max-width:400px}
}
@media (display-mode:standalone){ #instbar{display:none} }

/*──────── معاينة ورقة A5 داخل البرنامج ────────*/
.paper{background:#fff;color:#111;border-radius:14px;padding:18px 16px;
       box-shadow:var(--shL);border:1px solid rgba(0,0,0,.08);
       font-family:'IBM Plex Sans Arabic',sans-serif}
.paper .phd{text-align:center;border-bottom:3px solid #00695C;padding-bottom:8px}
.paper .phd img{width:100%;max-height:110px;object-fit:contain;display:block}
.paper .pmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  font-size:12.5px;margin:11px 0;padding:8px 0;border-bottom:1px dashed #999;color:#222}
/* السطر كله من اليسار: الرقم يسار الدواء كما في الوصفات الطبية */
.paper .rxrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #ddd;
  direction:ltr;text-align:left}
.paper .rxrow .n{width:24px;font-weight:800;color:#00695C;flex-shrink:0;
  font-family:'IBM Plex Mono',monospace}
.paper .rxtxt{flex:1;min-width:0}
.paper .dname{font-size:14.5px;font-weight:800;color:#111}
/* التفاصيل مختلطة عربي/أرقام — يُترك لكل جزء اتجاهه الطبيعي */
.paper .ddose{font-size:11.5px;color:#444;margin-top:2px;unicode-bidi:plaintext}
.paper .pft{margin-top:16px;padding-top:8px;border-top:1px solid #ddd;
  text-align:center;font-size:11px;color:#555}
.paper .psig{margin-top:24px;text-align:center;font-size:12px;color:#222}
.paper .psig img{display:block;margin:0 auto -6px;max-height:64px;max-width:210px;object-fit:contain}
.paper .psig .pname{font-weight:800;font-size:13px;border-top:1px solid #444;
  display:inline-block;padding-top:5px;min-width:190px}

/*──────── الكاميرا ────────*/
.camwrap{position:relative;border-radius:18px;overflow:hidden;background:#000;
         aspect-ratio:4/3;max-height:58vh}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camaim{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.camaim .box{width:78%;height:34%;border:3px solid rgba(255,255,255,.95);
             border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.camaim .ln{position:absolute;width:78%;height:3px;background:var(--br2);
            box-shadow:0 0 12px var(--br2);animation:sweep 1.9s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-17%)}50%{transform:translateY(17%)}}
.camst{position:absolute;inset-inline:0;bottom:0;padding:10px;text-align:center;
       background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;
       font-size:13px;font-weight:700}

/*──────── جرس التنبيهات ────────*/
#bellbtn{position:relative}
#bellcnt{position:absolute;top:-4px;inset-inline-end:-4px;min-width:17px;height:17px;
  padding:0 4px;border-radius:99px;background:var(--bd);color:#fff;font-size:10.5px;
  font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1}
#bellbtn.ring{color:var(--bd)}
#bellbtn.ring svg{animation:bellring 1.8s ease-in-out infinite;transform-origin:50% 15%}
@keyframes bellring{0%,58%,100%{transform:rotate(0)}64%{transform:rotate(12deg)}
  74%{transform:rotate(-10deg)}84%{transform:rotate(6deg)}92%{transform:rotate(-4deg)}}

/*──────── سؤال مقفل: «صحتي جيدة» تلغي ما سواها ────────*/
.chk.mhoff{opacity:.4;filter:saturate(.35)}

/*──────── تقليل الحركة عند الطلب ────────*/
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/*──────── طباعة ────────*/
@media print{
  body{background:#fff;color:#000}
  body::before{display:none}
  .noprint,.side,.topbar,#toast{display:none!important}
  @page{size:A5;margin:9mm}
}

/*═══════════════════════════════════════════════════════════════
  طبقة التصميم «نبض» — واجهة زجاجية حيّة وواضحة.
  · قائمة جانبية داكنة بلون الثيم نفسه، فتنفصل عن المحتوى بوضوح.
  · أسطح بيضاء زجاجية نظيفة بحواف صافية — بلا نقاط ولا ضباب.
  · أزرار مشبعة متوهّجة، وتموّج عند اللمس، ودخول متدرّج للعناصر.
  كل الألوان من متغيّرات الثيم، فتتبع الثيمات الخمسة والوضع الليلي.
  الحركة transform وopacity فقط، وتُطفأ لمن يطلب تقليلها.
═══════════════════════════════════════════════════════════════*/
:root{
  --r:20px;
  --bg:#EEF3F5;
  --glass:rgba(255,255,255,.80); --glass2:rgba(255,255,255,.58); --glassS:rgba(255,255,255,.94);
  --stroke:rgba(255,255,255,.95); --edge:rgba(12,45,55,.09);
  --side-a:#063A38; --side-b:#0A5752;
  --side-a:color-mix(in srgb, var(--br) 32%, #02181A);
  --side-b:color-mix(in srgb, var(--br) 70%, #03211F);
  --sh:0 1px 2px rgba(10,40,50,.05), 0 10px 28px -16px rgba(10,40,50,.28);
  --shL:0 2px 6px rgba(10,40,50,.07), 0 28px 60px -28px rgba(10,40,50,.45);
  --cglow:0 18px 40px -26px var(--gl2);
}
html[data-theme=dark]{
  --bg:#060D11;
  --glass:rgba(20,32,38,.78); --glass2:rgba(20,32,38,.52); --glassS:rgba(26,40,47,.94);
  --stroke:rgba(255,255,255,.08); --edge:rgba(255,255,255,.07);
  --side-a:color-mix(in srgb, var(--br) 16%, #030A0D);
  --side-b:color-mix(in srgb, var(--br) 34%, #04100F);
  --sh:0 1px 1px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.9);
  --shL:0 26px 60px -30px rgba(0,0,0,.95);
}
@property --ang{ syntax:'<angle>'; initial-value:0deg; inherits:false; }
@keyframes spin{ to{ --ang:360deg } }
@keyframes rise{ from{ opacity:0; transform:translateY(14px) scale(.985) } to{ opacity:1; transform:none } }
@keyframes ripple{ to{ transform:scale(2.6); opacity:0 } }
@keyframes floaty{ 0%,100%{ transform:translate3d(0,0,0) } 50%{ transform:translate3d(0,-14px,0) } }
@keyframes drift{ 0%{ transform:translate3d(0,0,0) scale(1) } 100%{ transform:translate3d(-4%,3%,0) scale(1.08) } }

/* ── الخلفية: ضوءان ملوّنان واضحان على أساس نظيف ── */
body{ background:var(--bg) }
body::before{
  inset:-20%; opacity:1;
  background:
    radial-gradient(30% 34% at 92% 8%,  color-mix(in srgb,var(--br2) 34%,transparent), transparent 70%),
    radial-gradient(34% 36% at 8% 96%,  color-mix(in srgb,var(--blob2) 60%,transparent), transparent 70%),
    radial-gradient(26% 28% at 55% 45%, color-mix(in srgb,var(--blob1) 26%,transparent), transparent 72%);
  animation:drift 26s ease-in-out infinite alternate;
}
html[data-theme=dark] body::before{ opacity:.9 }

/* ── الأسطح ── */
.card{
  background:var(--glass);
  border:1px solid var(--stroke);
  box-shadow:var(--sh), inset 0 1px 0 rgba(255,255,255,.7);
}
html[data-theme=dark] .card{ box-shadow:var(--sh), inset 0 1px 0 rgba(255,255,255,.05) }
.card.flat{ background:var(--glass2); box-shadow:none }
.it{
  background:var(--glass); border:1px solid var(--stroke);
  transition:transform .2s cubic-bezier(.2,.9,.3,1), box-shadow .2s, border-color .2s, background .2s;
}
.it:hover{ transform:translateY(-2px); border-color:color-mix(in srgb,var(--br) 45%,transparent);
  box-shadow:var(--shL), var(--cglow) }
details.acc{ background:var(--glass); border:1px solid var(--stroke) }
details.acc[open]{ box-shadow:var(--shL), var(--cglow) }
details.acc>summary .accic{
  background:linear-gradient(140deg,var(--br2),var(--br)); color:var(--on-br);
  box-shadow:0 8px 18px -8px var(--br) }
.shhead{ background:var(--glassS); border:1px solid var(--stroke); box-shadow:var(--shL) }

/* دخول العناصر بتدرّج خفيف — يُحسّ التطبيق حيّاً دون أن يبطئ */
#view > *, #view .col > .it, .sh > *{ animation:rise .42s cubic-bezier(.2,.9,.3,1) both }
#view > *:nth-child(2), .sh > *:nth-child(2){ animation-delay:.04s }
#view > *:nth-child(3), .sh > *:nth-child(3){ animation-delay:.08s }
#view > *:nth-child(4), .sh > *:nth-child(4){ animation-delay:.12s }
#view > *:nth-child(n+5), .sh > *:nth-child(n+5){ animation-delay:.16s }
#view .col > .it:nth-child(n+2){ animation-delay:.05s }
#view .col > .it:nth-child(n+4){ animation-delay:.1s }

/* ── الأزرار: ألوان مشبعة واضحة + توهج + لمعة + تموّج ── */
.btn{ position:relative; overflow:hidden; isolation:isolate; letter-spacing:.01em;
  transition:transform .14s, box-shadow .2s, filter .2s }
.btn:not(.gh):not(.sf):not(.dg):not(.ok):not(.wn){
  background:linear-gradient(135deg, var(--br2) 0%, var(--br) 70%);
  color:var(--on-br);
  box-shadow:0 10px 22px -12px var(--br), 0 0 0 1px color-mix(in srgb,var(--br) 40%,transparent) inset,
             0 0 22px -10px var(--gl2);
}
.btn:not(.gh):not(.sf):hover{ transform:translateY(-1px); filter:saturate(1.15) brightness(1.05);
  box-shadow:0 14px 28px -12px var(--br), 0 0 30px -8px var(--gl2) }
.btn::after{ content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%);
  transform:translateX(-130%); transition:transform .75s cubic-bezier(.2,.8,.2,1) }
html[dir=rtl] .btn::after{ transform:translateX(130%) }
.btn:not(.gh):not(.sf):hover::after{ transform:translateX(0) }
.btn.gh{ background:var(--glassS); color:var(--ink); border:1px solid color-mix(in srgb,var(--br) 22%,var(--edge));
  box-shadow:0 2px 6px -3px rgba(0,0,0,.12) }
.btn.gh:hover{ border-color:var(--br); color:var(--br); background:color-mix(in srgb,var(--br) 7%,var(--glassS));
  box-shadow:0 0 0 3px var(--brL) }
.btn.sf{ background:color-mix(in srgb,var(--br) 14%,var(--glassS)); color:var(--br);
  border:1px solid color-mix(in srgb,var(--br) 30%,transparent) }
.btn.sf:hover{ background:color-mix(in srgb,var(--br) 22%,var(--glassS)) }
.btn.ok{ background:linear-gradient(135deg,#34C27F,#13804F); box-shadow:0 10px 22px -12px #13804F, 0 0 20px -10px #34C27F }
.btn.dg{ background:linear-gradient(135deg,#F07466,#C0392B); box-shadow:0 10px 22px -12px #C0392B }
.btn.wn{ background:linear-gradient(135deg,#F2B544,#C27C06) }
.btn:disabled{ filter:grayscale(.4); transform:none }
.navb{ overflow:hidden }
.rpl{ position:absolute; border-radius:50%; pointer-events:none; z-index:0;
  background:currentColor; opacity:.22; transform:scale(0); animation:ripple .6s ease-out forwards }
.ib{ background:var(--glassS); border:1px solid color-mix(in srgb,var(--br) 18%,var(--edge)) }
.ib:hover{ box-shadow:0 0 0 3px var(--brL), 0 0 18px -6px var(--gl2) }

/* ── القائمة الجانبية: لوح داكن بلون الثيم ── */
.side{
  background:
    radial-gradient(120% 50% at 100% 0%, color-mix(in srgb,var(--br2) 30%,transparent), transparent 60%),
    linear-gradient(180deg, var(--side-b), var(--side-a));
  border-inline-end:none;
  box-shadow:-10px 0 40px -20px rgba(0,0,0,.5);
  -webkit-backdrop-filter:none; backdrop-filter:none;
  color:#EAF7F5;
}
.side::before{ content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:radial-gradient(60% 30% at 0% 100%, color-mix(in srgb,var(--br2) 26%,transparent), transparent 70%) }
.side > *{ position:relative }
.side .brand{ border-bottom:1px solid rgba(255,255,255,.12); padding:6px 6px 18px; margin-bottom:8px }
.side #hd-name{ color:#fff; font-size:20px }
.side #hd-role{ color:rgba(255,255,255,.62); letter-spacing:.04em }
.side .brand .mk{ width:48px; height:48px; border-radius:16px; position:relative;
  background:linear-gradient(140deg,var(--br2),var(--br)); box-shadow:0 10px 24px -10px var(--br2) }
.side .brand .mk::after{ content:''; position:absolute; inset:-3px; border-radius:19px; z-index:-1;
  background:conic-gradient(from var(--ang), var(--br2), transparent 40%, var(--br2) 60%, transparent);
  animation:spin 6s linear infinite; filter:blur(4px); opacity:.85 }
.side .brand .mk.img{ background:#fff }
.side .brand .mk img{ width:100%; height:100%; object-fit:contain; border-radius:16px; padding:4px }
.navb{ color:rgba(255,255,255,.78); border:1px solid transparent; padding:9px 11px }
.navb svg{ width:32px; height:32px; padding:6px; border-radius:11px; background:rgba(255,255,255,.08);
  transition:background .2s, box-shadow .2s, transform .2s }
.navb:hover{ background:rgba(255,255,255,.08); color:#fff }
.navb:hover svg{ transform:scale(1.06) }
.navb.on{ color:#fff; background:linear-gradient(270deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
  border-color:rgba(255,255,255,.18); box-shadow:0 10px 26px -14px rgba(0,0,0,.6) }
html[dir=ltr] .navb.on{ background:linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,.05)) }
.navb.on svg{ background:linear-gradient(140deg,var(--br2),var(--br)); color:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.25), 0 0 20px -2px var(--br2) }
.navb.on::before{ background:var(--br2); width:4px; box-shadow:0 0 14px var(--br2) }
.navb .cnt{ box-shadow:0 0 12px -2px var(--bd) }
.side .foot{ border-top:1px solid rgba(255,255,255,.12) }
.side .foot .ib{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14); color:#fff }
.side .foot .ib:hover{ background:rgba(255,255,255,.16) }

/* ── الشريط العلوي ── */
.topbar{ background:color-mix(in srgb,var(--glassS) 85%,transparent); border-bottom:1px solid var(--edge);
  box-shadow:0 8px 24px -20px rgba(0,0,0,.4) }
#pagetitle{ font-family:'Zain',sans-serif; font-size:23px; font-weight:900; letter-spacing:-.01em }
#pagetitle::before{ content:''; display:inline-block; width:8px; height:8px; border-radius:99px;
  margin-inline-end:10px; vertical-align:middle; background:var(--br2); box-shadow:0 0 12px var(--br2) }

/* ── الإدخال ── */
input,select,textarea{ background:var(--glassS); border-color:color-mix(in srgb,var(--br) 14%,var(--edge)) }
input:hover,select:hover,textarea:hover{ border-color:color-mix(in srgb,var(--br) 40%,var(--edge)) }

/* ── الشارات ── */
.av{ background:linear-gradient(140deg, color-mix(in srgb,var(--br2) 26%,transparent), var(--brL));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--br) 20%,transparent) }
.pill.b{ background:color-mix(in srgb,var(--br) 14%,transparent) }
.track{ background:color-mix(in srgb,var(--ink) 7%,transparent) }
.track>i{ box-shadow:0 0 12px -2px var(--gl2) }
.lbl{ color:color-mix(in srgb,var(--br) 60%,var(--ink3)) }

/* ── بطاقات الأرقام ── */
.g3>.card.ctr,.g2>.card.ctr{ overflow:hidden; position:relative }
.g3>.card.ctr::after,.g2>.card.ctr::after{ content:''; position:absolute; width:110px; height:110px;
  border-radius:99px; inset-inline-end:-46px; top:-54px; pointer-events:none;
  background:radial-gradient(circle, var(--gl2), transparent 70%); opacity:.4 }

/* ── شاشة الدخول ── */
#login{ position:relative }
.lghero{ text-align:center; margin-bottom:8px }
.lgring{ width:118px; height:118px; margin:0 auto 18px; border-radius:34px; position:relative;
  display:grid; place-items:center; animation:floaty 6s ease-in-out infinite }
.lgring::before{ content:''; position:absolute; inset:-4px; border-radius:38px;
  background:conic-gradient(from var(--ang), var(--br2), var(--blob2), var(--br), var(--br2));
  animation:spin 6s linear infinite; box-shadow:0 0 50px -8px var(--gl2) }
.lgring::after{ content:''; position:absolute; inset:0; border-radius:34px; background:var(--bg) }
.lgring .applogo{ position:relative; z-index:1; width:104px; height:104px; margin:0; border-radius:30px;
  box-shadow:0 18px 40px -18px var(--br) }
.applogo.custom{ background:#fff; object-fit:contain; padding:8px }
.lgname{ font-size:36px; font-weight:900 }
.lgsub{ font-family:'Zain',sans-serif; font-weight:700; font-size:17px; color:var(--br); margin-top:-2px }
#lg-cloud{ box-shadow:var(--shL), 0 0 70px -30px var(--gl2) }

/* ── شريط التمرير ── */
*{ scrollbar-width:thin; scrollbar-color:color-mix(in srgb,var(--br) 40%,transparent) transparent }
::-webkit-scrollbar{ width:9px; height:9px }
::-webkit-scrollbar-thumb{ background:color-mix(in srgb,var(--br) 35%,transparent); border-radius:99px;
  border:2px solid transparent; background-clip:padding-box }

/* ── عناصر مساعدة ── */
.logoprev{ width:58px; height:58px; border-radius:16px; flex-shrink:0; display:grid; place-items:center;
  font-size:26px; background:#fff; border:1px solid var(--edge); overflow:hidden; box-shadow:0 8px 20px -12px var(--br) }
.logoprev.lg{ width:76px; height:76px; border-radius:20px }
.logoprev img{ width:100%; height:100%; object-fit:contain; padding:5px }
.pickov{ position:fixed; inset:0; z-index:120; display:grid; place-items:center; padding:18px;
  background:rgba(3,16,19,.55); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); animation:fade .18s }
.pickbox{ width:100%; max-width:420px; max-height:86vh; overflow:auto; padding:18px; border-radius:22px;
  background:var(--glassS); border:1px solid var(--stroke); box-shadow:var(--shL), 0 0 50px -20px var(--gl2);
  animation:rise .25s cubic-bezier(.2,.9,.3,1) }
.clcode{ background:#fff; border-radius:18px; padding:18px; border:1px solid var(--edge);
  box-shadow:0 16px 36px -22px var(--br) }
.clcode-qr{ width:min(220px,70%); margin:0 auto }
.clcode-nm{ color:#000; text-align:center; font-family:'Zain',sans-serif; font-weight:800; font-size:20px; margin-bottom:8px }
.clcode-num{ color:#000; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:700;
  font-size:20px; letter-spacing:.24em; margin-top:8px }
.stgrp{ padding:14px; border-radius:16px; background:var(--glass2); border:1px solid var(--edge) }

/* ═══════ ملف المراجع ═══════ */
.pf-hero{ position:relative; overflow:hidden; border-radius:22px; padding:18px; color:#fff;
  background:
    radial-gradient(80% 120% at 100% 0%, color-mix(in srgb,var(--br2) 55%,transparent), transparent 60%),
    linear-gradient(135deg, var(--side-b), var(--side-a));
  box-shadow:0 22px 46px -26px var(--br) }
.pf-hero::after{ content:''; position:absolute; width:220px; height:220px; border-radius:99px;
  inset-inline-start:-80px; bottom:-120px; background:radial-gradient(circle, color-mix(in srgb,var(--br2) 40%,transparent), transparent 70%) }
.pf-hero > *{ position:relative; z-index:1 }
.pf-av{ width:58px; height:58px; border-radius:18px; display:grid; place-items:center; flex-shrink:0;
  font-family:'Zain',sans-serif; font-weight:900; font-size:26px; color:#fff;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25) }
.pf-name{ font-family:'Zain',sans-serif; font-weight:900; font-size:25px; line-height:1.15 }
.pf-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:7px }
.pf-chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:12px;
  font-weight:700; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); color:#fff; text-decoration:none }
.pf-x{ width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); flex-shrink:0 }
.pf-money{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px }
.pf-m{ padding:10px 12px; border-radius:15px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16) }
.pf-m .k{ font-size:11.5px; font-weight:700; opacity:.75 }
.pf-m .v{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:19px; margin-top:2px }
.pf-m.due .v{ color:#FFB4A8 } .pf-m.ok .v{ color:#9BF0C3 }
.pf-bar{ height:6px; border-radius:99px; background:rgba(255,255,255,.14); margin-top:12px; overflow:hidden }
.pf-bar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#9BF0C3,#fff) }
.pf-alerts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px }
.pf-al{ display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:99px; font-size:12px; font-weight:800 }
.pf-al.r{ background:#FFE1DC; color:#A3261A } .pf-al.w{ background:#FFF0CC; color:#7A5100 }
.pf-acts{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px }
.pf-act{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px; border-radius:18px;
  font-weight:800; font-size:13.5px; text-align:center; position:relative; overflow:hidden;
  background:var(--glassS); border:1px solid var(--stroke); box-shadow:var(--sh); transition:transform .18s, box-shadow .2s }
.pf-act .i{ width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-size:19px;
  color:#fff; background:linear-gradient(140deg,var(--br2),var(--br)); box-shadow:0 10px 20px -10px var(--br) }
.pf-act.pay .i{ background:linear-gradient(140deg,#34C27F,#13804F); box-shadow:0 10px 20px -10px #13804F }
.pf-act.ap .i{ background:linear-gradient(140deg,#8B7CFF,#5B45E0); box-shadow:0 10px 20px -10px #5B45E0 }
.pf-act:hover{ transform:translateY(-3px); box-shadow:var(--shL), var(--cglow) }
.pf-act.live{ border-color:var(--br); box-shadow:0 0 0 3px var(--brL), var(--cglow) }
.pf-act .s{ font-size:11px; font-weight:600; color:var(--ink3) }
.pf-tabs{ display:flex; gap:4px; padding:4px; margin-top:16px; border-radius:15px; background:var(--glass2); border:1px solid var(--edge) }
.pf-tabs button{ flex:1; padding:10px; border-radius:12px; font-weight:800; color:var(--ink2); transition:all .2s }
.pf-tabs button.on{ background:var(--glassS); color:var(--br); box-shadow:var(--sh) }
.pf-tabs .n{ font-family:'IBM Plex Mono',monospace; font-size:11px; padding:1px 7px; border-radius:99px;
  background:var(--brL); color:var(--br); margin-inline-start:4px }
.pf-more{ position:relative }
.pf-menu{ position:fixed; z-index:200; min-width:220px; padding:6px; border-radius:16px;
  background:var(--glassS); border:1px solid var(--stroke); box-shadow:var(--shL); animation:rise .18s }
.pf-menu button{ display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:11px;
  font-weight:700; color:var(--ink); text-align:start }
.pf-menu button:hover{ background:var(--brL); color:var(--br) }
.pf-menu button.dg{ color:var(--bd) } .pf-menu button.dg:hover{ background:var(--bdL) }
.pf-menu hr{ border:none; border-top:1px solid var(--edge); margin:4px 0 }

/* بطاقة زيارة */
.vc{ display:flex; gap:12px; padding:14px; border-radius:18px; background:var(--glass); border:1px solid var(--stroke);
  box-shadow:var(--sh); margin-top:10px; transition:box-shadow .2s, border-color .2s }
.vc:hover{ border-color:color-mix(in srgb,var(--br) 35%,transparent); box-shadow:var(--shL), var(--cglow) }
.vc.open{ border-color:color-mix(in srgb,var(--br) 50%,transparent); box-shadow:0 0 0 3px var(--brL), var(--sh) }
.vc-date{ width:58px; flex-shrink:0; text-align:center; padding:8px 4px; border-radius:15px; height:fit-content;
  background:linear-gradient(160deg, color-mix(in srgb,var(--br2) 20%,transparent), var(--brL)); color:var(--br) }
.vc-date .d{ font-family:'Zain',sans-serif; font-weight:900; font-size:26px; line-height:1 }
.vc-date .m{ font-size:11px; font-weight:800; margin-top:3px }
.vc-date .y{ font-size:10px; opacity:.7; font-family:'IBM Plex Mono',monospace }
.vc-row{ display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px dashed var(--edge) }
.vc-row:last-child{ border-bottom:none }
.tbadge{ min-width:40px; height:30px; padding:0 8px; border-radius:10px; display:grid; place-items:center;
  font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; color:#fff; flex-shrink:0 }
.vc-sum{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px }
.mchip{ display:inline-flex; gap:5px; align-items:center; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:800;
  background:var(--glass2); border:1px solid var(--edge) }
.mchip b{ font-family:'IBM Plex Mono',monospace }
.mchip.g{ background:var(--okL); color:var(--ok); border-color:transparent }
.mchip.r{ background:var(--bdL); color:var(--bd); border-color:transparent }
.vc-rx{ margin-top:9px; padding:9px 11px; border-radius:12px; font-size:12.5px; font-weight:600;
  background:color-mix(in srgb,var(--blob2) 18%,transparent); border:1px solid var(--edge); direction:ltr; text-align:left }
.vc-note{ margin-top:8px; font-size:12.5px; color:var(--ink2); font-weight:600 }

/* بطاقة سنّ */
.tc{ padding:14px; border-radius:18px; background:var(--glass); border:1px solid var(--stroke); box-shadow:var(--sh);
  margin-top:10px; cursor:pointer; transition:transform .18s, box-shadow .2s }
.tc:hover{ transform:translateY(-2px); box-shadow:var(--shL), var(--cglow) }
.tc-big{ width:52px; height:52px; border-radius:16px; display:grid; place-items:center; flex-shrink:0; color:#fff;
  font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:16px }
.steps{ display:flex; gap:5px; margin-top:10px }
.steps i{ flex:1; height:8px; border-radius:99px; background:color-mix(in srgb,var(--ink) 9%,transparent) }
.steps i.on{ background:var(--c, var(--br)); box-shadow:0 0 10px -2px var(--c, var(--br)) }
.ses{ display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13px; border-bottom:1px dashed var(--edge) }
.ses:last-child{ border-bottom:none }
.ses .n{ width:26px; height:26px; border-radius:9px; display:grid; place-items:center; font-weight:800; font-size:12px;
  background:var(--brL); color:var(--br); flex-shrink:0 }
@media (max-width:560px){ .pf-money{ gap:6px } .pf-m .v{ font-size:16px } .pf-name{ font-size:21px } }

/*──── الاشتراك: عدّاد الشريط وشاشة الإيقاف ────*/
.subchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:12px;
  border:1px solid var(--edge);background:var(--glass2);color:var(--ink);font:inherit;font-size:12.5px;
  font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .15s}
.subchip:active{transform:scale(.96)}
.subchip .sc-d{font-weight:600;opacity:.7;font-size:11.5px;direction:ltr}
.subchip.warn{border-color:var(--bd);background:var(--bdL);color:var(--bd);animation:subblink 1.15s ease-in-out infinite}
.subchip.grace{border-color:var(--wr);background:var(--wrL);color:var(--wr)}
.subchip.warn.grace{border-color:var(--bd);background:var(--bdL);color:var(--bd)}
@keyframes subblink{0%,100%{box-shadow:0 0 0 0 transparent;opacity:1}
  50%{box-shadow:0 0 0 4px var(--bdL),0 0 18px -2px var(--bd);opacity:.62}}
@media (max-width:560px){ .subchip .sc-d{display:none} .subchip{padding:0 9px} }
@media (prefers-reduced-motion:reduce){ .subchip.warn{animation:none;outline:2px solid var(--bd)} }
.sublock{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:18px;
  background:color-mix(in srgb,var(--bg,#0b1416) 55%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.sl-card{width:min(420px,100%);text-align:center;padding:26px 22px;border-radius:24px;
  background:var(--glassS);border:1px solid var(--edge);box-shadow:0 30px 80px -30px rgba(0,0,0,.55)}
.sl-ic{width:66px;height:66px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;
  font-size:30px;background:var(--bdL);border:1px solid var(--bd)}
.sl-t{font-size:23px;color:var(--bd);margin-bottom:6px}
.sl-s{color:var(--ink);opacity:.85;margin-bottom:16px}
.sl-ph{display:flex;flex-direction:column;gap:4px;margin:0 0 16px;padding:12px;border-radius:16px;
  background:var(--glass2);border:1px solid var(--edge)}
.sl-num{font-size:24px;font-weight:800;letter-spacing:.06em;color:var(--br);text-decoration:none}

/*──── الخلفية: رمادي هادئ بدل البياض (الوضع الفاتح فقط) ────
  البياض الكامل يجعل البطاقات البيضاء تذوب فيه فيبدو البرنامج باهتاً.
  أساس رمادي مطفأ يُبرز البطاقات والأقسام كما هي — هي لا تتغيّر. */
html:not([data-theme=dark]){ --bg:#D6DCE0 }
html:not([data-theme=dark]) body{ background:linear-gradient(180deg,#DCE1E5 0%,#D1D7DB 100%) fixed }
html:not([data-theme=dark]) body::before{ opacity:.5 }

/*──── شاشة الجلسة: أزرار العلاج والأرشيف والتفاصيل ────*/
.sxa{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px }
.sxa-t{ position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:14px 8px 12px; border-radius:18px; border:none; cursor:pointer; color:#fff; font:inherit;
  box-shadow:0 14px 26px -16px var(--c1); transition:transform .15s, box-shadow .2s, filter .2s;
  background:linear-gradient(145deg, var(--c1), var(--c2)) }
.sxa-t::after{ content:''; position:absolute; width:90px; height:90px; border-radius:50%; top:-40px; inset-inline-end:-30px;
  background:rgba(255,255,255,.16); pointer-events:none }
.sxa-t:hover{ transform:translateY(-2px); filter:saturate(1.1) brightness(1.05); box-shadow:0 18px 32px -16px var(--c1) }
.sxa-t:active{ transform:scale(.97) }
.sxa-t.rx { --c1:#0FA58C; --c2:#0B6F7A }
.sxa-t.arc{ --c1:#8B5CF6; --c2:#5B3CC4 }
.sxa-t.inf{ --c1:#3B82F6; --c2:#1E4FB8 }
.sxa-i{ width:40px; height:40px; border-radius:13px; display:grid; place-items:center; font-size:19px; font-weight:800;
  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.28) }
.sxa-l{ font-weight:800; font-size:13.5px; line-height:1.25; text-align:center }
.sxa-c{ font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; background:rgba(0,0,0,.18) }
@media (max-width:420px){ .sxa{ gap:7px } .sxa-t{ padding:12px 4px 10px } .sxa-l{ font-size:12.5px } }

/*──── جلسات الأسنان: زرّ لكل سن ────*/
.tsb{ border-radius:16px; border:1px solid var(--edge); background:var(--glass); overflow:hidden;
  border-inline-start:5px solid var(--edge); transition:box-shadow .2s }
.tsb.done{ border-inline-start-color:var(--ok); background:color-mix(in srgb,var(--ok) 7%,var(--glass)) }
.tsb.open{ border-inline-start-color:var(--bd); background:color-mix(in srgb,var(--bd) 6%,var(--glass)) }
.tsb.here{ box-shadow:0 0 0 2px color-mix(in srgb,var(--br) 45%,transparent) }
.tsb-h{ width:100%; display:flex; align-items:center; gap:10px; padding:11px 12px; border:none; background:none;
  font:inherit; color:inherit; cursor:pointer; text-align:start }
.tsb-n{ width:42px; height:42px; border-radius:13px; display:grid; place-items:center; flex-shrink:0; color:#fff;
  font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px }
.tsb-t{ display:block; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.tsb-ar{ font-size:18px; color:var(--ink3); transition:transform .2s }
.tsb.x .tsb-ar{ transform:rotate(180deg) }
.tsb-b{ display:none; padding:0 10px 10px }
.tsb.x .tsb-b{ display:block }
.tsc-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:8px 2px 4px;
  font-size:12px; font-weight:800; color:var(--ink2) }
.tsv{ display:flex; align-items:center; gap:10px; padding:10px 12px; margin-top:6px; border-radius:12px;
  background:var(--glassS); border:1px solid var(--edge); cursor:pointer; transition:border-color .15s }
.tsv:hover{ border-color:var(--br) }
.tsv.on{ cursor:default; border-color:var(--br); background:var(--brL) }
.tsv-s{ font-weight:800 }
.tsv-go{ color:var(--ink3); font-size:18px }
.tsb.other{ border-inline-start-color:var(--ink3) }

/* بطاقة السن في ملف المراجع: أخضر مكتمل · أحمر غير مكتمل */
.tc.done{ border-inline-start:5px solid var(--ok); background:color-mix(in srgb,var(--ok) 6%,var(--glass)) }
.tc.open{ border-inline-start:5px solid var(--bd); background:color-mix(in srgb,var(--bd) 5%,var(--glass)) }
</style>
</head>

<!-- ═══════════ شاشة الدخول ═══════════ -->
<div id="login">
  <div style="width:100%;max-width:400px">
    <div class="lghero">
      <div class="lgring"><div id="applogo"></div></div>
      <div class="h1 ctr lgname" id="lg-name">أسناني</div>
      <div class="ctr lgsub" id="lg-sub">My teeth</div>
    </div>
    <div class="sub ctr" id="lg-tag" style="margin-bottom:22px"></div>

    <!-- ═══ الدخول عبر السيرفر: شاشة واحدة، والدور يجيء من السيرفر ═══ -->
    <div id="lg-cloud" class="card">
      <div id="cl-warn" class="al w hide" style="margin-bottom:12px"></div>
      <label class="lb" id="lb-email"></label>
      <input id="cl-email" type="email" dir="ltr" autocomplete="username"
             inputmode="email" spellcheck="false">
      <div class="mt">
        <label class="lb" id="lb-cpass"></label>
        <input id="cl-pass" type="password" dir="ltr" autocomplete="current-password">
      </div>
      <button class="btn w mt2" id="cl-go"></button>
      <div id="cl-err" class="al r mt hide"></div>
      <button class="btn gh w mt2 xs" id="cl-reg"></button>
      <div class="ctr mt"><button class="lnk" id="cl-forgot"></button></div>
    </div>



    <div class="row mt2" style="justify-content:center">
      <button class="ib" onclick="UI.lang()"><span class="lgL">EN</span></button>
      <button class="ib" onclick="UI.theme()"><span class="thL">☾</span></button>
      <button class="ib" onclick="Setup.reset()" title="reset">⟳</button>
    </div>
  </div>
</div>

<!-- ═══════════ التطبيق ═══════════ -->
<div id="app" class="hide">
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand">
        <div class="mk" id="hd-mk">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 3c-3 0-4-1.2-6 0C4 4.2 3.4 7 4 10c.5 2.6 1.3 4 1.8 6.6.4 2 .6 4.4 2 4.4 1.6 0 1.3-2.6 1.8-4.6.4-1.6.8-2.4 2.4-2.4s2 .8 2.4 2.4c.5 2 .2 4.6 1.8 4.6 1.4 0 1.6-2.4 2-4.4.5-2.6 1.3-4 1.8-6.6.6-3 0-5.8-2-7-2-1.2-3 0-6 0z" fill="var(--on-br)"/></svg>
        </div>
        <div class="gr" style="min-width:0">
          <div class="dsp" style="font-size:19px;line-height:1.1" id="hd-name"></div>
          <div class="lbl" id="hd-role"></div>
        </div>
      </div>
      <nav id="navlist" class="col" style="gap:4px"></nav>
      <div class="foot">
        <button class="ib gr" onclick="UI.lang()"><span class="lgL">EN</span></button>
        <button class="ib gr" onclick="UI.theme()"><span class="thL">☾</span></button>
        <button class="ib gr" onclick="Auth.out()">⏻</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="ib burger" onclick="UI.drawer(true)">☰</button>
        <div class="gr">
          <div class="h3" id="pagetitle"></div>
        </div>
        <button class="subchip hide" id="subchip" onclick="Sub.info()"></button>
        <button class="syncdot hide" id="syncdot" onclick="Sync.run(true)"></button>
        <button class="ib hide" id="bellbtn" onclick="Notify.open()" title="">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.7 21a2 2 0 01-3.4 0"
              stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="bellcnt" class="hide"></span>
        </button>
        <button class="ib" id="scanbtn" onclick="Scan.open()" title="">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M7 8v8M10.5 8v8M14 8v8M17 8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <div class="wrap">
        <div id="quickbar"></div>
        <div id="view"></div>
      </div>
    </div>
  </div>
</div>

<div id="sheet"></div>
<div id="toast"></div>

<script>
/*═══════════════ Firebase — النواة المشتركة ═══════════════
  تُحقن هذه النواة كما هي في البرامج الثلاثة (الطبيب، المراجع، لوحة التحكم)
  بعد حزمة FBSDK. لا تحوي منطق شاشة — فقط الاتصال والأدوات المشتركة:
  · تهيئة التطبيق والدخول والقاعدة والتخزين.
  · ترجمة أخطاء Firebase إلى رسائل يفهمها البرنامج (ومنها: انقطاع الشبكة).
  · إنشاء حساب لشخص آخر دون الخروج من الحساب الحالي.
  · الباقات وحساب صلاحية الاشتراك.
  نموذج البيانات (والقواعد في firestore.rules تطابقه حرفاً حرفاً):
    members/{uid}                    عضو عيادة: cid, role, name, email, active, vis[]
    clinics/{cid}                    العيادة واشتراكها وحدودها وعدّاداتها
    clinics/{cid}/o/{K}/pub|prv/{id} سجلات المزامنة. K = طبيب السجل أو '_'
    clinics/{cid}/bookings/{id}      حجوزات تطبيق المراجع
    clinics/{cid}/links/{doctorUid}  من اختارهم الطبيب (سكرتارية، صيدليات، أطباء)
    clinics/{cid}/payments/{id}      سجل الاشتراك (لوحة التحكم)
    codes/{code}                     بطاقة العيادة العامة (يقرؤها المراجع برمزها)
    patients/{uid}                   ملف المراجع، وتحته clinics, bookings, care
    config/admins                    بريد مديري المنصّة
    audit/{id}                       سجل إجراءات المدير
═══════════════════════════════════════════════════════════*/
const FBC = {
  cfg:{
    apiKey:'AIzaSyAZ_neBQ4iHTIDNtz6uXOt61bvztHPXs8U',
    authDomain:'asnany-4311e.firebaseapp.com',
    projectId:'asnany-4311e',
    storageBucket:'asnany-4311e.firebasestorage.app',
    messagingSenderId:'930252788946',
    appId:'1:930252788946:web:ca2ce4a9126e213223890b',
  },
  ADMIN_EMAIL:'saif07807632797@gmail.com',
  app:null, auth:null, db:null, st:null, _ready:null,

  /* session=true: الجلسة تنتهي بإغلاق التبويب (لوحة التحكم) */
  init(opts){
    if (this.app) return this;
    const F = FBSDK;
    this.app  = F.initializeApp(this.cfg);
    this.auth = F.initializeAuth(this.app, { persistence: opts?.session
      ? [F.browserSessionPersistence]
      : [F.indexedDBLocalPersistence, F.browserLocalPersistence] });
    /* ذاكرة مؤقّتة فقط: البرنامج له قاعدته المحلية، ونسخة ثانية من
       Firestore على القرص تضاعف المساحة ولا تفيد. الاستطلاع الطويل
       يُكتشف تلقائياً خلف الشبكات التي تقطع البثّ. */
    this.db   = F.initializeFirestore(this.app, { localCache:F.memoryLocalCache(),
                                                  experimentalAutoDetectLongPolling:true });
    this.st   = F.getStorage ? F.getStorage(this.app) : null;   /* المراجع واللوحة بلا تخزين */
    this._ready = new Promise(res => {
      const off = F.onAuthStateChanged(this.auth, u => { off(); res(u); });
    });
    return this;
  },
  ready(){ return this._ready || Promise.resolve(null); },
  user(){ return this.auth?.currentUser || null; },
  uid(){ return this.auth?.currentUser?.uid || null; },

  /* مسارات */
  d(...p){ return FBSDK.doc(this.db, ...p); },
  c(...p){ return FBSDK.collection(this.db, ...p); },

  /* أوقات Firestore ↔ أرقام وتواريخ */
  ms(t){ return t == null ? null : (typeof t.toMillis === 'function' ? t.toMillis() : (typeof t === 'number' ? t : Date.parse(t) || null)); },
  iso(t){ const m = this.ms(t); return m == null ? null : new Date(m).toISOString(); },
  ts(ms){ return ms == null ? null : FBSDK.Timestamp.fromMillis(Number(ms)); },

  /* رقم عشوائي آمن */
  rid(n){
    const A = 'abcdefghijklmnopqrstuvwxyz0123456789';
    const b = crypto.getRandomValues(new Uint8Array(n || 20));
    return [...b].map(x => A[x % A.length]).join('');
  },
  /* رمز العيادة: K + ٩ خانات بلا أحرف ملتبسة */
  genCode(){
    const A = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
    const b = crypto.getRandomValues(new Uint8Array(9));
    return 'K' + [...b].map(x => A[x % A.length]).join('');
  },

  /*──── الأخطاء ────
    الرسائل الإنجليزية مقصودة: بقية البرنامج يفحصها بتعابير قديمة
    (invalid / credential / network / already) ولا يحتاج تعديلاً. */
  err(e){
    const code = String(e?.code || '');
    const map = {
      'auth/invalid-credential':'invalid credential', 'auth/wrong-password':'invalid credential',
      'auth/user-not-found':'invalid credential', 'auth/invalid-email':'bad_email',
      'auth/email-already-in-use':'email_taken', 'auth/weak-password':'weak_password',
      'auth/too-many-requests':'too_many_requests', 'auth/user-disabled':'account_disabled',
      'auth/requires-recent-login':'requires_recent_login',
      'permission-denied':'permission-denied', 'not-found':'not_found',
    };
    const net = code === 'auth/network-request-failed' || code === 'unavailable'
             || code === 'deadline-exceeded' || /network|offline|Failed to fetch/i.test(String(e?.message || ''));
    const out = new Error(net ? 'network' : (map[code] || e?.message || String(e)));
    out.code = code; out.net = !!net; out.cause = e;
    return out;
  },

  /*──── إنشاء حساب لشخص آخر ────
    تطبيق ثانوٍ مؤقّت بجلسة في الذاكرة: يُنشأ الحساب فيه ثم يُغلق،
    فيبقى المستثمر أو المدير داخلاً بحسابه هو. */
  async createUser(email, password, opts){
    const F = FBSDK;
    const sec = F.initializeApp(this.cfg, 'mk-' + Date.now() + '-' + this.rid(5));
    let user = null;
    try {
      const a = F.initializeAuth(sec, { persistence:[F.inMemoryPersistence] });
      const cr = await F.createUserWithEmailAndPassword(a, String(email).trim().toLowerCase(), password);
      user = cr.user;
      /* ما يُكتب بعد الإنشاء (العضوية، العيادة…). إن رُفض يُحذف الحساب
         الجديد فوراً، فلا يبقى حساب يتيم بلا عضوية. */
      if (opts?.after){
        try { await opts.after(sec, user.uid); }
        catch(e){ try { await user.delete(); } catch(_){} user = null; throw e; }
      }
      if (opts?.verify){ try { await F.sendEmailVerification(user); } catch(_){} }
      const uid = user.uid;
      try { await F.signOut(a); } catch(_){}
      return uid;
    } catch(e){ throw (e && e.code !== undefined) || !(e instanceof Error) ? this.err(e) : e; }
    finally { try { await F.deleteApp(sec); } catch(_){} }
  },

  /*──── الباقات ────*/
  PLANS:{
    basic:  { name:'الأساسية', monthly:40000,  annual:245000,  doctor:1, secretary:1, pharmacy:1, sort:1 },
    clinic: { name:'العيادة',  monthly:60000,  annual:350000,  doctor:2, secretary:2, pharmacy:1, sort:2 },
    center: { name:'المركز',   monthly:80000,  annual:595000,  doctor:4, secretary:3, pharmacy:1, sort:3 },
    complex:{ name:'المجمّع',  monthly:150000, annual:1050000, doctor:8, secretary:5, pharmacy:2, sort:4 },
  },
  /* هل اشتراك العيادة سارٍ؟ (القواعد تفرض الشيء نفسه على السيرفر) */
  subOk(c, nowMs){
    if (!c) return false;
    const now = nowMs || Date.now();
    const p = this.ms(c.paid_until), g = this.ms(c.grace_until);
    return p == null || now < p || (g != null && now < g);
  },
};

</script>
