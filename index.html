/*═══ باركود Code39 حقيقي — يُقرأ بأي ماسح ═══*/
const C39 = {
  map:{'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw',
       '5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn',
       'A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn',
       'F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn',
       'K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn',
       'P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn',
       'U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn',
       'Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'},
  svg(text, h=64){
    /* النجمة رمز البداية والنهاية في Code39 — بدونها لا يقرأ أي ماسح */
    const s = '*' + String(text).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'') + '*';
    const N=1.1, W=2.9; let x=0, bars='';
    for (const ch of s){
      const pat = this.map[ch]; if(!pat) continue;
      for (let i=0;i<9;i++){
        const w = pat[i]==='w'?W:N;
        if (i%2===0) bars += `<rect x="${x.toFixed(2)}" y="0" width="${w}" height="${h}" fill="#000"/>`;
        x += w;
      }
      x += N;
    }
    return `<svg viewBox="0 0 ${x.toFixed(0)} ${h}" preserveAspectRatio="none"
      style="width:100%;height:${h}px;background:#fff;display:block">${bars}</svg>`;
  },

  /* صورة PNG للتنزيل: اسم العيادة فوق، الخطوط، والرمز تحتها */
  png(text, title){
    const s = '*' + String(text).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'') + '*';
    const N=1.1, W=2.9, out=[]; let x=0;
    for (const ch of s){
      const pat = this.map[ch]; if(!pat) continue;
      for (let i=0;i<9;i++){
        const w = pat[i]==='w'?W:N;
        if (i%2===0) out.push([x,w]);
        x += w;
      }
      x += N;
    }
    const SC=4, PAD=32, BH=150;
    const c = document.createElement('canvas');
    c.width = Math.round(x*SC) + PAD*2;
    c.height = PAD + (title?52:0) + BH + 56 + PAD;
    const g = c.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
    g.fillStyle='#000'; g.textAlign='center';
    let y = PAD;
    if (title){
      g.font = 'bold 34px Zain, system-ui, sans-serif';
      g.fillText(String(title), c.width/2, y+34, c.width-PAD*2);
      y += 52;
    }
    for (const [bx,bw] of out) g.fillRect(PAD + bx*SC, y, bw*SC, BH);
    y += BH + 44;
    g.font = 'bold 36px monospace';
    g.fillText(String(text), c.width/2, y);
    return c.toDataURL('image/png');
  },
};
/*═══════════════ رمز QR ═══════════════
  مُرمِّز QR قياسي (ISO/IEC 18004) بلا مكتبة خارجية — سياسة الأمن
  في البرنامج تمنع تحميل أي سكربت من خارجه. وضع البايت، مستوى
  تصحيح M (يتحمّل تلف ~15٪ من الملصق)، الإصدارات ١–١٠، واختيار
  القناع الأقل عقوبة كما ينصّ المعيار.
═════════════════════════════════════*/
const QR = (() => {
  const ECC = [-1,10,16,26,18,24,16,18,22,22,26];   /* M: بايتات التصحيح لكل كتلة */
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];   /* M: عدد الكتل */

  const raw = v => { let r = (16*v + 128)*v + 64;
    if (v >= 2){ const n = Math.floor(v/7) + 2; r -= (25*n - 10)*n - 55; if (v >= 7) r -= 36; }
    return r; };
  const dataCw = v => Math.floor(raw(v)/8) - ECC[v]*BLK[v];
  const bit = (x, i) => ((x >>> i) & 1) !== 0;

  const mul = (x, y) => { let z = 0;
    for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
    return z; };
  const divisor = d => { const r = new Array(d).fill(0); r[d-1] = 1; let root = 1;
    for (let i = 0; i < d; i++){
      for (let j = 0; j < r.length; j++){ r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j+1]; }
      root = mul(root, 2);
    }
    return r; };
  const remainder = (data, div) => { const r = div.map(() => 0);
    for (const b of data){ const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= mul(c, f)); }
    return r; };

  function encode(text){
    const bytes = [...new TextEncoder().encode(String(text))];
    let ver = 1;
    for (; ver <= 10; ver++){
      const cc = ver < 10 ? 8 : 16;
      if (4 + cc + bytes.length*8 <= dataCw(ver)*8) break;
    }
    if (ver > 10) throw new Error('qr_too_long');
    const cc = ver < 10 ? 8 : 16;

    /* البتات: الوضع، الطول، البيانات، ثم الإنهاء والحشو */
    const bb = [];
    const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bb.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, cc); bytes.forEach(b => put(b, 8));
    const cap = dataCw(ver) * 8;
    put(0, Math.min(4, cap - bb.length));
    put(0, (8 - bb.length % 8) % 8);
    for (let p = 0xEC; bb.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = [];
    for (let i = 0; i < bb.length; i += 8){ let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bb[i+j]; data.push(v); }

    /* التصحيح والتشبيك بين الكتل */
    const nb = BLK[ver], be = ECC[ver], rawCw = Math.floor(raw(ver)/8);
    const nShort = nb - rawCw % nb, shortLen = Math.floor(rawCw / nb), div = divisor(be);
    const blocks = []; let k = 0;
    for (let i = 0; i < nb; i++){
      const d = data.slice(k, k + shortLen - be + (i < nShort ? 0 : 1)); k += d.length;
      const e = remainder(d, div);
      if (i < nShort) d.push(0);
      blocks.push(d.concat(e));
    }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++)
      for (let j = 0; j < blocks.length; j++)
        if (i !== shortLen - be || j >= nShort) cw.push(blocks[j][i]);

    /* المصفوفة */
    const n = ver*4 + 17;
    const M = Array.from({length:n}, () => new Array(n).fill(false));
    const F = Array.from({length:n}, () => new Array(n).fill(false));
    const setF = (x, y, d) => { M[y][x] = d; F[y][x] = true; };

    for (let i = 0; i < n; i++){ setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (x, y) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){
        const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < n && yy >= 0 && yy < n) setF(xx, yy, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(n - 4, 3); finder(3, n - 4);

    if (ver > 1){
      const na = Math.floor(ver/7) + 2;
      const step = Math.ceil((ver*4 + 4) / (na*2 - 2)) * 2;
      const pos = [6];
      for (let p = n - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
      for (let i = 0; i < na; i++) for (let j = 0; j < na; j++){
        if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
          setF(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }

    const format = mask => {
      const d = (0 << 3) | mask;              /* M = 00 */
      let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(b, i));
      setF(8, 7, bit(b, 6)); setF(8, 8, bit(b, 7)); setF(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) setF(n - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) setF(8, n - 15 + i, bit(b, i));
      setF(8, n - 8, true);
    };
    format(0);
    if (ver >= 7){
      let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++){
        const v = bit(b, i), a = n - 11 + i % 3, c = Math.floor(i / 3);
        setF(a, c, v); setF(c, a, v);
      }
    }

    let i = 0;
    for (let right = n - 1; right >= 1; right -= 2){
      if (right === 6) right = 5;
      for (let v = 0; v < n; v++) for (let j = 0; j < 2; j++){
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? n - 1 - v : v;
        if (!F[y][x] && i < cw.length*8){ M[y][x] = bit(cw[i >>> 3], 7 - (i & 7)); i++; }
      }
    }

    const MASKS = [
      (x,y) => (x+y)%2===0, (x,y) => y%2===0, (x,y) => x%3===0, (x,y) => (x+y)%3===0,
      (x,y) => (Math.floor(x/3)+Math.floor(y/2))%2===0, (x,y) => x*y%2 + x*y%3 === 0,
      (x,y) => (x*y%2 + x*y%3)%2===0, (x,y) => ((x+y)%2 + x*y%3)%2===0 ];
    const apply = m => { for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (!F[y][x] && MASKS[m](x, y)) M[y][x] = !M[y][x]; };

    const penalty = () => {
      let p = 0, dark = 0;
      const line = get => {
        let run = 1;
        for (let a = 1; a < n; a++){
          if (get(a) === get(a-1)){ run++; if (run === 5) p += 3; else if (run > 5) p++; }
          else run = 1;
        }
        for (let a = 0; a + 10 < n; a++){
          const s = []; for (let t = 0; t < 11; t++) s.push(get(a+t) ? 1 : 0);
          const q = s.join('');
          if (q === '10111010000' || q === '00001011101') p += 40;
        }
      };
      for (let y = 0; y < n; y++) line(x => M[y][x]);
      for (let x = 0; x < n; x++) line(y => M[y][x]);
      for (let y = 0; y < n - 1; y++) for (let x = 0; x < n - 1; x++){
        const c = M[y][x];
        if (c === M[y][x+1] && c === M[y+1][x] && c === M[y+1][x+1]) p += 3;
      }
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (M[y][x]) dark++;
      const tot = n*n;
      p += (Math.ceil(Math.abs(dark*20 - tot*10) / tot) - 1) * 10;
      return p;
    };

    let best = 0, low = Infinity;
    for (let m = 0; m < 8; m++){
      apply(m); format(m);
      const s = penalty();
      if (s < low){ low = s; best = m; }
      apply(m);
    }
    apply(best); format(best);
    return M;
  }

  /* SVG مربّع بهامش هادئ ٤ وحدات — شرط القراءة الموثوقة */
  function svg(text, px){
    const M = encode(text), n = M.length, q = 4, s = n + q*2;
    let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (M[y][x]) d += `M${x+q} ${y+q}h1v1h-1z`;
    return `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"
      style="width:${px ? px + 'px' : '100%'};height:auto;aspect-ratio:1;display:block;background:#fff">
      <rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  /* صورة PNG للتنزيل والطباعة */
  function png(text, title, sub, label){
    const M = encode(text), n = M.length, q = 4, sc = 14;
    const side = (n + q*2) * sc, head = title ? 70 : 0, foot = 64 + (sub ? 34 : 0);
    const c = document.createElement('canvas');
    c.width = side; c.height = side + head + foot;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#000'; g.textAlign = 'center';
    if (title){ g.font = 'bold 38px Zain, system-ui, sans-serif'; g.fillText(String(title), side/2, 50, side - 40); }
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (M[y][x]) g.fillRect((x+q)*sc, head + (y+q)*sc, sc, sc);
    g.font = 'bold 40px monospace';
    g.fillText(String(label || text), side/2, head + side + 44);
    if (sub){ g.font = '600 24px Zain, system-ui, sans-serif'; g.fillText(String(sub), side/2, head + side + 84, side - 40); }
    return c.toDataURL('image/png');
  }

  /* باركود العيادة رابطٌ لتطبيق المراجع يحمل رمزها: يقرؤه أي ماسح
     (كاميرا الهاتف، عدسة كوكل) فيفتح التطبيق، وبعد الدخول تُفتح العيادة.
     والرمز وحده ما زال مقروءاً من داخل التطبيق للباركودات القديمة. */
  const PATIENT_URL = 'https://myteethsick.vercel.app/';
  const link = code => PATIENT_URL + '?c=' + encodeURIComponent(String(code || '').toUpperCase());

  return { encode, svg, png, link };
})();

/*═══════════════ الاتصال الحيّ ═══════════════
  السيرفر يُخبر الأجهزة لحظة تغيّر أي سجل، بدل أن تسأله كل ٤٥
  ثانية. الفرق عملي: الاستدعاء من السكرتير يصل شاشة الطبيب خلال
  ثانية بدل دقيقة.

  اتصال WebSocket مباشر ببروتوكول Realtime — بلا مكتبة خارجية.
  إن تعذّر، يبقى الفحص الدوري شبكة أمان فلا يتوقّف شيء.
═══════════════════════════════════════════*/
const Live = {
  ws:null, n:0, hb:null, retry:0, deb:null, joined:false,

  up(){ return !!(this.ws && this.ws.readyState === 1 && this.joined); },

  connect(){
    if (!Sync.on() || !navigator.onLine) return;
    if (this.ws && (this.ws.readyState === 0 || this.ws.readyState === 1)) return;
    let url;
    try {
      url = Cloud.cfg.url.replace(/^http/, 'ws')
          + '/realtime/v1/websocket?apikey=' + encodeURIComponent(Cloud.cfg.key)
          + '&vsn=1.0.0';
      this.ws = new WebSocket(url);
    } catch(_){ return this.later(); }

    this.ws.onopen = () => {
      this.retry = 0; this.joined = false;
      /* الاشتراك محصور بعيادتي — والسيرفر يطبّق سياسات RLS فوقه */
      this.send('realtime:dentalos', 'phx_join', {
        config: {
          postgres_changes: [{
            event:'*', schema:'public', table:'records',
            filter:'clinic_id=eq.' + Cloud.me.clinic_id,
          }],
        },
        access_token: Cloud.session?.token,
      });
      clearInterval(this.hb);
      this.hb = setInterval(() => this.send('phoenix', 'heartbeat', {}), 25000);
    };

    this.ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch(_){ return; }
      if (m.event === 'phx_reply' && m.topic.startsWith('realtime:')){
        this.joined = (m.payload?.status === 'ok');
        Sync.paint();
        return;
      }
      if (m.event === 'postgres_changes'){
        /* عدة تغييرات متتابعة تُجمَع في سحبة واحدة */
        clearTimeout(this.deb);
        this.deb = setTimeout(() => Sync.run(), 350);
      }
    };

    this.ws.onclose = () => { this.joined = false; Sync.paint(); this.later(); };
    this.ws.onerror = () => { try { this.ws.close(); } catch(_){} };
  },

  send(topic, event, payload){
    if (!this.ws || this.ws.readyState !== 1) return;
    this.ws.send(JSON.stringify({ topic, event, payload, ref: String(++this.n) }));
  },

  /* إعادة المحاولة تتباعد تدريجياً حتى لا ترهق شبكة ضعيفة */
  later(){
    clearInterval(this.hb);
    if (!Sync.on()) return;
    const wait = Math.min(30000, 1500 * Math.pow(2, Math.min(this.retry++, 4)));
    setTimeout(() => this.connect(), wait);
  },

  stop(){
    clearInterval(this.hb); clearTimeout(this.deb);
    this.joined = false; this.retry = 0;
    try { this.ws?.close(); } catch(_){}
    this.ws = null;
  },
};

/*═══════════════ الصور ═══════════════
  الأشعة صورة تشخيصية لا صورة ذكرى. ضغط JPEG الفاقد يولّد تشويشاً
  حول الحواف عالية التباين — وهذا بالضبط شكل التسوّس المبكر
  والشعر الشعري في الجذر. فقد يُخفي آفة أو يصنع واحدة وهمية.
  لذلك تُحفظ الأشعة بـ WebP بلا فقدان: صفر تغيير في البكسل،
  وأصغر من PNG بنحو الثلث.

  الصور السريرية العادية (وجه، ابتسامة، قبل/بعد) لا يُشخَّص عليها،
  فتُضغط ضغطاً عالي الجودة.

  ومكان الحفظ صار التخزين لا قاعدة البيانات: القاعدة ٨ جيجا
  والتخزين ١٠٠ بالسعر نفسه، وbase64 كان يضخّم كل صورة ٣٣٪.
═════════════════════════════════════*/
const Img = {
  BUCKET:'xrays',
  DIAG:['xray','pano','ceph'],          /* ما لا يجوز المساس ببكسله */

  lossless(kind){ return this.DIAG.includes(kind); },

  /* WebP بلا فقدان مدعوم في كل متصفح حديث — ومع ذلك يُتحقَّق */
  webpOK(){
    if (this._w !== undefined) return this._w;
    const c = document.createElement('canvas'); c.width = c.height = 1;
    return this._w = c.toDataURL('image/webp').startsWith('data:image/webp');
  },

  /*──── التحضير قبل الحفظ ────*/
  async prep(file, kind){
    const diag = this.lossless(kind);
    const img  = await new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => { const i = new Image();
        i.onload = () => res(i); i.onerror = rej; i.src = rd.result; };
      rd.onerror = rej; rd.readAsDataURL(file);
    });

    /* الأشعة تبقى بأبعادها الأصلية — التصغير يمحو تفاصيل دقيقة
       لا تُستردّ. والصور العادية تُصغَّر لأنها للعرض لا للتشخيص. */
    const MAX = diag ? 4000 : 1600;
    const sc  = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * sc);
    c.height = Math.round(img.height * sc);
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, c.width, c.height);

    let type, q;
    if (diag){ type = this.webpOK() ? 'image/webp' : 'image/png'; q = 1; }
    else     { type = this.webpOK() ? 'image/webp' : 'image/jpeg'; q = 0.88; }

    const blob = await new Promise(r => c.toBlob(r, type, q));
    return { blob, type, w:c.width, h:c.height,
             orig:file.size, diag,
             ext: type === 'image/webp' ? 'webp' : type === 'image/png' ? 'png' : 'jpg' };
  },

  /*──── مصغّرة العرض ────
    الأشعة تُحفظ بلا فقدان فتبلغ ملايين البايتات. تحميلها كاملة
    لشبكة مصغّرات يستهلك عشرات الميغابايتات لفتح شاشة واحدة —
    ويُحسب من حصّة النقل. فتُحفظ معها صورة صغيرة مضغوطة تُعرض
    في الشبكة، ولا تُحمَّل الأصلية إلا عند فتحها. */
  async thumb(blob){
    try {
      const url = URL.createObjectURL(blob);
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i); i.onerror = rej; i.src = url;
      });
      const M = 320, sc = Math.min(1, M / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const g = c.getContext('2d');
      g.imageSmoothingQuality = 'medium';
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      return c.toDataURL(this.webpOK() ? 'image/webp' : 'image/jpeg', 0.72);
    } catch(_){ return null; }   /* غيابها لا يمنع الحفظ */
  },

  /*──── الرفع ────*/
  path(id, ext){ return `${Cloud.me.clinic_id}/${id}.${ext}`; },

  async upload(id, blob, type, ext){
    if (!Sync.on()) throw new Error('offline');
    const r = await fetch(
      `${Cloud.cfg.url}/storage/v1/object/${this.BUCKET}/${this.path(id, ext)}`, {
      method:'POST',
      headers:{ apikey:Cloud.cfg.key,
                Authorization:'Bearer ' + Cloud.session.token,
                'Content-Type':type, 'x-upsert':'true' },
      body: blob,
    });
    if (!r.ok){
      const t = await r.text().catch(()=> '');
      throw new Error(t || ('upload ' + r.status));
    }
    return this.path(id, ext);
  },

  /*──── العرض ────
    الحاوية خاصّة، فالعرض برابط موقّع قصير العمر لا برابط مكشوف.
    الروابط تُخزَّن مؤقتاً في الذاكرة فلا يُطلب توقيع لكل فتح. */
  _url:{}, err:null,
  async view(f){
    if (f.data) return f.data;                    /* صورة قديمة أو محلية */
    if (!f.path) return null;
    if (!Cloud.session?.token){ this.err = 'no_session'; return null; }
    const hit = this._url[f.path];
    if (hit && hit.exp > Date.now()) return hit.u;
    const r = await fetch(
      `${Cloud.cfg.url}/storage/v1/object/sign/${this.BUCKET}/${f.path}`, {
      method:'POST',
      headers:{ apikey:Cloud.cfg.key,
                Authorization:'Bearer ' + Cloud.session.token,
                'Content-Type':'application/json' },
      body: JSON.stringify({ expiresIn: 3600 }),
    });
    if (!r.ok){
      /* السبب يُحفظ ليُعرض للمستخدم: تخمين سبب فشل الصورة
         يضيّع وقتاً أطول من إظهاره. */
      this.err = `${r.status} ${(await r.text().catch(()=>'')).slice(0,120)}`;
      return f.data || null;
    }
    const d = await r.json().catch(()=>null);
    if (!d?.signedURL){ this.err = 'no_signed_url'; return f.data || null; }
    this.err = null;
    /* الرابط يعود أحياناً كاملاً وأحياناً نسبياً — يُقبل الشكلان */
    const u = /^https?:/.test(d.signedURL) ? d.signedURL
            : Cloud.cfg.url + '/storage/v1' + d.signedURL;
    this._url[f.path] = { u, exp: Date.now() + 3300000 };
    return u;
  },

  async del(f){
    if (!f?.path || !Sync.on()) return;
    try {
      await fetch(`${Cloud.cfg.url}/storage/v1/object/${this.BUCKET}/${f.path}`, {
        method:'DELETE',
        headers:{ apikey:Cloud.cfg.key, Authorization:'Bearer ' + Cloud.session.token },
      });
    } catch(_){ /* بقاء ملف يتيم أهون من فشل الحذف */ }
    delete this._url[f.path];
  },

  /*──── طابور الرفع ────
    الصورة تُلتقط بلا إنترنت أحياناً. تُحفظ في الجهاز كما هي،
    وتُرفع أول ما يعود الاتصال، ثم تُمحى نسختها المحلية. */
  async flush(){
    if (!Sync.on() || !navigator.onLine || this._busy) return 0;
    this._busy = true;
    let done = 0;
    try {
      const pend = (await DB.all('files')).filter(f => f.data && !f.path && f.blobType);
      for (const f of pend){
        try {
          const blob = await (await fetch(f.data)).blob();
          f.path = await this.upload(f.id, blob, f.blobType, f.ext || 'webp');
          if (!f.thumb) f.thumb = await this.thumb(blob);
          delete f.data;                 /* الحجم الكبير يغادر القاعدة */
          await DB.put('files', f);
          done++;
        } catch(_){ break; }             /* الشبكة متعثّرة: نكمل لاحقاً */
      }
    } finally { this._busy = false; }
    if (done) Sync.kick();
    return done;
  },

  async pending(){
    try { return (await DB.all('files')).filter(f => f.data && !f.path && f.blobType).length; }
    catch(_){ return 0; }
  },

  /*──── نقل الصور القديمة ────
    ما حُفظ سابقاً داخل القاعدة يُنقل إلى التخزين. البكسل لا يُمسّ:
    تُقرأ الصورة كما هي وتُرفع كما هي، بلا إعادة ضغط. */
  async migrate(onStep){
    if (!Sync.on()) throw new Error(T('syncOff'));
    const old = (await DB.all('files')).filter(f => f.data && !f.path);
    let n = 0;
    for (const f of old){
      try {
        const blob = await (await fetch(f.data)).blob();
        const type = blob.type || 'image/jpeg';
        const ext  = type.includes('webp') ? 'webp' : type.includes('png') ? 'png' : 'jpg';
        f.path = await this.upload(f.id, blob, type, ext);
        f.ext = ext; f.bytes = blob.size;
        if (!f.thumb) f.thumb = await this.thumb(blob);
        delete f.data;
        await DB.put('files', f);
        n++;
        onStep?.(n, old.length);
      } catch(_){ break; }
    }
    return { moved:n, total:old.length };
  },
};

/*═══════════════ المزامنة ═══════════════
  البرنامج يكتب في الجهاز أولاً ودائماً — لا انتظار للشبكة ولا
  توقّف عند انقطاعها. كل تعديل يُقيَّد في صندوق صادر، ويُرفع متى
  توفّر الاتصال. والوارد يُسحب بالرقم المتسلسل، فلا يُنقل إلا
  الجديد.

  التعارض: الأحدث يفوز (بحسب وقت التعديل في الجهاز). اختير هذا
  لأن سجلاً واحداً نادراً ما يُحرَّر من جهازين معاً في عيادة، وأي
  حسم أعقد يخفي على المستخدم أي نسخة بقيت.
═════════════════════════════════════════*/
const SYNC_STORES = ['patients','visits','works','payments','rx',
                     'files','tooth','appts','settings','suggest'];

/* الصيدلي يرى الوصفات والحساسيات فقط — مفروض في القاعدة أيضاً */
const ROLE_STORES = {
  pharmacy: { pull:['rx','patients'], push:['rx'] },
};

const Sync = {
  busy:false, quiet:false, last:0, pending:0, err:null, dirty:false, imgWait:0,
  again:false, fails:0, _kick:null, _retry:null,

  /* فرق ساعة هذا الجهاز عن السيرفر — يُقاس من كل ردّ */
  skew:0,
  now(){ return Date.now() + this.skew; },

  scope(){
    const r = ROLE_STORES[S.role];
    return { pull: r ? r.pull : SYNC_STORES, push: r ? r.push : SYNC_STORES };
  },

  /* اشتراك منتهٍ: لا مزامنة ولا بثّ — السيرفر يرفضهما أصلاً،
     ومحاولتهما كل ثوانٍ استهلاك بلا فائدة. */
  on(){ return Cloud.ready() && !!Cloud.session && !!Cloud.me?.clinic_id && !Sub.expired(); },

  revKey(){ return 'd_rev_' + (Cloud.me?.clinic_id || 'x'); },
  rev(){ return Number(localStorage.getItem(this.revKey()) || 0); },
  setRev(v){ try { localStorage.setItem(this.revKey(), String(v)); } catch(_){} },

  /*──── صندوق الصادر ────*/
  async queue(store, rid, deleted){
    if (this.quiet) return;                       /* الوارد لا يُعاد رفعه */
    if (!SYNC_STORES.includes(store)) return;
    if (store === 'settings' && rid === 'clinics') return;  /* دليل محلي */
    try {
      await DB.put('outbox', { id: store + '|' + rid, store, rid,
                               at: this.now(), deleted: !!deleted });
      this.pending++;
      this.paint();
      this.kick();
    } catch(_){ /* الصندوق لا يعطّل الحفظ */ }
  },

  /* الدفع يبدأ من الكتابة نفسها لا من مؤقّت.
     البثّ الحيّ يخبرني بتغييرات الآخرين، ولا يفعل شيئاً
     لتغييراتي أنا — فهذه هي التي تُطلقها.
     تأخير قصير يجمع الكتابات المتتابعة (حفظ خطة = عدة سجلات)
     في رفعة واحدة بدل رفعة لكل سجل. */
  kick(){
    clearTimeout(this._kick);
    this._kick = setTimeout(() => this.run(), 700);
  },

  async count(){
    try { this.pending = (await DB.all('outbox')).length; } catch(_){ this.pending = 0; }
    this.imgWait = await Img.pending();
    return this.pending;
  },

  /*──── الرفع ────*/
  async push(){
    const box = await DB.all('outbox');
    if (!box.length) return 0;
    const allow = this.scope().push;
    const items = box.filter(x => allow.includes(x.store));

    let sent = 0;
    /* الدفعة تُقاس بالحجم لا بالعدد: صورة أشعة واحدة قد تعادل
       ألف سجل نصّي، و٢٥ صورة في طلب واحد تتجاوز حدّ السيرفر
       فتفشل الدفعة كلها ويعلق العمل. */
    const CAP = 900 * 1024;
    let batch = [], done = [], size = 0;

    const flush = async () => {
      if (!batch.length) return;
      await Cloud.call('/rest/v1/rpc/sync_push', { method:'POST', body:{ changes:batch } });
      for (const x of done) await DB.del('outbox', x.id);
      sent += batch.length;
      batch = []; done = []; size = 0;
    };

    for (const x of items){
      const doc = x.deleted ? null : await DB.get(x.store, x.rid);
      if (!doc && !x.deleted){ await DB.del('outbox', x.id); continue; }
      /* صورة التُقطت بلا إنترنت وما زالت بكسلاتها داخل السجل:
         لا تُرسل حتى تُرفع إلى التخزين أولاً. لو أُرسلت لدخلت
         ملايين البايتات جدول السجلات وسُحبت إلى كل جهاز، ولربما
         تجاوزت حدّ الطلب فعلق الصادر كله. تبقى في الصندوق
         وتُرسل خفيفة بعد Img.flush. */
      if (x.store === 'files' && doc && doc.data && !doc.path && doc.blobType) continue;
      /* بعد الدمج يصير ختم السجل أحدث من وقت كتابتي، فيُرسل
         الأحدث وإلا رفض السيرفر المدموج باعتباره قديماً. */
      const ch = { store:x.store, id:x.rid, doc: doc || {},
                   updated_at: Math.max(Number(x.at||0), Number(doc?._up || 0)),
                   deleted: !!x.deleted || !doc };
      let len = 200;
      try { len = JSON.stringify(ch).length; } catch(_){}
      /* سجل أكبر من السقف وحده يُرسل منفرداً */
      if (batch.length && size + len > CAP) await flush();
      batch.push(ch); done.push(x); size += len;
      if (batch.length >= 50) await flush();
    }
    await flush();
    /* ما لا يخصّ دوري يُنظَّف حتى لا يتراكم بلا فائدة */
    for (const x of box) if (!allow.includes(x.store)) await DB.del('outbox', x.id);
    return sent;
  },

  /*──── السحب ────*/
  async pull(){
    const allow = this.scope().pull;
    let since = this.rev(), got = 0, guard = 0;

    while (guard++ < 200){
      const rows = await Cloud.call('/rest/v1/rpc/sync_pull',
        { method:'POST', body:{ since, lim:120 } });
      if (!Array.isArray(rows) || !rows.length) break;

      this.quiet = true;                       /* الوارد لا يدخل الصادر */
      try {
        for (const r of rows){
          if (r.rev > since) since = r.rev;
          if (!allow.includes(r.store)) continue;
          if (r.deleted){ await DB.del(r.store, r.id); got++; continue; }
          const mine = await DB.get(r.store, r.id);
          const mineAt  = Number(mine?._up || 0);
          const theirAt = Number(r.updated_at || 0);
          let doc = r.doc || {};

          if (mine && mineAt > theirAt){
            /* نسختي أحدث — لكن قد يحمل الوارد حقلاً أجدّ من حقلي،
               فأدمجه بدل أن أهمل الوارد كلّه. */
            const merged = Sync.merge(r.store, mine, doc, mineAt, theirAt);
            if (!merged) continue;
            doc = merged;
          } else if (mine){
            /* نسختهم أحدث — أحتفظ بحقولي التي خُتمت بعد ختمهم */
            doc = Sync.merge(r.store, doc, mine, theirAt, mineAt) || doc;
          }

          doc.id = r.id;
          doc._up = Math.max(mineAt, theirAt);
          await DB.put(r.store, doc);
          got++;
        }
      } finally { this.quiet = false; }

      this.setRev(since);
      if (rows.length < 120) break;
    }
    return got;
  },

  /*──── حجوزات تطبيق المراجعين ────
    المراجع يحجز من تطبيقه، والحجز يصل هنا بالشكل نفسه الذي
    تقرأه شاشة «الحجوزات» — فلا تحتاج تلك الشاشة أي تعديل.
    الصيدلي لا يعنيه هذا، فيُتخطّى. */
  bkKey(){ return 'd_bk_' + (Cloud.me?.clinic_id || 'x'); },

  /* قرار العيادة يعود إلى تطبيق المراجع، وإلا بقي حجزه
     «قيد المراجعة» إلى الأبد. */
  async bookStatus(id, status, code, ref){
    if (!this.on()) return;
    try {
      const body = { status };
      if (code) body.code = String(code);
      if (ref)  body.patient_ref = String(ref);
      await Cloud.call('/rest/v1/bookings?id=eq.' + encodeURIComponent(id),
        { method:'PATCH', body });
    } catch(_){ /* يُعاد في الدورة التالية عبر إعادة السحب */ }
  },

  async bookings(){
    if (S.role === 'pharmacy') return 0;
    const since = localStorage.getItem(this.bkKey()) || '1970-01-01T00:00:00Z';
    const rows = await Cloud.call('/rest/v1/rpc/book_pull',
      { method:'POST', body:{ since } });
    if (!Array.isArray(rows) || !rows.length) return 0;

    let mark = since, fresh = 0;
    this.quiet = true;
    try {
      for (const r of rows){
        if (r.updated_at > mark) mark = r.updated_at;
        const doc = r.doc || {};
        /* إجابات الاستمارة تصل بأشكال مختلفة حسب إصدار تطبيق
           المراجع — تُوحَّد هنا مرة واحدة فتظهر وتخرج تنبيهاتها. */
        if (doc.mh) doc.mh = MH.norm(doc.mh);
        const old = await DB.get('bookings', r.id);

        /* ألغى المراجع حجزه — الأثر يختلف بحسب ما وصل إليه الحجز */
        if (r.status === 'cancelled'){
          if (old) await this.cancelBooking(old, doc);
          continue;
        }

        /* المعرّف من السيرفر هو المرجع، والعيادة المحلية تُثبَّت
           حتى يظهر الحجز في قائمة هذه العيادة */
        const b = { ...doc, id:r.id, cid:CFG.data.cid, srv:true,
                    st: r.status === 'pending' ? 'new'
                      : r.status === 'accepted' ? 'accepted' : 'declined' };
        if (old && old.st !== 'new' && b.st === 'new') continue;  /* لا يعود المحسوم */
        if (!old && b.st === 'new') fresh++;
        await DB.put('bookings', b);
      }
    } finally { this.quiet = false; }

    try { localStorage.setItem(this.bkKey(), mark); } catch(_){}
    /* ما وصل من جهاز آخر قد يحمل باركوداً مكرّراً — يُصلَح هنا */
    await Ops.fixBarcodes();
    /* التنبيه لا ينتظر إعادة رسم الشاشة: الجرس وعدّاد الحجوزات
       يتحدّثان فوراً، فيرى السكرتير والطبيب الحجز الجديد وهما في
       أي قسم كان. */
    try { await Notify.refresh(fresh); } catch(_){}
    return rows.length;
  },

  /*──── أثر إلغاء المراجع ────
    ١) لم يُقبل بعد: يُحذف من قائمة السكرتير كأنه لم يكن.
    ٢) قُبل وموعده لم يمضِ: جلسته تُعلَّم «ألغى المراجع» بدل زر
       الاستدعاء — لا تُحذف، لأن السكرتير قد فتح لها ملفاً.
    ٣) قُبل ومضى موعده: لا يُمسّ شيء. ما جرى في العيادة تاريخ. */
  async cancelBooking(old, doc){
    if (old.st === 'new' || !old.st){
      await DB.del('bookings', old.id);
      toast(T('bkRemoved'), 'w');
      return;
    }
    if (old.st !== 'accepted') return;

    const day = doc.day || old.day;
    if (day && day < today()) return;      /* مضى الموعد */

    old.st = 'cancelled';
    await DB.put('bookings', old);

    /* الجلسة المفتوحة لهذا المراجع تُعلَّم ملغاة */
    if (old.pid){
      const vs = (await DB.by('visits','pid',old.pid))
        .filter(v => v.st !== 'done' && v.date >= today())
        .sort((a,b) => (b.at||0) - (a.at||0));
      const v = vs[0];
      if (v && v.qstate !== 'cancelled'){
        v.qstate = 'cancelled';
        v._qAt = this.now();          /* ختم الحقل — لا يُدهس بالمزامنة */
        await DB.put('visits', v);
      }
    }
    toast(T('bkCancelled'), 'w');
  },

  /*──── دورة كاملة ────*/
  async run(manual){
    if (!this.on()) return;
    /* كتابة وقعت أثناء دورة جارية: تُعاد الدورة بعدها بدل إهمالها */
    if (this.busy){ this.again = true; return; }
    if (!navigator.onLine){ this.err = T('syncOff'); this.paint(); return; }
    this.busy = true; this.err = null; this.paint();
    try {
      /* التذكرة تُجدَّد قبل انتهائها بدقيقة حتى لا تفشل الدورة */
      if (Cloud.session && Cloud.session.exp - Date.now() < 60000) await Cloud.refresh();
      /* السحب قبل الرفع — وهذا شرط لصحّة الدمج:
         لو رفعتُ أولاً لوصلت نسختي إلى السيرفر قبل أن أرى تعديل
         زميلي، فيُدهس عمله. وبالسحب أولاً يُدمج عمله في نسختي
         ثم أرفع المدموج، فلا يضيع طرف. */
      const down = await this.pull();
      /* صور التُقطت بلا إنترنت تُرفع إلى التخزين قبل الدفع،
         فيصل سجلّها إلى الزملاء في الدورة نفسها خفيفاً ومعه مساره.
         Img.flush يبتلع أخطاء الشبكة ولا يوقف الدورة. */
      await Img.flush();
      const up   = await this.push();
      const bk   = await this.bookings();
      this.last = Date.now();
      this.fails = 0;
      try { localStorage.setItem('d_synced', String(this.last)); } catch(_){}
      await this.count();
      if (manual) toast(`${T('syncDone')} · ${up} ${T('pushed')} · ${down} ${T('pulled')}`, 's');
      if (down || bk) this.redraw();
    } catch (e) {
      this.err = String(e.message || e);
      /* السيرفر لم يعد يعدّني عضواً فعّالاً: غالباً انتهى الاشتراك أو
         أُوقفت العيادة. يُسأل عن الحالة بدل التكرار كل ثوانٍ. */
      if (/not_a_clinic_member/.test(this.err)){
        Sub.recheck();
        clearTimeout(this._retry);
        this._retry = setTimeout(() => this.run(), 300000);
        return;
      }
      if (manual) toast(T('syncFail') + ' — ' + this.err, 'e');
      /* الفشل يعيد المحاولة متباعداً — لا ينتظر المؤقّت البطيء،
         ولا يكرّر بلا توقّف على شبكة متعثّرة. */
      this.fails = (this.fails || 0) + 1;
      clearTimeout(this._retry);
      this._retry = setTimeout(() => this.run(),
        Math.min(30000, 1000 * Math.pow(2, Math.min(this.fails, 5))));
    } finally {
      this.busy = false; this.paint();
      if (this.again){ this.again = false; this.kick(); }
    }
  },

  /*──── دمج الحقول المشتركة ────────
    الزيارة سجل يحرّره دوران: السكرتير يحرّك حالة الطابور،
    والطبيب يكتب ملخص الجلسة. لو حُسم التعارض على مستوى السجل
    لمحا أحدهما عمل الآخر — وهذا يقع فعلاً حين ينقطع النت
    فيعمل الجهازان معاً.

    فلكل حقل مشترك ختمه الخاص، ويفوز صاحب الختم الأحدث وحده.
    base هي النسخة الفائزة، وother النسخة الأخرى.
    تُرجع null إذا لم يكن في other ما يستحق النقل. */
  FIELDS:{ visits:[['done','_doneAt'], ['qstate','_qAt']] },

  merge(store, base, other, baseAt, otherAt){
    const map = this.FIELDS[store];
    if (!map) return null;
    let took = false;
    const out = { ...base };
    for (const [field, stamp] of map){
      if (other[field] === undefined || other[field] === base[field]) continue;
      const bs = base[stamp], os = other[stamp];
      let take;
      if (bs !== undefined && os !== undefined) take = Number(os) > Number(bs);
      /* ختم صريح في جهة واحدة يعني تعديلاً متعمّداً على الحقل،
         والجهة الأخرى تحمل قيمة موروثة من نسخة قديمة — فيفوز
         الختم الصريح ولو كان السجل ككل أقدم. */
      else if (os !== undefined) take = true;
      else if (bs !== undefined) take = false;
      else take = Number(otherAt || 0) > Number(baseAt || 0);
      const b = 0, o = take ? 1 : 0;
      if (o > b){
        out[field] = other[field];
        if (other[stamp] !== undefined) out[stamp] = other[stamp];
        took = true;
      }
    }
    return took ? out : null;
  },

  /*──── إعادة رسم آمنة ────────
    الوارد يظهر فوراً على الشاشة الرئيسية، لكنه لا يقاطع عملاً
    جارياً: صفحة مفتوحة أو حقل يكتب فيه الطبيب يُؤجَّل الرسم
    حتى يفرغ، فلا يُمحى نصّ تحت يده. */
  redraw(){
    const typing = document.activeElement &&
      /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    const inPage = Nav.stack.length > 0;
    if (typing || inPage){ this.dirty = true; return; }
    this.dirty = false;
    App.draw();
  },

  /* عند العودة للشاشة الرئيسية يُطبَّق ما تأجّل */
  flush(){ if (this.dirty) this.redraw(); },

  /*──── المؤشّر في الشريط العلوي ────*/
  paint(){
    const el = $('#syncdot'); if (!el) return;
    if (!this.on()){ el.classList.add('hide'); return; }
    el.classList.remove('hide');
    const st = this.busy ? 'busy'
             : (!navigator.onLine || this.err) ? 'off'
             : (this.pending || this.imgWait) ? 'wait' : 'ok';
    el.className = 'syncdot ' + st + (Live.up() ? ' live' : '');
    el.title = this.busy ? T('syncing')
             : !navigator.onLine ? T('syncOff')
             : this.err ? this.err
             : this.pending ? `${this.pending} ${T('pendingN')}`
             : this.imgWait ? `${this.imgWait} ${T('pendingUp')}`
             : `${T('syncClean')} · ${Live.up() ? T('liveOn') : T('liveOff')}`;
  },

  init(){
    this.last = Number(localStorage.getItem('d_synced') || 0);
    this.count();
    /* الرفع فور عودة الشبكة — لا ينتظر المؤقّت */
    window.addEventListener('online',  () => { Live.connect(); this.run(); });
    window.addEventListener('offline', () => this.paint());
    /* شبكة أمان فقط: مع الاتصال الحيّ يكفي فحص كل دقيقتين،
       وبدونه يعود الفحص كل ٢٠ ثانية. */
    setInterval(() => {
      if (!this.on()) return;
      /* شبكة أمان فقط — الدفع الحقيقي يقع لحظة الكتابة */
      const gap = Live.up() ? 30000 : 12000;
      if (Date.now() - this.last >= gap) return this.run();

      /* الحجوزات في جدول لا يشمله الاشتراك الحيّ، فكان الحجز
         ينتظر الدورة الكاملة. سؤالها وحدها كل عشرين ثانية طلب
         واحد خفيف يجعل التنبيه شبه فوري. */
      if (this.busy || !navigator.onLine) return;
      if (S.role !== 'doctor' && S.role !== 'secretary') return;
      if (Date.now() - (this._bkAt || 0) < 20000) return;
      this._bkAt = Date.now();
      this.bookings().then(n => { if (n) this.redraw(); }).catch(()=>{});
    }, 5000);
  },
};

  async call(path, { method='GET', body=null, auth=true, raw=false } = {}){
    if (!this.ready()) throw new Error(T('cloudNotSet'));
    const h = { 'apikey': this.cfg.key, 'Content-Type': 'application/json' };
    h['Authorization'] = 'Bearer ' +
      ((auth && this.session?.token) ? this.session.token : this.cfg.key);

    let r;
    try {
      r = await fetch(this.cfg.url + path, {
        method, headers:h, body: body ? JSON.stringify(body) : undefined,
      });
    } catch(_){ const e = new Error(T('cloudFail')); e.net = true; throw e; }

    /* الساعة المشتركة: كل ردّ يحمل وقت السيرفر، فتُقاس فروق
       ساعات الأجهزة عليه ويُحسم التعارض بمرجع واحد. */
    const sd = r.headers.get('date');
    if (sd){
      const t = Date.parse(sd);
      if (t && typeof Sync !== 'undefined') Sync.skew = t - Date.now();
    }

    const txt = await r.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch(_){ data = txt; }
    if (raw) return { ok:r.ok, status:r.status, data };
    if (!r.ok){
      const msg = data?.error_description || data?.msg || data?.error || data?.message || r.status;
      throw new Error(String(msg));
    }
    return data;
  },

      refresh: d.refresh_token,
      exp: Date.now() + (Number(d.expires_in||3600) * 1000),

      if (!e?.net) this.saveSess(null);

  },

    if (!r.ok || r.data?.error){

      if (e === 'email_taken')    throw new Error(T('emailTaken'));

      if (e === 'rate_limited')   throw new Error(T('regBusy'));

  async staffFn(body){

  /* الشعار يُصغَّر قبل رفعه: ٢٥٦ بكسل تكفي لكل مكان يظهر فيه،
     ويبقى حجمه عشرات الكيلوبايتات لا ميغابايتات في القاعدة. */
  async shrink(file, max){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url;
      });
      const M = max || 256, sc = Math.min(1, M / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc));
      c.height = Math.max(1, Math.round(img.height * sc));
      const g = c.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(img, 0, 0, c.width, c.height);
      let out = c.toDataURL('image/webp', .9);
      if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
      if (out.length > 380000) out = c.toDataURL('image/jpeg', .8);
      if (out.length > 380000) throw new Error(T('logoBig'));
      return out;
    } finally { URL.revokeObjectURL(url); }
  },
};

    this._me = v;
  },
};

/*──── نطاق الرؤية ────
  حين يربط طبيبٌ زميلاً به أو يفكّ الربط، يتغيّر ما يجوز لهذا الجهاز
  رؤيته. السحب بالرقم المتسلسل لا يعيد ما فات، ولا يمحو ما لم يعد
  مسموحاً. فعند تغيّر النطاق: يُرفع ما ينتظر أولاً، ثم تُمحى السجلات
  السريرية المحلية ويُسحب كل شيء من جديد بالنطاق الجديد. */
const Scope = {
  key(){ return 'd_scope_' + (Cloud.me?.clinic_id || 'x'); },
  CLINICAL:['patients','visits','works','payments','files','tooth','rx','appts'],

  async check(me){
    if (!me || !me.scope || !Sync.on()) return;
    const old = localStorage.getItem(this.key());
    if (old === me.scope) return;
    if (old){
      try {
        if ((await DB.all('outbox')).length) await Sync.push();
        if (await Img.pending()) await Img.flush();
        if ((await DB.all('outbox')).length || await Img.pending()) return;
      } catch(_){ return; }        /* بلا رفع ناجح لا يُمحى شيء — يُعاد لاحقاً */
      toast(T('scopeChanged'), 'w');
      Sync.quiet = true;
      try {
        for (const st of this.CLINICAL)
          for (const r of await DB.all(st)) await DB.del(st, r.id);
      } finally { Sync.quiet = false; }
      /* الحذف المحلي ليس حذفاً على السيرفر — يُفرَّغ الصادر منه */
      for (const x of await DB.all('outbox')) await DB.del('outbox', x.id);
      Sync.setRev(0);
    }
    try { localStorage.setItem(this.key(), me.scope); } catch(_){}
  },

  /* يُسأل السيرفر عن النطاق عند العودة للتطبيق، لا مع كل مزامنة */
  _at:0,
  async recheck(){
    if (!Sync.on() || !navigator.onLine || Date.now() - this._at < 600000) return;
    this._at = Date.now();
    try {
      const me = await Cloud.whoami();
      if (me && me.role === S.role){
        Brand.save(me); Sub.save(me); Sub.tick();
        if (Sub.expired()) return;
        await this.check(me); Sync.kick();
      }
    } catch(_){}
  },
};

/*═══════════════ الاشتراك ═══════════════
  موعد الدفع والانتهاء يقرّرهما السيرفر (whoami.sub) ويفرضهما على
  القاعدة نفسها: عند الانتهاء لا قراءة ولا كتابة ولا صور. هنا العرض:
  عدّاد في الشريط العلوي، تنبيه وومض في آخر ١٠ أيام، وشاشة إيقاف.
  الوقت يُقاس بساعة السيرفر (فرقها محفوظ مع الحالة)، فتغيير ساعة
  الجهاز لا يمدّ الاشتراك.
═════════════════════════════════════════*/
const Sub = {
  PHONE:'07807632797', WA:'9647807632797', WARN:10,
  d:null, _t:null, _chk:0,

  key(){ return 'd_sub_' + (Cloud.me?.clinic_id || S.user?.clinic_id || 'x'); },
  save(me){
    if (!me || !me.sub) return;
    const srv = Date.parse(me.sub.now);
    this.d = { ...me.sub, skew: isNaN(srv) ? 0 : srv - Date.now() };
    this._chk = Date.now();
    try { localStorage.setItem(this.key(), JSON.stringify(this.d)); } catch(_){}
  },
  load(){
    if (this.d) return this.d;
    try { this.d = JSON.parse(localStorage.getItem(this.key())) || null; } catch(_){ this.d = null; }
    return this.d;
  },
  now(){ return Date.now() + (this.load()?.skew || 0); },
  end(){
    const d = this.load(); if (!d || !d.paid_until) return 0;
    return Math.max(Date.parse(d.paid_until) || 0, Date.parse(d.grace_until || '') || 0);
  },
  staff(){ return !!S.role && S.role !== 'patient'; },
  limited(){ return this.staff() && !!this.end(); },
  left(){ const e = this.end(); return e ? e - this.now() : Infinity; },
  suspended(){ return this.staff() && this.load()?.active === false; },
  expired(){ return (this.limited() && this.left() <= 0) || this.suspended(); },
  inGrace(){ const d = this.load(); return !!d?.grace_until && this.now() >= Date.parse(d.paid_until); },
  days(){ return Math.max(0, Math.ceil(this.left() / 86400000)); },
  /* الانتهاء عند ٠٠:٠٠ من اليوم التالي — فيوم الاستحقاق هو آخر يوم عمل */
  due(){ const e = this.end(); return e ? new Date(e - 1000) : null; },
  fmt(d){
    if (!d) return '—';
    try { return d.toLocaleDateString('en-GB', { timeZone:'Asia/Baghdad', day:'2-digit', month:'2-digit', year:'numeric' }); }
    catch(_){ return d.toISOString().slice(0, 10); }
  },

  /*──── الشريط العلوي ────*/
  paint(){
    const el = $('#subchip'); if (!el) return;
    if (!this.limited() || this.expired()){ el.classList.add('hide'); return; }
    const n = this.days(), g = this.inGrace();
    el.classList.remove('hide');
    el.classList.toggle('warn', n <= this.WARN);
    el.classList.toggle('grace', g);
    el.innerHTML = `<span class="sc-ic">${g ? '⏳' : '📅'}</span>
      <span class="sc-n">${n <= 1 ? T('subLastDay') : `${n} ${T('subDays')}`}</span>
      <span class="sc-d">${this.fmt(this.due())}</span>`;
    el.title = `${g ? T('subGrace') : T('subDue')}: ${this.fmt(this.due())}`;
  },

  start(){
    this.d = null; this.load();
    clearInterval(this._t);
    this._t = setInterval(() => this.tick(), 60000);
    this.tick();
  },
  /* كل دقيقة: العدّاد. وكل ١٠ دقائق سؤال خفيف للسيرفر، فيظهر هنا
     ما يغيّره المدير من اللوحة (الباقة، شهري/سنوي، تمديد، دفعة). */
  tick(){
    this.paint();
    if (this.expired()) this.lock(); else this.warn();
    if (this.staff() && Date.now() - this._chk > 600000) this.recheck();
  },
  stop(){ clearInterval(this._t); this._t = null; this.unlock(); this.d = null; },

  /* تنبيه مرة واحدة يومياً في آخر ١٠ أيام — والومض مستمر في الشريط */
  warn(){
    if (!this.limited() || this.days() > this.WARN) return;
    const day = new Date(this.now()).toISOString().slice(0, 10);
    const k = 'd_subwarn_' + (Cloud.me?.clinic_id || 'x') + '_' + day;
    try { if (localStorage.getItem(k)) return; localStorage.setItem(k, '1'); } catch(_){ return; }
    toast(`${this.inGrace() ? T('subGrace') + ' — ' : T('subWarn') + ' '}${this.days()} ${T('subDays')} · ${this.fmt(this.due())}`, 'w');
  },

  /*──── شاشة الإيقاف ────*/
  lock(){
    if ($('#sublock')) return;
    Live.stop();
    clearTimeout(Sync._retry);
    const sus = this.suspended();
    const div = document.createElement('div');
    div.id = 'sublock'; div.className = 'sublock';
    div.innerHTML = `<div class="sl-card">
        <div class="sl-ic">${sus ? '⏸' : '⌛'}</div>
        <div class="dsp sl-t">${T(sus ? 'subSuspended' : 'subEnded')}</div>
        <div class="sl-s">${T(sus ? 'subSuspendedHint' : 'subEndedHint')}</div>
        <div class="sl-ph"><span class="lbl">${T('subSupport')}</span>
          <a class="sl-num" dir="ltr" href="tel:${this.PHONE}">${this.PHONE}</a></div>
        <div class="row" style="gap:9px">
          <a class="btn gh gr" href="tel:${this.PHONE}">📞 ${T('subCall')}</a>
          <a class="btn gr" href="https://wa.me/${this.WA}" target="_blank" rel="noopener">💬 ${T('subWa')}</a>
        </div>
        <button class="btn gh w mt2" id="sl-chk" onclick="Sub.recheck(true)">↻ ${T('subCheck')}</button>
        <div class="tiny mt2">${T('subDataSafe')}</div>
        <button class="lnk mt2" onclick="Sub.unlock();Auth.out()">⏻ ${T('logout') || 'خروج'}</button>
      </div>`;
    document.body.appendChild(div);
  },
  unlock(){ $('#sublock')?.remove(); },

  /* يُسأل السيرفر: هل جُدّد الاشتراك؟ — يدوياً من الشاشة، أو عند
     العودة للتطبيق مرة كل دقيقتين على الأكثر. */
  async recheck(manual){
    if (!Cloud.session || !navigator.onLine){ if (manual) toast(T('syncOff'), 'w'); return; }
    if (!manual && Date.now() - this._chk < 120000) return;
    this._chk = Date.now();
    const b = $('#sl-chk'); if (b) b.disabled = true;
    try {
      if (Cloud.session.exp - Date.now() < 60000) await Cloud.refresh();
      const me = await Cloud.whoami();
      if (!me || me.role !== S.role) return;
      this.save(me);
      if (!this.expired()){
        const was = !!$('#sublock');
        this.unlock(); this.paint(); this.warn();
        if (was){
          Brand.save(me);
          await Scope.check(me);
          if (Sync.on()){ Sync.run(); Live.connect(); }
          toast(T('subBack'), 's');
        }
      } else {
        this.lock();
        if (manual) toast(T('subStill'), 'e');
      }
    } catch(_){ if (manual) toast(T('cloudFail'), 'e'); }
    finally { if (b) b.disabled = false; }
  },

  info(){
    const d = this.load() || {};
    const row = (k, v) => `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--edge)">
      <span class="lbl">${k}</span><b>${v}</b></div>`;
    UI.sheet(`<div class="h2">${T('subTitle')}</div>
      <div class="card flat mt2">
        ${row(T('subPlan'), esc(d.plan_name || '—'))}
        ${row(T('subBilling'), d.billing === 'monthly' ? T('subMonthly') : T('subAnnual'))}
        ${row(this.inGrace() ? T('subGrace') : T('subDue'), this.fmt(this.due()))}
        ${row(T('subLeft'), this.days() <= 1 ? T('subLastDay') : `${this.days()} ${T('subDays')}`)}
      </div>
      <div class="tiny mt2">${T('subPayHint')}</div>
      <div class="row mt2" style="gap:9px">
        <a class="btn gh gr" href="tel:${this.PHONE}">📞 <span dir="ltr">${this.PHONE}</span></a>
        <a class="btn gr" href="https://wa.me/${this.WA}" target="_blank" rel="noopener">💬 ${T('subWa')}</a>
      </div>`);
  },
};

  /*──── تنفيذ الدخول بالبريد ────*/

    const btn = $('#cl-go');
    btn.disabled = true; btn.textContent = T('cloudBusy');

      Guard.ok();
      await Guard.remember(email, pass, me);   /* ليعمل بلا إنترنت لاحقاً */
      /* اسم العيادة والطبيب معروفان من السيرفر — لا يُسأل عنهما مرة أخرى */
      if (!CFG.data.registered && me.clinic_name){
        CFG.data.clinic = me.clinic_name;
        if (me.doctor_name) CFG.data.doctor = me.doctor_name;
        CFG.data.registered = true;
        await CFG.save();
        $('#regbox')?.remove();
      }
      /* ★ الدور يقرّره السيرفر، فتُفتح واجهة الطبيب أو السكرتير
         أو الصيدلية أو المراجع تلقائياً من شاشة واحدة. */
      S.role = me.role;
      S.user = { id:email, uid:me.uid || null, role:me.role,
                 name:me.full_name || me.n1 || email,
                 cloud:true, clinic_id:me.clinic_id || null };
      if (me.clinic_name) S.clinicName = me.clinic_name;
      Brand.save(me);
      Sub.save(me);
      await Scope.check(me);
      App.start();
    } catch (e) {
      const m = String(e.message || e);
      /* الشبكة مقطوعة: تُجرَّب ذاكرة الجهاز بدل أن يقف العمل */
      if (/cloudFail|تعذّر|Failed to fetch|NetworkError/i.test(m) || !navigator.onLine){
        const r = await Guard.offlineIn(email, pass);
        if (r.ok){
          S.role = r.me.role;
          S.user = { id:email, uid:r.me.uid || null, role:r.me.role,
                     name:r.me.full_name || email,
                     cloud:true, offline:true, clinic_id:r.me.clinic_id };
          S.clinicName = r.me.clinic_name;

    const ids = ['r-clinic','r-doctor','r-phone','r-country','r-gov','r-area','r-landmark'];
    let bad = false;
    for (const id of ids){

    toast(T('saved'), 's');
