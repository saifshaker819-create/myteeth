    });
  },

  /* الطبيب يرى وصفاته المكتوبة وحالتها — الصرف ليس من هنا */
  async list(){
    const v = $('#view'); v.innerHTML = UI.spin();
    const rs = (await DB.all('rx')).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,80);
    const rows = [];
    for (const r of rs){
      const p = await DB.get('patients', r.pid); if (!p) continue;
      rows.push(`<div class="it" onclick="Rx.view('${r.id}')">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr">
          <div class="h3 ell">${esc(nm(p))}</div>
          <div class="tiny mono">${fmtD(r.at)} · ${r.items.length} ${T('drug')}</div>
          <div class="tiny ell">${r.phName
            ? `💊 ${esc(r.phName)}` : `<span style="opacity:.7">${T('notSent')}</span>`}</div>
        </div>
        <span class="pill ${r.st==='done'?'g':'w'}">${r.st==='done'?T('dispensed'):T('pending')}</span>
      </div>`);
    }
    v.innerHTML = `<div class="lbl">${T('rxList')}</div>
      <div class="col mt2">${rows.join('')||`<div class="emp">${T('noRx')}</div>`}</div>`;
  },

  async view(id){
    const r = await DB.get('rx', id);
    const p = await DB.get('patients', r.pid);
    UI.sheet(`
      <div class="shhead">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr">
          <div class="h2">${esc(nm(p))}</div>
          <div class="tiny mono">${fmtD(r.at)} · ${T('file')} ${esc(p.mrn)}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>

      <div class="lbl">${T('rxPaper')}</div>
      <div class="mt">${await Print.rxPreview(id)}</div>

      <div class="al ${r.st==='done'?'g':'i'} mt2"><span>${r.st==='done'?'✓':'ℹ'}</span>
        <span>${r.st==='done'?T('dispensed'):T('onlyPharmacy')}</span></div>

      <button class="btn w mt2" onclick="Print.rx('${r.id}')">🖨 ${T('printA5')}</button>
      <button class="btn w gh mt" onclick="Nav.back()">${T('close')}</button>`);
  },

  read(){ return S.rxDraft.map((_,i)=>({
    drug:($('#rx-d'+i)?.value||'').trim(), dose:($('#rx-o'+i)?.value||'').trim(),
    freq:($('#rx-f'+i)?.value||'').trim(), dur:($('#rx-u'+i)?.value||'').trim(),
    instr:($('#rx-i'+i)?.value||'').trim() })); },

  /* إعادة رسم الورقة ليست صفحة جديدة — تُستبدل مكانها */
  redraw(){ Nav.stack.pop(); this.sheet(); },
  add(){ S.rxDraft=this.read(); S.rxPh=this.readPh(); S.rxDraft.push({}); this.redraw(); },
  del(i){ S.rxDraft=this.read(); S.rxPh=this.readPh(); S.rxDraft.splice(i,1); this.redraw(); },

  async save(alsoPrint){
    const items = this.read().filter(x=>x.drug.length>=2);
    if (!items.length) return toast(T('fillAll'),'e');

    /* تحذير الحساسية قبل الحفظ */
    const alg = (S.patient?.mh?.allergy_drug?.d||'').toLowerCase();
    if (alg.length>2){
      const hit = items.filter(i=>i.drug.toLowerCase().includes(alg));
      if (hit.length && !ask(`⚠ ${T('allergy')}: ${alg}\n${hit.map(h=>h.drug).join(', ')}\n\n${T('confirm')}?`)) return;
    }

    let v = S.visit;
    if (!v) v = await Ops.openVisit(S.patient.id);

    /* التحويل: بريد الصيدلية هو العنوان — الاسم للعرض والمعرّف
       قد يتبدّل، أما البريد فهو ما تدخل به الصيدلية. ومن لم
       يُختَر له عنوان لا يصل إلى أحد. */
    const phId = this.readPh();
    const ph = this.pharmacies().find(a => a.id === phId) || null;

    const rx = { id:uid(), pid:S.patient.id, vid:v.id, items, st:'signed',
                 doctor: Prof.cachedName() || S.user?.name || CFG.data.doctor || T('r_doctor'),
                 ph: ph ? ph.id : '', phName: ph ? (ph.name || ph.email) : '',
                 phEmail: ph ? ph.email : '', route:1,
                 cid: CFG.data.cid, at:Date.now() };
    await DB.put('rx', rx);
    for (const i of items){
      await SG.learn('drug',i.drug); await SG.learn('dose',i.dose);
      await SG.learn('freq',i.freq); await SG.learn('dur',i.dur); await SG.learn('instr',i.instr);
    }
    toast(ph ? `${T('sentTo')}: ${ph.name || ph.email}` : T('notSent'), ph ? 's' : 'w');
    S.rxPh = '';
    /* العودة إلى جلسة الوصفة نفسها — لا إلى آخر صفحة في السجل،
       فقد تكون صفحة المرفقات إن فُتحت قبل كتابة العلاج. */
    Nav.reset(); UI.close();
    if (alsoPrint) Print.rx(rx.id);
    Nav.session(v.id);
  },
};

/*═══════════════ الطابعات ═══════════════
  لا يعطي أي متصفح قائمة الطابعات لصفحة ويب — لا واجهة قياسية لذلك.
  فالتعرّف التلقائي يجري عبر أي جسر متاح (غلاف سطح مكتب أو أندرويد)،
  وإن لم يوجد بقي الاسم يُكتب مرة واحدة ويُذكَّر به عند كل طباعة.

  والأسماء تُحفظ في هذا الجهاز وحده ولا تُزامَن: طابعة الاستقبال
  ليست طابعة غرفة الطبيب، ولو زُومنت لطبع كلٌّ على طابعة غيره.
═══════════════════════════════════════*/
const Prn = {
  K:{ a5:'d_prn_a5', bc:'d_prn_bc', list:'d_prn_list', w:'d_lbl_w', h:'d_lbl_h' },

  get(k, d){ try { return localStorage.getItem(this.K[k]) || (d==null?'':String(d)); }
             catch(_){ return d==null?'':String(d); } },
  set(k, v){ try { localStorage.setItem(this.K[k], v==null?'':String(v)); } catch(_){} },

  /* قياس ملصق الباركود — الافتراضي ٥٠×٣٠ ملم، أشيع ملصق حراري */
  label(){ return { w:Number(this.get('w', 50)) || 50, h:Number(this.get('h', 30)) || 30 }; },

  names(){ try { return JSON.parse(this.get('list','[]')) || []; } catch(_){ return []; } },
  saveNames(a){
    const list = [...new Set((a||[]).map(x => String(x||'').trim()).filter(Boolean))].slice(0,30);
    this.set('list', JSON.stringify(list));
    return list;
  },

  /* أي جسر يوفّره الغلاف الذي يعمل البرنامج داخله */
  bridge(){
    return window.ClinicPrint || window.AndroidPrint || window.electronPrint
        || (window.electron && window.electron.printHTML ? window.electron : null) || null;
  },

  async detect(){
    const found = [];
    try {
      const b = this.bridge();
      let r = b ? (typeof b.getPrinters === 'function' ? b.getPrinters() : (b.printers || null)) : null;
      if (r && typeof r.then === 'function') r = await r;
      if (typeof r === 'string'){ try { r = JSON.parse(r); } catch(_){ r = r.split(/[\n,;]+/); } }
      if (Array.isArray(r))
        for (const x of r) found.push(typeof x === 'string' ? x : (x.name || x.displayName || x.printerName || ''));
    } catch(_){}
    try {
      const np = navigator.printing;
      let r = (np && typeof np.getPrinters === 'function') ? await np.getPrinters() : null;
      if (Array.isArray(r)) for (const x of r) found.push(x.name || x.printerName || '');
    } catch(_){}
    if (Array.isArray(window.__PRINTERS__)) found.push(...window.__PRINTERS__);

    const list = [...new Set(found.map(x => String(x||'').trim()).filter(Boolean))];
    if (list.length) this.saveNames([...list, ...this.names()]);
    return list;
  },

  /* الطباعة الصامتة عبر الجسر إن وُجد، وإلا تُترك للنافذة المعتادة
     مع تذكير باسم الطابعة المطلوبة حتى لا تُطبع الورقة على الملصق. */
  async send(kind, html, title){
    const dev = this.get(kind === 'bc' ? 'bc' : 'a5', '');
    const b = this.bridge();
    if (b && typeof b.printHTML === 'function'){
      try { await b.printHTML(html, dev || '', kind, title || ''); return true; } catch(_){}
    }
    if (dev) toast(`${T('sendTo')}: ${dev}`, 's');
    return false;
  },
};

/*═══════════════ الطباعة ═══════════════*/
const Print = {
  /* الشعار المرفوع في الإعدادات هو رأس الورقة نفسه — يُطبع بعرض
     الصفحة كاملاً. النص يظهر فقط عند غياب الشعار. */
  head(){
    const c = CFG.data;
    if (c.logo){
      return `<div style="text-align:center;padding-bottom:6px">
        <img src="${c.logo}" style="width:100%;max-height:130px;object-fit:contain;display:block">
      </div>`;
    }
    return `<div style="text-align:center;border-bottom:3px solid #00695C;padding-bottom:8px">
      <div style="font-size:19px;font-weight:800">${esc(c.header||c.clinic)}</div>
      ${c.doctor?`<div style="font-size:13px">${esc(c.doctor)}${c.title?' — '+esc(c.title):''}</div>`:''}
    </div>`;
  },
  /* ورقتان مختلفتان تماماً: ورقة العلاج A5 بترويستها وتذييلها،
     وملصق الباركود بقياس الملصق بلا شيء حوله. لكل واحدة طابعتها
     المختارة في الإعدادات. */
  win(inner, title, kind){
    const isLbl = kind === 'bc';
    const L = Prn.label();
    const page = isLbl ? `@page{size:${L.w}mm ${L.h}mm;margin:2mm}`
                       : `@page{size:A5;margin:9mm}`;
    const foot = isLbl ? '' : `<div class="ft">${CFG.data.footerImg
        ? `<img src="${CFG.data.footerImg}" style="width:100%;max-height:70px;object-fit:contain">`
        : esc(CFG.data.footer||'')}</div>`;

    const html = `<!DOCTYPE html><html lang="${LG}" dir="${isAr()?'rtl':'ltr'}"><head>
      <meta charset="utf-8"><title>${esc(title)}</title>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
      <style>${page}
        body{font-family:'IBM Plex Sans Arabic',sans-serif;margin:0;color:#111;
             font-size:${isLbl?'12px':'13px'}}
        table{width:100%;border-collapse:collapse;margin-top:8px}
        td,th{padding:7px 5px;border-bottom:1px solid #ccc;text-align:start}
        th{background:#eef3f3;font-size:11.5px}
        .ft{position:fixed;bottom:0;inset-inline:0;text-align:center;font-size:11px;
            color:#555;border-top:1px solid #ddd;padding-top:5px}
      </style></head><body>${inner}
      ${foot}
      <script>window.onload=()=>setTimeout(()=>window.print(),420)<\/script>
      </body></html>`;

    /* نافذة الطباعة تُفتح في اللحظة نفسها التي ضُغط فيها الزر —
       لو انتظرنا وعداً لحجبها المتصفح بوصفها نافذة منبثقة.
       فالجسر (إن وُجد) يطبع صامتاً، وإلا فُتحت النافذة فوراً. */
    const kindKey = isLbl ? 'bc' : 'a5';
    const br = Prn.bridge();
    if (br && typeof br.printHTML === 'function'){
      Prn.send(kindKey, html, title).catch(()=>{});
      return;
    }
    const dev = Prn.get(kindKey, '');
    if (dev) toast(`${T('sendTo')}: ${dev}`, 's');
    const w = window.open('','_blank','width=600,height=820');
    if (!w) return toast(T('printBlocked'), 'e');
    w.document.write(html);
    w.document.close();
  },

  /* جسم ورقة A5 — مصدر واحد يُستخدم للطباعة وللمعاينة داخل البرنامج،
     فما يراه الصيدلي هو نفسه ما يطبعه الطبيب حرفياً. */
  /* كل جزء يُعزل باتجاهه: الرقم يبقى ملتصقاً بكلمته العربية
     ولا يقفز للحقل المجاور — سبب ظهور "٤" مع حقل المدة. */
  seg(v){ return `<bdi style="unicode-bidi:isolate">${esc(v)}</bdi>`; },

  /* بيانات الطبيب صاحب الوصفة: ملفّه الشخصي إن وُجد، وإلا إعدادات
     العيادة كما كانت — فعيادة بطبيب واحد لا يتغيّر عليها شيء. */
  async docOf(rx){
    const pf = await Prof.get(rx && rx._own);
    if (!pf) return { doctor: rx?.doctor || CFG.data.doctor || '',
                      title: CFG.data.title || '', sign: CFG.data.sign || '' };
    return { doctor: pf.name || rx?.doctor || CFG.data.doctor || '',
             title: pf.title || '', sign: pf.sign || '' };
  },

  rxBody(rx, p, forScreen, d){
    const c = { ...CFG.data, ...(d || {}) };
    const head = c.logo
      ? `<div class="phd"><img src="${c.logo}"></div>`
      : `<div class="phd">
           <div style="font-size:19px;font-weight:800">${esc(c.header||c.clinic)}</div>
           ${c.doctor?`<div style="font-size:13px">${esc(c.doctor)}${c.title?' — '+esc(c.title):''}</div>`:''}
         </div>`;

    const items = rx.items.map((i,n)=>`
      <div class="rxrow">
        <div class="n">${n+1}</div>
        <div class="rxtxt">
          <div class="dname">${esc(i.drug)}</div>
          <div class="ddose">${[i.dose,i.freq,i.dur,i.instr]
            .filter(Boolean).map(x=>this.seg(x)).join(' — ')}</div>
        </div>
      </div>`).join('');

    return `${head}
      <div class="pmeta">
        <span><b>${esc(nm(p))}</b></span>
        <span>${p.age||''} ${T('yrs')}</span>
        <span>${esc(p.mrn||'')}</span>
        <span>${fmtD(rx.at)}</span>
      </div>
      ${rx.phName?`<div style="font-size:12px;font-weight:700;margin-top:6px">
        ${T('dispenseAt')}: ${esc(rx.phName)}</div>`:''}
      <div style="font-size:16px;font-weight:800;margin:8px 0 2px;color:#00695C">℞</div>
      ${items}
      ${rx.notes?`<div style="margin-top:10px;font-size:12px">${esc(rx.notes)}</div>`:''}
      <div class="psig">
        ${c.sign?`<img src="${c.sign}" alt="">`:''}
        <div class="pname">${esc(c.doctor||'')}</div>
        ${c.title?`<div style="font-size:11px;color:#555">${esc(c.title)}</div>`:''}
      </div>
      ${forScreen && c.footer?`<div class="pft">${esc(c.footer)}</div>`:''}`;
  },

  /* معاينة داخل البرنامج */
  async rxPreview(id){
    const rx = await DB.get('rx', id);
    const p  = await DB.get('patients', rx.pid);
    return `<div class="paper">${this.rxBody(rx, p, true, await this.docOf(rx))}</div>`;
  },

  async rx(id){
    const rx = await DB.get('rx', id);
    const p  = await DB.get('patients', rx.pid);
    const dc = await this.docOf(rx);
    this.win(`${this.head()}
      <div style="display:flex;justify-content:space-between;font-size:12.5px;
        margin:11px 0;padding:8px 0;border-bottom:1px dashed #999">
        <span><b>${esc(nm(p))}</b></span><span>${p.age||''} ${T('yrs')}</span>
        <span>${esc(p.mrn)}</span><span>${fmtD(rx.at)}</span></div>
      <div style="font-size:16px;font-weight:800;margin-top:6px;color:#00695C">℞</div>
      <table dir="ltr"><tbody>${rx.items.map((i,n)=>`<tr>
        <td style="width:24px;font-weight:800;color:#00695C;text-align:left">${n+1}</td>
        <td style="text-align:left">
          <b style="font-size:14.5px">${esc(i.drug)}</b>
          <div style="font-size:11.5px;color:#444;margin-top:2px;unicode-bidi:plaintext">
          ${[i.dose,i.freq,i.dur,i.instr].filter(Boolean)
            .map(x=>`<bdi style="unicode-bidi:isolate">${esc(x)}</bdi>`).join(' — ')}</div></td>
      </tr>`).join('')}</tbody></table>
      ${rx.notes?`<div style="margin-top:10px;font-size:12px">${esc(rx.notes)}</div>`:''}
      <div style="margin-top:26px;text-align:center;font-size:12px">
        ${dc.sign?`<img src="${dc.sign}" style="display:block;margin:0 auto -6px;
          max-height:64px;max-width:210px;object-fit:contain">`:''}
        <div style="font-weight:800;font-size:13px;border-top:1px solid #444;
          display:inline-block;padding-top:5px;min-width:190px">${esc(dc.doctor||'')}</div>
        ${dc.title?`<div style="font-size:11px;color:#555">${esc(dc.title)}</div>`:''}
      </div>`, nm(p), 'a5');
  },

  /*──── ملصق الباركود ────
    ترتيب مقصود: اسم الطبيب فوق ليُعرف مصدر الملصق من نظرة، ثم
    الباركود في وسط الملصق ليقرأه الماسح بلا بحث، ثم اسم المريض
    وتاريخ حجزه ووقته أسفله. ورقم الرمز تحت الخطوط لأن الماسح قد
    يتعطّل فيُكتب الرقم باليد. */
  labelHTML(o){
    return `<div style="width:100%;text-align:center;color:#000;
      font-family:'IBM Plex Sans Arabic',sans-serif;background:#fff">
      <div style="font-size:12.5px;font-weight:800;line-height:1.25;
        border-bottom:1px solid #000;padding-bottom:3px;margin-bottom:5px">
        ${esc(o.doctor||'')}</div>
      <div style="padding:0 2px">${C39.svg(o.code, 52)}</div>
      <div style="font-family:monospace;font-size:12.5px;font-weight:800;
        letter-spacing:.22em;margin-top:1px">${esc(o.code)}</div>
      <div style="font-size:13px;font-weight:800;margin-top:5px;line-height:1.25">
        ${esc(o.patient||'')}</div>
      <div style="font-size:10.5px;margin-top:2px;font-weight:600">${esc(o.when||'')}</div>
    </div>`;
  },

  /* بيانات الملصق: الرمز واحد للمراجع في كل زياراته، والوقت وقت
     حجزه من تطبيقه إن حجز، وإلا وقت فتح جلسته في العيادة. */
  async labelData(vid){
    const v = await DB.get('visits', vid);
    const p = v ? await DB.get('patients', v.pid) : null;
    if (p && !p.bc){ p.bc = await Ops.nextBarcode(); await DB.put('patients', p); }

    /* وقت هذه الزيارة تحديداً: حجز اليوم نفسه إن وُجد، وإلا حجز
       قادم، وإلا وقت فتح الجلسة. فلا يُطبع على ملصق اليوم تاريخُ
       حجز قديم. */
    let when = `${fmtD(v?.date || today())} · ${fmtT(v?.at || Date.now())}`;
    try {
      const day = v?.date || today();
      const mine = (await DB.all('bookings'))
        .filter(b => p && b.pid === p.id && b.day && b.st !== 'declined')
        .sort((a,b) => String((a.day||'')+(a.time||''))
                       .localeCompare(String((b.day||'')+(b.time||''))));
      const bk = mine.find(b => b.day === day) || mine.find(b => b.day >= day);
      if (bk) when = `${fmtD(bk.day)}${bk.time ? ' · ' + bk.time : ''}`;
    } catch(_){}

    return { code:String(p?.bc || v?.code || ''), patient:p ? nm(p) : '',
             doctor:(CFG.data.doctor || CFG.data.clinic || ''), when, p, v };
  },

  async barcode(vid){
    const d = await this.labelData(vid);
    if (!d.code) return toast(T('noResult'), 'e');
    this.win(this.labelHTML(d), d.code, 'bc');
  },

  async day(){
    const works = (await DB.all('works')).filter(w=>dkey(w.at)===today());
    const rows = [];
    for (const w of works){ const p = await DB.get('patients', w.pid);
      rows.push(`<tr><td>${esc(p?nm(p):'—')}</td>
        <td style="font-family:monospace">${w.fdi?Chart.lbl(w.fdi):'—'}</td>
        <td>${esc(pName(w.proc))}</td><td style="font-family:monospace">${N(w.price)}</td>
        <td style="font-size:11px">${esc(w.note||'')}</td></tr>`); }
    const tot = works.reduce((s,x)=>s+Number(x.price||0),0);
    this.win(`${this.head()}
      <div style="font-size:15px;font-weight:800;margin-top:10px">${T('dayReport')} — ${fmtD(today())}</div>
      <table><thead><tr><th>${T('name')}</th><th>${T('workSite')}</th><th>${T('workType')}</th>
        <th>${T('amountPaid')}</th><th>${T('notes')}</th></tr></thead>
        <tbody>${rows.join('')||''}</tbody></table>
      <div style="margin-top:12px;font-weight:800;font-size:15px">${T('total')}: ${N(tot)}</div>`,
      T('dayReport'));
  },
};

/*═══════════════ الصيدلية ═══════════════*/
const Ph = {
  /*──── ما الذي تراه هذه الصيدلية؟ ────
    الوصفة تُحوَّل إلى بريد صيدلية بعينه، فلا تراها غيرها. وما
    حُفظ بلا تحويل لا يراه أحد — هذا نصّ ما يريده الطبيب.
    وحدها الوصفات المكتوبة قبل تسجيل أول صيدلية تبقى ظاهرة، لئلا
    يفقد الصيدلي سجلّه القديم يوم تُفعّل الميزة.
    والطبيب والسكرتير خارج هذه القاعدة: يريان كل شيء كما كانا. */
  myMail(){
    return String(Cloud.session?.email || S.user?.id || '').trim().toLowerCase();
  },

  mine(r){
    if (!r) return false;
    if (S.role !== 'pharmacy') return true;
    /* العلامة route تُوضع على كل وصفة تكتبها هذه النسخة، اختير لها
       تحويل أو لم يُختر. فالحكم يقع من الوصفة نفسها لا من دليل
       الحسابات — وجهاز الصيدلية لا يستقبل إعدادات العيادة أصلاً
       (يسحب الوصفات والمراجعين فقط)، فلو عُلّق الحكم على الدليل
       لرأت كل صيدلية كل شيء. */
    if (r.phEmail) return String(r.phEmail).toLowerCase() === this.myMail();
    return !r.route;      /* وصفات كُتبت قبل هذه الميزة تبقى ظاهرة */
  },

  async mineAll(){ return (await DB.all('rx')).filter(r => this.mine(r)); },

  async queue(){
    const v = $('#view'); v.innerHTML = UI.spin();
    const rs = (await this.mineAll()).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,60);
    const rows = [];
    for (const r of rs){
      const p = await DB.get('patients', r.pid); if(!p) continue;
      rows.push(`<div class="it" onclick="Ph.open('${r.id}')">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr"><div class="h3 ell">${esc(nm(p))}</div>
          <div class="tiny mono">${fmtD(r.at)} · ${r.items.length} ${T('drug')}</div></div>
        <span class="pill ${r.st==='done'?'g':'w'}">${r.st==='done'?T('dispensed'):T('pending')}</span>
      </div>`);
    }
    v.innerHTML = rows.length?`<div class="col">${rows.join('')}</div>`:`<div class="emp">${T('noRx')}</div>`;
  },

  /* الصيدلي يرى ورقة العلاج كما يطبعها الطبيب تماماً،
     مع الحساسيات — بلا تشخيص ولا أسعار. */
  async open(id){
    const r = await DB.get('rx', id);
    if (!r) return toast(T('noResult'), 'e');
    /* حتى لو وصل الرمز بالمسح أو برابط قديم: ما ليس لها لا يُفتح */
    if (!this.mine(r)) return toast(T('rxNotYours'), 'e');
    const p = await DB.get('patients', r.pid);
    const alerts = MH.alerts(p.mh, true);

    UI.sheet(`
      <div class="shhead">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr">
          <div class="h2">${esc(nm(p))}</div>
          <div class="tiny mono">${p.age||'—'} ${T('yrs')} · ${T('file')} ${esc(p.mrn)} · ${fmtD(r.at)}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>

      ${alerts.length?`<div class="col" style="margin-bottom:12px">${alerts.map(x=>`
        <div class="al ${x.risk===2?'r':'w'}"><span>${x.risk===2?'⚠':'!'}</span>
        <span>${esc(x.txt)}${x.d?` — <b>${esc(x.d)}</b>`:''}</span></div>`).join('')}</div>`
       :`<div class="al g" style="margin-bottom:12px"><span>✓</span><span>${T('noAlerts')}</span></div>`}

      <div class="lbl">${T('rxPaper')}</div>
      <div class="mt">${await Print.rxPreview(id)}</div>

      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Print.rx('${id}')">🖨 ${T('printA5')}</button>
        ${r.st==='done'
          ? `<div class="al g gr" style="flex:2;justify-content:center"><span>✓</span>
             <span>${T('dispensed')}</span></div>`
          : S.role==='pharmacy'
            ? `<button class="btn ok gr" style="flex:2" onclick="Ph.give('${id}')">${T('dispense')}</button>`
            : `<div class="al i gr" style="flex:2"><span>ℹ</span><span>${T('onlyPharmacy')}</span></div>`}
      </div>
      <button class="btn w gh mt" onclick="Nav.back()">${T('close')}</button>`);
  },

  /*──── الصرف مع مبلغ اختياري ────*/
  give(id){
    if (S.role !== 'pharmacy') return toast(T('onlyPharmacy'), 'e');
    UI.sheet(`
      <div class="shhead"><div class="gr">
        <div class="h2">${T('confirmDispense')}</div>
        <div class="sub">${T('rxAmountOpt')}</div>
      </div><button class="ib" onclick="Nav.back()">✕</button></div>
      <div class="card">
        <label class="lb">${T('rxAmount')}</label>
        <input id="rx-amt" class="mono" inputmode="numeric" dir="ltr"
          style="font-size:24px;text-align:center" placeholder="0">
      </div>
      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
        <button class="btn ok gr" style="flex:2" onclick="Ph.confirmGive('${id}')">
          ${T('dispense')}</button>
      </div>`);
    setTimeout(()=>$('#rx-amt')?.focus(), 140);
  },

  async confirmGive(id){
    const r = await DB.get('rx', id);
    if (!r) return toast(T('noResult'), 'e');
    /* حارس أخير: لا تُصرف وصفة محوّلة إلى صيدلية أخرى */
    if (!this.mine(r)) return toast(T('rxNotYours'), 'e');
    r.st = 'done'; r.doneAt = Date.now();
    r.amount = Number($('#rx-amt')?.value) || 0;   /* صفر = بلا مبلغ */
    r.doneBy = S.user?.id || 'pharmacy';
    await DB.put('rx', r);
    toast(T('dispensed'), 's');
    Nav.reset(); UI.close(); App.draw();
  },

  /*──── الأطباء المحوّلون لهذه الصيدلية ────*/
  async docs(){
    const v = $('#view'); v.innerHTML = UI.spin();
    const rs = await this.mineAll();
    const map = {};
    for (const r of rs){
      const d = r.doctor || CFG.data.doctor || T('r_doctor');
      (map[d] ||= { name:d, total:0, done:0, amount:0, pts:new Set() });
      map[d].total++; map[d].pts.add(r.pid);
      if (r.st==='done'){ map[d].done++; map[d].amount += Number(r.amount||0); }
    }
    const docs = Object.values(map).sort((a,b)=> b.total - a.total);

    v.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <div class="lbl">${T('t_docs')}</div><span class="pill b">${docs.length}</span>
      </div>
      <div class="col mt2">${docs.length ? docs.map(d=>`
        <div class="it" onclick="Ph.docPatients('${encodeURIComponent(d.name)}')">
          <div class="av">${esc(d.name.replace(/^[دdD]\.?\s*/,'').charAt(0))}</div>
          <div class="gr">
            <div class="h3 ell">${esc(d.name)}</div>
            <div class="tiny mono">${d.pts.size} ${T('patients')} ·
              ${d.total} ${T('rxCount')} · ${d.done} ${T('dispensed')}</div>
          </div>
          <div style="text-align:end">
            <div class="tiny">${T('rxIncome')}</div>
            <div class="mono h3" style="color:var(--ok)">${N(d.amount)}</div>
          </div>
        </div>`).join('') : `<div class="emp">${T('noDocs')}</div>`}</div>`;
  },

  /* مراجعو طبيب معيّن مع حالة الصرف */
  async docPatients(encName){
    const name = decodeURIComponent(encName);
    const rs = (await this.mineAll())
      .filter(r => (r.doctor || CFG.data.doctor || T('r_doctor')) === name)
      .sort((a,b)=>(b.at||0)-(a.at||0));

    const rows = [];
    for (const r of rs){
      const p = await DB.get('patients', r.pid); if (!p) continue;
      rows.push(`<div class="it" onclick="Ph.open('${r.id}')">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr">
          <div class="h3 ell">${esc(nm(p))}</div>
          <div class="tiny mono">${fmtD(r.at)} · ${r.items.length} ${T('drug')}</div>
          <div class="tiny ell" dir="ltr" style="text-align:start">
            ${esc(r.items.map(i=>i.drug).join(' · '))}</div>
        </div>
        <div style="text-align:end">
          <span class="pill ${r.st==='done'?'g':'w'}">
            ${r.st==='done'?T('dispensed'):T('notDispensed')}</span>
          ${r.st==='done'&&r.amount?`<div class="mono" style="font-weight:700;
            color:var(--ok);margin-top:4px">${N(r.amount)}</div>`:''}
        </div>
      </div>`);
    }

    UI.sheet(`
      <div class="shhead"><div class="gr">
        <div class="h2">${esc(name)}</div>
        <div class="sub">${T('docPatients')} · ${rows.length}</div>
      </div><button class="ib" onclick="Nav.back()">✕</button></div>
      <div class="col">${rows.join('') || `<div class="emp">${T('noRx')}</div>`}</div>
      <button class="btn w gh mt2" onclick="Nav.back()">${T('back')}</button>`);
  },

  /*──── حسابات الصيدلية مع فلاتر ────*/
  flt:{ from:'', to:'', doc:'', pt:'' },

  async accounts(){
    const v = $('#view');
    const rs = await this.mineAll();
    const docs = [...new Set(rs.map(r=>r.doctor || CFG.data.doctor || T('r_doctor')))];

    v.innerHTML = `
      <div class="card">
        <div class="lbl">${T('filterDate')}</div>
        <div class="g2 mt">
          <div><label class="lb">${T('from')}</label>
            <input type="date" id="f-from" class="mono" value="${esc(this.flt.from)}"></div>
          <div><label class="lb">${T('to')}</label>
            <input type="date" id="f-to" class="mono" value="${esc(this.flt.to)}"></div>
        </div>
        <div class="g2 mt">
          <div><label class="lb">${T('filterDoc')}</label>
            <select id="f-doc"><option value="">${T('allDocs')}</option>
              ${docs.map(d=>`<option value="${esc(d)}" ${this.flt.doc===d?'selected':''}>${esc(d)}</option>`).join('')}
            </select></div>
          <div><label class="lb">${T('filterPt')}</label>
            <input id="f-pt" value="${esc(this.flt.pt)}" placeholder="${T('searchPatient')}"></div>
        </div>
        <div class="row mt" style="gap:8px">
          <button class="btn gh gr" onclick="Ph.clearFlt()">${T('clearFilters')}</button>
          <button class="btn gr" onclick="Ph.applyFlt()">${T('confirm')}</button>
        </div>
      </div>
      <div id="pacc-body" class="mt2">${UI.spin()}</div>`;
    this.accBody();
  },

  clearFlt(){ this.flt = { from:'', to:'', doc:'', pt:'' }; this.accounts(); },
  applyFlt(){
    this.flt = {
      from: $('#f-from')?.value || '', to: $('#f-to')?.value || '',
      doc:  $('#f-doc')?.value  || '', pt: ($('#f-pt')?.value || '').trim(),
    };
    this.accBody();
  },

  async accBody(){
    const box = $('#pacc-body'); if (!box) return;
    const f = this.flt;
    let rs = (await this.mineAll()).filter(r => r.st === 'done');
    if (f.from) rs = rs.filter(r => new Date(r.doneAt||r.at).toISOString().slice(0,10) >= f.from);
    if (f.to)   rs = rs.filter(r => new Date(r.doneAt||r.at).toISOString().slice(0,10) <= f.to);
    if (f.doc)  rs = rs.filter(r => (r.doctor || CFG.data.doctor || T('r_doctor')) === f.doc);

    const rows = []; let total = 0;
    for (const r of rs.sort((a,b)=>(b.doneAt||b.at)-(a.doneAt||a.at))){
      const p = await DB.get('patients', r.pid); if (!p) continue;
      if (f.pt && !nm(p).toLowerCase().includes(f.pt.toLowerCase())) continue;
      total += Number(r.amount||0);
      rows.push(`<div class="it" onclick="Ph.open('${r.id}')">
        <div class="av g">₪</div>
        <div class="gr">
          <div class="h3 ell">${esc(nm(p))}</div>
          <div class="tiny mono">${fmtD(r.doneAt||r.at)} · ${esc(r.doctor||CFG.data.doctor||'')}</div>
        </div>
        <div class="mono h3" style="color:${r.amount?'var(--ok)':'var(--ink3)'}">
          ${r.amount?N(r.amount):'—'}</div>
      </div>`);
    }

    box.innerHTML = `
      <div class="g3">
        <div class="card ctr" style="padding:14px 8px"><div class="tiny">${T('rxIncome')}</div>
          <div class="mono h2 mt" style="color:var(--ok)">${N(total)}</div></div>
        <div class="card ctr" style="padding:14px 8px"><div class="tiny">${T('rxCount')}</div>
          <div class="mono h2 mt">${rows.length}</div></div>
        <div class="card ctr" style="padding:14px 8px"><div class="tiny">${T('avgRx')}</div>
          <div class="mono h2 mt">${N(rows.length?Math.round(total/rows.length):0)}</div></div>
      </div>
      <div class="col mt2">${rows.join('') || `<div class="emp">${T('noRx')}</div>`}</div>`;
  },
};

/*═══════════════ مسح الباركود ═══════════════
  طريقتان: قارئ باركود يدوي (يكتب الرمز ثم Enter)، أو الكاميرا.
  الكاميرا تستخدم BarcodeDetector المدمج في المتصفح — بلا مكتبات
  خارجية، فيبقى البرنامج ملفاً واحداً يعمل بلا إنترنت.
═══════════════════════════════════════════════*/
const Scan = {
  stream:null, timer:null, det:null, facing:'environment',

  open(){
    UI.sheet(`
      <div class="shhead"><div class="gr">
        <div class="h2">${T('scan')}</div>
        <div class="sub">${T('scanHint')}</div>
      </div><button class="ib" onclick="Scan.close()">✕</button></div>

      <button class="btn w" onclick="Scan.camera()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"
            stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="1.9"/>
        </svg>${T('useCamera')}</button>

      <div id="cam-slot" class="mt"></div>

      <div class="card mt">
        <div class="lbl">${T('useReader')}</div>
        <div class="tiny" style="margin-top:4px">${T('typeCode')}</div>
        <input id="sc-in" class="mono mt" dir="ltr" autocomplete="off"
          style="font-size:19px;text-align:center;letter-spacing:.1em">
        <button class="btn w mt" onclick="Scan.go()">${T('confirm')}</button>
      </div>`);

    const i = $('#sc-in');
    setTimeout(()=>i?.focus(), 140);
    /* قارئ الباركود اليدوي يُرسل Enter بعد الرمز */
    i.onkeydown = e => { if (e.key === 'Enter') Scan.go(); };
  },

  close(){ this.stop(); Nav.back(); },

  /*──── الكاميرا ────*/
  async camera(){
    const slot = $('#cam-slot'); if (!slot) return;

    if (!('BarcodeDetector' in window)) return this.camErr(T('camUnsupported'));
    if (!navigator.mediaDevices?.getUserMedia) return this.camErr(T('camNeedHttps'));

    try {
      const formats = await BarcodeDetector.getSupportedFormats();
      const want = ['code_39','code_128','qr_code','ean_13','codabar','itf']
        .filter(f => formats.includes(f));
      this.det = new BarcodeDetector({ formats: want.length ? want : formats });
    } catch { return this.camErr(T('camUnsupported')); }

    slot.innerHTML = `
      <div class="camwrap">
        <video id="cam-v" playsinline muted autoplay></video>
        <div class="camaim"><div class="box"></div><div class="ln"></div></div>
        <div class="camst" id="cam-st">${T('pointCamera')}</div>
      </div>
      <div class="row mt" style="gap:8px">
        <button class="btn gh gr" onclick="Scan.stop()">${T('stopCam')}</button>
        <button class="btn gh gr" onclick="Scan.flip()">⟲ ${T('switchCam')}</button>
      </div>`;

    await this.start();
  },

  async start(){
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:{ ideal:this.facing }, width:{ideal:1280}, height:{ideal:720} },
        audio: false,
      });
    } catch (e) {
      const msg = e.name === 'NotAllowedError' ? T('camDenied')
                : e.name === 'NotFoundError'  ? T('camNone')
                : T('camNeedHttps');
      return this.camErr(msg);
    }

    const v = $('#cam-v'); if (!v) return this.stop();
    v.srcObject = this.stream;
    try { await v.play(); } catch {}
    this.loop();
  },

  loop(){
    const v = $('#cam-v');
    if (!v || !this.stream) return;
    const st = $('#cam-st'); if (st) st.textContent = T('scanning');

    const tick = async () => {
      if (!this.stream || !$('#cam-v')) return;
      try {
        const codes = await this.det.detect(v);
        const vals = codes.map(c => String(c.rawValue||'').trim().toUpperCase());
        /* نفضّل رمز زيارة صالحاً إن وُجد بين عدة رموز في الإطار */
        const hit = vals.find(x => /^V[0-9A-Z]{8,}$/.test(x)) || vals[0];
        if (hit){
          if (navigator.vibrate) navigator.vibrate(60);
          if (st) st.textContent = T('codeFound') + ' — ' + hit;
          this.stop(true);
          const inp = $('#sc-in'); if (inp) inp.value = hit;
          return this.go(hit);
        }
      } catch { /* إطار غير قابل للقراءة — نتابع */ }
      this.timer = setTimeout(tick, 220);
    };
    tick();
  },

  flip(){
    this.facing = this.facing === 'environment' ? 'user' : 'environment';
    this.stop(true);
    this.start();
  },

  stop(keepMsg){
    clearTimeout(this.timer); this.timer = null;
    if (this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream = null; }
    const v = $('#cam-v'); if (v) v.srcObject = null;
    if (!keepMsg){ const st = $('#cam-st'); if (st) st.textContent = T('stopCam'); }
  },

  camErr(msg){
    const slot = $('#cam-slot');
    if (slot) slot.innerHTML = `<div class="al w"><span>!</span><span>${esc(msg)}</span></div>`;
  },

  /*──── معالجة الرمز ────*/
  async go(code){
    const raw = (code || $('#sc-in')?.value || '').trim().toUpperCase();
    if (!raw) return;

    /* الرمز قد يكون رقم المراجع أو رمز جلسة — كلاهما يقود إليه */
    let pt = await Ops.findPtByCode(raw);
    if (!pt){
      const v = await Ops.findByCode(raw);
      if (v) pt = await DB.get('patients', v.pid);
    }
    if (!pt){
      toast(T('noResult'), 'e');
      const st = $('#cam-st'); if (st) st.textContent = T('noResult');
      if (this.det && !this.timer && this.stream) this.loop();
      return;
    }

    this.stop(true);
    UI.close();
    Nav.reset();
    return this.route(pt);
  },

  /*──── ما بعد القراءة ────
    الماسح لا ينقل الموظّف من مكانه: يبقى في القسم الذي كان يعمل
    فيه ويظهر المراجع داخله — قرأتَه في «اليوم» ظهر في قائمة اليوم،
    وفي «الملفات» ظهر في الملفات، وهكذا.
    والصيدلي وحده يُفتح له آخر علاج كتبه الطبيب مباشرة، لأن هذا
    كل ما يعنيه من القراءة.
    ومع كل قراءة تُرفع بطاقة «آخر طلب» فوق القسم. */
  async route(pt){
    const info = await Ops.lastOrder(pt.id);
    const code = String(pt.bc || pt.mrn || nm(pt));

    if (S.role === 'pharmacy'){
      /* آخر علاج مما هو محوَّل إلى هذه الصيدلية تحديداً */
      const own = (info.all || []).find(r => Ph.mine(r));
      if (own){ toast(`${nm(pt)} — ${T('lastRx')}`, 's'); return Ph.open(own.id); }
      toast(`${nm(pt)} — ${T('noLastRx')}`, 'e');
      await App.draw();
      return this.banner(pt, info);
    }

    const tab = S.tab;
    S.patient = null;
    S.chartOpen = false;

    if (tab === 'files'){
      await App.draw();
      const i = $('#sc-q'); if (i) i.value = code;
      await Sec.list(code);
    } else if (tab === 'book'){
      /* قسم الحجوزات: يُبحث عنه بين الطلبات التي تنتظر القرار */
      Sec.bq = (pt.phone || nm(pt));
      await App.draw();
    } else if (tab === 'rx' && info.rx){
      await App.draw();
      this.banner(pt, info);
      return Rx.view(info.rx.id);
    } else if (tab === 'money'){
      await App.draw();
      this.banner(pt, info);
      return Money.ptVisits(pt.id);
    } else if (tab === 'today' || !tab){
      Sec.qq = code;
      S.tab = 'today';
      await App.draw();
    } else {
      await App.draw();
    }

    this.banner(pt, info);
    const has = !!info.todayVisit;
    toast(`${nm(pt)} — ${has ? T('bookedToday') : T('notBookedToday')}`, has ? 's' : 'w');
  },

  /* بطاقة «آخر طلب» فوق القسم — تُطالَع بنظرة وتُغلق بضغطة،
     ولا تُغطّي الشاشة ولا تُخرج الموظّف من عمله. */
  banner(pt, info){
    const box = $('#view'); if (!box) return;
    $('#scanbar')?.remove();

    const ws = (info.works || []).slice(0,3)
      .map(x => `${x.fdi ? Chart.lbl(x.fdi) + ' · ' : ''}${pName(x.proc)}`);
    /* الصيدلي يرى في البطاقة ما يخصّه فقط */
    const rx = (S.role === 'pharmacy')
      ? (info.all || []).find(r => Ph.mine(r)) || null : info.rx;
    const drugs = rx ? rx.items.map(i => i.drug).filter(Boolean).slice(0,4).join(' · ') : '';
    const st = info.todayVisit
      ? `<span class="pill g">${T('bookedToday')}</span>`
      : (info.booking && info.booking.st === 'new')
        ? `<span class="pill w">${T('bookPending')}</span>`
        : `<span class="pill n">${T('notBookedToday')}</span>`;

    box.insertAdjacentHTML('afterbegin', `
      <div class="card" id="scanbar" style="border-color:var(--br)">
        <div class="row">
          <div class="av">${esc(nm(pt).charAt(0))}</div>
          <div class="gr">
            <div class="row" style="gap:6px">
              <div class="h3 ell">${esc(nm(pt))}</div>${st}
            </div>
            <div class="mono tiny">${T('file')} ${esc(pt.mrn||'—')} ·
              ▮▮ ${esc(pt.bc||'—')} · ${esc(pt.phone||'')}</div>
          </div>
          <button class="ib" onclick="document.getElementById('scanbar').remove()">✕</button>
        </div>

        <div class="mt" style="padding:11px;background:var(--glass2);border-radius:11px">
          <div class="lbl">${T('lastOrder')}</div>
          ${info.visit
            ? `<div class="tiny mt">${fmtD(info.visit.date)} — ${ws.length ? esc(ws.join(' · ')) : '—'}</div>`
            : `<div class="tiny mt">${T('noLastOrder')}</div>`}
          ${drugs ? `<div class="tiny mt" dir="ltr" style="text-align:start">℞ ${esc(drugs)}</div>` : ''}
          ${info.appt ? `<div class="tiny mt">📅 ${fmtD(info.appt.day)}${
            info.appt.time ? ' · ' + esc(info.appt.time) : ''}</div>` : ''}
        </div>

        <div class="row mt" style="gap:8px">
          ${S.role !== 'pharmacy'
            ? `<button class="btn sm gh gr" onclick="Sec.file('${pt.id}')">${T('file')}</button>` : ''}
          ${rx ? `<button class="btn sm gh gr" onclick="${S.role==='pharmacy'
              ? `Ph.open('${rx.id}')` : `Rx.view('${rx.id}')`}">${T('lastRx')}</button>` : ''}
          ${(info.visit && S.role !== 'pharmacy') ? `<button class="btn sm gr"
            onclick="Nav.session('${info.visit.id}')">${T('session')}</button>` : ''}
        </div>
      </div>`);
  },
};
/*═══════════════ المواعيد القادمة ═══════════════*/
const Appt = {
  /* تحديد الموعد يقع بعد الإنهاء، لكنه يُطلب أحياناً من داخل
     الجلسة. فيُحرس بالحارس نفسه: بلا تحديد الجلسة المنفَّذة لا
     يُعرف ما بقي، فيخرج الموعد القادم على رقم خاطئ. */
  async guard(pid, vid){
    if (!vid) return false;
    const fdi = await Sec.needSession(pid, vid);
    if (!fdi) return false;
    S.patient = await DB.get('patients', pid);
    S.visit   = await DB.get('visits', vid);
    toast(T('needPick'), 'e');
    Nav.reset();
    await Doc.tooth(fdi);
    const sh = $('#sheet .sh');
    if (sh) sh.insertAdjacentHTML('afterbegin',
      `<div class="al r" style="margin:0 0 12px"><span>!</span>
         <span><b>${T('needPick')}</b><br>
         <span class="tiny">${T('needPickH')}</span></span></div>`);
    return true;
  },

  /* بعد إنهاء الجلسة: هل يحتاج المراجع جلسة أخرى؟ */
  async ask(pid, vid){
    /* أسنان عُمل عليها في هذه الجلسة — يمكن إنهاء سلسلة أيٍّ منها هنا */
    const works = vid ? await DB.by('works','vid',vid) : [];
    const teeth = [...new Set(works.map(w=>Number(w.fdi)).filter(Boolean))];
    const cards = [];
    for (const f of teeth){
      const cs = await Ops.courseTotals(pid, f);
      cards.push(`<div class="it" style="cursor:default">
        <div class="av mono">${Chart.lbl(f)}</div>
        <div class="gr">
          <div class="tiny">${T('courseTotal')}</div>
          <div class="mono h3" style="color:var(--ok)">${N(cs.paid)}
            <span class="tiny" style="color:var(--ink3)">/ ${N(cs.total)}</span></div>
        </div>
      </div>`);
    }

    UI.sheet(`
      ${cards.length?`<div class="card">
        <div class="lbl">${T('teethThisSession')}</div>
        <div class="col mt">${cards.join('')}</div>
      </div>`:''}

      <div class="ctr" style="padding:10px 4px">
        <div style="font-size:46px">📅</div>
        <div class="h2 mt">${T('askNext')}</div>
      </div>

      <button class="btn w mt2" onclick="Appt.pick('${pid}','${vid}')">${T('yes')}</button>
      ${S.role!=='secretary'
        ? `<button class="btn w sf mt" onclick="Appt.defer('${pid}','${vid}')">🗂 ${T('bySec')}</button>`
        : ''}
      ${teeth.length
        ? `<button class="btn w wn mt" onclick="Appt.sealAll('${pid}','${vid}')">
             ✔ ${T('sealNow')}</button>`
        : `<button class="btn w gh mt" onclick="Nav.home()">${T('no')}</button>`}`);
  },

  /* لا موعد قادم: تُختم ملفات كل أسنان هذه الجلسة وتظهر مكتملة */
  async sealAll(pid, vid){
    if (!ask(T('endCourseQ'))) return;
    const works = vid ? await DB.by('works','vid',vid) : [];
    const teeth = [...new Set(works.map(w=>Number(w.fdi)).filter(Boolean))];
    for (const f of teeth) await Ops.endCourse(pid, f);
    toast(T('sealedAll'), 's');
    Nav.home();
  },

  /* إنهاء سلسلة سن من شاشة الإنهاء */
  async endTooth(pid, fdi, vid){
    if (!ask(T('endCourseQ'))) return;
    await Ops.endCourse(pid, fdi);
    toast(T('courseDone'), 's');
    this.ask(pid, vid);
  },

  /* الطبيب يحيل تحديد الموعد للاستقبال — تظهر عندهم علامة انتظار */
  async defer(pid, vid){
    if (await this.guard(pid, vid)) return;
    const v = await DB.get('visits', vid);
    v.needAppt = true; await DB.put('visits', v);
    toast(T('deferred'), 's'); Nav.home();
  },

  /* تحديد اليوم والتاريخ الكامل */
  async pick(pid, vid, p){
    /* الموعد بلا معرفة الجلسة المنفَّذة يخرج على رقم خاطئ */
    if (await this.guard(pid, vid)) return;
    const d = new Date(); d.setDate(d.getDate()+7);
    const iso = d.toISOString().slice(0,10);
    UI.sheet(`
      <div class="shhead"><div class="gr">
        <div class="h2">${T('nextVisit')}</div>
        <div class="sub">${p ? T('apptFor')+' '+esc(nm(p)) : T('sendAppt')}</div>
      </div><button class="ib" onclick="Nav.back()">✕</button></div>
      <div class="card mt2">
        <label class="lb">${T('pickDate')} <span class="req">*</span></label>
        <input type="date" id="ap-d" class="mono" min="${today()}" value="${iso}"
               onchange="Appt.showDay()">
        <div id="ap-day" class="al i mt"></div>
        <div class="mt"><label class="lb">${T('pickTime')} <span class="req">*</span></label>
          <input type="time" id="ap-t" class="mono" value="10:00"></div>
        <div class="mt"><label class="lb">${T('notes')}</label>
          <input id="ap-n" placeholder="${T('workType')}"></div>
      </div>
      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
        <button class="btn gr" style="flex:2" onclick="Appt.send('${pid}','${vid}')">${T('sendAppt')}</button>
      </div>`);
    SG.attach($('#ap-n'),'worknote');
    this.showDay();
  },

  /* عرض اسم اليوم كاملاً مع التاريخ */
  showDay(){
    const v = $('#ap-d')?.value; if (!v) return;
    const d = new Date(v + 'T00:00:00');
    const day = d.toLocaleDateString(isAr()?'ar-IQ':'en-GB', { weekday:'long' });
    const full = d.toLocaleDateString(isAr()?'ar-IQ':'en-GB',
      { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    const box = $('#ap-day');
    if (box) box.innerHTML = `<span>📆</span><span><b>${esc(day)}</b> — ${esc(full)}</span>`;
  },

  async send(pid, vid){
    const d = $('#ap-d')?.value, t = $('#ap-t')?.value;
    if (!d || !t){ $('#ap-d').classList.add('err'); return; }
    await DB.put('appts', { id:uid(), pid, fromVid:vid, day:d, time:t,
                            note:($('#ap-n').value||'').trim(), st:'open', at:Date.now() });
    /* رفع علامة الانتظار عن الزيارة بعد تحديد الموعد */
    const vi = await DB.get('visits', vid);
    if (vi && vi.needAppt){ vi.needAppt = false; await DB.put('visits', vi); }
    await SG.learn('worknote', $('#ap-n').value);
    toast(T('apptSent'),'s'); Nav.home();
  },

  /* لوحة كل المواعيد القادمة — قسم مستقل للطبيب والسكرتير */
  bq:'',
  async board(){
    const v = $('#view');
    if (!$('#ap-q')){
      v.innerHTML = `
        <div class="sbar">
          <button class="btn" onclick="Appt.picker()">＋ ${T('newAppt')}</button>
          <input id="ap-q" placeholder="${T('apSearch')}" value="${esc(this.bq)}">
          <span class="pill b" id="ap-n">0</span>
        </div>
        <div id="ap-list" class="col mt2">${UI.spin()}</div>`;
      const i = $('#ap-q'); let tm;
      i.oninput = () => { clearTimeout(tm); this.bq = i.value;
                          tm = setTimeout(()=>this.board(), 200); };
    }
    const box = $('#ap-list'); if (!box) return;

    const q  = this.bq.trim().toLowerCase();
    const qd = q.replace(/\D/g,'');
    const all = (await DB.all('appts')).filter(a => a.st==='open')
                 .sort((a,b)=> (a.day+a.time).localeCompare(b.day+b.time));
    const td = today();
    const rows = [];
    for (const a of all){
      const p = await DB.get('patients', a.pid); if (!p) continue;
      if (q && !( nm(p).toLowerCase().includes(q)
               || String(p.mrn||'').toLowerCase().includes(q)
               || String(p.bc||'') === q
               || (qd && (p.phone||'').replace(/\D/g,'').includes(qd)) )) continue;
      const diff = Math.round((new Date(a.day) - new Date(td)) / 86400000);
      const when = diff < 0 ? T('overdue') : diff === 0 ? T('todayWord')
                 : diff === 1 ? T('tomorrow') : `${T('daysLeft')} ${diff} ${T('dayWord')}`;
      const tone = diff < 0 ? 'r' : diff === 0 ? 'b' : diff <= 2 ? 'w' : 'n';
      const dayName = new Date(a.day+'T00:00:00')
        .toLocaleDateString(isAr()?'ar-IQ':'en-GB',{weekday:'long'});
      /* المتأخّر يومض بالأحمر: مرّ موعده ولم يأتِ، وهذا وحده
         يستحق نظرة قبل غيره. */
      const late = diff < 0;
      rows.push(`<div class="it ${late?'live':''}" onclick="Appt.detail('${a.id}','${p.id}')">
        <div class="av ${tone==='r'?'r':tone==='b'?'':'w'}">${late?'⚠':'📅'}</div>
        <div class="gr">
          <div class="row" style="gap:6px">
            ${late?'<span class="dotlive"></span>':''}
            <div class="h3 ell">${esc(nm(p))}</div>
          </div>
          <div class="mono tiny">${esc(dayName)} · ${fmtD(a.day)} — ${esc(a.time||'')}</div>
          ${a.note?`<div class="tiny" style="margin-top:2px">${esc(a.note)}</div>`:''}
        </div>
        <div class="col" style="gap:5px;align-items:flex-end">
          <span class="pill ${tone}">${when}</span>
          <button class="btn xs gh" onclick="event.stopPropagation();Appt.cancel('${a.id}')">✕</button>
        </div>
      </div>`);
    }
    const n = $('#ap-n'); if (n) n.textContent = rows.length;
    box.innerHTML = rows.join('')
      || `<div class="emp">${this.bq ? T('apNone') : T('noNext')}</div>`;
  },

  /* فتح زيارة من الموعد: الموعد أدّى غرضه فيُغلق ويختفي من
     القائمة — سواء جاء في وقته أو قبله أو بعده. بقاؤه بعد فتح
     الزيارة يجعل القائمة تكذب. */
  /*──── المواعيد الفائتة ────
    موعد مضى يومه ولم تُفتح له زيارة يعني أن المراجع لم يحضر.
    يُنقل من قائمة المواعيد إلى سجلّه، فلا يزاحم القادم ولا يضيع
    أثره — والطبيب يرى من يتخلّف قبل أن يمنحه موعداً آخر. */
  async sweepMissed(){
    const td = today();
    let n = 0;
    for (const a of await DB.all('appts')){
      if (a.st !== 'open' || !a.day || a.day >= td) continue;
      const vs = await DB.by('visits','pid',a.pid);
      /* زيارة في يوم الموعد أو بعده تعني أنه حضر */
      if (vs.some(v => v.date >= a.day)) { a.st = 'done'; a.doneAt = Date.now(); }
      else { a.st = 'missed'; a.missedAt = Date.now(); n++; }
      await DB.put('appts', a);
    }
    return n;
  },

  /*──── تفاصيل الموعد ────
    فتح الزيارة مباشرة يجعل الطبيب يبدأ وهو لا يعرف أين توقّف:
    أي سن، وأي جلسة، وكم دُفع. فتُعرض الصورة أولاً ثم يُفتح.
    والقرار يبقى بيده — لا يُفتح شيء دون ضغطة. */
  async detail(aid, pid){
    const a = await DB.get('appts', aid);
    const p = await DB.get('patients', pid);
    if (!p) return this.board();

    const all = await DB.by('works','pid',pid);
    const rows = [];
    for (const t of (await DB.by('tooth','pid',pid))){
      const cur  = t.course || 1;
      const plan = (t.plans || {})[cur];
      if (!plan || !plan.sessions) continue;

      const ws = all.filter(w => Number(w.fdi) === Number(t.fdi) && (w.course||1) === cur);
      const done = new Set();
      ws.forEach(w => (w.sessionNos||[]).forEach(n => done.add(Number(n))));
      if (done.size >= plan.sessions) continue;        /* اكتملت */

      /* أول رقم لم يُنفَّذ هو الجلسة القادمة */
      let next = plan.sessions;
      for (let i = 1; i <= plan.sessions; i++) if (!done.has(i)){ next = i; break; }
      const cs = await Ops.courseTotals(pid, Number(t.fdi));

      rows.push(`<div class="card flat" style="margin-top:8px">
        <div class="row">
          <div class="av mono">${Chart.lbl(t.fdi)}</div>
          <div class="gr">
            <div class="h3">${esc(P(plan.proc).ar || plan.proc || '—')}</div>
            <div class="tiny">${T('apDone')} ${done.size} ${T('rcOf')} ${plan.sessions}
              ${T('apSess')}</div>
          </div>
          <span class="pill b">${T('apNext')} ${next}</span>
        </div>
        <div class="row mt" style="gap:8px">
          <div class="gr">
            <div class="tiny">${T('apPaidBefore')}</div>
            <div class="mono h3" style="color:var(--ok)">${N(cs.paid)}
              <span class="tiny" style="color:var(--ink3)">/ ${N(cs.total)}</span></div>
          </div>
          ${cs.total - cs.paid > 0 ? `<div style="text-align:end">
            <div class="tiny">${T('apLeft')}</div>
            <div class="mono h3" style="color:var(--bd)">${N(cs.total - cs.paid)}</div>
          </div>` : ''}
        </div>
      </div>`);
    }

    UI.sheet(`
      <div class="shhead">
        <div class="accic" style="width:44px;height:44px;font-size:19px">📅</div>
        <div class="gr">
          <div class="h2 ell">${esc(nm(p))}</div>
          <div class="mono tiny">${fmtD(a?.day)} — ${esc(a?.time||'')}</div>
        </div>
        <button class="ib" onclick="UI.close()">✕</button>
      </div>

      ${a?.note ? `<div class="card"><div class="lbl">${T('notes')}</div>
        <div class="mt" style="font-weight:600">${esc(a.note)}</div></div>` : ''}

      <div class="card">
        <div class="lbl">${T('apDetail')}</div>
        ${rows.join('') || `<div class="emp">${T('apNone')}</div>`}
      </div>

      <button class="btn w mt2" onclick="Appt.openFrom('${aid}','${pid}')">
        ${T('apOpenVisit')}</button>
      <button class="btn w gh mt" onclick="UI.close()">${T('close')}</button>`);
  },

  async openFrom(aid, pid){
    UI.close();
    const a = await DB.get('appts', aid);
    if (a){ a.st = 'done'; a.doneAt = Date.now(); await DB.put('appts', a); }
    const p = await DB.get('patients', pid);
    if (!p) return this.board();
    S.patient = p;
    await Ops.openVisit(pid, a?.note || '');
    toast(`${nm(p)} — ${T('visitOpened')}`, 's');
    S.tab = 'today'; App.draw();
  },

  /* اختيار المراجع قبل تحديد الموعد: بحث في المسجّلين أو تسجيل جديد */
  pq:'',
  picker(){
    UI.sheet(`
      <div class="shhead"><div class="gr"><div class="h2">${T('newAppt')}</div>
        <div class="sub">${T('pickPatient')}</div></div>
        <button class="ib" onclick="Nav.back()">✕</button></div>
      <div class="sbar">
        <input id="ap-q" placeholder="${T('searchPatient')}" value="${esc(this.pq)}">
      </div>
      <div id="ap-list" class="col mt2"></div>
      <div class="sep"></div>
      <div class="tiny ctr">${T('orNew')}</div>
      <button class="btn w gh mt" onclick="Sec.newPt()">＋ ${T('addPatient')}</button>`);

    const inp = $('#ap-q');
    let tm;
    inp.addEventListener('input', ()=>{ this.pq = inp.value;
      clearTimeout(tm); tm = setTimeout(()=>this.pickerList(), 200); });
    setTimeout(()=>inp.focus(), 120);
    this.pickerList();
  },

  async pickerList(){
    const box = $('#ap-list'); if (!box) return;
    const ps = await Ops.patients(this.pq);
    box.innerHTML = ps.slice(0,40).map(p=>`
      <div class="it" onclick="Appt.forPatientNew('${p.id}')">
        <div class="av">${esc(nm(p).charAt(0))}</div>
        <div class="gr">
          <div class="h3 ell">${esc(nm(p))}</div>
          <div class="mono tiny">${T('file')} ${esc(p.mrn)} · ${esc(p.phone||'')}</div>
        </div>
        <span style="color:var(--ink3)">${isAr()?'‹':'›'}</span>
      </div>`).join('') || `<div class="emp">${T('noResult')}</div>`;
  },

  /* عدد المواعيد القادمة — لشارة التبويب */
  async count(){
    return (await DB.all('appts')).filter(a => a.st==='open' && a.day >= today()).length;
  },

  async forPatient(pid){
    const rows = await DB.by('appts','pid',pid);
    return rows.filter(a => a.st==='open' && a.day >= today())
               .sort((a,b)=> a.day.localeCompare(b.day));
  },

  async cancel(id){
    if (!ask()) return;
    const a = await DB.get('appts', id); a.st='cancelled'; await DB.put('appts', a);
    toast(T('deleted')); App.draw();
  },

  /* السكرتير يحدد موعداً لمراجع من صفحته مباشرة */
  async forPatientNew(pid){
    const p  = await DB.get('patients', pid);
    const vs = (await DB.by('visits','pid',pid)).sort((a,b)=>(b.at||0)-(a.at||0));
    this.pick(pid, vs[0]?.id || '', p);
  },
};

/*═══════════════ تطبيق المراجع ═══════════════*/
const Pt = {
  /*──── حجز موعد: البيانات + الاستمارة الصحية ────*/
  book(){
    const v = $('#view');
    v.innerHTML = `
      <div class="card">
        <div class="h2">${T('t_new')}</div>
        <div class="sub">${T('markYes')}</div>
      </div>
      <div class="card">
        <div class="g2">
          <div><label class="lb">${T('pickDate')} <span class="req">*</span></label>
            <input type="date" id="b-day" class="mono" min="${today()}" value="${today()}"></div>
          <div><label class="lb">${T('pickTime')} <span class="req">*</span></label>
            <input type="time" id="b-time" class="mono" value="10:00"></div>
        </div>
      </div>
      <div class="card" id="b-form">${Form.html({ phone: S.user?.phone })}</div>
      <div id="b-err" class="al r mt hide"></div>
      <button class="btn w mt2" onclick="Pt.send()">${T('bookNow')}</button>`;
    Form.wire();
  },

  async send(){
    if (!Form.validate()){
      const e=$('#b-err'); e.textContent=T('fillAll'); e.classList.remove('hide');
      window.scrollTo({top:0,behavior:'smooth'}); return;
    }
    const d = Form.read();
    const mh = d.mh;
    /* يجب اختيار حالة واحدة على الأقل — أو تأكيد أن الصحة جيدة */
    if (!Object.keys(mh).length){
      const e=$('#b-err'); e.textContent=T('mustPickOne'); e.classList.remove('hide');
      document.getElementById('f-mh').scrollIntoView({behavior:'smooth'}); return;
    }
    const b = { id:uid(), ...d, cid: S.clinic?.id || CFG.data.cid,
                day:$('#b-day').value, time:$('#b-time').value,
                st:'new', at:Date.now() };
    await DB.put('bookings', b);
    await Form.learn(d);

    const phone = (S.user?.phone||'').replace(/\D/g,'');
    const cid = S.user?.cid || CFG.data.cid;
    const all = (await DB.all('patients')).filter(x => !x.cid || x.cid === cid);
    const p = all.find(x => (x.phone||'').replace(/\D/g,'') === phone);

    const bks = (await DB.all('bookings')).filter(b =>
      (b.phone||'').replace(/\D/g,'')===phone && b.st==='new' && (!b.cid || b.cid===cid));

    if (!p){
      v.innerHTML = `
        ${bks.length?`<div class="card"><div class="lbl">${T('t_book')}</div>

      return;

    S.patient = p;
    const L    = await Ops.ledger(p.id);
    const vs   = (await DB.by('visits','pid',p.id)).sort((x,y)=>(y.at||0)-(x.at||0));
    const open = vs.find(x=>x.st==='open');
    const next = await Appt.forPatient(p.id);

        <summary>

          </span>

          <span class="ar">${isAr()?'‹':'›'}</span>
        </summary>
        <div class="bd">
          ${t.courses.map(c=>`
            <div class="row" style="justify-content:space-between;margin-bottom:8px">
              <span class="pill ${c.closed?'n':'b'}">${T('courseNo')} ${c.n} ·

              </div>`).join('')}</div>`).join('')}

      </details>`).join('');

    /* الزيارات كقوائم منسدلة */
    const visitAcc = [];

    v.innerHTML = `
      <div class="card">${ptHead(p)}
        <div class="g3 mt">
          <div class="ctr"><div class="tiny">${T('grandTotal')}</div>
            <div class="mono h2" style="color:var(--ok)">${N(L.allPaid)}</div></div>
          <div class="ctr"><div class="tiny">${T('visitsCount')}</div>
            <div class="mono h2">${L.visitCount}</div></div>

          ${C39.svg(open.code, 62)}
          <div class="mono ctr" style="color:#000;font-weight:700;letter-spacing:.14em;margin-top:5px">
            ${esc(open.code)}</div>
        </div></div>`:''}

      <div class="card">
        <div class="lbl">${T('nextVisits')}</div>
        ${next.length ? `<div class="col mt">${next.map(a2=>{
          const dn = new Date(a2.day+'T00:00:00')

      ${teethAcc?`<div class="mt2"><div class="lbl">${T('perTooth')}</div>${teethAcc}</div>`:''}

      <div class="mt2"><div class="lbl">${T('sessions')} (${vs.length})</div>

          ${mins.map(m=>`<option value="${m}" ${cur===m?'selected':''}>
            ${m?`${m} ${T('lockMin')}`:T('lockOff')}</option>`).join('')}
        </select></div>
      <button class="btn w gh mt2" onclick="Guard.lock(false)">${T('lockNow')}</button>`;


    const own = S.role === 'owner', doc = S.role === 'doctor', mg = Perm.manage() && Sync.on();
    $('#view').innerHTML =
        (own ? `<div class="al i" style="margin-bottom:6px"><span>★</span><span>${T('ownerData')}</span></div>` : '')
      + (doc && Sync.on() ? this.acc('pf','🪪', T('secProfile'), this.profileBox()) : '')
      + (doc && Sync.on() ? this.acc('tm','🤝', T('secTeam'), this.teamBox()) : '')
      + (mg ? this.acc('br','✨', T('secBrand'), this.brandBox()) : '')
      + (mg ? this.acc('st','👥', T('secStaff'), this.staffBox()) : '')
      + (S.role !== 'pharmacy' && (Cloud.me?.code || Brand.get().code)
          ? this.acc('cc','▮▮', T('secCode'), this.codeBox()) : '')
      + this.acc('g','🏥', T('secGeneral'), general)
      + (own ? '' : this.acc('p','🖨', T('secPrint'),   print))
      + this.acc('l','🎨', T('secLook'),    skin + '<div class="sep"></div>' + look)
      + (Sync.on() ? this.acc('sy','🔄', T('syncSection'), sync) : '')
      + this.acc('cl','☁', T('cloudSection'), cloud)
      + ((doc || own) ? this.acc('s','🛡', T('secSafety'), safety) : '')
      + (S.role==='doctor' ? this.acc('r','🔐', T('secPerm'), perm) : '')
      + (S.role==='doctor' ? this.acc('t','🦷', T('toothStatuses'), statuses) : '')
      + (S.role==='doctor' ? this.acc('pc','🧰', T('procTypes'), procs) : '')
      + (S.role==='doctor' ? this.acc('d','💾', T('secData'), data) : '');

    const pick = (id, key) => {
      const n = $('#'+id); if (!n) return;
      n.onchange = async e => {
        const f = e.target.files[0]; if(!f) return;
        const rd = new FileReader();
        rd.onload = async () => { CFG.data[key] = rd.result; await CFG.save(); Cfg.draw(); };
        rd.readAsDataURL(f);
      };
    };
    pick('s-logo','logo'); pick('s-sign','sign');
    if (mg) this.fillStaff();
    if (doc && Sync.on()){ this.fillTeam(); this.fillProf(); }

    /* محاولة تعرّف صامتة على الطابعات عند فتح الإعدادات: إن وُجد
       جسر يعطي الأسماء ظهرت في القائمتين بلا ضغط زر، وإن لم يوجد
       لم يتغيّر شيء ولم تظهر رسالة. */
    Prn.detect().then(l => {
      if (l.length && !Prn._auto){ Prn._auto = true; Cfg.draw(); }
    }).catch(()=>{});
  },

    return `

      <input id="br-name" value="${esc(b.name && b.name !== b.clinic ? b.name : '')}"

      <div class="mt2"><label class="lb">${T('clinicLogo')}</label>

            <label class="btn gh" style="cursor:pointer">${T('pickLogo')}
              <input type="file" class="hide" accept="image/png,image/jpeg,image/webp"

      this._newLogo = await Brand.shrink(f);
      if (box) box.innerHTML = `<img src="${esc(this._newLogo)}" alt="">`;
    } catch (e) { toast(String(e.message || e), 'e'); }

  async brandSave(){
    if (!Sync.on() || !navigator.onLine) return toast(T('syncOff'), 'e');
    const body = { app_name: ($('#br-name')?.value || '').trim() };
    if (this._newLogo !== undefined) body.logo = this._newLogo;
    const b = $('#br-go'); b.disabled = true; b.textContent = T('cloudBusy');
    try {
      const d = await Cloud.call('/rest/v1/rpc/clinic_update', { method:'POST', body:{ p:body } });

      const m = String(e.message || e);

  /*════════ حسابات الطاقم (المستثمر) ════════*/
  staffBox(){ return `<div id="staffbox">${UI.spin()}</div>`; },

  async fillStaff(){
    const box = $('#staffbox'); if (!box) return;
    const d = await Staff.load(true);
    if (!box.isConnected) return;
    if (!d || !d.limits){ box.innerHTML = `<div class="al r"><span>!</span><span>${T('staffLoadFail')}</span></div>`; return; }
    const lim = d.limits || {};
    const ic = { doctor:'🦷', secretary:'🗂', pharmacy:'💊' };
    const add = { doctor:T('addDoctor'), secretary:T('addSec'), pharmacy:T('addPharm') };
    const group = role => {
      const all = Staff.members(role);
      const act = all.filter(m => m.active !== false).length;
      const max = Number(lim[role] ?? 0);
      const full = act >= max;
      return `<div class="stgrp mt2">
        <div class="row">
          <div class="gr h3">${ic[role]} ${T('r_'+role)}</div>
          <span class="pill ${full?'w':'b'} mono">${act} / ${max}</span>
        </div>
        <div class="track mt" style="height:6px"><i style="width:${max?Math.min(100,act/max*100):100}%;
          background:${full?'var(--wr)':'linear-gradient(90deg,var(--br),var(--br2))'}"></i></div>
        <div class="col mt">${all.length ? all.map(m => this.staffRow(m, ic[role])).join('')
          : `<div class="emp" style="padding:18px">${T('noStaffYet')}</div>`}</div>
        <button class="btn w gh mt" ${full?'disabled':''} onclick="Cfg.accAdd('${role}')">${add[role]}</button>
        ${full?`<div class="tiny mt" style="color:var(--wr)">${T('quotaFull')}</div>`:''}
      </div>`;
    };
    box.innerHTML = `<div class="tiny">${T('staffHint')}</div>`
      + (S.role === 'doctor' ? `<div class="al i mt"><span>ℹ</span><span>${T('legacyManage')}</span></div>` : '')
      + group('doctor') + group('secretary') + group('pharmacy');
  },

  staffRow(m, ic){
    const off = m.active === false;
    const st = off ? ['r', T('staffOff')] : m.confirmed ? ['g', T('accOk')] : ['w', T('accPending')];
    const self = m.uid === S.user?.uid;
    return `<div class="it" style="cursor:default">
      <div class="av ${st[0]}">${ic}</div>
      <div class="gr">
        <div class="h3 ell">${esc(m.name || m.email || '—')}</div>
        <div class="mono tiny ell">${esc(m.email || '')}</div>
      </div>
      <div style="text-align:end">
        <span class="pill ${st[0]}">${st[1]}</span>
        <div class="row mt" style="gap:6px;justify-content:flex-end">
          ${(!m.confirmed && !off) ? `<button class="btn xs gh"
            onclick="Cfg.accConfirm('${esc(m.email)}')">${T('accConfirm')}</button>` : ''}
          ${self ? '' : `<button class="btn xs ${off?'':'gh'}"
            onclick="Cfg.staffActive('${m.uid}',${off})">${off?T('enableAcc'):T('disableAcc')}</button>`}
        </div>
      </div>
    </div>`;
  },

  async staffActive(uid, on){
    if (!on && !ask(T('disableQ'))) return;
    try {
      await Cloud.staffFn({ action:'setActive', user_id:uid, active:!!on });
      toast(T('saved'), 's');
      this.fillStaff();
    } catch (e) { toast(String(e.message || e), 'e'); }
  },

  /*════════ فريقي (الطبيب) ════════*/
  teamBox(){ return `<div id="teambox">${UI.spin()}</div>`; },

  async fillTeam(){
    const box = $('#teambox'); if (!box) return;
    const d = await Staff.load(true);
    if (!box.isConnected) return;
    if (!d){ box.innerHTML = `<div class="al r"><span>!</span><span>${T('staffLoadFail')}</span></div>`; return; }
    const me = S.user?.uid;
    const kinds = [['secretary', T('mySecs'), ''], ['pharmacy', T('myPharms'), ''],
                   ['doctor', T('myViewers'), T('viewersHint')]];
    box.innerHTML = `<div class="tiny">${T('teamHint')}</div>` + kinds.map(([k, title, hint]) => {
      const list = Staff.members(k).filter(m => m.uid !== me && m.active !== false);
      const on = new Set(Staff.linked(k).map(m => m.uid));
      return `<div class="mt2"><div class="lbl">${title}</div>
        ${hint ? `<div class="tiny mt">${hint}</div>` : ''}
        <div class="col mt" data-kind="${k}">${list.length ? list.map(m => `
          <div class="chk ${on.has(m.uid)?'on':''}" data-uid="${m.uid}" onclick="this.classList.toggle('on')">
            <div class="bx">✓</div>
            <div class="gr"><div style="font-weight:700">${esc(m.name || m.email || '—')}</div>
              <div class="tiny mono">${esc(m.email || '')}</div></div>
          </div>`).join('') : `<div class="emp" style="padding:16px">${T('noneOfKind')}</div>`}</div>
      </div>`;
    }).join('') + `<button class="btn w mt2" id="team-go" onclick="Cfg.teamSave()">${T('save')}</button>`;
  },

  async teamSave(){
    if (!Sync.on() || !navigator.onLine) return toast(T('syncOff'), 'e');
    const b = $('#team-go'); if (b){ b.disabled = true; b.textContent = T('cloudBusy'); }
    try {
      for (const k of ['secretary', 'pharmacy', 'doctor']){
        const ids = [...document.querySelectorAll(`#teambox [data-kind="${k}"] .chk.on`)]
          .map(x => x.dataset.uid);
        /* المعطّلون لا يظهرون في القائمة — روابطهم تُحفظ كما هي */
        for (const m of Staff.linked(k)) if (m.active === false) ids.push(m.uid);
        await Cloud.call('/rest/v1/rpc/doctor_links_set',
          { method:'POST', body:{ p_kind:k, p_members:ids } });
      }
      await Staff.load(true);
      toast(T('teamSaved'), 's');
    } catch (e) { toast(String(e.message || e), 'e'); }
    finally { if (b){ b.disabled = false; b.textContent = T('save'); } }
  },

                      title:($('#pf-title')?.value || '').trim() });
    toast(T('saved'), 's');

    await Prof.save(cur);

  accAdd(role){
    const icon = { pharmacy:'💊', secretary:'🗂', doctor:'🦷' }[role] || '👤';
    const title = { pharmacy:T('newPharmAcc'), secretary:T('newSecAcc'), doctor:T('newDoctorAcc') }[role];
    const nameLb = { pharmacy:T('pharmName'), secretary:T('secName'), doctor:T('docAccName') }[role];
    UI.sheet(`
      <div class="shhead">
        <div class="accic" style="width:44px;height:44px;font-size:19px">${icon}</div>
        <div class="gr"><div class="h2">${title}</div>
          <div class="tiny">${T('staffHint')}</div></div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>
      <div class="card">
        <label class="lb">${nameLb} <span class="req">*</span></label>
        <input id="ac-name" autocomplete="off">
        <div class="mt"><label class="lb">${T('accEmail')} <span class="req">*</span></label>
          <input id="ac-mail" type="email" dir="ltr" spellcheck="false" inputmode="email"></div>
        <div class="mt"><label class="lb">${T('accPass')} <span class="req">*</span></label>
          <input id="ac-p1" type="password" dir="ltr" autocomplete="new-password"></div>
        <div class="mt"><label class="lb">${T('accPass2')} <span class="req">*</span></label>
          <input id="ac-p2" type="password" dir="ltr" autocomplete="new-password"></div>
        <div id="ac-err" class="al r mt hide"></div>
        <div class="row mt2" style="gap:9px">
          <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
          <button class="btn gr" style="flex:2" id="ac-go"
            onclick="Cfg.accSave('${role}')">${T('save')}</button>
        </div>
      </div>`);
    setTimeout(()=>$('#ac-name')?.focus(), 140);
  },

  async accSave(role){
    const v = id => ($('#'+id)?.value || '').trim();
    const err = $('#ac-err');
    const show = m => { err.textContent = m; err.classList.remove('hide'); };
    err.classList.add('hide');

    const name = v('ac-name');
    const mail = v('ac-mail').toLowerCase();
    const p1 = $('#ac-p1')?.value || '', p2 = $('#ac-p2')?.value || '';

    if (name.length < 2) return show(T('fillAll'));
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return show(T('email'));
    if (p1.length < 8) return show(T('pass8'));
    if (p1 !== p2)     return show(T('passMatch'));
    if (Staff.members().some(m => String(m.email||'').toLowerCase() === mail))
      return show(T('emailTaken'));

    const b = $('#ac-go'); b.disabled = true; b.textContent = T('cloudBusy');
    try {
      /* السيرفر يتحقّق من الصلاحية والحدّ ويأخذ العيادة من حسابك */
      await Cloud.addAccount({ role, email:mail, password:p1, name });
      await Staff.load(true);

      Nav.back();
      toast(T('accAdded'), 's');
      this.accConfirm(mail);
    } catch (e) {
      show(String(e.message || e));
    } finally {
      b.disabled = false; b.textContent = T('save');
    }
  },

  /*──── تأكيد بريد الحساب برمز ────
    الرمز يصل إلى بريد الصيدلية أو السكرتير، ويُكتب هنا من جهاز
    الطبيب أو من جهازهم — كلاهما يصحّ، فالتأكيد على السيرفر. */
  accConfirm(email){
    UI.sheet(`
      <div class="shhead">
        <div class="accic" style="width:44px;height:44px;font-size:19px">📩</div>
        <div class="gr"><div class="h2">${T('accConfirm')}</div>
          <div class="mono tiny ell">${esc(email)}</div></div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>
      <div class="card">
        <label class="lb">${T('confirmCode')}</label>
        <input id="ac-code" inputmode="numeric" dir="ltr" maxlength="8"
          autocomplete="one-time-code" placeholder="——————"
          oninput="this.value=this.value.replace(/\D/g,'')"
          style="letter-spacing:.32em;text-align:center;font-size:20px;font-weight:800">
        <div class="tiny mt">${T('confirmHint')}</div>
        <div id="ac-cerr" class="al r mt hide"></div>
        <button class="btn w mt2" id="ac-cgo"
          onclick="Cfg.accConfirmGo('${esc(email)}')">${T('confirmGo')}</button>
        <button class="btn w gh mt" onclick="Login.resend('${esc(email)}')">
          ${T('resendCode')}</button>
      </div>`);
    setTimeout(()=>$('#ac-code')?.focus(), 140);
  },

  async accConfirmGo(email){
    const err = $('#ac-cerr');
    const show = m => { err.textContent = m; err.classList.remove('hide'); };
    err.classList.add('hide');
    const code = ($('#ac-code')?.value || '').trim();
    if (!/^\d{6}$|^\d{8}$/.test(code)) return show(T('code6'));

    const b = $('#ac-cgo'); b.disabled = true; b.textContent = T('cloudBusy');
    try {
      /* جلسة الحساب الجديد لا تُحفظ: الطبيب يبقى داخلاً بحسابه */
      const d = await Cloud.call('/auth/v1/verify', { method:'POST', auth:false,
        body:{ type:'signup', email, token:code } });
      if (!d?.access_token) return show(T('confirmBad'));

      await Staff.load(true);
      Nav.back();
      toast(T('confirmDone'), 's');
      this.draw();
    } catch (e) {
      const m = String(e.message || e);
      show(/token|expired|invalid/i.test(m) ? T('confirmBad') : m);
    } finally { b.disabled = false; b.textContent = T('confirmGo'); }
  },

  async accDel(id){
    const a = (CFG.data.accounts || []).find(x => x.id === id); if (!a) return;
    if (!ask(`${esc(a.name || a.email)}\n\n${T('accRemoveHint')}\n\n${T('confirm')}?`)) return;
    CFG.data.accounts = (CFG.data.accounts || []).filter(x => x.id !== id);
    await CFG.save();
    toast(T('saved'), 's');
    this.draw();
  },

  /*──── الطابعات ────
    ورقة العلاج A5 وملصق الباركود لا يخرجان من طابعة واحدة عادةً،
    فلكلٍّ طابعته. والاختيار محلي في هذا الجهاز لا يُزامَن، لأن
    طابعة الاستقبال ليست طابعة غرفة الطبيب. */
  printersBox(){
    const list = Prn.names();
    const L = Prn.label();
    const sel = (kind) => {
      const cur = Prn.get(kind, '');
      const opts = list.map(n =>
        `<option value="${esc(n)}" ${cur===n?'selected':''}>${esc(n)}</option>`).join('');
      const extra = (cur && !list.includes(cur))
        ? `<option value="${esc(cur)}" selected>${esc(cur)}</option>` : '';
      return `<select onchange="Cfg.prnSet('${kind}', this.value)">
        <option value="">${T('prnDefault')}</option>${opts}${extra}</select>`;
    };

    return `
      <div class="card flat mt2" style="padding:12px">

    بريد — يغادر كل حماية بنيناها. وهو يحوي كل ملفات المراجعين.
    فهو الشيء الوحيد الذي يستحق التشفير فعلاً، لأن مفتاحه في رأس
    الطبيب لا في الملف. */
  async export(){
    if (!Guard.can()) return toast(T('encNo'), 'e');
    const pass = prompt(T('encBackup') + '\n' + T('encHint'));
    if (pass === null) return;
    if (String(pass).length < 8) return toast(T('encShort'), 'e');

    toast(T('cloudBusy'));
    const out = {};
    for (const st of DB.STORES) out[st] = await DB.all(st);

    const enc = await Vault.seal(JSON.stringify(out), pass);
    const blob = new Blob([JSON.stringify(enc)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `dentalos-${today()}.dosbak`;
    a.click();
    toast(T('encDone'), 's');
  },

  async import(inp){
    const f = inp.files[0]; if (!f) return;
    let raw;
    try { raw = JSON.parse(await f.text()); }
    catch(_){ return toast(T('encBad'), 'e'); }

    let data = raw;
    if (raw && raw.v === 1 && raw.alg === 'AES-GCM'){
      const pass = prompt(T('encAsk'));
      if (pass === null) return;
      const txt = await Vault.open(raw, pass);
      if (!txt) return toast(T('encBad'), 'e');
      try { data = JSON.parse(txt); } catch(_){ return toast(T('encBad'), 'e'); }
    } else {
      /* الملفات القديمة تُقبل حتى لا تضيع نسخة موجودة */
      toast(T('encOld'), 'w');
    }

    if (!ask()) return;
    for (const st of DB.STORES) for (const row of (data[st] || [])) await DB.put(st, row);
    await CFG.load(); toast(T('saved'), 's'); location.reload();
  },
};

  الحجز الجديد كان يمرّ في رسالة عابرة تختفي بعد ثوانٍ: من كان في
  شاشة أخرى لم يعلم به أبداً. الجرس يبقى ظاهراً بعدده حتى تُفتح
  الحجوزات وتُحسم، ومعه صوت قصير واهتزاز.
═══════════════════════════════════════════*/
const Notify = {
  ac:null,

  /* الحجوزات تخصّ الاستقبال والطبيب — الصيدلي والمراجع لا يعنيهما */
  sees(){ return S.role === 'doctor' || S.role === 'secretary'; },

  async count(){
    if (!this.sees()) return 0;
    try { return (await DB.all('bookings')).filter(b => b.st === 'new').length; }
    catch(_){ return 0; }
  },

  async paint(){
    const btn = $('#bellbtn'); if (!btn) return;
    btn.classList.toggle('hide', !this.sees());
    if (!this.sees()) return;
    const n = await this.count();
    btn.title = `${n} ${T('t_book')}`;
    btn.classList.toggle('ring', !!n);
    const c = $('#bellcnt'); if (!c) return;
    c.textContent = n > 99 ? '99+' : n;
    c.classList.toggle('hide', !n);
  },

  /* نغمة قصيرة مولّدة داخل المتصفح — بلا ملف صوت يُحمَّل */
  beep(){
    try {
      const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
      this.ac = this.ac || new A();
      if (this.ac.state === 'suspended') this.ac.resume();
      const t = this.ac.currentTime;
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(880, t);
      o.frequency.setValueAtTime(1174, t + .16);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.18, t + .03);
      g.gain.exponentialRampToValueAtTime(.0001, t + .42);
      o.connect(g); g.connect(this.ac.destination);
      o.start(t); o.stop(t + .44);
    } catch(_){}
  },

  async refresh(fresh){
    await this.paint();
    try { if (S.role) await App.badges(); } catch(_){}
    if (!fresh || !this.sees()) return;
    toast(`${fresh} ${T('newBooking')}`, 's');
    this.beep();
    if (navigator.vibrate) try { navigator.vibrate([90,60,90]); } catch(_){}
    /* شاشة الحجوزات المفتوحة تُحدَّث في مكانها بلا انتظار */
    if (S.tab === 'book' && !Nav.stack.length) Sec.books();
  },

  open(){ if (this.sees()) App.setTab('book'); },
};

  async badges(){
