/*═══════════════ التخزين — IndexedDB ═══════════════*/
/* بعض السياقات تمنع IndexedDB: فتح الملف من مدير ملفات أندرويد
   (content://) أو التصفّح الخاص. عندها ننتقل تلقائياً إلى تخزين
   بديل يحفظ في localStorage، ولو مُنع هذا أيضاً نعمل في الذاكرة
   مع تحذير صريح بأن البيانات لن تبقى بعد إغلاق الصفحة. */
const MEM = {
  data:{}, mode:'memory',

  init(stores){
    stores.forEach(s => this.data[s] = this.data[s] || {});
    try {
      const raw = localStorage.getItem('dentalos_fallback');
      if (raw) Object.assign(this.data, JSON.parse(raw));
      localStorage.setItem('dentalos_probe','1');
      localStorage.removeItem('dentalos_probe');
      this.mode = 'local';
    } catch { this.mode = 'memory'; }
  },

  flush(){
    if (this.mode !== 'local') return;
    try { localStorage.setItem('dentalos_fallback', JSON.stringify(this.data)); }
    catch { /* الحصة ممتلئة — الصور الكبيرة قد تتجاوزها */ }
  },

  put(st, o){ (this.data[st] ||= {})[o.id] = o; this.flush(); return o; },
  get(st, id){ return (this.data[st]||{})[id] || null; },
  all(st){ return Object.values(this.data[st]||{}); },
  by(st, idx, v){ return this.all(st).filter(x => x[idx] === v); },
  del(st, id){ delete (this.data[st]||{})[id]; this.flush(); },
  clearAll(){ for (const k of Object.keys(this.data)) this.data[k] = {}; this.flush(); },
};

const DB = {
  _db:null, fallback:false,
  /* users بقي مخزناً لتُمحى بقاياه عند الترقية، وخرج من
     قائمة التصدير فلا يُنقل شيء ميّت إلى نسخة احتياطية. */
  STORES:['patients','visits','works','payments','rx','files','settings','bookings','suggest','tooth','appts'],
  ALL:['patients','visits','works','payments','rx','files','settings','users','bookings','suggest','tooth','appts'],

  async open(){
    if (this.fallback) return null;
    if (this._db) return this._db;
    try {
      this._db = await this._openIDB();
    } catch (e) {
      /* المنع متوقّع في content:// — ننتقل للبديل بدل تعطيل البرنامج */
      this.fallback = true;
      MEM.init(this.STORES);
      throw Object.assign(new Error('STORAGE_FALLBACK'), { cause:e });
    }
    return this._db;
  },

  async _openIDB(){
    return await new Promise((res,rej)=>{
      /* الإصدار ٦ يبقى: جهاز فُتحت عليه نسخة سابقة بهذا الإصدار لا
         يستطيع الرجوع إلى ٥ (يرفض المتصفح فتح قاعدة بإصدار أقدم). */
      const r = indexedDB.open('dentalos', 6);
      /* تبويب قديم مفتوح يمنع ترقية قاعدة البيانات فتتجمّد بصمت.
         هنا نُعلم المستخدم بدل أن يبقى الزر بلا استجابة. */
      r.onblocked = () => rej(new Error(
        'أغلق نسخ البرنامج المفتوحة في التبويبات الأخرى ثم أعد التحميل'));
      setTimeout(() => rej(new Error('تعذّر فتح قاعدة البيانات — أعد تحميل الصفحة')), 8000);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        /* المخازن تُنشأ من ALL لا STORES — users ما زال يُفتح
           ليُقرأ ويُمحى، وإن سقط من الإنشاء فشلت المعاملة. */
        /* صندوق الصادر: كل تعديل محلي يُسجَّل هنا حتى يُرفع بنجاح،
           فلا يضيع عمل أُنجز بلا إنترنت. */
        if (!db.objectStoreNames.contains('outbox'))
          db.createObjectStore('outbox', { keyPath:'id' });
        /* من تجربة «الصور محلياً» الملغاة — يبقى المخزن ليُرفع ما فيه */
        if (!db.objectStoreNames.contains('imgs'))
          db.createObjectStore('imgs', { keyPath:'id' });
        if (!db.objectStoreNames.contains('kv'))
          db.createObjectStore('kv', { keyPath:'k' });
        for (const s of DB.ALL){
          if (!db.objectStoreNames.contains(s)){
            const os = db.createObjectStore(s, { keyPath:'id' });
            if (['visits','works','payments','rx','files','tooth','appts'].includes(s))
              os.createIndex('pid','pid',{unique:false});
            if (s==='works'||s==='rx'||s==='files') os.createIndex('vid','vid',{unique:false});
            if (s==='visits') os.createIndex('code','code',{unique:false});
          }
        }
      };
      r.onsuccess = e => res(e.target.result);
      r.onerror  = e => rej(e.target.error);
    });
  },

  async tx(store, mode='readonly'){
    const db = await this.open();
    return db.transaction(store, mode).objectStore(store);
  },

  /* كل كتابة تُختم بوقتها وتُقيَّد في صندوق الصادر.
     التغليف هنا لا في مواضع الاستدعاء، فلا يمكن أن يفوت تعديل. */
  /* opts.quiet: كتابة واردة من السيرفر — لا ختم جديد ولا صادر */
  async put(store, obj, opts){
    const quiet = !!(opts?.quiet || Sync.quiet);
    /* الختم بساعة متفق عليها بين الأجهزة لا بساعة الجهاز وحده */
    if (store !== 'outbox' && obj && typeof obj === 'object' && !quiet)
      obj._up = Sync.now();
    /* ملكية السجل: كل سجل سريري يحمل طبيبه، فيعرف السيرفر من يراه.
       المراجع يأخذ طبيبه عند تسجيله، وما سواه يرث طبيب مراجعه.
       يُختم هنا وحده فلا يفوته أي مسار إنشاء. */
    if (!quiet && obj && typeof obj === 'object' && !obj._own && Own.STORES.includes(store)){
      try { obj._own = await Own.of(store, obj); } catch(_){}
      if (!obj._own) delete obj._own;
    }
    let done;
    if (this.fallback) done = await MEM.put(store, obj);
    else {
      /* المعاملة تُفتح خارج الوعد: منفّذ async يبتلع الرفض فيتجمّد الحفظ بصمت */
      const os = await this.tx(store,'readwrite');
      done = await new Promise((res,rej)=>{
        const r = os.put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error);
      });
    }
    if (store !== 'outbox' && obj?.id && !quiet) Sync.queue(store, obj.id, false);
    return done;
  },
  async get(store, id){
    if (this.fallback) return MEM.get(store, id);
    const os = await this.tx(store);
    return new Promise((res,rej)=>{ const r=os.get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
  },
  async all(store){
    if (this.fallback) return MEM.all(store);
    const os = await this.tx(store);
    return new Promise((res,rej)=>{ const r=os.getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
  },
  async by(store, index, val){
    if (this.fallback) return MEM.by(store, index, val);
    const os = await this.tx(store);
    return new Promise((res,rej)=>{
      const r = os.index(index).getAll(val);
      r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
    });
  },
  async del(store, id, opts){
    const quiet = !!(opts?.quiet || Sync.quiet);
    /* مسار السجل ومراجعه يُحفظان مع الحذف: الشاهدة تُرفع إلى المكان نفسه */
    let old = null;
    if (store !== 'outbox' && !quiet){ try { old = await this.get(store, id); } catch(_){} }
    let done;
    if (this.fallback) done = await MEM.del(store, id);
    else {
      const os = await this.tx(store,'readwrite');
      done = await new Promise((res,rej)=>{
        const r = os.delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);
      });
    }
    /* الحذف يُرفع كشاهدة، وإلا عاد السجل من جهاز آخر */
    if (store !== 'outbox' && !quiet) Sync.queue(store, id, true, old?._k || old?._own || null, old?.pid || null);
    return done;
  },
  async clearAll(){
    if (this.fallback) return MEM.clearAll();
    const db = await this.open();
    const tx = db.transaction(DB.ALL,'readwrite');
    DB.ALL.forEach(s=>tx.objectStore(s).clear());
    return new Promise(res=>{ tx.oncomplete=res; });
  },
};

  try {
    /* التحويل عبر صيغة قابلة للتحليل — لا مكتبة ولا جدول إزاحات */
    return new Date(new Date(t).toLocaleString('en-US', { timeZone: tz }));
  } catch(_){ return new Date(t); }
};

const SG = {
  async learn(field, val){
    const v = String(val||'').trim();
    if (v.length < 2 || v.length > 140) return;
    const id = field+'::'+v;
    const cur = await DB.get('suggest', id);
    await DB.put('suggest', { id, field, v, n:(cur?.n||0)+1, at:Date.now() });
  },
  async find(field, q){
    const all = await DB.all('suggest');
    const s = String(q||'').trim();
    return all.filter(x => x.field===field && (!s || x.v.includes(s)) && x.v!==s)
              .sort((a,b)=> b.n-a.n || b.at-a.at).slice(0,6).map(x=>x.v);
  },
  attach(inp, field){
    if (!inp) return;
    inp.parentElement.classList.add('sgw');
    let box=null, tm=null;
    const close=()=>{ if(box){box.remove(); box=null;} };
    const show=async()=>{
      const items = await SG.find(field, inp.value);
      close(); if(!items.length) return;
      box = el(`<div class="sgs">${items.map(v=>`<div>${esc(v)}</div>`).join('')}</div>`);
      [...box.children].forEach((d,i)=> d.onmousedown = e=>{ e.preventDefault(); inp.value=items[i]; close(); });
      inp.parentElement.appendChild(box);
    };
    inp.addEventListener('focus', show);
    inp.addEventListener('input', ()=>{ clearTimeout(tm); tm=setTimeout(show,160); });
    inp.addEventListener('blur', ()=> setTimeout(close,170));
  },
};

/*═══════════════ الضغط المطوّل ═══════════════
  خيارات إضافية بلا أزرار تزحم القوائم: أي عنصر يحمل data-hold
  يُنفِّذ ما فيه بعد نصف ثانية من الضغط، والضغطة العادية تبقى كما هي.
═══════════════════════════════════════════*/
const Hold = {
  t:null, fired:false, x:0, y:0, el:null, MS:550, SLIP:12,

  /* الإجراءات المسموحة بالضغط المطوّل — قائمة مغلقة */
  ACTIONS:{
    delPatient: pid       => Del.patient(pid),
    delTodayRow:(vid, pid) => Del.todayRow(vid, pid),
  },

  init(){
    const clear = () => {
      clearTimeout(this.t); this.t = null;
      if (this.el){ this.el.classList.remove('holding'); this.el = null; }
    };

    document.addEventListener('pointerdown', e => {
      const el = e.target.closest && e.target.closest('[data-hold]');
      if (!el) return;
      /* الضغط على زر داخل العنصر يبقى ضغطة زر */
      if (e.target.closest('button') && e.target.closest('button') !== el) return;
      clear();
      this.fired = false; this.x = e.clientX; this.y = e.clientY;
      this.el = el; el.classList.add('holding');
      this.t = setTimeout(() => {
        const act = el.dataset.hold, arg = el.dataset.holdArg || '';
        this.fired = true; clear();
        if (navigator.vibrate) try { navigator.vibrate(30); } catch(_){}
        /* تنفيذ من سجلّ مغلق لا من نصّ: هكذا لا يحتاج البرنامج
           unsafe-eval في سياسة الأمن، فتُسدّ أوسع أبواب حقن الشيفرة. */
        try { this.ACTIONS[act]?.(...arg.split('|')); }
        catch(err){ toast(String((err && err.message) || err), 'e'); }
      }, this.MS);
    }, true);

    document.addEventListener('pointermove', e => {
      if (!this.t) return;
      if (Math.abs(e.clientX - this.x) > this.SLIP ||
          Math.abs(e.clientY - this.y) > this.SLIP) clear();
    }, true);

    ['pointerup','pointercancel','pointerleave','scroll']
      .forEach(ev => document.addEventListener(ev, clear, true));

    /* الضغطة التي صارت ضغطاً مطوّلاً لا تفتح الصفحة خلفها */
    document.addEventListener('click', e => {
      if (!this.fired) return;
      this.fired = false;
      e.stopPropagation(); e.preventDefault();
    }, true);

    document.addEventListener('contextmenu', e => {
      if (e.target.closest && e.target.closest('[data-hold]')) e.preventDefault();
    });
  },
};

    const q=Math.floor(f/10), p=f%10;
    const sym={1:'⌐',2:'¬',3:'L',4:'J'}[q]||'';
    return (q===1||q===4)? `${p}${sym}` : `${sym}${p}`;
  },

  svg(map, sel){
    const W=360, RX=150, up={cy:32,ry:88}, lo={cy:226,ry:88};
    const pos=(list,arc,isUp)=>list.map((f,i)=>{
      const deg=180+(i/(list.length-1))*180, th=deg*Math.PI/180;
      const x=W/2+RX*Math.cos(th);
      const y=isUp? arc.cy-arc.ry*Math.sin(th) : arc.cy+arc.ry*Math.sin(th);
      const rot=isUp?(deg-270):-(deg-270), p=f%10;
      return {f,x,y,rot, w:p>=6?22:p>=4?17:p===3?15.5:14, h:p>=6?23:p>=4?22:24};
    });
    const gumP=(arc,isUp)=>{ let d='';
      for(let i=0;i<=44;i++){ const th=(180+(i/44)*180)*Math.PI/180;
        const x=W/2+RX*Math.cos(th);
        const y=isUp?arc.cy-arc.ry*Math.sin(th):arc.cy+arc.ry*Math.sin(th);
        d+=`${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`; } return d; };

    const teeth=[...pos(UP,up,true), ...pos(LO,lo,false)];
    const body = teeth.map(t=>{
      const st = map[t.f] || 'sound';
      const col = TS(st).col;
      const gone = st==='extracted'||st==='missing';
      const on = sel===t.f;
      return `<g onclick="Doc.tooth(${t.f})">
        <g transform="translate(${t.x.toFixed(1)} ${t.y.toFixed(1)}) rotate(${t.rot.toFixed(1)})">
          <rect x="${(-t.w/2).toFixed(1)}" y="${(-t.h/2).toFixed(1)}" width="${t.w}" height="${t.h}"
            rx="${(t.w*.3).toFixed(1)}"
            fill="${gone?'transparent':(col||'var(--tooth)')}"
            stroke="${on?'var(--br)':gone?'#D94A3D':(col||'var(--tline)')}"
            stroke-width="${on?3:gone?1.8:1.4}" stroke-dasharray="${gone?'3 2.5':'none'}"/>
          ${gone?`<line x1="${-t.w/2+3}" y1="${-t.h/2+3}" x2="${t.w/2-3}" y2="${t.h/2-3}" stroke="#D94A3D" stroke-width="2"/>
                  <line x1="${t.w/2-3}" y1="${-t.h/2+3}" x2="${-t.w/2+3}" y2="${t.h/2-3}" stroke="#D94A3D" stroke-width="2"/>`:''}
        </g>
        <text x="${t.x.toFixed(1)}" y="${(t.y+3.6).toFixed(1)}" text-anchor="middle"
          font-family="'IBM Plex Mono',monospace" font-size="${t.w>19?9:8.2}" font-weight="600"
          fill="${gone?'#D94A3D':col?'#fff':'var(--ink2)'}"
          style="pointer-events:none;user-select:none">${this.lbl(t.f)}</text>
      </g>`;
    }).join('');

    return `<svg class="chart" viewBox="0 0 360 262">
      <path d="${gumP(up,true)}"  fill="none" stroke="var(--gum)" stroke-width="32" stroke-linecap="round"/>
      <path d="${gumP(lo,false)}" fill="none" stroke="var(--gum)" stroke-width="32" stroke-linecap="round"/>
      <line x1="180" y1="8" x2="180" y2="254" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
      ${body}</svg>`;
  },

  /* الحالات كثيرة، فتظهر عشراً عشراً بدل جدار ألوان تحت المخطط */
  legShow:10,
  legend(){
    const all  = Object.entries(TSTAT).filter(([,v])=>v.col);
    const n    = Math.min(this.legShow, all.length);
    const left = all.length - n;
    let last = null;
    const items = all.slice(0,n).map(([k,v])=>{
      const g = SG_OF(k);
      const head = (g && g !== last)
        ? `<div class="lgd-grp" style="width:100%;color:${g.col}">${esc(isAr()?g.ar:g.en)}</div>`
        : '';
      last = g;
      return head + `<span><i style="background:${v.col}"></i>${esc(isAr()?v.ar:v.en)}</span>`;
    }).join('');
    return `<div class="lgdbox">
      <div class="lgd">${items}</div>
      ${(left>0 || this.legShow>10) ? `<div class="row mt" style="gap:8px">
        ${left>0?`<button class="btn gh gr lgd-more" onclick="Chart.moreLeg()">
             <span>${T('moreStatus')}</span>
             <span class="pill n">${left}</span>
             <span class="arw">↓</span></button>`:''}
        ${this.legShow>10?`<button class="btn gh lgd-more" onclick="Chart.lessLeg()"
             style="${left>0?'flex:0 0 auto;min-width:118px':'flex:1'}">
             <span>${T('lessStatus')}</span><span class="arw up">↑</span></button>`:''}
      </div>`:''}
    </div>`;
  },
  moreLeg(){ this.legShow += 10; this.redrawLeg(); },
  lessLeg(){ this.legShow = 10;  this.redrawLeg(); },
  /* قد يظهر المخطط في أكثر من صفحة، فتُحدَّث كل وسائل الإيضاح */
  redrawLeg(){
    document.querySelectorAll('.lgdbox').forEach(b => { b.outerHTML = Chart.legend(); });
  },
  switcher(){
    return `<div class="row" style="gap:5px">${['palmer','fdi','universal'].map(m=>
      `<button class="btn xs ${CFG.data.notation===m?'':'gh'}" onclick="Chart.set('${m}')">${m.slice(0,4).toUpperCase()}</button>`).join('')}</div>`;
  },
  async set(m){ CFG.data.notation=m; await CFG.save(); App.draw(); },
};

/*═══ باركود Code39 حقيقي — يُقرأ بأي ماسح ═══*/
const C39 = {
  map:{'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw',
       '5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn',
       'A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn',
       'F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn',
       'K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn',
       'P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn',
       'U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn',
       'Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'},
  svg(text, h=64){
    /* النجمة رمز البداية والنهاية في Code39 — بدونها لا يقرأ أي ماسح */
    const s = '*' + String(text).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'') + '*';
    const N=1.1, W=2.9; let x=0, bars='';
    for (const ch of s){
      const pat = this.map[ch]; if(!pat) continue;
      for (let i=0;i<9;i++){
        const w = pat[i]==='w'?W:N;
        if (i%2===0) bars += `<rect x="${x.toFixed(2)}" y="0" width="${w}" height="${h}" fill="#000"/>`;
        x += w;
      }
      x += N;
    }
    return `<svg viewBox="0 0 ${x.toFixed(0)} ${h}" preserveAspectRatio="none"
      style="width:100%;height:${h}px;background:#fff;display:block">${bars}</svg>`;
  },

  /* صورة PNG للتنزيل: اسم العيادة فوق، الخطوط، والرمز تحتها */
  png(text, title){
    const s = '*' + String(text).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'') + '*';
    const N=1.1, W=2.9, out=[]; let x=0;
    for (const ch of s){
      const pat = this.map[ch]; if(!pat) continue;
      for (let i=0;i<9;i++){
        const w = pat[i]==='w'?W:N;
        if (i%2===0) out.push([x,w]);
        x += w;
      }
      x += N;
    }
    const SC=4, PAD=32, BH=150;
    const c = document.createElement('canvas');
    c.width = Math.round(x*SC) + PAD*2;
    c.height = PAD + (title?52:0) + BH + 56 + PAD;
    const g = c.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
    g.fillStyle='#000'; g.textAlign='center';
    let y = PAD;
    if (title){
      g.font = 'bold 34px Zain, system-ui, sans-serif';
      g.fillText(String(title), c.width/2, y+34, c.width-PAD*2);
      y += 52;
    }
    for (const [bx,bw] of out) g.fillRect(PAD + bx*SC, y, bw*SC, BH);
    y += BH + 44;
    g.font = 'bold 36px monospace';
    g.fillText(String(text), c.width/2, y);
    return c.toDataURL('image/png');
  },
};
/*═══════════════ رمز QR ═══════════════
  مُرمِّز QR قياسي (ISO/IEC 18004) بلا مكتبة خارجية — سياسة الأمن
  في البرنامج تمنع تحميل أي سكربت من خارجه. وضع البايت، مستوى
  تصحيح M (يتحمّل تلف ~15٪ من الملصق)، الإصدارات ١–١٠، واختيار
  القناع الأقل عقوبة كما ينصّ المعيار.
═════════════════════════════════════*/
const QR = (() => {
  const ECC = [-1,10,16,26,18,24,16,18,22,22,26];   /* M: بايتات التصحيح لكل كتلة */
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];   /* M: عدد الكتل */

  const raw = v => { let r = (16*v + 128)*v + 64;
    if (v >= 2){ const n = Math.floor(v/7) + 2; r -= (25*n - 10)*n - 55; if (v >= 7) r -= 36; }
    return r; };
  const dataCw = v => Math.floor(raw(v)/8) - ECC[v]*BLK[v];
  const bit = (x, i) => ((x >>> i) & 1) !== 0;

  const mul = (x, y) => { let z = 0;
    for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
    return z; };
  const divisor = d => { const r = new Array(d).fill(0); r[d-1] = 1; let root = 1;
    for (let i = 0; i < d; i++){
      for (let j = 0; j < r.length; j++){ r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j+1]; }
      root = mul(root, 2);
    }
    return r; };
  const remainder = (data, div) => { const r = div.map(() => 0);
    for (const b of data){ const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= mul(c, f)); }
    return r; };

  function encode(text){
    const bytes = [...new TextEncoder().encode(String(text))];
    let ver = 1;
    for (; ver <= 10; ver++){
      const cc = ver < 10 ? 8 : 16;
      if (4 + cc + bytes.length*8 <= dataCw(ver)*8) break;
    }
    if (ver > 10) throw new Error('qr_too_long');
    const cc = ver < 10 ? 8 : 16;

    /* البتات: الوضع، الطول، البيانات، ثم الإنهاء والحشو */
    const bb = [];
    const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bb.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, cc); bytes.forEach(b => put(b, 8));
    const cap = dataCw(ver) * 8;
    put(0, Math.min(4, cap - bb.length));
    put(0, (8 - bb.length % 8) % 8);
    for (let p = 0xEC; bb.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = [];
    for (let i = 0; i < bb.length; i += 8){ let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bb[i+j]; data.push(v); }

    /* التصحيح والتشبيك بين الكتل */
    const nb = BLK[ver], be = ECC[ver], rawCw = Math.floor(raw(ver)/8);
    const nShort = nb - rawCw % nb, shortLen = Math.floor(rawCw / nb), div = divisor(be);
    const blocks = []; let k = 0;
    for (let i = 0; i < nb; i++){
      const d = data.slice(k, k + shortLen - be + (i < nShort ? 0 : 1)); k += d.length;
      const e = remainder(d, div);
      if (i < nShort) d.push(0);
      blocks.push(d.concat(e));
    }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++)
      for (let j = 0; j < blocks.length; j++)
        if (i !== shortLen - be || j >= nShort) cw.push(blocks[j][i]);

    /* المصفوفة */
    const n = ver*4 + 17;
    const M = Array.from({length:n}, () => new Array(n).fill(false));
    const F = Array.from({length:n}, () => new Array(n).fill(false));
    const setF = (x, y, d) => { M[y][x] = d; F[y][x] = true; };

    for (let i = 0; i < n; i++){ setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (x, y) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){
        const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < n && yy >= 0 && yy < n) setF(xx, yy, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(n - 4, 3); finder(3, n - 4);

    if (ver > 1){
      const na = Math.floor(ver/7) + 2;
      const step = Math.ceil((ver*4 + 4) / (na*2 - 2)) * 2;
      const pos = [6];
      for (let p = n - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
      for (let i = 0; i < na; i++) for (let j = 0; j < na; j++){
        if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
          setF(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }

    const format = mask => {
      const d = (0 << 3) | mask;              /* M = 00 */
      let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(b, i));
      setF(8, 7, bit(b, 6)); setF(8, 8, bit(b, 7)); setF(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) setF(n - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) setF(8, n - 15 + i, bit(b, i));
      setF(8, n - 8, true);
    };
    format(0);
    if (ver >= 7){
      let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++){
        const v = bit(b, i), a = n - 11 + i % 3, c = Math.floor(i / 3);
        setF(a, c, v); setF(c, a, v);
      }
    }

    let i = 0;
    for (let right = n - 1; right >= 1; right -= 2){
      if (right === 6) right = 5;
      for (let v = 0; v < n; v++) for (let j = 0; j < 2; j++){
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? n - 1 - v : v;
        if (!F[y][x] && i < cw.length*8){ M[y][x] = bit(cw[i >>> 3], 7 - (i & 7)); i++; }
      }
    }

    const MASKS = [
      (x,y) => (x+y)%2===0, (x,y) => y%2===0, (x,y) => x%3===0, (x,y) => (x+y)%3===0,
      (x,y) => (Math.floor(x/3)+Math.floor(y/2))%2===0, (x,y) => x*y%2 + x*y%3 === 0,
      (x,y) => (x*y%2 + x*y%3)%2===0, (x,y) => ((x+y)%2 + x*y%3)%2===0 ];
    const apply = m => { for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (!F[y][x] && MASKS[m](x, y)) M[y][x] = !M[y][x]; };

    const penalty = () => {
      let p = 0, dark = 0;
      const line = get => {
        let run = 1;
        for (let a = 1; a < n; a++){
          if (get(a) === get(a-1)){ run++; if (run === 5) p += 3; else if (run > 5) p++; }
          else run = 1;
        }
        for (let a = 0; a + 10 < n; a++){
          const s = []; for (let t = 0; t < 11; t++) s.push(get(a+t) ? 1 : 0);
          const q = s.join('');
          if (q === '10111010000' || q === '00001011101') p += 40;
        }
      };
      for (let y = 0; y < n; y++) line(x => M[y][x]);
      for (let x = 0; x < n; x++) line(y => M[y][x]);
      for (let y = 0; y < n - 1; y++) for (let x = 0; x < n - 1; x++){
        const c = M[y][x];
        if (c === M[y][x+1] && c === M[y+1][x] && c === M[y+1][x+1]) p += 3;
      }
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (M[y][x]) dark++;
      const tot = n*n;
      p += (Math.ceil(Math.abs(dark*20 - tot*10) / tot) - 1) * 10;
      return p;
    };

    let best = 0, low = Infinity;
    for (let m = 0; m < 8; m++){
      apply(m); format(m);
      const s = penalty();
      if (s < low){ low = s; best = m; }
      apply(m);
    }
    apply(best); format(best);
    return M;
  }

  /* SVG مربّع بهامش هادئ ٤ وحدات — شرط القراءة الموثوقة */
  function svg(text, px){
    const M = encode(text), n = M.length, q = 4, s = n + q*2;
    let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (M[y][x]) d += `M${x+q} ${y+q}h1v1h-1z`;
    return `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"
      style="width:${px ? px + 'px' : '100%'};height:auto;aspect-ratio:1;display:block;background:#fff">
      <rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  /* صورة PNG للتنزيل والطباعة */
  function png(text, title, sub, label){
    const M = encode(text), n = M.length, q = 4, sc = 14;
    const side = (n + q*2) * sc, head = title ? 70 : 0, foot = 64 + (sub ? 34 : 0);
    const c = document.createElement('canvas');
    c.width = side; c.height = side + head + foot;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#000'; g.textAlign = 'center';
    if (title){ g.font = 'bold 38px Zain, system-ui, sans-serif'; g.fillText(String(title), side/2, 50, side - 40); }
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (M[y][x]) g.fillRect((x+q)*sc, head + (y+q)*sc, sc, sc);
    g.font = 'bold 40px monospace';
    g.fillText(String(label || text), side/2, head + side + 44);
    if (sub){ g.font = '600 24px Zain, system-ui, sans-serif'; g.fillText(String(sub), side/2, head + side + 84, side - 40); }
    return c.toDataURL('image/png');
  }

  /* باركود العيادة رابطٌ لتطبيق المراجع يحمل رمزها: يقرؤه أي ماسح
     (كاميرا الهاتف، عدسة كوكل) فيفتح التطبيق، وبعد الدخول تُفتح العيادة.
     والرمز وحده ما زال مقروءاً من داخل التطبيق للباركودات القديمة. */
  const PATIENT_URL = 'https://myteethsick.vercel.app/';
  const link = code => PATIENT_URL + '?c=' + encodeURIComponent(String(code || '').toUpperCase());

  return { encode, svg, png, link };
})();

/*═══════════════ الاتصال الحيّ ═══════════════
  السيرفر يُخبر الأجهزة لحظة تغيّر أي سجل، بدل أن تسأله كل ٤٥
  ثانية. الفرق عملي: الاستدعاء من السكرتير يصل شاشة الطبيب خلال

  اتصال WebSocket مباشر ببروتوكول Realtime — بلا مكتبة خارجية.
  إن تعذّر، يبقى الفحص الدوري شبكة أمان فلا يتوقّف شيء.
═══════════════════════════════════════════*/
/* البثّ الحيّ صار استماع Firestore نفسه (Sync.listen) — هذه واجهة
   الاسم القديم فقط، فلا يتغيّر من يناديها. */
const Live = {
  up(){ return navigator.onLine && Object.keys(Sync._subs || {}).length > 0; },
  connect(){ Sync.listen(); },
  stop(){ Sync.unlisten(); },
};

/*═══════════════ الصور ═══════════════
  الأشعة صورة تشخيصية لا صورة ذكرى. ضغط JPEG الفاقد يولّد تشويشاً
  حول الحواف عالية التباين — وهذا بالضبط شكل التسوّس المبكر
  والشعر الشعري في الجذر. فقد يُخفي آفة أو يصنع واحدة وهمية.
  لذلك تُحفظ الأشعة بـ WebP بلا فقدان: صفر تغيير في البكسل،
  وأصغر من PNG بنحو الثلث.

  الصور السريرية العادية (وجه، ابتسامة، قبل/بعد) لا يُشخَّص عليها،
  فتُضغط ضغطاً عالي الجودة.

  ومكان الحفظ صار التخزين لا قاعدة البيانات: القاعدة ٨ جيجا
  والتخزين ١٠٠ بالسعر نفسه، وbase64 كان يضخّم كل صورة ٣٣٪.
═════════════════════════════════════*/
const Img = {
  BUCKET:'xrays',
  DIAG:['xray','pano','ceph'],          /* ما لا يجوز المساس ببكسله */

  lossless(kind){ return this.DIAG.includes(kind); },

  /* WebP بلا فقدان مدعوم في كل متصفح حديث — ومع ذلك يُتحقَّق */
  webpOK(){
    if (this._w !== undefined) return this._w;
    const c = document.createElement('canvas'); c.width = c.height = 1;
    return this._w = c.toDataURL('image/webp').startsWith('data:image/webp');
  },

  /*──── التحضير قبل الحفظ ────*/
  async prep(file, kind){
    const diag = this.lossless(kind);
    const img  = await new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => { const i = new Image();
        i.onload = () => res(i); i.onerror = rej; i.src = rd.result; };
      rd.onerror = rej; rd.readAsDataURL(file);
    });

    /* الأشعة تبقى بأبعادها الأصلية — التصغير يمحو تفاصيل دقيقة
       لا تُستردّ. والصور العادية تُصغَّر لأنها للعرض لا للتشخيص. */
    const MAX = diag ? 4000 : 1600;
    const sc  = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * sc);
    c.height = Math.round(img.height * sc);
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, c.width, c.height);

    let type, q;
    if (diag){ type = this.webpOK() ? 'image/webp' : 'image/png'; q = 1; }
    else     { type = this.webpOK() ? 'image/webp' : 'image/jpeg'; q = 0.88; }

    const blob = await new Promise(r => c.toBlob(r, type, q));
    return { blob, type, w:c.width, h:c.height,
             orig:file.size, diag,
             ext: type === 'image/webp' ? 'webp' : type === 'image/png' ? 'png' : 'jpg' };
  },

  /*──── مصغّرة العرض ────
    الأشعة تُحفظ بلا فقدان فتبلغ ملايين البايتات. تحميلها كاملة
    لشبكة مصغّرات يستهلك عشرات الميغابايتات لفتح شاشة واحدة —
    ويُحسب من حصّة النقل. فتُحفظ معها صورة صغيرة مضغوطة تُعرض
    في الشبكة، ولا تُحمَّل الأصلية إلا عند فتحها. */
  async thumb(blob){
    try {
      const url = URL.createObjectURL(blob);
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i); i.onerror = rej; i.src = url;
      });
      const M = 320, sc = Math.min(1, M / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const g = c.getContext('2d');
      g.imageSmoothingQuality = 'medium';
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      return c.toDataURL(this.webpOK() ? 'image/webp' : 'image/jpeg', 0.72);
    } catch(_){ return null; }   /* غيابها لا يمنع الحفظ */
  },

  /*──── الرفع (Cloudinary) ────
    ★ إعدادات الصور: اسم الحساب (Cloud name) واسم الـ Upload preset
      غير الموقَّع من لوحة Cloudinary. لا يوضع هنا API Secret أبداً.
    الصورة تُرفع كما هي بلا أي تحويل، فالأشعة تبقى بلا فقدان. اسمها
    عشوائي طويل داخل مجلد العيادة، ورابطها يُحفظ في سجل الصورة. */
  CLD:{ cloud:'CLOUD_NAME_HERE', preset:'asnany_unsigned' },
  ready(){ return !!this.CLD.cloud && this.CLD.cloud !== 'CLOUD_NAME_HERE'; },

  async upload(id, blob, type, ext){
    if (!Sync.on()) throw new Error('offline');
    /* بلا Cloudinary: التخزين الافتراضي هو Firebase Storage (خطة Blaze) */
    if (!this.ready()){
      const path = `clinics/${Cloud.me.clinic_id}/img/${id}.${ext}`;
      try { await FBSDK.uploadBytes(FBSDK.ref(FBC.st, path), blob, { contentType:type }); }
      catch(e){ throw FBC.err(e); }
      return path;
    }
    const fd = new FormData();
    fd.append('file', new File([blob], `${id}.${ext}`, { type }));
    fd.append('upload_preset', this.CLD.preset);
    fd.append('folder', `asnany/${Cloud.me.clinic_id}`);
    fd.append('public_id', `${id}-${FBC.rid(12)}`);
    fd.append('return_delete_token', 'true');
    let r, d;
    try {
      r = await fetch(`https://api.cloudinary.com/v1_1/${this.CLD.cloud}/image/upload`, { method:'POST', body:fd });
      d = await r.json().catch(() => ({}));
    } catch(_){ const e = new Error('network'); e.net = true; throw e; }
    if (!r.ok || !d.secure_url) throw new Error(d?.error?.message || ('upload_failed_' + r.status));
    /* رمز الحذف صالح عشر دقائق: يكفي للتراجع عن صورة رُفعت خطأً */
    this._tok[d.secure_url] = { t:d.delete_token, at:Date.now() };
    return d.secure_url;
  },
  _tok:{},
  /* data: إلى Blob بلا fetch — سياسة الأمان تمنع fetch لروابط data: */
  blobOf(u){
    const [h, b64] = String(u).split(',');
    const type = (h.match(/^data:([^;]+)/) || [])[1] || 'application/octet-stream';
    const bin = atob(b64 || ''), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], { type });
  },

  /*──── العرض ────
    التخزين محمي بالقواعد: الرابط يُطلب بجلسة العضو، ويُحفظ في
    الذاكرة فلا يُطلب لكل فتح. */
  _url:{}, err:null,
  async view(f){
    if (f.data) return f.data;                    /* صورة قديمة أو محلية */
    if (!f.path) return null;
    if (/^https:\/\//.test(f.path)) return f.path;   /* رابط Cloudinary مباشر */
    if (!Cloud.session){ this.err = 'no_session'; return null; }
    const hit = this._url[f.path];
    if (hit) return hit;
    try {
      const u = await FBSDK.getDownloadURL(FBSDK.ref(FBC.st, f.path));
      this.err = null;
      this._url[f.path] = u;
      return u;
    } catch(e){
      this.err = String(FBC.err(e).message || e);
      return f.data || null;
    }
  },

  async del(f){
    if (!f?.path || !Sync.on()) return;
    if (/^https:\/\//.test(f.path)){
      /* الحذف من المتصفح ممكن خلال عشر دقائق من الرفع فقط (رمز الحذف).
         بعدها تبقى الصورة في الحساب — لا ضرر، وتُحذف من لوحة Cloudinary. */
      const k = this._tok[f.path];
      if (k && Date.now() - k.at < 9.5 * 60000){
        try {
          const fd = new FormData(); fd.append('token', k.t);
          await fetch(`https://api.cloudinary.com/v1_1/${this.CLD.cloud}/delete_by_token`, { method:'POST', body:fd });
        } catch(_){}
        delete this._tok[f.path];
      }
      return;
    }
    try { await FBSDK.deleteObject(FBSDK.ref(FBC.st, f.path)); }
    catch(_){ /* بقاء ملف يتيم أهون من فشل الحذف */ }
    delete this._url[f.path];
  },

  /*──── طابور الرفع ────
    الصورة تُلتقط بلا إنترنت أحياناً. تُحفظ في الجهاز كما هي،
    وتُرفع أول ما يعود الاتصال، ثم تُمحى نسختها المحلية. */
  async flush(){
    if (!Sync.on() || !navigator.onLine || this._busy) return 0;
    this._busy = true;
    let done = 0;
    try {
      const pend = (await DB.all('files')).filter(f => f.data && !f.path && f.blobType);
      for (const f of pend){
        try {
          const blob = Img.blobOf(f.data);
          f.path = await this.upload(f.id, blob, f.blobType, f.ext || 'webp');
          if (!f.thumb) f.thumb = await this.thumb(blob);
          delete f.data;                 /* الحجم الكبير يغادر القاعدة */
          await DB.put('files', f);
          done++;
        } catch(_){ break; }             /* الشبكة متعثّرة: نكمل لاحقاً */
      }
      done += await this.flushLocal();
    } finally { this._busy = false; }
    if (done) Sync.kick();
    return done;
  },

  /* صور حُفظت محلياً في النسخة الملغاة («الصور على الجهاز فقط»):
     تُرفع إلى التخزين كالمعتاد ثم تُمحى نسختها المحلية. */
  async flushLocal(){
    let n = 0, db;
    try { db = await DB.open(); if (!db || !db.objectStoreNames.contains('imgs')) return 0; } catch(_){ return 0; }
    const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const recs = (await DB.all('files')).filter(f => f.local && !f.path);
    for (const f of recs){
      const li = await req(db.transaction('imgs').objectStore('imgs').get(f.id)).catch(() => null);
      if (!li || !li.blob) continue;             /* صورة جهاز آخر — يرفعها جهازها */
      try {
        const type = li.type || f.blobType || 'image/webp';
        f.path = await this.upload(f.id, li.blob, type, f.ext || (type.includes('png') ? 'png' : type.includes('jpeg') ? 'jpg' : 'webp'));
        f.thumb = li.thumb || await this.thumb(li.blob);
        delete f.local; delete f.devBy;
        await DB.put('files', f);
        await req(db.transaction('imgs', 'readwrite').objectStore('imgs').delete(f.id)).catch(() => {});
        n++;
      } catch(_){ break; }
    }
    return n;
  },

  async pending(){
    try { return (await DB.all('files')).filter(f => f.data && !f.path && f.blobType).length; }
    catch(_){ return 0; }
  },

  /*──── نقل الصور القديمة ────
    ما حُفظ سابقاً داخل القاعدة يُنقل إلى التخزين. البكسل لا يُمسّ:
    تُقرأ الصورة كما هي وتُرفع كما هي، بلا إعادة ضغط. */
  async migrate(onStep){
    if (!Sync.on()) throw new Error(T('syncOff'));
    const old = (await DB.all('files')).filter(f => f.data && !f.path);
    let n = 0;
    for (const f of old){
      try {
        const blob = Img.blobOf(f.data);
        const type = blob.type || 'image/jpeg';
        const ext  = type.includes('webp') ? 'webp' : type.includes('png') ? 'png' : 'jpg';
        f.path = await this.upload(f.id, blob, type, ext);
        f.ext = ext; f.bytes = blob.size;
        if (!f.thumb) f.thumb = await this.thumb(blob);
        delete f.data;
        await DB.put('files', f);
        n++;
        onStep?.(n, old.length);
      } catch(_){ break; }
    }
    return { moved:n, total:old.length };
  },
};

/*═══════════════ المزامنة ═══════════════
  البرنامج يكتب في الجهاز أولاً ودائماً — لا انتظار للشبكة ولا
  توقّف عند انقطاعها. كل تعديل يُقيَّد في صندوق صادر، ويُرفع متى
  توفّر الاتصال. والوارد يُسحب بالرقم المتسلسل، فلا يُنقل إلا
  الجديد.

  التعارض: الأحدث يفوز (بحسب وقت التعديل في الجهاز). اختير هذا
  لأن سجلاً واحداً نادراً ما يُحرَّر من جهازين معاً في عيادة، وأي
  حسم أعقد يخفي على المستخدم أي نسخة بقيت.
═════════════════════════════════════════*/
const SYNC_STORES = ['patients','visits','works','payments','rx',
                     'files','tooth','appts','settings','suggest'];

/* الصيدلي يرى الوصفات والحساسيات فقط — مفروض في القاعدة أيضاً */
const ROLE_STORES = {
  pharmacy: { pull:['rx','patients'], push:['rx'] },
  /* المستثمر لا يكتب في السجلات السريرية — الإعدادات والاقتراحات فقط */
  owner:    { pull:SYNC_STORES, push:['settings','suggest'] },
};

const Sync = {
  busy:false, quiet:false, last:0, pending:0, err:null, dirty:false, imgWait:0,
  again:false, fails:0, _kick:null, _retry:null,

  /* فرق ساعة هذا الجهاز عن السيرفر — يُقاس من كل ردّ */
  skew:0,
  now(){ return Date.now() + this.skew; },

  scope(){
    const r = ROLE_STORES[S.role];
    return { pull: r ? r.pull : SYNC_STORES, push: r ? r.push : SYNC_STORES };
  },

  /* اشتراك منتهٍ: لا مزامنة ولا استماع — القواعد ترفضهما أصلاً،
     ومحاولتهما بلا توقّف استهلاك بلا فائدة. */
  on(){ return Cloud.ready() && !!Cloud.session && !!Cloud.me?.clinic_id && !Sub.expired(); },

  /*──── علامات الاستماع ────
    لكل مجموعة سجلات علامة: ختم آخر سجل وصل منها (ثوانٍ.نانو). الاستماع
    يبدأ بعدها، فلا يُقرأ سجل مرتين ولا يُدفع ثمن ما عندنا. */
  revKey(){ return 'd_mk_' + (Cloud.me?.clinic_id || 'x') + '|'; },
  rev(){ return 0; },
  setRev(v){
    if (Number(v) !== 0) return;
    /* صفر = إعادة السحب من البداية (تغيّر النطاق): تُمحى كل العلامات */
    try {
      const p = this.revKey();
      for (let i = localStorage.length - 1; i >= 0; i--){
        const k = localStorage.key(i); if (k && k.startsWith(p)) localStorage.removeItem(k);
      }
    } catch(_){}
    this.unlisten();
  },
  mark(key){
    try {
      const v = localStorage.getItem(this.revKey() + key);
      if (!v) return FBSDK.Timestamp.fromMillis(0);
      const [s, n] = v.split('.').map(Number);
      return new FBSDK.Timestamp(s || 0, n || 0);
    } catch(_){ return FBSDK.Timestamp.fromMillis(0); }
  },
  setMark(key, t){
    try { localStorage.setItem(this.revKey() + key, `${t.seconds}.${t.nanoseconds}`); } catch(_){}
  },

  /*──── صندوق الصادر ────*/
  async queue(store, rid, deleted, own, pid){
    if (this.quiet) return;                       /* الوارد لا يُعاد رفعه */
    if (!SYNC_STORES.includes(store)) return;
    if (store === 'settings' && rid === 'clinics') return;  /* دليل محلي */
    try {
      await DB.put('outbox', { id: store + '|' + rid, store, rid,
                               at: this.now(), deleted: !!deleted, own: own || null, pid: pid || null });
      this.pending++;
      this.paint();
      this.kick();
    } catch(_){ /* الصندوق لا يعطّل الحفظ */ }
  },

  /* الدفع يبدأ من الكتابة نفسها لا من مؤقّت. تأخير قصير يجمع
     الكتابات المتتابعة (حفظ خطة = عدة سجلات) في دفعة واحدة. */
  kick(){
    clearTimeout(this._kick);
    this._kick = setTimeout(() => this.run(), 700);
  },

  async count(){
    try { this.pending = (await DB.all('outbox')).length; } catch(_){ this.pending = 0; }
    this.imgWait = await Img.pending();
    return this.pending;
  },

  /*──── مسار السجل على السيرفر ────
    clinics/{cid}/o/{K}/{pub|prv}/{store~id}
    K = طبيب السجل (من يملكه) أو '_' للمشترك. pub = ما تراه الصيدلية. */
  SHARED:['settings','suggest'],
  PUB:['patients','rx'],
  recK(store, doc, hint){
    if (this.SHARED.includes(store)) return '_';
    return (doc && (doc._k || doc._own)) || hint || '_';
  },
  recRef(store, id, K){
    return FBC.d('clinics', Cloud.me.clinic_id, 'o', K,
      this.PUB.includes(store) ? 'pub' : 'prv', store + '~' + encodeURIComponent(id));
  },

  /* مهلة للالتزام: بلا إنترنت تبقى الكتابة معلّقة إلى الأبد —
     يبقى السجل في الصندوق ويُعاد لاحقاً (الإعادة لا تكرّر شيئاً). */
  _commit(p){
    return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('network'), { net:true })), 25000))]);
  },

  /*──── الرفع ────*/
  async push(){
    const box = await DB.all('outbox');
    if (!box.length) return 0;
    const F = FBSDK;
    const allow = this.scope().push;
    const items = box.filter(x => allow.includes(x.store));
    let sent = 0;
    /* الدفعة تُقاس بالحجم لا بالعدد: سجل كبير وحده قد يقارب حدّ الطلب */
    const CAP = 700 * 1024;
    let batch = [], size = 0;

    const send = async () => {
      if (!batch.length) return;
      const b = F.writeBatch(FBC.db);
      for (const it of batch) b.set(it.ref, it.data);
      try {
        await this._commit(b.commit());
        for (const it of batch) await DB.del('outbox', it.x.id);
        sent += batch.length;
        await this.mirror(batch);
      } catch(e){
        const er = FBC.err(e);
        if (er.net || er.message === 'network') throw er;
        if (er.message !== 'permission-denied') throw er;
        /* رفض: هل فقدنا العضوية أو انتهى الاشتراك؟ عندها نتوقّف ونحتفظ بكل شيء */
        const me = await Cloud.whoami().catch(() => null);
        if (!me || !me.clinic_id || !me.sub?.ok || !me.sub?.active)
          throw new Error('not_a_clinic_member');
        /* وإلا فسجلّ بعينه رُفض — غالباً لأن على السيرفر نسخة أحدث.
           يبقى في الصندوق حتى يصل الأحدث ويُدمج، ثم يُعاد. ومن رُفض
           خمس مرات يُترك حتى لا يعلق الصادر كله. */
        for (const it of batch){
          try {
            await this._commit(F.setDoc(it.ref, it.data));
            await DB.del('outbox', it.x.id); sent++;
            await this.mirror([it]);
          } catch(e2){
            const e3 = FBC.err(e2);
            if (e3.net) throw e3;
            const t = (it.x.tries || 0) + 1;
            if (t >= 5) await DB.del('outbox', it.x.id);
            else await DB.put('outbox', { ...it.x, tries:t }, { quiet:true });
          }
        }
      }
      batch = []; size = 0;
    };

    for (const x of items){
      const doc = x.deleted ? null : await DB.get(x.store, x.rid);
      if (!doc && !x.deleted){ await DB.del('outbox', x.id); continue; }
      /* صورة ما زالت بكسلاتها داخل سجلّها: تُرفع إلى التخزين أولاً */
      if (x.store === 'files' && doc && doc.data && !doc.path && doc.blobType) continue;
      const K = this.recK(x.store, doc, x.own);
      /* المسار يُثبَّت في السجل نفسه: لا يتنقّل بين مجموعتين أبداً */
      if (doc && !doc._k){ doc._k = K; await DB.put(x.store, doc, { quiet:true }); }
      const ua = Math.max(Number(x.at || 0), Number(doc?._up || 0));
      let j = '{}';
      if (doc){ try { j = JSON.stringify(doc); } catch(_){ await DB.del('outbox', x.id); continue; } }
      const data = { store:x.store, j, ua, del:!doc, u:F.serverTimestamp(), by:Cloud.me.uid };
      const len = j.length + 200;
      if (batch.length && size + len > CAP) await send();
      batch.push({ x, ref:this.recRef(x.store, x.rid, K), data, doc });
      size += len;
      if (batch.length >= 100) await send();
    }
    await send();
    /* ما لا يخصّ دوري يُنظَّف حتى لا يتراكم بلا فائدة */
    for (const x of box) if (!allow.includes(x.store)) await DB.del('outbox', x.id);
    return sent;
  },

  /*──── نسخة المراجع ────
    مواعيد المراجع وجلساته وأعماله تُنسخ نسخة خفيفة إلى حسابه في
    تطبيق المراجع — فقط لمن حجز من التطبيق وقُبل حجزه. أفضل جهد:
    فشلها لا يمسّ مزامنة العيادة. */
  CARE:['visits','works','appts'],
  async mirror(list){
    if (S.role !== 'doctor' && S.role !== 'secretary') return;
    const F = FBSDK, cid = Cloud.me.clinic_id;
    /* القواعد تقرأ ربط كل مراجع بالعيادة؛ الدفعة الواحدة لا تحتمل أكثر
       من ٢٠ قراءة، فتُرسل كل ١٢ مراجعاً مختلفاً على حدة */
    let b = F.writeBatch(FBC.db), n = 0, pus = new Set();
    const flush = async () => {
      if (n){ try { await this._commit(b.commit()); } catch(_){} }
      b = F.writeBatch(FBC.db); n = 0; pus = new Set();
    };
    for (const it of list){
      const st = it.x.store;
      if (!this.CARE.includes(st)) continue;
      const doc = it.doc;
      let pid = doc?.pid;
      if (!pid && it.x.deleted && it.x.pid) pid = it.x.pid;
      if (!pid) continue;
      const p = await DB.get('patients', pid);
      if (!p || !p.pu) continue;
      if (!pus.has(p.pu) && pus.size >= 12) await flush();
      pus.add(p.pu);
      const ref = FBC.d('patients', p.pu, 'care', cid + '_' + st + '_' + encodeURIComponent(it.x.rid));
      if (!doc){ b.delete(ref); n++; continue; }
      const base = { cid, store:st, rid:it.x.rid, clinic:Cloud.me.clinic_name || CFG.data.clinic || '',
                     phone:CFG.data.phone || null, u:F.serverTimestamp() };
      const slim = st === 'visits' ? { date:doc.date || null, st:doc.st || null }
                 : st === 'works'  ? { vid:doc.vid || null, price:Number(doc.price || 0),
                                       proc:pName(doc.proc) || '', fdi:doc.fdi || null,
                                       sessionNos:(doc.sessionNos || []).map(Number) }
                 : { day:doc.day || null, time:doc.time || null, note:doc.note || null, st:doc.st || null };
      b.set(ref, { ...base, ...slim }); n++;
    }
    await flush();
  },

  /*──── الاستماع (بدل السحب الدوري) ────
    مجموعة لكل طبيب أراه ولكل نوع (pub/prv)، ومجموعة الحجوزات.
    Firestore يرسل الجديد فقط لحظة حدوثه: لا استطلاع يكلّف قراءة
    كل بضع ثوانٍ، ولا سحب لما وصل سابقاً. */
  _subs:{}, _q:Promise.resolve(), _got:0,

  paths(){
    const me = Cloud.me; if (!me?.clinic_id) return [];
    const Ks = ['_', ...(me.vis || [])];
    const cols = S.role === 'pharmacy' ? ['pub'] : ['pub', 'prv'];
    const out = [];
    for (const K of [...new Set(Ks)]) for (const col of cols) out.push({ K, col, key:K + '|' + col });
    return out;
  },

  listen(){
    if (!this.on() || !navigator.onLine) return;
    const want = this.paths();
    const keys = new Set(want.map(p => p.key));
    if (S.role === 'doctor' || S.role === 'secretary') keys.add('bookings');
    for (const k of Object.keys(this._subs)) if (!keys.has(k)){ try { this._subs[k](); } catch(_){} delete this._subs[k]; }
    for (const p of want) if (!this._subs[p.key]) this._sub(p);
    if (keys.has('bookings') && !this._subs.bookings) this._subBookings();
    this.paint();
  },

  unlisten(){
    for (const k of Object.keys(this._subs)){ try { this._subs[k](); } catch(_){} }
    this._subs = {};
  },

  _sub(p){
    const F = FBSDK, cid = Cloud.me.clinic_id;
    const q = F.query(FBC.c('clinics', cid, 'o', p.K, p.col), F.where('u', '>', this.mark(p.key)), F.orderBy('u'));
    this._subs[p.key] = F.onSnapshot(q,
      snap => { this._q = this._q.then(() => this.applySnap(p, snap)).catch(() => {}); },
      err  => { delete this._subs[p.key]; this.listenErr(err); });
  },

  listenErr(err){
    const e = FBC.err(err);
    this.paint();
    /* رفض الصلاحية: انتهى الاشتراك أو تغيّر النطاق — يُسأل السيرفر */
    if (e.message === 'permission-denied'){ Sub.recheck(); Scope.recheck(true); }
    clearTimeout(this._relisten);
    this._relisten = setTimeout(() => this.listen(), e.net ? 15000 : 120000);
  },

  async applySnap(p, snap){
    const allow = this.scope().pull;
    let got = 0, mark = null;
    for (const ch of snap.docChanges()){
      if (ch.type === 'removed') continue;
      const d = ch.doc;
      if (d.metadata.hasPendingWrites) continue;      /* كتابتي أنا قبل التزامها */
      const x = d.data();
      if (x.u && (!mark || x.u.toMillis() > mark.toMillis() ||
          (x.u.seconds === mark.seconds && x.u.nanoseconds > mark.nanoseconds))) mark = x.u;
      if (!x.store || !allow.includes(x.store)) continue;
      const id = decodeURIComponent(d.id.slice(x.store.length + 1));
      if (x.del){ await DB.del(x.store, id, { quiet:true }); got++; continue; }
      let doc;
      try { doc = JSON.parse(x.j || '{}'); } catch(_){ continue; }
      const mine = await DB.get(x.store, id);
      const mineAt  = Number(mine?._up || 0);
      const theirAt = Number(x.ua || 0);
      if (mine && mineAt > theirAt){
        /* نسختي أحدث — لكن قد يحمل الوارد حقلاً أجدّ من حقلي فأدمجه */
        const merged = this.merge(x.store, mine, doc, mineAt, theirAt);
        if (!merged) continue;
        doc = merged;
      } else if (mine){
        /* نسختهم أحدث — أحتفظ بحقولي التي خُتمت بعد ختمهم */
        doc = this.merge(x.store, doc, mine, theirAt, mineAt) || doc;
      }
      doc.id = id;
      doc._k = p.K;
      doc._up = Math.max(mineAt, theirAt);
      await DB.put(x.store, doc, { quiet:true });
      got++;
    }
    if (mark) this.setMark(p.key, mark);
    if (got){ this._got += got; this.last = Date.now(); this.redraw(); }
  },

  /*──── حجوزات تطبيق المراجعين ────
    تصل بالشكل نفسه الذي تقرؤه شاشة «الحجوزات» — لا تعديل هناك. */
  bkKey(){ return 'bookings'; },

  _subBookings(){
    const F = FBSDK, cid = Cloud.me.clinic_id;
    const q = F.query(FBC.c('clinics', cid, 'bookings'), F.where('u', '>', this.mark('bookings')), F.orderBy('u'));
    this._subs.bookings = F.onSnapshot(q,
      snap => { this._q = this._q.then(() => this.applyBookings(snap)).catch(() => {}); },
      err  => { delete this._subs.bookings; this.listenErr(err); });
  },

  async applyBookings(snap){
    let mark = null, fresh = 0, n = 0;
    for (const ch of snap.docChanges()){
      if (ch.type === 'removed') continue;
      const d = ch.doc;
      if (d.metadata.hasPendingWrites) continue;
      const r = d.data();
      if (r.u && (!mark || r.u.toMillis() > mark.toMillis() ||
          (r.u.seconds === mark.seconds && r.u.nanoseconds > mark.nanoseconds))) mark = r.u;
      n++;
      const doc = { ...(r.doc || {}) };
      /* إجابات الاستمارة تصل بأشكال مختلفة حسب إصدار تطبيق المراجع */
      if (doc.mh) doc.mh = MH.norm(doc.mh);
      const old = await DB.get('bookings', d.id);

      /* ألغى المراجع حجزه — الأثر يختلف بحسب ما وصل إليه الحجز */
      if (r.status === 'cancelled'){
        if (old) await this.cancelBooking(old, doc);
        continue;
      }
      const b = { ...doc, id:d.id, cid:CFG.data.cid, srv:true, pu:r.pu || null,
                  st: r.status === 'pending' ? 'new'
                    : r.status === 'accepted' ? 'accepted' : 'declined' };
      if (old && old.st !== 'new' && b.st === 'new') continue;   /* لا يعود المحسوم */
      if (old){ b.pid = old.pid; b.bc = old.bc; }
      if (!old && b.st === 'new') fresh++;
      await DB.put('bookings', b, { quiet:true });
    }
    if (mark) this.setMark('bookings', mark);
    if (!n) return 0;
    /* ما وصل من جهاز آخر قد يحمل باركوداً مكرّراً — يُصلَح هنا */
    await Ops.fixBarcodes();
    try { await Notify.refresh(fresh); } catch(_){}
    this.redraw();
    return n;
  },

  /* قرار العيادة يعود إلى تطبيق المراجع، وإلا بقي حجزه «قيد المراجعة» */
  async bookStatus(id, status, code, ref){
    if (!this.on()) return;
    const F = FBSDK, cid = Cloud.me.clinic_id;
    const up = { status, u:F.serverTimestamp() };
    if (code) up.code = String(code);
    if (ref)  up.patient_ref = String(ref);
    try { await this._commit(F.updateDoc(FBC.d('clinics', cid, 'bookings', id), up)); } catch(_){}
    const b = await DB.get('bookings', id);
    if (b?.pu){ try { await this._commit(F.updateDoc(FBC.d('patients', b.pu, 'bookings', id), up)); } catch(_){} }
  },

  /* إبقاء الاسم القديم: الحجوزات تصل بالاستماع لا بالسحب */
  async bookings(){ this.listen(); return 0; },
  async pull(){ this.listen(); const g = this._got; this._got = 0; return g; },

  /*──── أثر إلغاء المراجع ────
    ١) لم يُقبل بعد: يُحذف من قائمة السكرتير كأنه لم يكن.
    ٢) قُبل وموعده لم يمضِ: جلسته تُعلَّم «ألغى المراجع» بدل زر
       الاستدعاء — لا تُحذف، لأن السكرتير قد فتح لها ملفاً.
    ٣) قُبل ومضى موعده: لا يُمسّ شيء. ما جرى في العيادة تاريخ. */
  async cancelBooking(old, doc){
    if (old.st === 'new' || !old.st){
      await DB.del('bookings', old.id);
      toast(T('bkRemoved'), 'w');
      return;
    }
    if (old.st !== 'accepted') return;

    const day = doc.day || old.day;
    if (day && day < today()) return;      /* مضى الموعد */

    old.st = 'cancelled';
    await DB.put('bookings', old);

    /* الجلسة المفتوحة لهذا المراجع تُعلَّم ملغاة */
    if (old.pid){
      const vs = (await DB.by('visits','pid',old.pid))
        .filter(v => v.st !== 'done' && v.date >= today())
        .sort((a,b) => (b.at||0) - (a.at||0));
      const v = vs[0];
      if (v && v.qstate !== 'cancelled'){
        v.qstate = 'cancelled';
        v._qAt = this.now();          /* ختم الحقل — لا يُدهس بالمزامنة */
        await DB.put('visits', v);
      }
    }
    toast(T('bkCancelled'), 'w');
  },

  /*──── دورة كاملة ────
    الاستماع يجلب الوارد لحظة حدوثه؛ الدورة تضمن أن الاستماع قائم،
    وترفع الصور المعلّقة، ثم ترفع الصادر. */
  async run(manual){
    if (!this.on()) return;
    /* كتابة وقعت أثناء دورة جارية: تُعاد الدورة بعدها بدل إهمالها */
    if (this.busy){ this.again = true; return; }
    if (!navigator.onLine){ this.err = T('syncOff'); this.paint(); return; }
    this.busy = true; this.err = null; this.paint();
    try {
      this.listen();
      await Img.flush();
      const up   = await this.push();
      const down = this._got; this._got = 0;
      this.last = Date.now();
      this.fails = 0;
      try { localStorage.setItem('d_synced', String(this.last)); } catch(_){}
      await this.count();
      if (manual) toast(`${T('syncDone')} · ${up} ${T('pushed')} · ${down} ${T('pulled')}`, 's');
    } catch (e) {
      this.err = String(e.message || e);
      /* السيرفر لم يعد يعدّني عضواً فعّالاً: غالباً انتهى الاشتراك أو
         أُوقفت العيادة. يُسأل عن الحالة بدل التكرار كل ثوانٍ. */
      if (/not_a_clinic_member/.test(this.err)){
        Sub.recheck();
        clearTimeout(this._retry);
        this._retry = setTimeout(() => this.run(), 300000);
        return;
      }
      if (manual) toast(T('syncFail') + ' — ' + this.err, 'e');
      /* الفشل يعيد المحاولة متباعداً — لا يكرّر بلا توقّف على شبكة متعثّرة */
      this.fails = (this.fails || 0) + 1;
      clearTimeout(this._retry);
      this._retry = setTimeout(() => this.run(),
        Math.min(60000, 2000 * Math.pow(2, Math.min(this.fails, 5))));
    } finally {
      this.busy = false; this.paint();
      if (this.again){ this.again = false; this.kick(); }
    }
  },

  /*──── دمج الحقول المشتركة ────────
    الزيارة سجل يحرّره دوران: السكرتير يحرّك حالة الطابور،
    والطبيب يكتب ملخص الجلسة. لو حُسم التعارض على مستوى السجل
    لمحا أحدهما عمل الآخر — وهذا يقع فعلاً حين ينقطع النت
    فيعمل الجهازان معاً.

    فلكل حقل مشترك ختمه الخاص، ويفوز صاحب الختم الأحدث وحده.
    base هي النسخة الفائزة، وother النسخة الأخرى.
    تُرجع null إذا لم يكن في other ما يستحق النقل. */
  FIELDS:{ visits:[['done','_doneAt'], ['qstate','_qAt']] },

  merge(store, base, other, baseAt, otherAt){
    const map = this.FIELDS[store];
    if (!map) return null;
    let took = false;
    const out = { ...base };
    for (const [field, stamp] of map){
      if (other[field] === undefined || other[field] === base[field]) continue;
      const bs = base[stamp], os = other[stamp];
      let take;
      if (bs !== undefined && os !== undefined) take = Number(os) > Number(bs);
      /* ختم صريح في جهة واحدة يعني تعديلاً متعمّداً على الحقل،
         والجهة الأخرى تحمل قيمة موروثة من نسخة قديمة — فيفوز
         الختم الصريح ولو كان السجل ككل أقدم. */
      else if (os !== undefined) take = true;
      else if (bs !== undefined) take = false;
      else take = Number(otherAt || 0) > Number(baseAt || 0);
      const b = 0, o = take ? 1 : 0;
      if (o > b){
        out[field] = other[field];
        if (other[stamp] !== undefined) out[stamp] = other[stamp];
        took = true;
      }
    }
    return took ? out : null;
  },

  /*──── إعادة رسم آمنة ────────
    الوارد يظهر فوراً على الشاشة الرئيسية، لكنه لا يقاطع عملاً
    جارياً: صفحة مفتوحة أو حقل يكتب فيه الطبيب يُؤجَّل الرسم
    حتى يفرغ، فلا يُمحى نصّ تحت يده. */
  redraw(){
    const typing = document.activeElement &&
      /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    const inPage = Nav.stack.length > 0;
    if (typing || inPage){ this.dirty = true; return; }
    this.dirty = false;
    App.draw();
  },

  /* عند العودة للشاشة الرئيسية يُطبَّق ما تأجّل */
  flush(){ if (this.dirty) this.redraw(); },

  /*──── المؤشّر في الشريط العلوي ────*/
  paint(){
    const el = $('#syncdot'); if (!el) return;
    if (!this.on()){ el.classList.add('hide'); return; }
    el.classList.remove('hide');
    const st = this.busy ? 'busy'
             : (!navigator.onLine || this.err) ? 'off'
             : (this.pending || this.imgWait) ? 'wait' : 'ok';
    el.className = 'syncdot ' + st + (Live.up() ? ' live' : '');
    el.title = this.busy ? T('syncing')
             : !navigator.onLine ? T('syncOff')
             : this.err ? this.err
             : this.pending ? `${this.pending} ${T('pendingN')}`
             : this.imgWait ? `${this.imgWait} ${T('pendingUp')}`
             : `${T('syncClean')} · ${Live.up() ? T('liveOn') : T('liveOff')}`;
  },

  init(){
    this.last = Number(localStorage.getItem('d_synced') || 0);
    this.count();
    /* عودة الشبكة: يُعاد الاستماع ويُرفع الصادر فوراً */
    window.addEventListener('online',  () => { this.listen(); this.run(); });
    window.addEventListener('offline', () => this.paint());
    /* شبكة أمان فقط: الوارد يصل بالاستماع والصادر يُرفع لحظة الكتابة.
       هنا يُتأكّد كل ١٥ ثانية أن الاستماع قائم وأن لا صادر عالقاً —
       بلا أي طلب للسيرفر ما دام كل شيء سليماً. */
    setInterval(() => {
      if (!this.on() || !navigator.onLine || this.busy) return;
      if (!Object.keys(this._subs).length) this.listen();
      if (this.pending && Date.now() - this.last >= 30000) this.run();
    }, 15000);
  },
};

/* عنوان العودة: البرنامجان يتشاركان سيرفراً واحداً، فلولا هذا
   لعادت رسائل تأكيد الطاقم إلى تطبيق المراجع. كل برنامج يرسل
   عنوانه مع الطلب، فيرجع البريد إلى مَن طلبه. */
const backHere = () => location.origin + location.pathname;

const CLOUD_URL = 'firebase';
const CLOUD_KEY = 'firebase';

/*═══════════════ الاتصال بالسيرفر (Firebase) ═══════════════
  واجهة Cloud نفسها التي يستعملها البرنامج كله (session · me · whoami ·
  signIn · signOut · addAccount …) لكن خلفها Firebase. القواعد في
  firestore.rules هي التي تعزل العيادات وتفرض الأدوار والاشتراك —
  هذه الطبقة لا تثق بنفسها في شيء من ذلك.
═══════════════════════════════════════════════════════════*/
const Cloud = {
  cfg:{ url:CLOUD_URL, key:CLOUD_KEY },
  session:null,      /* { email, uid, exp } — موجودة ما دام المستخدم داخلاً */
  me:null,           /* ناتج whoami: الدور والعيادة والاشتراك */

  load(){ FBC.init(); },
  ready(){ return !!FBC.auth; },
  saveSess(v){ this.session = v; },

  /* الجلسة تحفظها Firebase نفسها على الجهاز — هنا ننتظر استرجاعها */
  async boot(){
    const u = await FBC.ready();
    this.session = u ? { email:u.email, uid:u.uid, exp:Infinity } : null;
    return this.session;
  },

  /* لم يبقَ استدعاء REST — أي مسار قديم منسيّ يظهر خطؤه فوراً */
  async call(path){ throw new Error('unsupported: ' + path); },

  async signIn(email, password){
    try {
      const cr = await FBSDK.signInWithEmailAndPassword(FBC.auth, String(email).trim().toLowerCase(), password);
      this.session = { email:cr.user.email, uid:cr.user.uid, exp:Infinity };
    } catch(e){ throw FBC.err(e); }
    const me = await this.whoami();
    if (me && me.role !== 'none' && me.role !== 'patient'){
      try { await FBSDK.updateDoc(FBC.d('members', me.uid), { last_login:FBSDK.serverTimestamp(), seen:FBSDK.serverTimestamp() }); } catch(_){}
    }
    return me;
  },

  /* من أنا؟ العضوية والعيادة والاشتراك وساعة السيرفر */
  async whoami(){
    const u = FBC.user();
    if (!u){ this.me = { role:'none' }; return this.me; }
    const F = FBSDK;
    let ms;
    try { ms = await F.getDoc(FBC.d('members', u.uid)); } catch(e){ throw FBC.err(e); }

    if (!ms.exists() || ms.data().active !== true){
      let isPt = false;
      try { isPt = (await F.getDoc(FBC.d('patients', u.uid))).exists(); } catch(_){}
      this.me = isPt ? { role:'patient' } : { role:'none' };
      return this.me;
    }
    let m = ms.data();

    /* ساعة السيرفر: ختم «آخر ظهور» ثم قراءته — منه يُقاس فرق ساعة الجهاز */
    let now = Date.now();
    try {
      await F.updateDoc(FBC.d('members', u.uid), { seen:F.serverTimestamp() });
      const m2 = await F.getDoc(FBC.d('members', u.uid));
      if (m2.exists()){ m = m2.data(); now = FBC.ms(m.seen) || now; }
    } catch(_){}
    Sync.skew = now - Date.now();

    let c = null;
    try { const cs = await F.getDoc(FBC.d('clinics', m.cid)); c = cs.exists() ? cs.data() : null; }
    catch(e){ throw FBC.err(e); }
    if (!c){ this.me = { role:'none' }; return this.me; }

    const ok = FBC.subOk(c, now);
    /* المستثمر يرى كل أطباء عيادته */
    let vis = Array.isArray(m.vis) ? m.vis.slice() : [];
    if (m.role === 'owner' && c.active && ok){
      try {
        const q = F.query(FBC.c('members'), F.where('cid', '==', m.cid), F.where('role', '==', 'doctor'));
        vis = (await F.getDocs(q)).docs.map(d => d.id);
      } catch(_){}
    }
    vis = [...new Set(vis)].sort();

    this.me = {
      role:m.role, uid:u.uid, clinic_id:m.cid, clinic_name:c.name, clinic_kind:'clinic',
      doctor_name:c.doctor_name || null, full_name:m.name || null,
      app_name:c.app_name || null, logo:c.logo || null, code:c.code || null,
      can_manage: m.role === 'owner' && c.active === true && ok,
      vis,
      /* النطاق: تغيّره يعني أن ما يجوز لهذا الجهاز رؤيته تغيّر */
      scope: m.role === 'owner' ? 'owner' : vis.join(','),
      limits:{ doctor:c.max?.doctor ?? 1, secretary:c.max?.secretary ?? 1, pharmacy:c.max?.pharmacy ?? 1 },
      sub:{
        plan:c.plan || null, plan_name:(FBC.PLANS[c.plan] || {}).name || null,
        billing:c.billing || 'annual',
        paid_until:FBC.iso(c.paid_until), grace_until:FBC.iso(c.grace_until),
        ok, active:c.active === true, now:new Date(now).toISOString(),
      },
    };
    try { localStorage.setItem('d_me', JSON.stringify(this.me)); } catch(_){}
    return this.me;
  },

  /* التذكرة تجدّدها Firebase تلقائياً */
  async refresh(){ return !!FBC.user(); },

  async signOut(){
    try { Sync.unlisten(); } catch(_){}
    try { await FBSDK.signOut(FBC.auth); } catch(_){}
    this.session = null; this.me = null;
    try { localStorage.removeItem('d_me'); } catch(_){}
  },

  /*──── تسجيل عيادة جديدة ────
    الحساب يُنشأ في تطبيق ثانوي، وبجلسته تُكتب العيادة والعضوية
    وبطاقة الرمز في دفعة واحدة — القواعد تمنح العيادة الجديدة تجربة
    ١٤ يوماً وحدوداً افتراضية لا يستطيع المسجِّل تغييرها. */
  async registerClinic(payload){
    const F = FBSDK;
    const k = payload.clinic || {};
    const o = payload.owner || {};
    if (k.logo && String(k.logo).length > 400000) throw new Error(T('logoBig'));
    try {
      await FBC.createUser(o.email, o.password, { verify:true, after: async (sec, uid) => {
        const db = F.initializeFirestore(sec, { localCache:F.memoryLocalCache() });
        let code = null;
        for (let i = 0; i < 5 && !code; i++){
          const t = FBC.genCode();
          try { if (!(await F.getDoc(F.doc(db, 'codes', t))).exists()) code = t; } catch(_){ code = t; }
        }
        const cid = F.doc(F.collection(db, 'clinics')).id;
        const card = { cid, name:k.name, app_name:null, logo:k.logo || null, doctor_name:null,
                       phone:k.phone || null, area:k.area || null, gov:k.gov || null, active:true };
        const b = F.writeBatch(db);
        b.set(F.doc(db, 'clinics', cid), {
          name:k.name, app_name:null, logo:k.logo || null, phone:k.phone || null,
          country:k.country || null, gov:k.gov || null, area:k.area || null, landmark:null,
          doctor_name:null, code, kind:'clinic', active:true, owner_uid:uid,
          max:{ doctor:1, secretary:1, pharmacy:1 }, cnt:{ doctor:0, secretary:0, pharmacy:0 },
          plan:null, billing:'annual', grace_until:null,
          paid_until:F.Timestamp.fromMillis(Date.now() + 14 * 86400000),
          created_at:F.serverTimestamp(), u:F.serverTimestamp(),
        });
        b.set(F.doc(db, 'members', uid), { cid, role:'owner', name:k.name, email:String(o.email).toLowerCase(),
          active:true, vis:[], created_at:F.serverTimestamp() });
        b.set(F.doc(db, 'codes', code), card);
        await b.commit();
      }});
    } catch(e){
      const m = String(e?.message || e);
      if (m === 'email_taken')   throw new Error(T('emailTaken'));
      if (m === 'weak_password') throw new Error(T('pass8'));
      if (m === 'bad_email')     throw new Error(T('email'));
      if (e?.net)                throw new Error(T('cloudFail'));
      throw new Error(m || T('regFailed'));
    }
    return { ok:true };
  },

  /*──── حسابات الطاقم (المستثمر) ────
    العضوية وعدّاد العيادة في دفعة واحدة: القواعد ترفض أي حساب
    يتجاوز حدّ لوحة التحكم، فلا طريق لتجاوزه من الجهاز. */
  async staffFn(body){
    const F = FBSDK, cid = this.me?.clinic_id;
    if (!cid || !this.me?.can_manage) throw new Error(T('docOnly'));
    const clinicRef = FBC.d('clinics', cid);
    try {
      if (body.action === 'create'){
        const role = body.role;
        if (!['doctor', 'secretary', 'pharmacy'].includes(role)) throw new Error('bad_role');
        const c = (await F.getDoc(clinicRef)).data();
        if ((c.cnt?.[role] || 0) >= (c.max?.[role] || 0)) throw new Error(T('quotaFull'));
        const email = String(body.email || '').trim().toLowerCase();
        const uid = await FBC.createUser(email, body.password, { after: async (sec, nuid) => {
          const b = F.writeBatch(FBC.db);
          b.set(FBC.d('members', nuid), { cid, role, name:body.name || '', email, active:true,
            vis: role === 'doctor' ? [nuid] : [], created_at:F.serverTimestamp(), created_by:this.me.uid });
          b.update(clinicRef, { cnt:{ ...{ doctor:0, secretary:0, pharmacy:0 }, ...(c.cnt || {}), [role]:(c.cnt?.[role] || 0) + 1 },
                                cnt_by:nuid });
          await b.commit();
        }});
        return { ok:true, user_id:uid, email, role };
      }
      if (body.action === 'setActive'){
        const uid = body.user_id, on = !!body.active;
        const ms = await F.getDoc(FBC.d('members', uid));
        if (!ms.exists() || ms.data().cid !== cid) throw new Error('not_found');
        const m = ms.data();
        if (m.role === 'owner') throw new Error('not_allowed');
        if (m.active === on) return { ok:true };
        const c = (await F.getDoc(clinicRef)).data();
        const n = (c.cnt?.[m.role] || 0) + (on ? 1 : -1);
        if (on && n > (c.max?.[m.role] || 0)) throw new Error(T('quotaFull'));
        const b = F.writeBatch(FBC.db);
        b.update(FBC.d('members', uid), { active:on });
        b.update(clinicRef, { cnt:{ ...(c.cnt || {}), [m.role]:Math.max(0, n) }, cnt_by:uid });
        await b.commit();
        return { ok:true };
      }
      if (body.action === 'resend'){
        const ms = await F.getDoc(FBC.d('members', body.user_id));
        if (!ms.exists()) throw new Error('not_found');
        await FBSDK.sendPasswordResetEmail(FBC.auth, ms.data().email);
        return { ok:true };
      }
    } catch(e){
      const m = String(e?.message || e);
      if (m === 'email_taken')   throw new Error(T('emailTaken'));
      if (m === 'weak_password') throw new Error(T('pass8'));
      if (m === 'bad_email')     throw new Error(T('email'));
      if (m === 'permission-denied') throw new Error(T('quotaFull'));
      if (e?.net)                throw new Error(T('cloudFail'));
      throw e instanceof Error ? e : new Error(m);
    }
    throw new Error('unknown_action');
  },

  addAccount({ role, email, password, name }){
    return this.staffFn({ action:'create', role,
      email:String(email||'').trim().toLowerCase(), password, name:name||'' });
  },

  /*──── طاقم العيادة وروابط الأطباء ────
    الشكل نفسه الذي كانت تعيده clinic_staff، فلا تتغيّر الشاشات. */
  async staff(){
    const F = FBSDK, cid = this.me?.clinic_id; if (!cid) throw new Error('no_clinic');
    const [ms, ls, cs] = await Promise.all([
      F.getDocs(F.query(FBC.c('members'), F.where('cid', '==', cid))),
      F.getDocs(FBC.c('clinics', cid, 'links')),
      F.getDoc(FBC.d('clinics', cid)),
    ]);
    const members = ms.docs.map(d => { const x = d.data();
      return { uid:d.id, role:x.role, name:x.name || '', email:x.email || '', active:x.active !== false, confirmed:true }; });
    const links = [];
    ls.docs.forEach(d => { const x = d.data();
      for (const kind of ['secretary', 'pharmacy', 'doctor'])
        for (const m of (x[kind] || [])) links.push({ doctor:d.id, member:m, kind }); });
    const c = cs.exists() ? cs.data() : {};
    return { members, links, limits:{ doctor:c.max?.doctor ?? 1, secretary:c.max?.secretary ?? 1, pharmacy:c.max?.pharmacy ?? 1 } };
  },

  /* الطبيب يختار فريقه: تُحفظ القائمة، ويُضاف/يُزال من قائمة رؤية كل زميل */
  async linksSet(kind, ids){
    const F = FBSDK, cid = this.me?.clinic_id, me = this.me?.uid;
    const ref = FBC.d('clinics', cid, 'links', me);
    const cur = await F.getDoc(ref);
    const old = new Set(cur.exists() ? (cur.data()[kind] || []) : []);
    const now = new Set(ids);
    const b = F.writeBatch(FBC.db);
    b.set(ref, { [kind]:[...now] }, { merge:true });
    for (const m of now) if (!old.has(m) && m !== me) b.update(FBC.d('members', m), { vis:F.arrayUnion(me) });
    for (const m of old) if (!now.has(m) && m !== me) b.update(FBC.d('members', m), { vis:F.arrayRemove(me) });
    try { await b.commit(); } catch(e){ throw FBC.err(e); }
  },

  /* هوية العيادة وبياناتها — والبطاقة العامة التي يقرؤها المراجع */
  async clinicUpdate(p){
    const F = FBSDK, cid = this.me?.clinic_id;
    const keys = ['name', 'app_name', 'logo', 'phone', 'country', 'gov', 'area', 'landmark'];
    const up = {};
    for (const k of keys) if (k in p) up[k] = (p[k] == null || p[k] === '') ? (k === 'name' ? undefined : null) : String(p[k]).trim();
    if (!up.name) delete up.name;
    if (up.logo && up.logo.length > 400000) throw new Error(T('logoBig'));
    up.u = F.serverTimestamp();
    try {
      await F.updateDoc(FBC.d('clinics', cid), up);
      const c = (await F.getDoc(FBC.d('clinics', cid))).data();
      if (c.code){
        await F.setDoc(FBC.d('codes', c.code), { cid, name:c.name, app_name:c.app_name || null, logo:c.logo || null,
          doctor_name:c.doctor_name || null, phone:c.phone || null, area:c.area || null, gov:c.gov || null,
          active:c.active === true });
      }
      return { name:c.name, app_name:c.app_name || null, logo:c.logo || null, code:c.code || null };
    } catch(e){ throw FBC.err(e); }
  },

  async resetMail(email){
    try { await FBSDK.sendPasswordResetEmail(FBC.auth, String(email).trim().toLowerCase()); }
    catch(e){ throw FBC.err(e); }
  },

  /* تغيير كلمة المرور: الحالية تُتحقَّق بدخول فعلي أولاً */
  async changePass(current, next){
    const u = FBC.user(); if (!u) throw new Error('invalid credential');
    try {
      await FBSDK.reauthenticateWithCredential(u, FBSDK.EmailAuthProvider.credential(u.email, current));
      await FBSDK.updatePassword(u, next);
    } catch(e){ throw FBC.err(e); }
  },

  async ping(){ return navigator.onLine; },
};


/*═══════════════ هوية العيادة ═══════════════
  اسم التطبيق وشعاره يخصّان العيادة وحدها: يُقرآن من السيرفر عند
  الدخول، ويُحفظان في هذا الجهاز ليظهرا على شاشة الدخول التالية.
  عيادة أخرى على جهازها ترى هويتها هي — لا تتأثر بما هنا.
═══════════════════════════════════════════*/
const Brand = {
  KEY:'d_brand',
  get(){ try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch(_){ return {}; } },

  save(me){
    const b = { name: me.app_name || me.clinic_name || '', clinic: me.clinic_name || '',
                logo: me.logo || '', code: me.code || '' };
    try { localStorage.setItem(this.KEY, JSON.stringify(b)); } catch(_){}
    this.apply(b);
  },

  apply(b){
    b = b || this.get();
    APP.logo = b.logo || '';
    APP.title = b.name || '';
    const nm = b.name || APP.nameAr;
    document.title = b.name ? `${b.name}` : `${APP.nameAr} — ${APP.nameEn}`;
    const ln = $('#lg-name'); if (ln) ln.textContent = nm;
    const ls = $('#lg-sub');  if (ls) ls.textContent = b.name ? (b.clinic && b.clinic !== b.name ? b.clinic : APP.nameEn) : APP.nameEn;
    const lg = $('#applogo') || document.querySelector('#login .applogo');
    if (lg) lg.outerHTML = ICON.el();
    const mk = $('#hd-mk');
    if (mk){
      mk.classList.toggle('img', !!b.logo);
      mk.innerHTML = b.logo
        ? `<img src="${esc(b.logo)}" alt="">`
        : `<svg width="22" height="22" viewBox="0 0 24 24"><path d="${ICON.TOOTH}" fill="var(--on-br)"/></svg>`;
    }
    try { ICON.cache = {}; Install.manifest(); } catch(_){}
  },

  /* الشعار يُصغَّر قبل رفعه: ٢٥٦ بكسل تكفي لكل مكان يظهر فيه،
     ويبقى حجمه عشرات الكيلوبايتات لا ميغابايتات في القاعدة. */
  async shrink(file, max){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url;
      });
      const M = max || 256, sc = Math.min(1, M / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc));
      c.height = Math.max(1, Math.round(img.height * sc));
      const g = c.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(img, 0, 0, c.width, c.height);
      let out = c.toDataURL('image/webp', .9);
      if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
      if (out.length > 380000) out = c.toDataURL('image/jpeg', .8);
      if (out.length > 380000) throw new Error(T('logoBig'));
      return out;
    } finally { URL.revokeObjectURL(url); }
  },
};

/*═══════════════ طاقم العيادة وروابط الطبيب ═══════════════*/
const Staff = {
  data:null, at:0,
  key(){ return 'd_staff_' + (Cloud.me?.clinic_id || S.user?.clinic_id || 'x'); },

  cache(){
    if (!this.data){ try { this.data = JSON.parse(localStorage.getItem(this.key())) || null; } catch(_){} }
    return this.data;
  },

  /* يُحمَّل عند الحاجة لا مع كل مزامنة — وتُحفظ نسخة للعمل بلا إنترنت */
  async load(force){
    if (!Sync.on() || !navigator.onLine) return this.cache();
    if (!force && this.data && Date.now() - this.at < 120000) return this.data;
    try {
      const d = await Cloud.staff();
      this.data = d; this.at = Date.now();
      try { localStorage.setItem(this.key(), JSON.stringify(d)); } catch(_){}
    } catch(_){ return this.cache(); }
    return this.data;
  },

  members(role){ return ((this.data || {}).members || []).filter(m => !role || m.role === role); },
  active(role){ return this.members(role).filter(m => m.active !== false); },
  name(uid){ return (this.members().find(m => m.uid === uid) || {}).name || ''; },

  /* من ربطهم هذا الطبيب بنفسه من نوع ما */
  linked(kind, doctor){
    const d = doctor || S.user?.uid;
    const ids = new Set(((this.data || {}).links || [])
      .filter(l => l.doctor === d && l.kind === kind).map(l => l.member));
    return this.members(kind).filter(m => ids.has(m.uid));
  },

  soleDoctor(){
    const d = this.active('doctor');
    return d.length === 1 ? d[0].uid : null;
  },
};

/*═══════════════ ملكية السجلات ═══════════════*/
const Own = {
  STORES:['patients','visits','works','payments','files','tooth','rx','appts'],
  pending:null,          /* الطبيب المختار لمراجع يُسجَّل الآن */

  async of(store, obj){
    if (store === 'patients'){
      if (this.pending) return this.pending;
      if (S.role === 'doctor') return S.user?.uid || null;
      return Staff.cache() ? Staff.soleDoctor() : null;
    }
    if (obj.pid){
      const p = await DB.get('patients', obj.pid);
      if (p && p._own) return p._own;
    }
    if (S.role === 'doctor') return S.user?.uid || null;
    return Staff.cache() ? Staff.soleDoctor() : null;
  },

  /* لأي طبيب هذا المراجع الجديد؟
     الطبيب نفسه لا يُسأل. والسكرتير يُسأل فقط إن خدم أكثر من طبيب.
     يُرجع المعرّف، أو null إن أُلغي أو لم يوجد طبيب مربوط. */
  async choose(){
    if (S.role === 'doctor') return S.user?.uid || '';
    if (!Sync.on()) return '';                       /* حساب محلي قديم */
    await Staff.load();
    const docs = Staff.active('doctor');
    if (!docs.length){ toast(T('noDoctorLinked'), 'e'); return null; }
    if (docs.length === 1) return docs[0].uid;
    return this.pick(docs);
  },

  pick(docs){
    return new Promise(res => {
      const ov = el(`<div class="pickov"><div class="pickbox">
        <div class="h2">${T('pickDoctor')}</div>
        <div class="tiny mt">${T('pickDoctorHint')}</div>
        <div class="col mt2">${docs.map((d,i)=>`
          <button class="it" data-i="${i}" style="width:100%;text-align:start">
            <div class="av">${esc((d.name||'?').replace(/^[دdD]\.?\s*/,'').charAt(0))}</div>
            <div class="gr"><div class="h3 ell">${esc(d.name||'—')}</div>
              <div class="tiny">${T('ofDoctor')}</div></div>
          </button>`).join('')}</div>
        <button class="btn w gh mt2" data-x="1">${T('cancel')}</button>
      </div></div>`);
      ov.addEventListener('click', e => {
        const b = e.target.closest('[data-i],[data-x]');
        if (!b && e.target !== ov) return;
        ov.remove();
        res(b && b.dataset.i != null ? docs[Number(b.dataset.i)].uid : null);
      });
      document.body.appendChild(ov);
    });
  },
};

/*═══════════════ ملف الطبيب الشخصي ═══════════════
  الاسم واللقب والتوقيع لكل طبيب على حدة — في عيادة بعدة أطباء لا
  يجوز أن تخرج وصفة طبيب بتوقيع زميله. يُحفظ في سجل إعدادات باسم
  الطبيب، فيصل إلى أجهزة العيادة كلها مع المزامنة.
═══════════════════════════════════════════════*/
const Prof = {
  _me:null,
  id(uid){ return 'prof:' + uid; },
  async get(uid){
