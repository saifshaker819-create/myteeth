    try { const r = await DB.get('settings', this.id(uid)); return (r && r.v) || null; }
    catch(_){ return null; }
  },
  async mine(){
    if (!S.user?.uid) return null;
    this._me = await this.get(S.user.uid);
    return this._me;
  },
  cachedName(){ return (this._me && this._me.name) || ''; },
  async save(v){

/*──── نطاق الرؤية ────
  حين يربط طبيبٌ زميلاً به أو يفكّ الربط، يتغيّر ما يجوز لهذا الجهاز
  رؤيته. السحب بالرقم المتسلسل لا يعيد ما فات، ولا يمحو ما لم يعد
  مسموحاً. فعند تغيّر النطاق: يُرفع ما ينتظر أولاً، ثم تُمحى السجلات
  السريرية المحلية ويُسحب كل شيء من جديد بالنطاق الجديد. */
const Scope = {
  key(){ return 'd_scope_' + (Cloud.me?.clinic_id || 'x'); },
  CLINICAL:['patients','visits','works','payments','files','tooth','rx','appts'],

  async check(me){
    if (!me || !me.scope || !Sync.on()) return;
    const old = localStorage.getItem(this.key());
    if (old === me.scope) return;
    if (old){
      try {
        if ((await DB.all('outbox')).length) await Sync.push();
        if (await Img.pending()) await Img.flush();
        if ((await DB.all('outbox')).length || await Img.pending()) return;
      } catch(_){ return; }        /* بلا رفع ناجح لا يُمحى شيء — يُعاد لاحقاً */
      toast(T('scopeChanged'), 'w');
      Sync.quiet = true;
      try {
        for (const st of this.CLINICAL)
          for (const r of await DB.all(st)) await DB.del(st, r.id);
      } finally { Sync.quiet = false; }
      /* الحذف المحلي ليس حذفاً على السيرفر — يُفرَّغ الصادر منه */
      for (const x of await DB.all('outbox')) await DB.del('outbox', x.id);
      Sync.setRev(0);
    }
    try { localStorage.setItem(this.key(), me.scope); } catch(_){}
  },

  /* يُسأل السيرفر عن النطاق عند العودة للتطبيق، لا مع كل مزامنة */
  _at:0,
  async recheck(){
    if (!Sync.on() || !navigator.onLine || Date.now() - this._at < 600000) return;
    this._at = Date.now();
    try {
      const me = await Cloud.whoami();
      if (me && me.role === S.role){
        Brand.save(me); Sub.save(me); Sub.tick();
        if (Sub.expired()) return;
        await this.check(me); Sync.kick();
      }
    } catch(_){}
  },
};

/*═══════════════ الاشتراك ═══════════════
  موعد الدفع والانتهاء يقرّرهما السيرفر (whoami.sub) ويفرضهما على
  القاعدة نفسها: عند الانتهاء لا قراءة ولا كتابة ولا صور. هنا العرض:
  عدّاد في الشريط العلوي، تنبيه وومض في آخر ١٠ أيام، وشاشة إيقاف.
  الوقت يُقاس بساعة السيرفر (فرقها محفوظ مع الحالة)، فتغيير ساعة
  الجهاز لا يمدّ الاشتراك.
═════════════════════════════════════════*/
const Sub = {
  PHONE:'07807632797', WA:'9647807632797', WARN:10,
  d:null, _t:null, _chk:0,

  key(){ return 'd_sub_' + (Cloud.me?.clinic_id || S.user?.clinic_id || 'x'); },
  save(me){
    if (!me || !me.sub) return;
    const srv = Date.parse(me.sub.now);
    this.d = { ...me.sub, skew: isNaN(srv) ? 0 : srv - Date.now() };
    this._chk = Date.now();
    try { localStorage.setItem(this.key(), JSON.stringify(this.d)); } catch(_){}
  },
  load(){
    if (this.d) return this.d;
    try { this.d = JSON.parse(localStorage.getItem(this.key())) || null; } catch(_){ this.d = null; }
    return this.d;
  },
  now(){ return Date.now() + (this.load()?.skew || 0); },
  end(){
    const d = this.load(); if (!d || !d.paid_until) return 0;
    return Math.max(Date.parse(d.paid_until) || 0, Date.parse(d.grace_until || '') || 0);
  },
  staff(){ return !!S.role && S.role !== 'patient'; },
  limited(){ return this.staff() && !!this.end(); },
  left(){ const e = this.end(); return e ? e - this.now() : Infinity; },
  suspended(){ return this.staff() && this.load()?.active === false; },
  expired(){ return (this.limited() && this.left() <= 0) || this.suspended(); },
  inGrace(){ const d = this.load(); return !!d?.grace_until && this.now() >= Date.parse(d.paid_until); },
  days(){ return Math.max(0, Math.ceil(this.left() / 86400000)); },
  /* الانتهاء عند ٠٠:٠٠ من اليوم التالي — فيوم الاستحقاق هو آخر يوم عمل */
  due(){ const e = this.end(); return e ? new Date(e - 1000) : null; },
  fmt(d){
    if (!d) return '—';
    try { return d.toLocaleDateString('en-GB', { timeZone:'Asia/Baghdad', day:'2-digit', month:'2-digit', year:'numeric' }); }
    catch(_){ return d.toISOString().slice(0, 10); }
  },

  /*──── الشريط العلوي ────*/
  paint(){
    const el = $('#subchip'); if (!el) return;
    if (!this.limited() || this.expired()){ el.classList.add('hide'); return; }
    const n = this.days(), g = this.inGrace();
    el.classList.remove('hide');
    el.classList.toggle('warn', n <= this.WARN);
    el.classList.toggle('grace', g);
    el.innerHTML = `<span class="sc-ic">${g ? '⏳' : '📅'}</span>
      <span class="sc-n">${n <= 1 ? T('subLastDay') : `${n} ${T('subDays')}`}</span>
      <span class="sc-d">${this.fmt(this.due())}</span>`;
    el.title = `${g ? T('subGrace') : T('subDue')}: ${this.fmt(this.due())}`;
  },

  start(){
    this.d = null; this.load();
    clearInterval(this._t);
    this._t = setInterval(() => this.tick(), 60000);
    this.tick();
  },
  /* كل دقيقة: العدّاد. وكل ١٠ دقائق سؤال خفيف للسيرفر، فيظهر هنا
     ما يغيّره المدير من اللوحة (الباقة، شهري/سنوي، تمديد، دفعة). */
  tick(){
    this.paint();
    if (this.expired()) this.lock(); else this.warn();
    if (this.staff() && Date.now() - this._chk > 600000) this.recheck();
  },
  stop(){ clearInterval(this._t); this._t = null; this.unlock(); this.d = null; },

  /* تنبيه مرة واحدة يومياً في آخر ١٠ أيام — والومض مستمر في الشريط */
  warn(){
    if (!this.limited() || this.days() > this.WARN) return;
    const day = new Date(this.now()).toISOString().slice(0, 10);
    const k = 'd_subwarn_' + (Cloud.me?.clinic_id || 'x') + '_' + day;
    try { if (localStorage.getItem(k)) return; localStorage.setItem(k, '1'); } catch(_){ return; }
    toast(`${this.inGrace() ? T('subGrace') + ' — ' : T('subWarn') + ' '}${this.days()} ${T('subDays')} · ${this.fmt(this.due())}`, 'w');
  },

  /*──── شاشة الإيقاف ────*/
  lock(){
    if ($('#sublock')) return;
    Live.stop();
    clearTimeout(Sync._retry);
    const sus = this.suspended();
    const div = document.createElement('div');
    div.id = 'sublock'; div.className = 'sublock';
    div.innerHTML = `<div class="sl-card">
        <div class="sl-ic">${sus ? '⏸' : '⌛'}</div>
        <div class="dsp sl-t">${T(sus ? 'subSuspended' : 'subEnded')}</div>
        <div class="sl-s">${T(sus ? 'subSuspendedHint' : 'subEndedHint')}</div>
        <div class="sl-ph"><span class="lbl">${T('subSupport')}</span>
          <a class="sl-num" dir="ltr" href="tel:${this.PHONE}">${this.PHONE}</a></div>
        <div class="row" style="gap:9px">
          <a class="btn gh gr" href="tel:${this.PHONE}">📞 ${T('subCall')}</a>
          <a class="btn gr" href="https://wa.me/${this.WA}" target="_blank" rel="noopener">💬 ${T('subWa')}</a>
        </div>
        <button class="btn gh w mt2" id="sl-chk" onclick="Sub.recheck(true)">↻ ${T('subCheck')}</button>
        <div class="tiny mt2">${T('subDataSafe')}</div>
        <button class="lnk mt2" onclick="Sub.unlock();Auth.out()">⏻ ${T('logout') || 'خروج'}</button>
      </div>`;
    document.body.appendChild(div);
  },
  unlock(){ $('#sublock')?.remove(); },

  /* يُسأل السيرفر: هل جُدّد الاشتراك؟ — يدوياً من الشاشة، أو عند
     العودة للتطبيق مرة كل دقيقتين على الأكثر. */
  async recheck(manual){
    if (!Cloud.session || !navigator.onLine){ if (manual) toast(T('syncOff'), 'w'); return; }
    if (!manual && Date.now() - this._chk < 120000) return;
    this._chk = Date.now();
    const b = $('#sl-chk'); if (b) b.disabled = true;
    try {
      if (Cloud.session.exp - Date.now() < 60000) await Cloud.refresh();
      const me = await Cloud.whoami();
      if (!me || me.role !== S.role) return;
      this.save(me);
      if (!this.expired()){
        const was = !!$('#sublock');
        this.unlock(); this.paint(); this.warn();
        if (was){
          Brand.save(me);
          await Scope.check(me);
          if (Sync.on()){ Sync.run(); Live.connect(); }
          toast(T('subBack'), 's');
        }
      } else {
        this.lock();
        if (manual) toast(T('subStill'), 'e');
      }
    } catch(_){ if (manual) toast(T('cloudFail'), 'e'); }
    finally { if (b) b.disabled = false; }
  },

  info(){
    const d = this.load() || {};
    const row = (k, v) => `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--edge)">
      <span class="lbl">${k}</span><b>${v}</b></div>`;
    UI.sheet(`<div class="h2">${T('subTitle')}</div>
      <div class="card flat mt2">
        ${row(T('subPlan'), esc(d.plan_name || '—'))}
        ${row(T('subBilling'), d.billing === 'monthly' ? T('subMonthly') : T('subAnnual'))}
        ${row(this.inGrace() ? T('subGrace') : T('subDue'), this.fmt(this.due()))}
        ${row(T('subLeft'), this.days() <= 1 ? T('subLastDay') : `${this.days()} ${T('subDays')}`)}
      </div>
      <div class="tiny mt2">${T('subPayHint')}</div>
      <div class="row mt2" style="gap:9px">
        <a class="btn gh gr" href="tel:${this.PHONE}">📞 <span dir="ltr">${this.PHONE}</span></a>
        <a class="btn gr" href="https://wa.me/${this.WA}" target="_blank" rel="noopener">💬 ${T('subWa')}</a>
      </div>`);
  },
};

  async cloudSubmit(){
    const err = $('#cl-err');
    const show = m => { err.textContent = m; err.classList.remove('hide'); };
    err.classList.add('hide');

    const email = $('#cl-email').value.trim().toLowerCase();
    const pass  = $('#cl-pass').value;
    if (!email || !pass) return show(T('fillAll'));

    const left = Guard.lockLeft();
    if (left) return show(`${T('tooMany')} ${Math.ceil(left/1000)}s`);

    const btn = $('#cl-go');
    btn.disabled = true; btn.textContent = T('cloudBusy');
    try {
      const me = await Cloud.signIn(email, pass);
      if (!me || me.role === 'none' || me.role === 'patient'){
        await Cloud.signOut();
        return show(T('noMembership'));
      }
      Guard.ok();
      await Guard.remember(email, pass, me);   /* ليعمل بلا إنترنت لاحقاً */
      /* اسم العيادة والطبيب معروفان من السيرفر — لا يُسأل عنهما مرة أخرى */
      if (!CFG.data.registered && me.clinic_name){
        CFG.data.clinic = me.clinic_name;
        if (me.doctor_name) CFG.data.doctor = me.doctor_name;
        CFG.data.registered = true;
        await CFG.save();
        $('#regbox')?.remove();
      }
      /* ★ الدور يقرّره السيرفر، فتُفتح واجهة الطبيب أو السكرتير
         أو الصيدلية أو المراجع تلقائياً من شاشة واحدة. */
      S.role = me.role;
      S.user = { id:email, uid:me.uid || null, role:me.role,
                 name:me.full_name || me.n1 || email,
                 cloud:true, clinic_id:me.clinic_id || null };
      if (me.clinic_name) S.clinicName = me.clinic_name;
      Brand.save(me);
      Sub.save(me);
      await Scope.check(me);
      App.start();
    } catch (e) {
      const m = String(e.message || e);
      /* الشبكة مقطوعة: تُجرَّب ذاكرة الجهاز بدل أن يقف العمل */
      if (/cloudFail|تعذّر|Failed to fetch|NetworkError|^network$/i.test(m) || !navigator.onLine){
        const r = await Guard.offlineIn(email, pass);
        if (r.ok){
          S.role = r.me.role;
          S.user = { id:email, uid:r.me.uid || null, role:r.me.role,
                     name:r.me.full_name || email,
                     cloud:true, offline:true, clinic_id:r.me.clinic_id };

          toast(T('offlineIn'), 'w');
          return App.start();

        if (r.why === 'noOffline')   return show(T('noOffline'));
        if (r.why === 'offlineOld')  return show(T('offlineOld'));
        return show(T('badCloudLogin'));

      if (/api key/i.test(m)) show(T('badKey'));

/*═══════════════ استمارة التاريخ الطبي ═══════════════
  مطابقة لاستمارة العيادة الورقية — ٢٢ سؤالاً بأقسامها
═══════════════════════════════════════════════════════*/
const MH = {
  /* توحيد شكل الإجابات ─ تطبيق المراجع كان يرسل ١ أو نصّ التفصيل
     مباشرة، والبرنامج هنا يتوقّع {y:true,d:'…'}. فكانت إجابات الحجز
     تصل ولا تُقرأ، ولا يخرج منها أي تنبيه للسكرتير أو الطبيب.
     التوحيد في مكان واحد يجعل الشكلين مقروءين بلا كسر أي سجل قديم. */
  norm(vals){
    if (!vals || typeof vals !== 'object') return {};
    const out = {};
    for (const [k, v] of Object.entries(vals)){
      if (v === null || v === undefined || v === false || v === 0 || v === '') continue;
      if (typeof v === 'object'){
        if (v.y) out[k] = { y:true, d:String(v.d || '').trim() };
        continue;
      }
      const t = String(v).trim();
      if (!t || t === '0' || t === 'false') continue;
      out[k] = { y:true, d:(t === '1' || t === 'true') ? '' : t };
    }
    return out;
  },

  render(vals, gender, editable){
    vals = this.norm(vals);
    const groups = ['gen','car','alg','med'];
    let html = '';

    for (const g of groups){
      const qs = MHQ.filter(q => q.g===g && !q.f);
      if (!qs.length) continue;
      html += `<div class="mt2"><div class="lbl">${MHG[g][LG]}</div><div class="col mt">
        ${qs.map(q => this.q(q, vals, editable)).join('')}
      </div></div>`;
    }

    /* قسم النساء يظهر فقط للإناث */
    if (gender === 'female'){
      const qs = MHQ.filter(q => q.f);
      html += `<div class="mt2">
        <div class="al i"><span>♀</span><span>${MHG.fem[LG]}</span></div>
        <div class="col mt">${qs.map(q=>this.q(q, vals, editable)).join('')}</div></div>`;
    }
    return html;
  },

  q(q, vals, editable){
    const v = vals[q.c] || {};
    const on = !!v.y;
    const dang = q.risk === 2;
    const txt = isAr()? q.ar : q.en;
    const dis = editable === false ? 'style="pointer-events:none;opacity:.85"' : '';
    /* من قال إن صحته جيدة تُقفل عنه بقية الأسئلة */
    const off = q.c !== 'health_good' && !!(vals.health_good && vals.health_good.y);
    return `<div>
      <div class="chk ${on?'on':''} ${dang?'dang':''} ${off?'mhoff':''}" id="mhc-${q.c}" ${dis}
           onclick="MH.toggle('${q.c}')">
        <div class="bx">✓</div>
        <div class="gr">${esc(txt)}</div>
        ${q.risk===2?'<span class="pill r">⚠</span>':q.risk===1?'<span class="pill w">!</span>':''}
      </div>
      ${q.d ? `<div id="mhd-${q.c}" class="${on?'':'hide'}" style="margin-top:7px;padding-inline-start:12px">
        <input id="mhi-${q.c}" placeholder="${esc(q.dl || (isAr()?'التفاصيل':'Details'))}"
               value="${esc(v.d||'')}" ${editable===false?'disabled':''}>
      </div>` : ''}
    </div>`;
  },

  /* «صحتي جيدة» جواب يلغي ما سواه: من صحته جيدة لا حالة عنده.
     فاختيارها يرفع البقية ويقفلها، ورفعها يفتحها من جديد. */
  GOOD:'health_good',

  toggle(c){
    const box = $('#mhc-'+c); if (!box) return;
    const goodOn = !!$('#mhc-'+this.GOOD)?.classList.contains('on');

    /* محاولة اختيار حالة أخرى مع «صحتي جيدة» تُمنع بتنبيه صريح */
    if (c !== this.GOOD && goodOn && !box.classList.contains('on'))
      return toast(T('mhGoodAlone'), 'e');

    box.classList.toggle('on');
    const d = $('#mhd-'+c);
    if (d) d.classList.toggle('hide', !box.classList.contains('on'));

    if (c === this.GOOD) this.lockOthers(box.classList.contains('on'));
  },

  lockOthers(on){
    let cleared = 0;
    for (const q of MHQ){
      if (q.c === this.GOOD) continue;
      const b = $('#mhc-'+q.c); if (!b) continue;
      if (on && b.classList.contains('on')){
        b.classList.remove('on');
        $('#mhd-'+q.c)?.classList.add('hide');
        const i = $('#mhi-'+q.c); if (i) i.value = '';
        cleared++;
      }
      b.classList.toggle('mhoff', !!on);
    }
    if (on) toast(cleared ? T('mhGoodPicked') : T('mhGoodAlone'), cleared ? 's' : 'w');
  },

  collect(){
    const out = {};
    for (const q of MHQ){
      const box = $('#mhc-'+q.c); if (!box) continue;
      const on = box.classList.contains('on');
      if (!on) continue;
      out[q.c] = { y:true, d: ($('#mhi-'+q.c)?.value || '').trim() };
    }
    return out;
  },

  /* التنبيهات الحرجة المستخرجة من الإجابات */
  alerts(vals, forPharmacy){
    vals = this.norm(vals);
    const out = [];
    for (const q of MHQ){
      const v = vals[q.c];
      if (!v?.y || !q.al) continue;
      if (forPharmacy && !q.ph) continue;
      out.push({ risk:q.risk, txt:(isAr()?q.al:(q.alE||q.al)), d:v.d });
    }
    return out.sort((a,b)=>b.risk-a.risk);
  },

  alertsHtml(vals, forPharmacy){
    const a = this.alerts(vals, forPharmacy);
    if (!a.length) return `<div class="al g"><span>✓</span><span>${T('noAlerts')}</span></div>`;
    return `<div class="col">${a.map(x=>`
      <div class="al ${x.risk===2?'r':'w'}">
        <span>${x.risk===2?'⚠':'!'}</span>
        <span>${esc(x.txt)}${x.d?` — <b>${esc(x.d)}</b>`:''}</span>
      </div>`).join('')}</div>`;
  },
};

const Form = {
  gender:null,

  html(p){

    this.gender = p.gender || null;
    this._prevId = p.id || null;
    const f=(id,lb,val,extra='')=>`<div><label class="lb">${lb} <span class="req">*</span></label>

      <div class="mt">${f('f-addr',T('address'),p.address)}</div>
      <div class="mt">${f('f-job',T('job'),p.job)}</div>
      <div class="mt"><label class="lb">${T('complaint')} <span class="req">*</span></label>
        <textarea id="f-comp">${esc(p.complaint||'')}</textarea></div>

      <div class="mt3"><div class="h3">${T('healthInfo')}</div>
        <div class="sub">${T('markYes')}</div></div>
      <div id="f-mh">${MH.render(p.mh, p.gender, true)}</div>

      <div class="mt2"><label class="lb">${T('prevDental')}</label>
        <textarea id="f-prev">${esc(p.prevDental||'')}</textarea></div>
      <div class="mt"><label class="lb">${T('otherInfo')}</label>
        <textarea id="f-other">${esc(p.other||'')}</textarea></div>`;
  },

  wire(){
    if (this.gender) this.setG(this.gender);
    /* اقتراح من سجلّ المراجعين نفسه — اختيار الاسم يملأ كل الحقول */
    this.attachPatientSearch($('#f-name'));
    SG.attach($('#f-addr'),'address');
    SG.attach($('#f-job'),'job');
    SG.attach($('#f-comp'),'complaint');
  },

  /* بحث حيّ في ملفات المراجعين أثناء كتابة الاسم */
  attachPatientSearch(inp){
    if (!inp) return;
    inp.parentElement.classList.add('sgw');
    let box = null, tm = null;
    const close = () => { if (box){ box.remove(); box = null; } };

    const show = async () => {
      const q = inp.value.trim();
      close();
      if (q.length < 2) return;
      const ps = (await Ops.patients(q)).slice(0, 6);
      if (!ps.length) return;

      box = el(`<div class="sgs">${ps.map(p=>`
        <div style="display:flex;align-items:center;gap:9px">
          <span class="av" style="width:30px;height:30px;font-size:13px">${esc(nm(p).charAt(0))}</span>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-weight:700" class="ell">${esc(nm(p))}</span>
            <span class="tiny">${p.age||'—'} ${T('yrs')} · ${esc(p.address||'—')}</span>
          </span>
          <span class="pill b" style="font-size:10px">${T('prevPatient')}</span>
        </div>`).join('')}</div>`);

      [...box.children].forEach((d,i) => d.onmousedown = e => {
        e.preventDefault(); close(); Form.fillFrom(ps[i]);
      });
      inp.parentElement.appendChild(box);
    };

    inp.addEventListener('focus', show);
    inp.addEventListener('input', ()=>{ clearTimeout(tm); tm = setTimeout(show, 200); });
    inp.addEventListener('blur', ()=> setTimeout(close, 180));
  },

  /* تعبئة كل البيانات من ملف سابق */
  fillFrom(p){
    const set = (id, v) => { const n = $('#'+id); if (n){ n.value = v ?? ''; n.classList.remove('err'); } };
    set('f-name', nm(p));
    set('f-age', p.age);
    set('f-phone', p.phone);
    set('f-addr', p.address);
    set('f-job', p.job);
    set('f-comp', p.complaint);
    set('f-prev', p.prevDental);
    set('f-other', p.other);
    if (p.gender) this.setG(p.gender);
    /* الاستمارة الصحية تُستعاد أيضاً */
    const box = $('#f-mh');
    if (box) box.innerHTML = MH.render(p.mh, p.gender || this.gender, true);
    this._prevId = p.id;
    toast(T('fillFromPrev'), 's');
  },

  setG(g){
    this.gender = g;
    $('#f-gm').className = 'btn gr ' + (g==='male'?'':'gh');
    $('#f-gf').className = 'btn gr ' + (g==='female'?'':'gh');
    /* قسم النساء يظهر/يختفي فوراً */
    const box = $('#f-mh');
    if (box){
      const cur = MH.collect();
      box.innerHTML = MH.render(cur, g, true);
    }
  },

  validate(){
    const ids = ['f-age','f-phone','f-addr','f-job','f-comp'];
    let bad = false;

    /* الاسم الرباعي إجباري — أربع كلمات على الأقل */
    const nEl = $('#f-name');
    const okName = nEl && nameWords(nEl.value) >= 4;
    if (nEl) nEl.classList.toggle('err', !okName);
    if (!okName) bad = true;

    for (const id of ids){
      const n = $('#'+id); if (!n) continue;
      const ok = n.value.trim().length >= (id==='f-age' ? 1 : 2);
      n.classList.toggle('err', !ok);
      if (!ok) bad = true;
    }
    if (!this.gender){ $('#f-gm').classList.add('err'); $('#f-gf').classList.add('err'); bad = true; }
    return !bad;
  },

  read(){
    const v = id => ($('#'+id)?.value || '').trim();
    const full = v('f-name');
    return {
      name: full, ...splitName(full),
      age:Number(v('f-age'))||null, gender:this.gender,
      phone:v('f-phone'), address:v('f-addr'), job:v('f-job'),
      complaint:v('f-comp'), prevDental:v('f-prev'), other:v('f-other'),
      mh: MH.collect(),
    };
  },

  async learn(d){
    await SG.learn('name', d.name);
    await SG.learn('address', d.address);
    await SG.learn('job', d.job);
    await SG.learn('complaint', d.complaint);
  },
};
/*═══════════════ عمليات مشتركة ═══════════════*/
const Ops = {
  async patients(q){
    const all = await DB.all('patients');
    const s = String(q||'').trim().toLowerCase();
    const list = !s ? all : all.filter(p =>
      nm(p).toLowerCase().includes(s) ||
      (p.phone||'').replace(/\D/g,'').includes(s.replace(/\D/g,'')) && s.replace(/\D/g,'') ||
      String(p.mrn||'').includes(s));
    /* الأحدث نشاطاً أولاً: آخر تعديل، وإلا تاريخ التسجيل */
    return list.sort((a,b)=> ((b.up||b.at||0) - (a.up||a.at||0)));
  },

  /*──── باركود المراجع ────
    رقم قصير يُقرأ بالماسح ويُنطق بالهاتف. يبدأ من ١٠٠ في كل
    عيادة، فلا يخرج أول مراجع برقم ١ ولا يطول بلا داعٍ.
    التفرّد داخل العيادة فقط — عيادتان مختلفتان قد تحملان الرقم
    نفسه ولا ضير، فقواعدهما معزولة. */
  async nextBarcode(){
    const cid = CFG.data.cid;
    const used = (await DB.all('patients'))
      .filter(p => !p.cid || p.cid === cid)
      .map(p => Number(p.bc) || 0);
    return String(Math.max(99, ...used) + 1);
  },

  /* جهازان يعملان بلا إنترنت قد يمنحان الرقم نفسه لمراجعين.
     بعد المزامنة يُكشف التكرار ويُعاد ترقيم الأحدث تسجيلاً —
     الأقدم يحتفظ برقمه لأنه غالباً طُبع أو أُعطي لصاحبه. */
  async fixBarcodes(){
    const cid = CFG.data.cid;
    const ps = (await DB.all('patients')).filter(p => !p.cid || p.cid === cid);
    const seen = new Map();
    let next = Math.max(99, ...ps.map(p => Number(p.bc) || 0)) + 1;
    let fixed = 0;

    for (const p of ps.sort((a,b) => (a.at||0) - (b.at||0))){
      if (!p.bc) continue;
      const k = String(p.bc);
      if (!seen.has(k)){ seen.set(k, p.id); continue; }
      p.bc = String(next++);
      await DB.put('patients', p);
      fixed++;
    }
    return fixed;
  },

  async nextMrn(){
    const all = await DB.all('patients');
    const y = new Date().getFullYear();
    const n = all.filter(p=>String(p.mrn||'').startsWith(y+'-')).length + 1;
    return `${y}-${String(n).padStart(4,'0')}`;
  },

  async savePatient(data, id){
    const now = Date.now();
    let p;
    if (id){
      p = await DB.get('patients', id);
      p = { ...p, ...data, up:now };
    } else {
      /* مراجع جديد: لأي طبيب؟ — يُلغى الحفظ إن لم يُحسم */
      const own = await Own.choose();
      if (own === null) return null;
      p = { id:uid(), mrn: await this.nextMrn(), bc: await this.nextBarcode(),
            cid: CFG.data.cid, ...data, at:now, up:now };
      if (own) p._own = own;
    }
    await DB.put('patients', p);
    await Form.learn(data);
    return p;
  },

  async openVisit(pid, note){
    const vs = await DB.by('visits','pid',pid);
    const open = vs.find(v=>v.st==='open');
    if (open) return open;
    const v = { id:uid(), pid, cid:CFG.data.cid, code:newCode(), date:today(), at:Date.now(),
                st:'open', qstate:'waiting', no:vs.length+1, note:note||'' };
    await DB.put('visits', v);
    return v;
  },

  async visitTotals(vid){
    const w = (await DB.by('works','vid',vid)).sort((a,b)=>(b.at||0)-(a.at||0));
    const p = (await DB.all('payments')).filter(x=>x.vid===vid);
    return { total:w.reduce((s,x)=>s+Number(x.price||0),0),
             paid: p.reduce((s,x)=>s+Number(x.amt||0),0), works:w };
  },

  async patientTotals(pid){
    const w = (await DB.by('works','pid',pid));
    const p = (await DB.by('payments','pid',pid));
    const total = w.reduce((s,x)=>s+Number(x.price||0),0);
    const paid  = p.reduce((s,x)=>s+Number(x.amt||0),0);
    return { total, paid, due: total-paid };
  },

  async toothMap(pid){
    const rows = await DB.by('tooth','pid',pid);
    const m = {}; rows.forEach(r => m[r.fdi] = r.st);
    return m;
  },

  /* سلسلة جلسات السن: كل الأعمال والدفعات بين "بداية" و"إنهاء" تُحسب معاً.
     عند الإنهاء يرتفع رقم السلسلة فتبدأ جلسات ومدفوعات جديدة نظيفة. */
  async course(pid, fdi){
    const r = await DB.get('tooth', pid+'-'+fdi);
    return r?.course || 1;
  },

  /* لأي سلسلة تُنسب دفعة على سن؟ للحالية إن كان عليها مبلغ أو بدأت،
     وإلا لأحدث سلسلة سابقة بقي عليها مبلغ — فمن أكمل علاجه وجاء
     يسدّد الباقي تُسجَّل دفعته على علاجه المكتمل لا على خطة فارغة. */
  async payCourse(pid, fdi){
    const cur = await this.course(pid, fdi);
    const works = (await DB.by('works','pid',pid)).filter(w => Number(w.fdi) === Number(fdi));
    const pays  = (await DB.by('payments','pid',pid)).filter(x => Number(x.fdi) === Number(fdi));
    const dueOf = c => works.filter(w => (w.course||1) === c).reduce((a,w)=>a+Number(w.price||0),0)
                     - pays.filter(x => (x.course||1) === c).reduce((a,x)=>a+Number(x.amt||0),0);
    if (works.some(w => (w.course||1) === cur) || dueOf(cur) > 0) return cur;
    for (let c = cur - 1; c >= 1; c--) if (dueOf(c) > 0) return c;
    return cur;
  },

  /* حساب سلسلة السن الحالية: الأعمال والمدفوعات المرتبطة بها */
  async courseTotals(pid, fdi, course){
    const cur = course || await this.course(pid, fdi);
    const works = (await DB.by('works','pid',pid))
      .filter(w => Number(w.fdi) === Number(fdi) && (w.course || 1) === cur);
    const pays = (await DB.by('payments','pid',pid))
      .filter(x => Number(x.fdi) === Number(fdi) && (x.course || 1) === cur);
    const total = works.reduce((a,x)=>a+Number(x.price||0),0);
    const paid  = pays.reduce((a,x)=>a+Number(x.amt||0),0);
    return { course:cur, works, pays, total, paid, due: total-paid };
  },

  /* دفتر المراجع: كل سن ← سلاسله ← جلساته ← مبلغ كل جلسة ومجموع السن.
     يجيب على: كم مرة جاء؟ كم سناً عولج؟ كل سن كم جلسة وكم دفع؟ */
  async ledger(pid){
    const works = await DB.by('works','pid',pid);
    const pays  = await DB.by('payments','pid',pid);
    const teethRows = await DB.by('tooth','pid',pid);
    const visits = await DB.by('visits','pid',pid);
    const vMap = {}; visits.forEach(v=>vMap[v.id]=v);
    const curOf = {}; teethRows.forEach(t=> curOf[t.fdi] = t.course || 1);

    const teeth = {};
    const addTooth = f => (teeth[f] ||= { fdi:Number(f), courses:{} });
    const addCourse = (f,c) => {
      const t = addTooth(f);
      return (t.courses[c] ||= { n:Number(c), sessions:{}, total:0, paid:0 });
    };

    for (const w of works){
      if (!w.fdi) continue;
      const c = addCourse(w.fdi, w.course || 1);
      const vid = w.vid || 'x';
      const sess = (c.sessions[vid] ||= {
        vid, date: vMap[vid]?.date || null, no: vMap[vid]?.no || null,
        works:[], total:0, paid:0 });
      sess.works.push(w); sess.total += Number(w.price||0);
      c.total += Number(w.price||0);
    }
    for (const x of pays){
      if (!x.fdi) continue;
      const c = addCourse(x.fdi, x.course || 1);
      const vid = x.vid || 'x';
      const sess = (c.sessions[vid] ||= {
        vid, date: vMap[vid]?.date || null, no: vMap[vid]?.no || null,
        works:[], total:0, paid:0 });
      sess.paid += Number(x.amt||0);
      c.paid += Number(x.amt||0);
    }

    /* دفعات غير منسوبة لسن — تُعرض على حدة حتى لا تختفي */
    const loose = pays.filter(x=>!x.fdi);

    const out = Object.values(teeth).map(t => {
      const cs = Object.values(t.courses)
        .map(c => ({
          ...c,
          closed: c.n < (curOf[t.fdi] || 1),
          sessions: Object.values(c.sessions)
            .sort((a,b)=> String(b.date||'').localeCompare(String(a.date||''))),
        }))
        .sort((a,b)=> b.n - a.n);
      return {
        fdi: t.fdi, courses: cs,
        total: cs.reduce((a,c)=>a+c.total,0),
        paid:  cs.reduce((a,c)=>a+c.paid,0),
        visits: cs.reduce((a,c)=>a+c.sessions.length,0),
      };
    }).sort((a,b)=> b.paid - a.paid);

    return {
      teeth: out,
      loose,
      loosePaid: loose.reduce((a,x)=>a+Number(x.amt||0),0),
      allPaid: pays.reduce((a,x)=>a+Number(x.amt||0),0),
      visitCount: visits.length,
      toothCount: out.length,
    };
  },

  /*────────── خطة علاج السن ──────────
    كل سن له ملف مستقل: خطة (نوع العمل وعدد الجلسات) وجلسات
    منفّذة وحساب وأرشيف. عند الختم يبدأ ملف جديد لنفس السن. */
  async toothRec(pid, fdi){
    const id = pid + '-' + fdi;
    return (await DB.get('tooth', id)) ||
           { id, pid, fdi:Number(fdi), st:'sound', course:1, plans:{}, archive:[] };
  },

  async plan(pid, fdi){
    const r = await this.toothRec(pid, fdi);
    return (r.plans || {})[r.course || 1] || null;
  },

  async savePlan(pid, fdi, plan){
    const r = await this.toothRec(pid, fdi);
    r.plans = r.plans || {};
    const c = r.course || 1;
    r.plans[c] = { ...(r.plans[c] || {}), ...plan, at: Date.now() };
    await DB.put('tooth', r);
    return r.plans[c];
  },

  /* الجلسات المنفّذة فعلياً لهذه السلسلة (من سجلّ الأعمال) */
  async doneSessions(pid, fdi){
    const r = await this.toothRec(pid, fdi);
    const c = r.course || 1;
    const ws = (await DB.by('works','pid',pid))
      .filter(w => Number(w.fdi) === Number(fdi) && (w.course||1) === c);
    const nums = new Set();
    ws.forEach(w => (w.sessionNos || []).forEach(n => nums.add(Number(n))));
    return { nums:[...nums].sort((a,b)=>a-b), works:ws };
  },

  /* ختم ملف السن: تُؤرشف الخطة وتبدأ سلسلة جديدة */
  async endCourse(pid, fdi){
    const r = await this.toothRec(pid, fdi);
    const c = r.course || 1;
    const totals = await this.courseTotals(pid, fdi);
    r.archive = r.archive || [];
    const ds = await this.doneSessions(pid, fdi);
    r.archive.push({
      course:c, plan:(r.plans||{})[c] || null,
      total:totals.total, paid:totals.paid,
      sessions:totals.works.length,
      /* يُحفظ ما نُفّذ فعلاً وما كان مخطَّطاً، فيبقى الفرق مقروءاً
         بعد الختم حتى لو أُنهي السن قبل اكتمال جلساته. */
      doneNums: ds.nums,
      planned: ((r.plans||{})[c] || {}).sessions || 0,
      closedAt:Date.now(),
    });
    r.course = c + 1;
    r.closedAt = Date.now();
    await DB.put('tooth', r);
    return r.course;
  },

  /* كل ملفات أسنان المراجع: المفتوحة والمختومة */
  async toothFiles(pid){
    const recs = await DB.by('tooth','pid',pid);
    const works = await DB.by('works','pid',pid);
    const pays  = await DB.by('payments','pid',pid);
    const out = [];

    for (const r of recs){
      const cur = r.course || 1;
      for (let c = 1; c <= cur; c++){
        const ws = works.filter(w => Number(w.fdi)===r.fdi && (w.course||1)===c);
        const ps = pays .filter(x => Number(x.fdi)===r.fdi && (x.course||1)===c);
        const arch = (r.archive||[]).find(a => a.course === c);
        const plan = (r.plans||{})[c] || arch?.plan || null;
        if (!ws.length && !ps.length && !plan) continue;
        const nums = new Set();
        ws.forEach(w => (w.sessionNos||[]).forEach(n => nums.add(Number(n))));
        const sealed  = c < cur;
        const planned = plan?.sessions || 0;
        /* السن المختوم مكتمل دائماً — قرار الطبيب بالإنهاء يعلو
           على عدّاد الجلسات المخطَّطة. */
        const complete = sealed || (planned > 0 && nums.size >= planned);
        out.push({
          fdi:r.fdi, course:c, sealed, plan, st:r.st, planned, complete,
          doneNums:[...nums].sort((a,b)=>a-b),
          works:ws.sort((a,b)=>(b.at||0)-(a.at||0)),
          pays:ps,
          total: ws.reduce((a,x)=>a+Number(x.price||0),0),
          paid:  ps.reduce((a,x)=>a+Number(x.amt||0),0),
          last:  Math.max(0, ...ws.map(w=>w.at||0), ...ps.map(x=>x.at||0)),
        });
      }
    }
    return out.sort((a,b)=> (a.sealed - b.sealed) || (b.last - a.last));
  },

  /* تحديث حالة السن فقط — بدمج على السجل القائم.
     الاستبدال الكامل كان يمحو الخطة والأرشيف ورقم السلسلة
     في كل مرة يُحفظ فيها عمل، فتضيع خطة السن بلا سبب ظاهر. */
  async setTooth(pid, fdi, st, vid){
    const r = await this.toothRec(pid, fdi);
    r.st = st; r.vid = vid || null; r.at = Date.now();
    await DB.put('tooth', r);
  },

  /* حذف مراجع نهائياً: يمسح كل ما يتعلّق به في كل المخازن،
     فلا تبقى جلسة يتيمة ولا دفعة بلا صاحب. */
  async deletePatient(pid){
    /* صور الأشعة تعيش في التخزين لا في القاعدة. حذف سجلّها وحده
       يترك الصورة قائمة: يُدفع ثمنها، والأخطر أنها تبقى قابلة
       للاسترجاع بعد أن يظنّ الطبيب أنه محا الملف. */
    for (const f of await DB.by('files','pid',pid)) await Img.del(f);

    for (const st of ['visits','works','payments','files','rx','tooth','appts']){
      for (const row of await DB.by(st, 'pid', pid)) await DB.del(st, row.id);
    }
    for (const b of (await DB.all('bookings')).filter(x=>x.pid===pid))
      await DB.del('bookings', b.id);
    await DB.del('patients', pid);
  },

  /* إزالة جلسة واحدة: تختفي من قائمة اليوم ويبقى ملف المراجع */
  async deleteVisit(vid){
    for (const w of await DB.by('works','vid',vid))   await DB.del('works', w.id);
    for (const r of await DB.by('rx','vid',vid))      await DB.del('rx', r.id);
    for (const f of await DB.by('files','vid',vid)){
      await Img.del(f);                              /* الصورة نفسها لا سجلّها فقط */
      await DB.del('files', f.id);
    }
    for (const x of (await DB.all('payments')).filter(p=>p.vid===vid))
      await DB.del('payments', x.id);
    await DB.del('visits', vid);
  },

  async findByCode(code){
    const vs = await DB.all('visits');
    return vs.find(v => v.code === String(code||'').trim().toUpperCase()) || null;
  },

  /* الماسح يقرأ رمز الجلسة أو باركود المراجع — كلاهما مقبول */
  async findPtByCode(code){
    const c = String(code||'').trim().replace(/^P/i,'');
    if (!/^\d+$/.test(c)) return null;
    const cid = CFG.data.cid;
    return (await DB.all('patients'))
      .find(p => String(p.bc) === c && (!p.cid || p.cid === cid)) || null;
  },

  /*──── آخر طلب للمراجع ────
    ما يحتاجه من يقرأ الباركود: آخر جلسة وما سُجّل فيها، وآخر علاج
    كتبه الطبيب، وحال حجزه اليوم، وموعده القادم. تُجمع مرة واحدة
    فتُعرض حيثما وقف القارئ — استقبالاً كان أم طبيباً أم صيدلياً. */
  async lastOrder(pid){
    const vs = (await DB.by('visits','pid',pid)).sort((a,b)=>(b.at||0)-(a.at||0));
    const visit = vs[0] || null;
    const works = visit ? (await DB.by('works','vid',visit.id)).sort((a,b)=>(b.at||0)-(a.at||0)) : [];
    const rxs = (await DB.by('rx','pid',pid)).sort((a,b)=>(b.at||0)-(a.at||0));
    const bks = (await DB.all('bookings')).filter(b => b.pid === pid)
                  .sort((a,b)=>(b.at||0)-(a.at||0));
    let appt = null;
    try {
      appt = (await DB.by('appts','pid',pid))
        .filter(a => a.st !== 'cancelled' && a.day && a.day >= today())
        .sort((a,b)=>String(a.day+(a.time||'')).localeCompare(String(b.day+(b.time||''))))[0] || null;
    } catch(_){}
    return { visit, works, rx:rxs[0] || null, all:rxs, booking:bks[0] || null, appt,
             todayVisit: vs.find(v => v.date === today()) || null };
  },

  /* ترقيم الملفات المسجّلة قبل إضافة الباركود */
  async backfillBarcodes(){
    const cid = CFG.data.cid;
    const ps = (await DB.all('patients'))
      .filter(p => (!p.cid || p.cid === cid) && !p.bc)
      .sort((a,b) => (a.at||0) - (b.at||0));
    if (!ps.length) return 0;
    let next = Number(await this.nextBarcode());
    for (const p of ps){ p.bc = String(next++); await DB.put('patients', p); }
    return ps.length;
  },
};

/* «الجلسة ٢» · «الجلستان ٢ و ٣» · «الجلسات ٢ و ٣ و ٤» */
function sessText(nos){
  const ns = [...new Set((nos || []).map(Number))].sort((a,b)=>a-b);
  if (!ns.length) return T('sessionOf');
  if (ns.length === 1) return `${T('sessionN')} ${ns[0]}`;
  return `${ns.length === 2 ? T('sessTwo') : T('sessMany')} ${ns.join(` ${T('and')} `)}`;
}

/*═══════════════ قائمة جلسات المراجع ═══════════════
  تظهر أسفل كل صفحة جلسة، فيتنقّل المستخدم بين الجلسات مباشرة.
═══════════════════════════════════════════════════*/
async function sessionsList(pid, activeVid, opts){
  opts = opts || {};
  const vs = await DB.by('visits','pid',pid);
  if (!vs.length) return '';
  const vMap = {}; vs.forEach(v => vMap[v.id] = v);
  const files = await Ops.toothFiles(pid);

  /* كل سن زرّ واحد: يُجمع كل ما عُمل له (بكل خططه) */
  const byFdi = {};
  for (const f of files) (byFdi[f.fdi] ||= []).push(f);

  const visitRow = (vid, works) => {
    const v = vMap[vid], on = vid === activeVid;
    const nos = []; works.forEach(w => (w.sessionNos||[]).forEach(n => nos.push(n)));
    const amt = works.reduce((a,w)=>a+Number(w.price||0),0);
    return `<div class="tsv ${on?'on':''}" ${v && !on ? `onclick="Nav.session('${vid}')"` : ''}>
      <div class="gr">
        <div class="tsv-s">${sessText(nos)}</div>
        <div class="tiny">${T('tVisitN')} ${v ? v.no + ' · ' + fmtD(v.date) : '—'}
          ${on ? ` · <b style="color:var(--br)">${T('currentSession')}</b>` : ''}</div>
      </div>
      <span class="mono" style="font-weight:800">${N(amt)}</span>
      ${v && !on ? '<span class="tsv-go">‹</span>' : ''}
    </div>`;
  };

  const teeth = Object.entries(byFdi).map(([fdi, courses]) => {
    courses.sort((a,b) => a.course - b.course);
    const last = courses[courses.length - 1];
    const col  = last.plan ? P(last.plan.proc).col : (last.works[0] ? P(last.works[0].proc).col : 'var(--br)');
    const name = last.plan ? pName(last.plan.proc) : (last.works[0] ? pName(last.works[0].proc) : '—');
    const visitsAll = new Set(); courses.forEach(c => c.works.forEach(w => w.vid && visitsAll.add(w.vid)));
    const here = [...visitsAll].includes(activeVid);
    const body = courses.slice().reverse().map(c => {
      const groups = {};
      c.works.forEach(w => (groups[w.vid || 'x'] ||= []).push(w));
      const rows = Object.entries(groups)
        .sort((a,b) => (vMap[a[0]]?.at || 0) - (vMap[b[0]]?.at || 0))
        .map(([vid, ws]) => visitRow(vid, ws)).join('');
      const dueC = c.total - c.paid;
      return `${courses.length > 1 ? `<div class="tsc-h"><span>${T('tPlanN')} ${c.course}${c.plan ? ' · ' + esc(pName(c.plan.proc)) : ''}</span>
          <span class="pill ${c.complete?'g':'r'}">${c.complete ? '✓ ' + T('completed') : T('inProgress')}</span></div>` : ''}
        ${rows || `<div class="tiny" style="padding:8px 4px">—</div>`}
        ${opts.file ? `<div class="vc-sum">
            <span class="mchip">${T('total')} <b>${N(c.total)}</b></span>
            <span class="mchip g">${T('paid')} <b>${N(c.paid)}</b></span>
            ${dueC > 0 ? `<span class="mchip r">${T('due')} <b>${N(dueC)}</b></span>` : ''}
          </div>
          <button class="btn sm gh w mt" onclick="Doc.openToothFile('${pid}',${Number(fdi)},${c.course})">🦷 ${T('tOpenTooth')}</button>` : ''}`;
    }).join('');
    return { done:last.complete, lastAt:last.last, here, html:`
      <div class="tsb ${last.complete ? 'done' : 'open'} ${here ? 'here' : ''}">
        <button class="tsb-h" onclick="this.parentElement.classList.toggle('x')">
          <span class="tsb-n" style="background:${col}">${Chart.lbl(Number(fdi))}</span>
          <span class="gr" style="min-width:0">
            <span class="tsb-t">${esc(name)}</span>
            <span class="tiny">${last.planned ? `${last.doneNums.length} ${T('ofN')} ${last.planned} ${T('toothVisits')}` : `${last.works.length} ${T('tSessDone')}`}
              · ${visitsAll.size} ${T('tVisitsN')}</span>
          </span>
          <span class="pill ${last.complete ? 'g' : 'r'}">${last.complete ? '✓ ' + T('completed') : T('inProgress')}</span>
          <span class="tsb-ar">⌄</span>
        </button>
        <div class="tsb-b">${body}</div>
      </div>` };
  }).sort((a,b) => (b.here - a.here) || (a.done - b.done) || (b.lastAt - a.lastAt));

  /* زيارات بلا عمل على سن — حتى لا يضيع الوصول إليها */
  const withTooth = new Set(); files.forEach(f => f.works.forEach(w => w.vid && withTooth.add(w.vid)));
  const others = vs.filter(v => !withTooth.has(v.id)).sort((a,b)=>(b.at||0)-(a.at||0));

  if (opts.file && !teeth.length && !others.length) return '';
  return `<div class="card ${opts.file ? 'mt' : 'mt2'}">
    <div class="row" style="justify-content:space-between">
      <div class="lbl">${T('tToothSess')}</div><span class="pill n">${teeth.length}</span>
    </div>
    <div class="col mt" style="gap:8px">${teeth.map(t => t.html).join('') || `<div class="emp">${T('tNoTeethYet')}</div>`}</div>
    ${others.length ? `<div class="tsb other mt">
      <button class="tsb-h" onclick="this.parentElement.classList.toggle('x')">
        <span class="tsb-n" style="background:var(--ink3)">•</span>

/*═══════════════ السكرتير ═══════════════*/
const Sec = {

  /*──── اليوم: طابور المراجعين + بحث + استدعاء ────*/
  qq:'',

  /* الهيكل يُبنى مرة واحدة، والبحث يحدّث القائمة فقط —
     إعادة بناء الحقل مع كل حرف كانت تُفقد التركيز وتُلغي الكتابة. */
  async today(){
    const v = $('#view');
    if (!$('#q-today')){
      v.innerHTML = `
        <div class="sbar">
          <input id="q-today" placeholder="${T('searchQ')}" value="${esc(this.qq)}">
          <span class="pill b" id="q-count">0</span>
        </div>
        ${S.role==='doctor'?`<div class="tiny ctr" style="margin-top:7px;color:var(--ink3)">
          ${T('holdHint')}</div>`:''}
        <div id="q-list" class="col mt2"></div>`;
      const inp = $('#q-today');
      let tm;
      inp.addEventListener('input', () => {
        this.qq = inp.value;
        clearTimeout(tm);
        tm = setTimeout(() => this.queue(), 180);
      });
    }
    return this.queue();
  },

  async queue(){
    const box = $('#q-list'); if (!box) return;

    /* الترقيم بترتيب الوصول، والعرض من الأحدث للأقدم */
    const vs = (await DB.all('visits')).filter(x=>x.date===today())
                .sort((a,b)=>(a.at||0)-(b.at||0));
    vs.forEach((x,i)=> x._no = i+1);
    vs.reverse();

    const q = this.qq.trim().toLowerCase();
    const qd = q.replace(/\D/g,'');
    const rows = [];
    for (const vi of vs){
      const p = await DB.get('patients', vi.pid); if (!p) continue;
      if (q && !( nm(p).toLowerCase().includes(q)
               || String(p.mrn||'').toLowerCase().includes(q)
               || String(p.bc||'') === q                    /* باركود المراجع */
               || (qd && (p.phone||'').replace(/\D/g,'').includes(qd)) )) continue;
      rows.push({ vi, p, tt: await Ops.visitTotals(vi.id) });
    }

    const cls    = { waiting:'n', called:'w', chair:'b', done:'g', cancelled:'r' };
    /* الملغاة بلا خطوة تالية: لا يُستدعى من ألغى موعده */
    const nextOf = { waiting:'called', called:'chair', chair:'done' };
    const lblOf  = { waiting:T('call'), called:T('seat'), chair:T('finish') };

    const cnt = $('#q-count'); if (cnt) cnt.textContent = rows.length;

    box.innerHTML = rows.length ? rows.map(({vi,p,tt})=>{
      const live = vi.qstate==='called' || vi.qstate==='chair';
      const cx   = vi.qstate === 'cancelled';
      return `
      <div class="it ${live?'live':''}" style="${cx?'opacity:.62':''}"
        onclick="Nav.session('${vi.id}')"
        ${S.role==='doctor'?`data-hold="delTodayRow" data-hold-arg="${vi.id}|${p.id}"`:''}>
        <div class="av ${vi.qstate==='done'?'g':vi.qstate==='chair'?'':'w'}">${vi._no}</div>
        <div class="gr">
          <div class="row" style="gap:6px">
            ${live?'<span class="dotlive"></span>':''}
            <div class="h3 ell">${esc(nm(p))}</div>
            ${vi.needAppt?`<span class="pill w">${T('needAppt')}</span>`:''}
          </div>
          <div class="mono tiny">${T('file')} ${esc(p.mrn)} · ${T('total')} ${N(tt.total)}
            · <span style="color:var(--ok);font-weight:700">${T('paid')} ${N(tt.paid)}</span></div>
        </div>
        <div class="col" style="gap:5px;align-items:flex-end">
          <span class="pill ${cls[vi.qstate]||'n'}">${
            vi.qstate==='cancelled' ? T('ptCancelled')
            : T(vi.qstate==='chair'?'inChair':vi.qstate||'waiting')}</span>
          ${!cx && nextOf[vi.qstate||'waiting'] && S.role!=='pharmacy'
            ? `<button class="btn xs ${vi.qstate==='chair'?'ok':''}"
                 onclick="event.stopPropagation();Sec.setQ('${vi.id}','${nextOf[vi.qstate||'waiting']}')">
                 ${lblOf[vi.qstate||'waiting']}</button>` : ''}
        </div>
      </div>`;}).join('') : `<div class="emp">${T('noQueue')}</div>`;
  },

  /*──── هل يجوز إنهاء هذه الزيارة؟ ────
    سنّ خطته مرقّمة ولم تُسجَّل له جلسة اليوم يعني أن العمل جرى
    بلا نسبته إلى جلسة. فيضيع أثره: لا الخطة تتقدّم، ولا يُعرف
    عند الزيارة القادمة ما بقي. فيُمنع الإنهاء ويُفتح ملف السن. */
  async needSession(pid, vid){
    const ws = await DB.by('works','vid',vid);
    if (ws.some(w => (w.sessionNos||[]).length)) return null;   /* سُجّلت */

    const all = await DB.by('works','pid',pid);
    for (const t of (await DB.by('tooth','pid',pid))){
      const cur  = t.course || 1;
      const plan = (t.plans || {})[cur];
      if (!plan || !plan.sessions) continue;
      const done = new Set();
      all.filter(w => Number(w.fdi) === Number(t.fdi) && (w.course||1) === cur)
         .forEach(w => (w.sessionNos||[]).forEach(x => done.add(Number(x))));
      if (done.size < plan.sessions) return Number(t.fdi);      /* ما زالت ناقصة */
    }
    return null;
  },

  /* انتقال حالة الدور: بالانتظار ← استدعاء ← على الكرسي ← إنهاء */
  async setQ(vid, st){
    const v = await DB.get('visits', vid);

    if (st === 'done'){
      const fdi = await this.needSession(v.pid, vid);
      if (fdi){
        S.patient = await DB.get('patients', v.pid);
        S.visit = v;
        toast(T('needPick'), 'e');
        Nav.reset();
        await Doc.tooth(fdi);
        /* تنبيه ثابت داخل الصفحة لا رسالة عابرة تختفي */
        const sh = $('#sheet .sh');
        if (sh) sh.insertAdjacentHTML('afterbegin',
          `<div class="al r" style="margin:0 0 12px"><span>!</span>
             <span><b>${T('needPick')}</b><br>
             <span class="tiny">${T('needPickH')}</span></span></div>`);
        return;
      }
    }

    v.qstate = st;
    v._qAt = Sync.now();          /* ختم الحقل نفسه، لا السجل كله */
    if (st === 'done'){ v.st = 'done'; }
    await DB.put('visits', v);
    if (st === 'done') return Appt.ask(v.pid, vid);
    toast(T(st==='chair'?'inChair':st==='done'?'done':'called'), 's');
    this.today();
  },

  async decide(id, ok){
    const b = await DB.get('bookings', id); if (!b) return;
    if (!ok){ b.st='declined'; await DB.put('bookings',b); toast(T('declined'));
      if (b.srv) Sync.bookStatus(b.id, 'declined');
      return Nav.home(); }

    /* القبول ينشئ ملف المراجع كاملاً ببياناته التي أدخلها بنفسه */
    const all = await DB.all('patients');
    let p = all.find(x => x.phone.replace(/\D/g,'') === (b.phone||'').replace(/\D/g,''));
    const data = { name:nm(b), n1:b.n1,n2:b.n2,n3:b.n3,n4:b.n4, age:b.age, gender:b.gender,
                   phone:b.phone, address:b.address, job:b.job,
                   complaint:b.complaint, prevDental:b.prevDental, other:b.other,
                   mh: MH.norm(b.mh) };
    /* ملف العيادة يُربط بحساب المراجع في تطبيقه: مواعيده وجلساته تصله */
    if (b.pu) data.pu = b.pu;
    const hadPu = p?.pu;
    p = await Ops.savePatient(data, p?.id);
    if (!p) return;
    /* ربط جديد لمراجع له تاريخ عندنا: تُرسل سجلاته السابقة إلى تطبيقه */
    if (b.pu && hadPu !== b.pu){
      for (const st of Sync.CARE) for (const r of await DB.by(st, 'pid', p.id)) Sync.queue(st, r.id, false);
    }
    b.st='accepted'; b.pid=p.id; b.bc=p.bc; await DB.put('bookings', b);
    /* الباركود يصل تطبيق المراجع فيُريه للاستقبال من هاتفه */
    /* معرّف ملفه عندنا يُرسل مع القبول — بلاه لا يستطيع تطبيقه
       أن يجد مواعيده ولا جلساته. */
    if (b.srv) Sync.bookStatus(b.id, 'accepted', p.bc, p.id);
    await Ops.openVisit(p.id, b.complaint);
    toast(T('accepted'),'s');
    Nav.home();
  },

  /*──── ملف المراجع — تخطيط مضغوط بلا فراغات ────*/
  /*════════ ملف المراجع ════════
    صفحة واحدة تجيب عن أسئلة العمل اليومية بلا بحث:
    · من هذا المراجع، وهل عنده ما يجب الحذر منه؟
    · كم عليه، وكم دفع، وكم بقي؟
    · ماذا جرى في كل زيارة — بالتاريخ — وأين وصل علاج كل سن؟
    ثلاثة أزرار للعمل الحاضر، وما سواها في قائمة «المزيد». */
  /* العرض الافتراضي: الزيارات حسب السن. يُحفظ اختيار التبويب أثناء
     العمل على المراجع نفسه، ويعود «حسب السن» عند فتح مراجع آخر. */
  fView:'tooth', _fPid:null,

  async file(pid){
    if (this._fPid !== pid){ this._fPid = pid; this.fView = 'tooth'; }
    const sh = UI.sheet(UI.spin());
    const p = await DB.get('patients', pid); if (!p) return;
    S.patient = p;

    const [visits, works, pays, rxs, teethRecs, files, next] = await Promise.all([
      DB.by('visits','pid',pid), DB.by('works','pid',pid), DB.by('payments','pid',pid),
      DB.by('rx','pid',pid), DB.by('tooth','pid',pid), Ops.toothFiles(pid), Appt.forPatient(pid),
    ]);
    visits.sort((x,y) => (y.at||0) - (x.at||0));
    const missed = (await DB.by('appts','pid',pid)).filter(a => a.st === 'missed')
      .sort((x,y) => String(y.day).localeCompare(String(x.day)));

    const total = works.reduce((t,w) => t + Number(w.price||0), 0);
    const paid  = pays.reduce((t,x) => t + Number(x.amt||0), 0);
    const due   = total - paid;
    const pct   = total ? Math.min(100, Math.round(paid/total*100)) : (paid ? 100 : 0);
    const open  = visits.find(v => v.st === 'open');
    const alerts = MH.alerts(p.mh);

    /* عدد جلسات الخطة لكل سن وسلسلة — ليُكتب «جلسة ٢ من ٣» */
    const planned = {};
    for (const t of teethRecs) for (const [c, pl] of Object.entries(t.plans || {}))
      planned[t.fdi + '-' + c] = (pl && pl.sessions) || 0;
    const sesLbl = w => {
      const ns = (w.sessionNos || []).map(Number).sort((x,y) => x-y);
      if (!ns.length) return '';
      const of = planned[Number(w.fdi) + '-' + (w.course||1)];
      return sessText(ns) + (of ? ` ${T('ofN')} ${of}` : '');
    };

    const dt = d => { const x = new Date((d||'') + 'T00:00:00');

            <span class="mchip">${T('total')} <b>${N(vt)}</b></span>

          </div>
          <div class="pf-more">
            <button class="pf-x" onclick="Sec.pfMenu(event)" title="${T('ptOptions')}">⋯</button>

          <button class="pf-x" onclick="Nav.back()">✕</button>

          <div class="pf-m"><div class="k">${T('grandTotal')}</div><div class="v">${N(total)}</div></div>
          <div class="pf-m ok"><div class="k">${T('paid')}</div><div class="v">${N(paid)}</div></div>
          <div class="pf-m ${due>0?'due':'ok'}"><div class="k">${T('due')}</div><div class="v">${N(Math.max(0,due))}</div></div>
        </div>
        <div class="pf-bar"><i style="width:${pct}%"></i></div>

        ${alerts.length ? `<div class="pf-alerts">${alerts.map(x => `<span class="pf-al ${x.risk===2?'r':'w'}"
          >${x.risk===2?'⚠':'!'} ${esc(x.txt.split('—')[0].trim())}${x.d?` · ${esc(x.d)}`:''}</span>`).join('')}</div>` : ''}
      </div>

      <div class="pf-acts">
        ${open
          ? `<button class="pf-act live" onclick="Nav.session('${open.id}')"><span class="i">▶</span>
               ${T('currentSession')}<span class="s">${fmtD(open.date)}</span></button>`
          : `<button class="pf-act" onclick="Sec.start('${pid}')"><span class="i">＋</span>
               ${T('newVisit')}<span class="s">${T('visitsCount')}: ${visits.length}</span></button>`}

          ${T('pay')}<span class="s">${due>0 ? `${T('due')} ${N(due)}` : '✓'}</span></button>
        <button class="pf-act ap" onclick="Sec.apptNew('${pid}')"><span class="i">📅</span>

    $('#pf-date')?.classList.toggle('hide', v !== 'date');

  /* القائمة الثانوية — كل ما لا يُحتاج في كل زيارة */
  pfMenu(e){
    e.stopPropagation();
    const btn = e.currentTarget, old = document.querySelector('.pf-menu');
    if (old){ old.remove(); if (old._btn === btn) return; }
    const pid = S.patient?.id; if (!pid) return;
    const m = el(`<div class="pf-menu">
      <button onclick="Sec.newPt(S.patient)">✎ ${T('editPt')}</button>
      <button onclick="Sec.showMH('${pid}')">♡ ${T('healthInfo')}</button>
      ${Perm.chart() ? `<button onclick="Doc.open('${pid}')">🦷 ${T('toothChart')}</button>` : ''}
      <button onclick="Money.ptVisits('${pid}')">₪ ${T('perTooth')}</button>
      ${S.patient.bc ? `<button onclick="Sec.ptCode('${pid}')">▮▮ ${T('ptCode')}</button>` : ''}
      ${S.role==='doctor' ? `<hr><button class="dg" onclick="Del.patient('${pid}')">🗑 ${T('delPt')}</button>` : ''}
    </div>`);
    m._btn = btn;
    const r = btn.getBoundingClientRect();
    m.style.top = (r.bottom + 6) + 'px';
    m.style.left = Math.min(innerWidth - 236, Math.max(8, r.left)) + 'px';
    document.body.appendChild(m);
    m.addEventListener('click', () => m.remove());
    setTimeout(() => document.addEventListener('click', function off(ev){
      if (!m.contains(ev.target)){ m.remove(); document.removeEventListener('click', off); }
    }), 0);
  },

          <button class="btn gh" onclick="Sec.newPt(S.patient)">✎ ${T('editPt')}</button>
          <button class="btn ${v.needAppt?'wn':'gh'}" onclick="Appt.pick('${v.pid}','${vid}')">

  async saveWork(vid){
    const v = await DB.get('visits', vid);
    const proc = PickProc.read('w-p');
    if (!proc){ $('#w-p-q')?.classList.add('err'); return toast(T('typeProc'),'e'); }
    if (proc.startsWith('x:')) await SG.learn('proctext', proc.slice(2));
    const fdi  = Number($('#w-f').value)||null;
    const w = { id:uid(), vid, pid:v.pid, proc, fdi,
                course: fdi ? await Ops.course(v.pid, fdi) : null,
                by: S.role,   /* الطبيب يعرف من سجّل العمل */
                price:Number($('#w-a').value)||0, note:$('#w-n').value.trim(), at:Date.now() };
    await DB.put('works', w);
    await SG.learn('worknote', w.note);
    const st = P(proc).st;
    if (fdi && st) await Ops.setTooth(v.pid, fdi, st, vid);
    UI.close(); toast(T('saved'),'s');
    this.visit(vid);
  },

    if (!ask()) return;
    await DB.del('works', id); toast(T('deleted'));
    this.visit(vid);
  },

    const v = await DB.get('visits', vid);

    Nav.reset();
    Appt.ask(v.pid, vid);

          <button data-v="card" onclick="Sec.pm(this)">${T('card')}</button>
          <button data-v="transfer" onclick="Sec.pm(this)">${T('transfer')}</button>
        </div></div>
        <div class="mt"><label class="lb">${T('notes')}</label><input id="p-n"></div>
      </div>
      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
        <button class="btn ok gr" style="flex:2" onclick="Sec.savePay('${pid}','${vid||''}')">${T('save')}</button>
      </div>`);
    setTimeout(()=>$('#p-a')?.focus(),140);
  },
  pm(b){ [...b.parentElement.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); },
  pickFdi(b){
    [...b.parentElement.children].forEach(x=>{ x.classList.remove('on'); x.classList.add('gh'); });

  },

    const method = $('#p-m .on')?.dataset.v || 'cash';
    const fdiSel = $('#p-fdi .on')?.dataset.v || '';
    const fdi = fdiSel ? Number(fdiSel) : null;
    await DB.put('payments', {
      id:uid(), pid, vid:vid||null, amt:a, method, fdi,
      course: fdi ? await Ops.payCourse(pid, fdi) : null,
      note:$('#p-n').value.trim(), at:Date.now() });
    UI.close(); toast(T('saved'),'s');
    vid ? this.visit(vid) : this.file(pid);
  },
};

  /*──── ملف السن: الخطة والجلسات والحساب ────*/
  async tooth(fdi, opts){
    if (!S.patient) return;
    S.sel = fdi;
    const pid = S.patient.id;

    /* سنّ اكتملت جلسات خطته في زيارة سابقة، ثم اختير في زيارة جديدة
       مفتوحة: يُختم عمله السابق (يبقى في الأرشيف بحسابه) ويُفتح له
       نموذج خطة جديدة مباشرة. */
    let sealedNow = false;
    if (!opts?.view && Perm.addWork() && S.visit && S.visit.st === 'open' && S.visit.pid === pid){
      const pl0 = await Ops.plan(pid, fdi);
      if (pl0 && pl0.sessions){
        const d0 = await Ops.doneSessions(pid, fdi);
        if (d0.nums.length >= pl0.sessions && !d0.works.some(w => w.vid === S.visit.id)){
          await Ops.endCourse(pid, fdi);
          sealedNow = true;
        }
      }
    }

    const rec  = await Ops.toothRec(pid, fdi);
    const plan = await Ops.plan(pid, fdi);
    const done = await Ops.doneSessions(pid, fdi);
    const cs   = await Ops.courseTotals(pid, fdi);
    const map  = await Ops.toothMap(pid);
    const st   = map[fdi] || 'sound';
    const col  = TS(st).col;
    const wl   = done.works.find(w => /W\.?L\s?\d+/i.test(w.note||''));
    const arch = (rec.archive||[]).slice().reverse();

    const head = `
      <div class="shhead">
        <div class="av mono" style="width:52px;height:52px;border-radius:16px;font-size:16px;
          background:${col?col+'26':'var(--glass2)'};color:${col||'var(--ink2)'};
          border:2px solid ${col||'var(--edge)'}">${Chart.lbl(fdi)}</div>
        <div class="gr">
          <div class="h2">${T('tooth')} ${Chart.lbl(fdi)}</div>
          <div class="mono tiny">FDI ${fdi} · ${T('courseNo')} ${rec.course||1} ·
            ${esc(isAr()?TS(st).ar:TS(st).en)}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>`;

    /* نموذج الخطة يظهر فقط لسن لا تاريخ له إطلاقاً.
       أي سن عُملت له جلسة — مفتوحة كانت أم مختومة — يفتح ملفه
       مباشرة بسجلّه وأرشيفه، ووضع الخطة يبقى زراً داخله. */
    const hasHistory = done.works.length > 0 || (rec.archive||[]).length > 0 || cs.pays.length > 0;
    if (!plan && (!hasHistory || sealedNow) && Perm.addWork()){
      UI.sheet(head + (sealedNow ? `<div class="al g"><span>✓</span><span>${T('tPrevDone')}</span></div>` : '')
        + this.planForm(fdi, null));
      this.wirePlan();
      return;
    }

    const total = plan?.sessions || 0;
    const left  = Math.max(0, total - done.nums.length);
    const pct   = total ? Math.round(done.nums.length / total * 100) : 0;
    const visNo = {}; (await DB.by('visits','pid',pid)).forEach(v => visNo[v.id] = v.no);
    /* حساب الخطط المؤرشفة حيّ لا لقطة الختم: دفعة تُستلم بعد الختم
       لسنّ أكمل علاجه تُحسب على خطته القديمة وتظهر هنا */
    const aW = (await DB.by('works','pid',pid)).filter(w => Number(w.fdi) === Number(fdi));
    const aP = (await DB.by('payments','pid',pid)).filter(x => Number(x.fdi) === Number(fdi));
    const liveA = c => ({
      total: aW.filter(w => (w.course||1) === c).reduce((a,w)=>a+Number(w.price||0),0),
      paid:  aP.filter(x => (x.course||1) === c).reduce((a,x)=>a+Number(x.amt||0),0) });
    arch.forEach((a, i) => { arch[i] = { ...a, ...liveA(a.course) }; });

    UI.sheet(head + `
      ${plan ? `
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="lbl">${T('plan')}</div>
          ${Perm.addWork()?`<button class="btn xs gh" onclick="Doc.editPlan(${fdi})">
            ✎ ${T('editPlan')}</button>`:''}
        </div>
        <div class="row mt" style="gap:10px">
          <div class="av" style="background:${P(plan.proc).col}22;color:${P(plan.proc).col}">
            ${done.nums.length}</div>
          <div class="gr">

  sessLabel(w){ return sessText(w.sessionNos); },

  /*──── تفاصيل جلسة سن واحدة ────
    الترتيب مقصود: ملخّص السن ومخطّطه أولاً، ثم العلاج المعطى،
    ثم أرشيف الجلسة، ثم تفاصيلها، ثم مبلغها، وأخيراً ما كتبه الطبيب.
    تعمل للسلاسل المفتوحة والمختومة معاً لأنها تقرأ سلسلة العمل نفسه. */
  async sessionCard(pid, fdi, wid){
    const works = await DB.by('works','pid',pid);
    const w = works.find(x => x.id === wid);
    if (!w) return toast(T('noResult'),'e');

    const p   = await DB.get('patients', pid);
    const rec = await Ops.toothRec(pid, fdi);
    const c   = w.course || 1;
    const cur = rec.course || 1;
    const arc = (rec.archive || []).find(a => a.course === c) || null;
    /* الخطة تُقرأ من سلسلة هذا العمل، لا من السلسلة الحالية */
    const plan   = (rec.plans || {})[c] || arc?.plan || null;
    const sealed = c < cur;

    const cWorks = works.filter(x => Number(x.fdi) === Number(fdi) && (x.course||1) === c)
                        .sort((a,b)=>(a.at||0)-(b.at||0));
    const nums = new Set();
    cWorks.forEach(x => (x.sessionNos||[]).forEach(n => nums.add(Number(n))));
    const total = plan?.sessions || 0;
    const done  = nums.size;
    const full  = sealed || (total && done >= total);
    const early = sealed && total && done < total;
    const pct   = total ? Math.min(100, Math.round(done/total*100)) : 0;

    const map   = await Ops.toothMap(pid);
    const pays  = (await DB.by('payments','pid',pid))
      .filter(x => x.vid === w.vid && Number(x.fdi) === Number(fdi) && (x.course||1) === c)
      .sort((a,b)=>(b.at||0)-(a.at||0));
    const paid  = pays.reduce((a,x)=>a+Number(x.amt||0),0);
    const files = (await DB.by('files','pid',pid)).filter(f => f.vid === w.vid);
    const visit = w.vid ? await DB.get('visits', w.vid) : null;
    const col   = P(w.proc).col;

    const sec = (icon, title, body, extra) => `
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="row" style="gap:8px">
            <span class="accic" style="width:28px;height:28px;font-size:14px">${icon}</span>
            <span class="lbl">${title}</span>
          </div>
          ${extra || ''}
        </div>
        ${body}
      </div>`;

    UI.sheet(`
      <div class="shhead">
        <div class="av mono" style="width:50px;height:50px;font-size:15px;
          background:${col}22;color:${col};border:2px solid ${col}">${Chart.lbl(fdi)}</div>
        <div class="gr">
          <div class="h2">${this.sessLabel(w)}</div>
          <div class="tiny">${esc(nm(p))} · ${T('tooth')} ${Chart.lbl(fdi)} · ${fmtD(w.at)}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>

      ${sec('🦷', T('planSummary'), `
        <div class="row mt" style="gap:9px">
          <span class="pill ${full?'g':'w'}">${full?`✓ ${T('completed')}`:T('inProgress')}</span>
          <span class="pill n">${T('courseNo')} ${c}</span>
          ${plan?`<span class="pill n" style="color:${P(plan.proc).col}">
            ${esc(pName(plan.proc))}</span>`:''}
        </div>
        ${early?`<div class="tiny mt" style="color:var(--wr)">${T('sealedEarly')}</div>`:''}
        ${total?`
          <div class="row mt" style="justify-content:space-between">
            <span class="tiny">${done} ${T('ofN')} ${total} ${T('toothVisits')}</span>
            <span class="tiny mono">${full?100:pct}%</span>
          </div>
          <div class="track mt"><i style="width:${full?100:pct}%;
            background:${full?'var(--ok)':col}"></i></div>
          <div class="row wrapv mt" style="gap:6px">
            ${Array.from({length:total},(_,i)=>i+1).map(n=>{
              const on  = nums.has(n);
              const now = (w.sessionNos||[]).map(Number).includes(n);
              return `<span class="pill ${now?'b':on?'g':'n'}">
                ${on?'✓ ':''}${T('sessionN')} ${n}${now?' •':''}</span>`;}).join('')}
          </div>
          ${!full && total>done?`<div class="tiny mt" style="color:var(--ink3)">
            ${total-done} ${T('notDone')}</div>`:''}`:''}
        <div class="mt2">${Chart.svg(map, Number(fdi))}</div>
        ${Chart.legend()}`)}

      ${sec('🪥', T('sessionRx'), `
        <div class="mt">
          <div class="h3" style="color:${col}">${esc(pName(w.proc))}</div>
          <div class="tiny mt">${fmtD(w.at)} ${fmtT(w.at)}</div>
          ${w.note?`<div class="card flat mt" style="padding:11px">
            <div class="tiny" style="color:var(--ink3)">${T('workNote')}</div>
            <div style="font-weight:600;margin-top:3px">${esc(w.note)}</div>
          </div>`:''}
          ${w.by==='secretary'?`<span class="pill n" style="margin-top:7px">
            ${T('enteredBy')}: ${T('bySecretary')}</span>`:''}
        </div>`)}

      ${sec('🗂', T('sessionArc'),
        files.length?`<div class="g4 mt">${files.map(f=>`
          <div style="cursor:pointer" onclick="Doc.viewFile('${f.id}')">
            <img data-fid="${f.id}" style="width:100%;aspect-ratio:1;object-fit:cover;
              border-radius:12px;border:1px solid var(--edge);background:var(--glass2)">
            <div class="tiny ctr" style="margin-top:4px">${T(f.kind)}</div>
          </div>`).join('')}</div>`
        :`<div class="emp mt">${T('noSessionArc')}</div>`,
        files.length?`<span class="pill n">${files.length}</span>`:'')}

      ${sec('📋', T('sessionInfo'), `
        <div class="col mt">
          <div class="it" style="cursor:default;padding:10px 12px">
            <div class="gr"><div class="tiny">${T('name')}</div>
              <div style="font-weight:700">${esc(nm(p))}</div></div>
            <div style="text-align:end"><div class="tiny">${T('file')}</div>
              <div class="mono" style="font-weight:700">${esc(p.mrn||'—')}</div></div>
          </div>
          ${visit?`<div class="it" style="cursor:default;padding:10px 12px">
            <div class="gr"><div class="tiny">${T('visit')}</div>
              <div style="font-weight:700">${visit.no} · ${fmtD(visit.date)}</div></div>
            <div style="text-align:end"><div class="tiny">${T('barcode')}</div>
              <div class="mono tiny">${esc(visit.code||'—')}</div></div>
          </div>`:''}
        </div>`)}

      ${sec('₪', T('sessionAmt'), `
        <div class="g2 mt">
          <div class="card flat ctr" style="padding:13px 8px">
            <div class="tiny">${T('sessionAmt')}</div>
            <div class="mono h2 mt">${N(w.price)}</div></div>
          <div class="card flat ctr" style="padding:13px 8px">
            <div class="tiny">${T('paid')}</div>
            <div class="mono h2 mt" style="color:var(--ok)">${N(paid)}</div></div>
        </div>
        ${pays.length?`<div class="col mt">${pays.map(x=>`
          <div class="it" style="cursor:default;padding:9px 11px">
            <div class="av g" style="width:30px;height:30px;font-size:13px">₪</div>
            <div class="gr"><div class="mono" style="font-weight:700">${N(x.amt)}</div>
              <div class="tiny">${fmtD(x.at)} · ${T(x.method||'cash')}</div></div>
          </div>`).join('')}</div>`:''}`)}

      ${sec('✍️', T('whatDoctorWrote'),
        visit?.done?`<div class="card flat mt" style="padding:12px;font-weight:600;
          line-height:1.7">${esc(visit.done)}</div>`
        :`<div class="emp mt">${T('noDoctorNote')}</div>`)}

      ${visit?`<button class="btn w gh mt2"
        onclick="Nav.session('${visit.id}')">${T('openSession')}</button>`:''}
      <button class="btn w gh mt" onclick="Nav.back()">${T('back')}</button>`);
  },

        </div>
        <div class="g2 mt">
          <div><label class="lb">${T('planCount')} <span class="req">*</span></label>
            <input id="pl-n" class="mono" inputmode="numeric" dir="ltr" value="${n}"
              onchange="Doc.rebuildChips()"></div>

          <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
          <button class="btn gr" style="flex:2" onclick="Doc.savePlan(${fdi})">
            ${T('savePlan')}</button>
        </div>
      </div>`;
  },

  wirePlan(){
    SG.attach($('#pl-note'), 'plannote');
    /* ما يُكتب يدوياً في حقل نوع العمل يتعلّم ويُقترح لاحقاً */
    SG.attach($('#pl-proc-q'), 'proctext');
    SG.attach($('#pl-dx-q'), 'proctext');
    const pr = $('#pl-price');
    if (pr && !pr.value) pr.value = Number($('#pl-proc')?.dataset.p || 0) || '';
    this.rebuildChips();
  },

  /* أرقام الجلسات تُبنى حسب العدد المطلوب، ويمكن اختيار أكثر من واحدة */
  rebuildChips(){
    const box = $('#pl-chips'); if (!box) return;
    const n = Math.max(1, Math.min(20, Number($('#pl-n')?.value) || 1));
    const picked = new Set([...box.querySelectorAll('.on')].map(b=>Number(b.dataset.n)));
    box.innerHTML = Array.from({length:n},(_,i)=>i+1).map(k=>`
      <button type="button" class="btn sm ${picked.has(k)?'':'gh'} ${picked.has(k)?'on':''}"
        data-n="${k}" onclick="Doc.toggleChip(this)">${T('sessionN')} ${k}</button>`).join('');
    if (!picked.size){ const first = box.querySelector('button'); if (first) this.toggleChip(first); }
  },

  toggleChip(b){
    const on = b.classList.toggle('on');
    b.classList.toggle('gh', !on);
  },

  async savePlan(fdi){
    const proc = PickProc.read('pl-proc');
    if (!proc){ $('#pl-proc-q')?.classList.add('err'); return toast(T('typeProc'),'e'); }
    if (proc.startsWith('x:')) await SG.learn('proctext', proc.slice(2));
    /* التشخيص اختياري: خطة قديمة بلا تشخيص تبقى صالحة كما هي */
    const dx = PickProc.read('pl-dx');
    if (dx && dx.startsWith('x:')) await SG.learn('proctext', dx.slice(2));
    const count = Math.max(1, Number($('#pl-n').value) || 1);
    const price = Number($('#pl-price').value) || 0;
    const note  = ($('#pl-note').value || '').trim();
    const picked = [...document.querySelectorAll('#pl-chips .on')].map(b=>Number(b.dataset.n));

    await Ops.savePlan(S.patient.id, fdi, { dx, proc, sessions:count, price, note });
    await SG.learn('plannote', note);

    /* الجلسات المختارة اليوم تُسجَّل كأعمال فوراً */
    if (picked.length && S.visit){
      const c = await Ops.course(S.patient.id, fdi);
      await DB.put('works', {
        id:uid(), vid:S.visit.id, pid:S.patient.id, proc, dx, fdi,
        course:c, sessionNos:picked, by:S.role,
        price: price * picked.length, note, at:Date.now(),
      });
      const st = P(proc).st;
      if (st) await Ops.setTooth(S.patient.id, fdi, st, S.visit.id);
    }

    toast(T('planSaved'), 's');
    Nav.stack.pop();
    this.tooth(fdi);
  },

  async editPlan(fdi){
    const plan = await Ops.plan(S.patient.id, fdi);
    const rec  = await Ops.toothRec(S.patient.id, fdi);
    const col  = TS(rec.st||'sound').col;
    UI.sheet(`
      <div class="shhead">
        <div class="av mono" style="width:48px;height:48px;font-size:15px">${Chart.lbl(fdi)}</div>
        <div class="gr"><div class="h2">${T('editPlan')}</div>
          <div class="tiny">${T('tooth')} ${Chart.lbl(fdi)}</div></div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>` + this.planForm(fdi, plan));
    this.wirePlan();
  },

  /* تنفيذ جلسة إضافية من الخطة اليوم */
  async doSession(fdi){
    const plan = await Ops.plan(S.patient.id, fdi);
    const done = await Ops.doneSessions(S.patient.id, fdi);
    const left = Array.from({length:plan.sessions},(_,i)=>i+1).filter(n=>!done.nums.includes(n));

    UI.sheet(`
      <div class="shhead">
        <div class="av mono" style="width:48px;height:48px;font-size:15px">${Chart.lbl(fdi)}</div>
        <div class="gr"><div class="h2">${T('planToday')}</div>
          <div class="tiny">${esc(pName(plan.proc))} · ${T('remaining')} ${left.length}</div></div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>
      <div class="card">
        <label class="lb">${T('pickSessions')}</label>
        <div class="row wrapv mt" id="ds-chips" style="gap:6px">
          ${left.map((k,i)=>`<button type="button" class="btn sm ${i===0?'on':'gh'}"
            data-n="${k}" onclick="Doc.toggleChip(this)">${T('sessionN')} ${k}</button>`).join('')}
        </div>
        <div class="mt"><label class="lb">${T('planPrice')}</label>
          <input id="ds-price" class="mono" inputmode="numeric" dir="ltr" value="${plan.price||''}"></div>
        <div class="mt"><label class="lb">${T('notes')}</label><input id="ds-note"></div>
        <div class="row mt2" style="gap:9px">
          <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
          <button class="btn gr" style="flex:2" onclick="Doc.saveSession(${fdi})">${T('save')}</button>
        </div>
      </div>`);
    SG.attach($('#ds-note'), 'worknote');
  },

  async saveSession(fdi){
    const plan = await Ops.plan(S.patient.id, fdi);
    const picked = [...document.querySelectorAll('#ds-chips .on')].map(b=>Number(b.dataset.n));
    if (!picked.length) return toast(T('pickSessions'), 'e');
    const price = Number($('#ds-price').value) || 0;
    const note  = ($('#ds-note').value || '').trim();
    const c = await Ops.course(S.patient.id, fdi);

    await DB.put('works', {
      id:uid(), vid:S.visit.id, pid:S.patient.id, proc:plan.proc, fdi,
      course:c, sessionNos:picked, by:S.role,
      price: price * picked.length, note, at:Date.now(),
    });
    await SG.learn('worknote', note);
    const st = P(plan.proc).st;
    if (st) await Ops.setTooth(S.patient.id, fdi, st, S.visit.id);

    toast(T('saved'), 's');
    Nav.stack.pop();
    this.tooth(fdi);
  },

  stFilter(fdi){ this.stQ = $('#st-q')?.value || ''; this.stShow = 10; this.stList(fdi); },

  stList(fdi){

    let last = null;

      const g = q ? null : SG_OF(k);

        style="${v.col?`border-color:${v.col};color:${v.col}`:''}">
        ${v.col?`<i class="dotc" style="background:${v.col}"></i>`:''}
        ${esc(isAr()?v.ar:v.en)}</button>`;

    box.innerHTML = `

      </div>

        ${left>0?`<button class="btn gh gr lgd-more" onclick="Doc.stMore(${fdi})">
          <span>${T('moreStatus')}</span><span class="pill n">${left}</span>
          <span class="arw">↓</span></button>`:''}
        ${this.stShow>10?`<button class="btn gh lgd-more" onclick="Doc.stLess(${fdi})"
          style="${left>0?'flex:0 0 auto;min-width:118px':'flex:1'}">

  /* المصغّرات تُملأ بعد الرسم: الرابط الموقّع يحتاج نداءً للسيرفر،
     فلا يُنتظر قبل إظهار الشاشة. */
  async thumbs(){
    for (const el of $$('img[data-fid]')){
      if (el.src || el.dataset.done) continue;
      el.dataset.done = '1';
      const f = await DB.get('files', el.dataset.fid);
      /* المصغّرة المحفوظة تظهر فوراً بلا شبكة — والأصلية تُترك
         لشاشة العرض الكاملة وحدها. */
      if (f?.thumb){ el.src = f.thumb; continue; }
      let u = null;
      try { u = f && await Img.view(f); } catch(_){}
      if (u){
        /* الصورة قد تفشل بعد إسناد الرابط أيضاً — يُعرض بديل مفهوم
           بدل أيقونة المتصفح المكسورة التي لا تقول شيئاً. */
        el.onerror = () => Doc.imgFail(el);
        el.src = u;
      } else Doc.imgFail(el);
    }
  },

  imgFail(el){
    el.removeAttribute('src');
    el.style.display = 'none';
    if (el.nextElementSibling?.classList.contains('imgx')) return;
    el.insertAdjacentHTML('afterend',
      `<div class="imgx" onclick="event.stopPropagation();Doc.imgAgain(this)">
         <span>🖼</span><span class="tiny">${T('imgGone')}</span>
         ${Img.err?`<span class="tiny mono" style="opacity:.75;word-break:break-all">
           ${esc(String(Img.err))}</span>`:''}
         <span class="tiny" style="text-decoration:underline">${T('imgRetry')}</span>
       </div>`);
  },

  imgAgain(box){
    const img = box.previousElementSibling;
    box.remove();
    if (!img) return;
    img.style.display = '';
    delete img.dataset.done;
    Img._url = {};                  /* روابط قديمة قد تكون انتهت */
    this.thumbs();
  },

    const f = await DB.get('files', id);

    await DB.del('files', id);
